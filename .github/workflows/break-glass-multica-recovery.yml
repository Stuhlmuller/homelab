name: Break Glass Multica Recovery

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: break-glass-multica-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    env:
      AWS_REGION: us-west-2
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Recovery Inputs
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          test -n "${AWS_APPLY_ROLE_ARN}" || { echo "AWS_ROLE_TO_ASSUME_HOMELAB must be set."; exit 1; }
          test -n "${KUBE_CONFIG_B64}" || { echo "KUBE_CONFIG_B64 must be set as a repository secret."; exit 1; }

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: homelab-multica-recovery-${{ github.run_id }}
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          unset-current-credentials: true

      - name: Recover Multica
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          nix develop --command bash <<'EOF'
          set -euo pipefail

          install -m 0700 -d "${HOME}/.kube"
          printf '%s' "${KUBE_CONFIG_B64}" | base64 -d >"${HOME}/.kube/config"
          chmod 0600 "${HOME}/.kube/config"

          adopt_existing_ssm_parameters() {
            local parameter_region="us-west-2"
            local state_resources
            local parameter_name
            local resource_address
            local existing_name
            local parameter_names=(
              "/homelab/github-actions-runner/registration-token"
              "/homelab/cordium/agent-auth-token"
            )

            terragrunt init -no-color
            state_resources="$(terragrunt state list -no-color 2>/dev/null || true)"

            for parameter_name in "${parameter_names[@]}"; do
              resource_address="aws_ssm_parameter.this[\"${parameter_name}\"]"
              if grep -Fxq "${resource_address}" <<<"${state_resources}"; then
                echo "SSM parameter ${parameter_name} is already managed in OpenTofu state."
                continue
              fi

              existing_name="$(
                aws ssm describe-parameters \
                  --region "${parameter_region}" \
                  --parameter-filters "Key=Name,Option=Equals,Values=${parameter_name}" \
                  --query "Parameters[0].Name" \
                  --output text 2>/dev/null || true
              )"

              if [[ "${existing_name}" == "${parameter_name}" ]]; then
                echo "Adopting existing SSM parameter ${parameter_name} into OpenTofu state."
                terragrunt import -no-color "${resource_address}" "${parameter_name}"
              else
                echo "SSM parameter ${parameter_name} is absent; OpenTofu will create the placeholder."
              fi
            done
          }

          plan_validate_and_apply() {
            local unit_dir="$1"
            local policy_dir="$2"
            local adopt_ssm="${3:-false}"

            (
              cd "${unit_dir}"
              rm -f plan.out plan.json
              if [[ "${adopt_ssm}" == "true" ]]; then
                adopt_existing_ssm_parameters
              else
                terragrunt init -no-color
              fi
              terragrunt plan -out plan.out -no-color
              terragrunt --log-disable show -json plan.out >plan.json
              conftest test --policy "${policy_dir}" --output github plan.json
              terragrunt apply -no-color plan.out
            )
          }

          kubectl --request-timeout=15s version
          (cd IaC && terragrunt stack generate)
          plan_validate_and_apply IaC/live/aws-ssm-parameters ../../../policy true
          plan_validate_and_apply IaC/live/argocd-apps/multica ../../../../policy

          for attempt in $(seq 1 60); do
            sync_status="$(
              kubectl -n argocd get application multica \
                -o jsonpath='{.status.sync.status}' 2>/dev/null || true
            )"
            health_status="$(
              kubectl -n argocd get application multica \
                -o jsonpath='{.status.health.status}' 2>/dev/null || true
            )"
            printf 'multica sync=%s health=%s attempt=%s\n' \
              "${sync_status:-unknown}" \
              "${health_status:-unknown}" \
              "${attempt}"
            if [[ "${sync_status}" == "Synced" && "${health_status}" == "Healthy" ]]; then
              kubectl -n argocd get application multica -o wide
              exit 0
            fi
            sleep 30
          done

          kubectl -n argocd get application multica -o yaml
          exit 1
          EOF
