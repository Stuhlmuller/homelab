name: OpenClaw Enterprise Images

# checkov:skip=CKV_GHA_7: expected_sha pins the fixed source build to reviewed current main.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed current main commit for Enterprise images, CLI and journal operator
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Build And Publish Pinned Stock Images, CLI And Journal Operator
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: harbor-packages-production
      cancel-in-progress: false
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    outputs:
      restore: ${{ steps.publication.outputs.restore }}
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          [[ "${ACTUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1

      - name: Validate Pinned Source And Publication Gates
        run: |
          nix develop --command python3 -I scripts/ci/openclaw-enterprise-image-test.py
          nix develop --command python3 -I scripts/ci/openclaw-enterprise-operator-image-test.py
          nix develop --command python3 -I scripts/ci/openclaw-enterprise-restore-image-test.py
          nix develop --command python3 -I scripts/ci/harbor-core-scan-check-test.py
          nix develop --command python3 -I scripts/ci/harbor-publish-test.py

      - name: Build Journal Operator Before Registry Login
        run: nix develop --command bash builds/openclaw-enterprise/build-operator.sh

      - name: Build Stock Controller Runtime And CLI Before Registry Login
        run: nix develop --command bash builds/openclaw-enterprise/build.sh

      - name: Build Restore Runtime Before Registry Login
        run: nix develop --command bash builds/openclaw-enterprise-restore/build.sh

      - name: Audit Exact Restore Runtime Before Registry Login
        id: restore_scan
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash builds/openclaw-enterprise-restore/scan.sh >"$private_log" 2>&1; then
            echo "::error::Restore runtime audit failed; private output withheld."
            exit 1
          fi
          echo "Restore runtime complete private scan passed; details withheld."

      - name: Verify Current Main Commit Before Credentials
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_RESTORE_IMAGE_ID: ${{ steps.restore_scan.outputs.restore_image_id }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"
          [[ "${EXPECTED_RESTORE_IMAGE_ID}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Id}}' homelab-oce-restore:build)" = "${EXPECTED_RESTORE_IMAGE_ID}"

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-oce-images-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Publish And Verify Signed Harbor Images, CLI And Operator
        id: publication
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_RESTORE_IMAGE_ID: ${{ steps.restore_scan.outputs.restore_image_id }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/harbor-publish.sh publish-openclaw-enterprise
          EOF
          then
            python3 -I scripts/ci/harbor-encrypt-diagnostic.py "$private_log" \
              "$RUNNER_TEMP/oce-image-error.gpg" >/dev/null 2>&1 || true
            phase=unclassified
            if [[ -f "$GITHUB_STEP_SUMMARY" ]]; then
              phase_line="$(tail -n 1 "$GITHUB_STEP_SUMMARY")"
              if [[ "$phase_line" == "Enterprise image publication failed at phase: "* ]]; then
                candidate="${phase_line#*phase: }"
                case "$candidate" in
                  preflight|private-route|harbor-auth|cleanup|signing-prepare|signing-create|signing-wait|signing-key|signature-verify|receipt|push-controller|push-runtime|push-cli|push-operator|push-restore|upload-verify-controller|upload-verify-runtime|upload-verify-cli|upload-verify-operator|upload-verify-restore|authenticated-pull-controller|authenticated-pull-runtime|authenticated-pull-cli|authenticated-pull-operator|authenticated-pull-restore)
                    phase="$candidate" ;;
                esac
              fi
            fi
            echo "::error::Enterprise image publication failed at phase: $phase; private transport and registry output withheld."
            exit 1
          fi
          echo "Pinned Enterprise controller/runtime/CLI/operator/restore images published, signed, and fully pulled; private output withheld."

      - name: Retain Only Encrypted Failure Diagnostic
        if: failure()
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: oce-image-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oce-image-error.gpg
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: false

  published-restore-digest:
    name: Report Published Restore Digest
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate Published Restore Reference
        env:
          RESTORE_REFERENCE: ${{ needs.publish.outputs.restore }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RESTORE_REFERENCE:-}" =~ ^harbor\.stinkyboi\.com/homelab/homelab-oce-restore:homelab-${GITHUB_SHA}@sha256:[0-9a-f]{64}$ ]]
          set -o noclobber
          printf '%s\n' "$RESTORE_REFERENCE" >"${RUNNER_TEMP:?}/oce-restore-published-image.txt"
      - name: Upload Published Restore Reference
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: oce-restore-published-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oce-restore-published-image.txt
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
