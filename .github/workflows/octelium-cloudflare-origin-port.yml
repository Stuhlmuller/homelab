name: Reconcile Octelium Cloudflare Origin Port

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: octelium-cloudflare-origin-port
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Reconcile Cloudflare Origin Port
        env:
          CLOUDFLARE_ZONE_SETTINGS_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_SETTINGS_TOKEN }}
        run: |
          private_log="$(mktemp "${RUNNER_TEMP}/cloudflare-origin-port.XXXXXX")"
          chmod 600 "$private_log"
          trap 'rm -f -- "$private_log"' EXIT
          if ! scripts/octelium-cloudflare-origin-port.sh >"$private_log" 2>&1; then
            echo "::error::Cloudflare origin-port reconciliation failed; rerun it from an approved local operator session for details."
            exit 1
          fi
