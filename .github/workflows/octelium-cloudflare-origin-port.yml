name: Reconcile Octelium Cloudflare Origin Port

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: octelium-cloudflare-origin-port
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Reject Retired WAN Transport
        run: |
          echo "::error::WAN port forwarding is retired. Run octelium-public-tunnel.yml after the Tunnel routes are synced."
          exit 1
