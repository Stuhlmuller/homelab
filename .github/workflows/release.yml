name: "Release"

permissions: read-all

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  release-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
          token: ""

      - name: Install locked release toolchain
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Semantic Release Dry Run
        run: |
          git switch --force-create semantic-release-dry-run
          git clone --bare . "${RUNNER_TEMP}/semantic-release-dry-run.git"
          unset CI GITHUB_ACTIONS GITHUB_EVENT_NAME
          ./node_modules/.bin/semantic-release \
            --dry-run \
            --no-ci \
            --branches semantic-release-dry-run \
            --repository-url "file://${RUNNER_TEMP}/semantic-release-dry-run.git"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating releases
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
          token: ""

      - name: Install locked release toolchain
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release
