---
name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee

      - name: Check flake
        run: nix flake check --no-build --all-systems

      - name: Check HCL Formatting
        run: nix develop --command terragrunt hcl fmt --check

      - name: Generate Terragrunt Stack
        run: nix develop --command bash -c 'cd IaC && terragrunt stack generate'

      - name: Validate Terragrunt HCL
        run: nix develop --command terragrunt hcl validate

      - name: Render Kustomize sources
        run: |
          for overlay in clusters/homelab/platform/storage clusters/homelab/argocd/self-management clusters/homelab/apps/*; do
            test -f "$overlay/kustomization.yaml" || continue
            echo "rendering $overlay"
            nix develop --command kubectl kustomize "$overlay" >/dev/null
          done

      - name: Check whitespace
        run: git diff --check

      - name: Set Up Python For LiteLLM SDK Checks
        # actions/setup-python@v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Verify LiteLLM Authentication And Attribution
        run: |
          # PyPI native wheels need system libraries, not Nix's Python loader.
          python -m venv "${RUNNER_TEMP}/litellm-test"
          source "${RUNNER_TEMP}/litellm-test/bin/activate"
          python -m pip install 'litellm[proxy]==1.80.8'
          python scripts/ci/litellm-attribution-check.py

      - name: Secret scan
        run: nix develop --command bash scripts/ci/secret-scan.sh
