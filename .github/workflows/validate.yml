---
name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1

      - name: Check flake
        run: nix flake check --no-build --all-systems

      - name: Check HCL Formatting
        run: nix develop --command terragrunt hcl fmt --check

      - name: Generate Terragrunt Stack
        run: nix develop --command bash -c 'cd IaC && terragrunt stack generate'

      - name: Validate Terragrunt HCL
        run: nix develop --command terragrunt hcl validate

      - name: Render Kustomize sources
        run: |
          for overlay in clusters/homelab/platform/storage clusters/homelab/argocd/self-management clusters/homelab/apps/*; do
            test -f "$overlay/kustomization.yaml" || continue
            echo "rendering $overlay"
            nix develop --command kubectl kustomize "$overlay" >/dev/null
          done

      - name: Check whitespace
        run: git diff --check

      - name: Secret scan
        run: nix develop --command bash scripts/ci/secret-scan.sh
