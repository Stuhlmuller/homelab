---
name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image-policy: ${{ steps.scope.outputs.image-policy }}
      network-policy: ${{ steps.scope.outputs.network-policy }}
      harbor-core: ${{ steps.scope.outputs.harbor-core }}
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve runtime check scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/validate-runtime-scope.sh "$BASE_SHA"

  image-policy:
    needs: runtime-scope
    if: >-
      !cancelled() &&
      (needs.runtime-scope.result != 'success' || needs.runtime-scope.outputs.image-policy != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-validate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: 'false'
      - name: Exercise native image admission
        run: nix develop --command python3 -I scripts/ci/image-policy-check.py
  network-policy:
    needs: runtime-scope
    if: >-
      !cancelled() &&
      (needs.runtime-scope.result != 'success' || needs.runtime-scope.outputs.network-policy != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-validate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: 'false'
      - name: Exercise isolated network policy enforcement
        run: nix develop --command python3 -I scripts/ci/network-policy-enforcement-check.py
  harbor-core-compatibility:
    needs: runtime-scope
    if: >-
      !cancelled() &&
      (needs.runtime-scope.result != 'success' || needs.runtime-scope.outputs.harbor-core != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Check pinned source trust boundary
        run: python3 -I scripts/ci/harbor-core-source-test.py
      - name: Check pinned Chainguard signer compatibility
        run: bash builds/harbor-core/signer-test.sh
      - name: Build source-level duplicate-reference repair
        run: bash builds/harbor-core/build.sh
      - name: Install pinned runtime audit tools
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-validate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: 'false'
      - name: Check runtime report trust boundaries
        run: |
          python3 -I scripts/ci/harbor-core-scan-check-test.py
          python3 -I scripts/ci/harbor-encrypt-diagnostic-test.py
      - name: Audit exact built runtime privately
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          diagnostic_file="$(mktemp)"
          trap 'rm -f "$private_log" "$diagnostic_file"' EXIT
          printf '%s\n' launcher >"$diagnostic_file"
          if ! nix develop --command bash builds/harbor-core/scan.sh \
            --encrypted-report "$RUNNER_TEMP/harbor-core-reports.tar.gz.gpg" \
            --diagnostic-file "$diagnostic_file" >"$private_log" 2>&1; then
            bash scripts/ci/harbor-core-audit-status.sh "$diagnostic_file"
            exit 1
          fi
          grep -F 'Complete private runtime audit passed;' "$private_log"
          grep -F 'Runtime audit receipt: ' "$private_log"
      - name: Retain only encrypted failed runtime report
        if: failure()
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: harbor-core-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harbor-core-reports.tar.gz.gpg
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: false
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1

      - name: Verify Offline Nix Checks
        # On PRs, the required Terragrunt Gate already verifies these outputs.
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          if git cat-file -e origin/main:scripts/config/nix-cache.json 2>/dev/null; then
            git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          else
            printf '%s\n' '{"url":"","publicKey":""}' >"$cache_policy"
          fi
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"

      - name: Restore Nix Store Cache
        if: github.event_name == 'pull_request'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-validate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: 'false'

      - name: Check flake
        run: nix flake check --no-build --all-systems

      - name: Check HCL Formatting
        run: nix develop --command terragrunt hcl fmt --check

      - name: Generate Terragrunt Stack
        run: nix develop --command bash -c 'cd IaC && terragrunt stack generate'

      - name: Validate Terragrunt HCL
        run: nix develop --command bash -c 'cd IaC/homelab/us-west-2 && terragrunt hcl validate'

      - name: Render Kustomize sources
        run: |
          for overlay in clusters/homelab/platform/storage clusters/homelab/platform/image-policy clusters/homelab/argocd/self-management clusters/homelab/apps/*; do
            test -f "$overlay/kustomization.yaml" || continue
            echo "rendering $overlay"
            nix develop --command kubectl kustomize "$overlay" >/dev/null
          done

      - name: Check whitespace
        run: |
          base_sha="$(jq -er --arg event "${GITHUB_EVENT_NAME}" '
            (if $event == "pull_request" then .pull_request.base.sha else .before end) |
            select(test("^[0-9a-f]{40}$"))
          ' "${GITHUB_EVENT_PATH}")"
          if [[ "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -w -t tree /dev/null)"
          fi
          git diff --check "${base_sha}" HEAD

      - name: Check ClickHouse diagnostic quarantine
        run: nix develop --command python3 -I scripts/ci/clickhouse-log-quarantine-test.py --runtime docker

      - name: Exercise isolated AdGuard DNS and security profile
        run: nix develop --command python3 -I scripts/ci/adguard-runtime-test.py

      - name: Install Python for gateway checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Check gateway authentication and telemetry
        run: |
          python -m venv "${RUNNER_TEMP}/litellm-test"
          source "${RUNNER_TEMP}/litellm-test/bin/activate"
          python -m pip install 'litellm[proxy]==1.80.8' 'litellm-proxy-extras==0.4.11' 'opentelemetry-sdk==1.25.0' 'openai==2.8.0' 'httpx==0.28.1' 'prisma==0.11.0' 'fastapi==0.120.1' 'starlette==0.49.1' 'uvicorn==0.31.1'
          python -m prisma generate --schema "$(python -c 'from pathlib import Path; import litellm; print(Path(litellm.__file__).parent / "proxy/schema.prisma")')"
          python scripts/ci/litellm-attribution-check.py
          python scripts/ci/litellm-native-auth-test.py
          nix develop --command env -u PYTHONPATH "${VIRTUAL_ENV}/bin/python" scripts/ci/litellm-native-database-test.py

      - name: Secret scan
        run: nix develop --command bash scripts/ci/secret-scan.sh

  cache-publish:
    name: Publish Validation Nix Cache
    if: github.event_name == 'push'
    needs: repo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: homelab-production
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
      - name: Publish Nix Store Cache On Miss
        id: cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-validate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          lookup-only: 'true'
          save: 'true'
      - name: Realize Pinned Validation Dependencies
        if: steps.cache.outputs.hit-primary-key != 'true'
        run: nix develop --command true
