---
name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1

      - name: Check flake
        run: nix flake check --no-build --all-systems

      - name: Check published Chainguard Python compatibility
        # CI uses the identical public-source digest; live Harbor access is verified separately.
        run: |
          image="$(nix develop --command yq -r '.spec.template.spec.containers[0].image' clusters/homelab/apps/harbor/vulnerability-exporter.yaml)"
          for job in harbor fleet; do
            test "$image" = "$(nix develop --command yq -r '.spec.template.spec.containers[0].image' "clusters/homelab/apps/${job}/bootstrap-job.yaml")"
          done
          image="${image#harbor.stinkyboi.com/mirror/}"
          for test in harbor-bootstrap-test.py harbor-vulnerability-exporter-test.py fleet-bootstrap-test.py; do
            args=()
            if [[ "$test" == fleet-bootstrap-test.py ]]; then args=(BootstrapTest); fi
            docker run --rm --network none --read-only --user 65532:65532 \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              --volume "${GITHUB_WORKSPACE}:/repo:ro" --workdir /repo \
              --entrypoint /usr/bin/python3 "$image" \
              -I -B "scripts/ci/${test}" "${args[@]}"
          done

      - name: Check HCL Formatting
        run: nix develop --command terragrunt hcl fmt --check

      - name: Generate Terragrunt Stack
        run: nix develop --command bash -c 'cd IaC && terragrunt stack generate'

      - name: Validate Terragrunt HCL
        run: nix develop --command terragrunt hcl validate

      - name: Render Kustomize sources
        run: |
          for overlay in clusters/homelab/platform/storage clusters/homelab/argocd/self-management clusters/homelab/apps/*; do
            test -f "$overlay/kustomization.yaml" || continue
            echo "rendering $overlay"
            nix develop --command kubectl kustomize "$overlay" >/dev/null
          done

      - name: Check whitespace
        run: git diff --check

      - name: Check ClickHouse diagnostic quarantine
        run: nix develop --command python3 -I scripts/ci/clickhouse-log-quarantine-test.py --runtime docker

      - name: Install Python for gateway checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Check gateway authentication and telemetry
        run: |
          python -m venv "${RUNNER_TEMP}/litellm-test"
          source "${RUNNER_TEMP}/litellm-test/bin/activate"
          python -m pip install 'litellm[proxy]==1.80.8' 'litellm-proxy-extras==0.4.11' 'opentelemetry-sdk==1.25.0' 'openai==2.8.0' 'httpx==0.28.1' 'prisma==0.11.0' 'fastapi==0.120.1' 'starlette==0.49.1' 'uvicorn==0.31.1'
          python -m prisma generate --schema "$(python -c 'from pathlib import Path; import litellm; print(Path(litellm.__file__).parent / "proxy/schema.prisma")')"
          python scripts/ci/litellm-attribution-check.py
          python scripts/ci/litellm-native-auth-test.py
          nix develop --command env -u PYTHONPATH "${VIRTUAL_ENV}/bin/python" scripts/ci/litellm-native-database-test.py

      - name: Secret scan
        run: nix develop --command bash scripts/ci/secret-scan.sh
