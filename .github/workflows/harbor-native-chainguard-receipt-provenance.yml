name: Verify Native Chainguard Receipt Provenance

on:
  push:
    branches: [main]
  # zizmor: ignore[dangerous-triggers] Trusted base code reads the PR state only as bounded API data.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  verify:
    name: Native Chainguard Receipt Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Check Out Trusted Base
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Changed Native Receipt State
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$GH_TOKEN" >"$token_file"
          report_status() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context='Native Chainguard Receipt Provenance' \
              -f description='Protected receipt state verification' >/dev/null
          }
          report_status pending
          if python3 -I scripts/ci/harbor-native-chainguard-receipt-import.py verify-pull-request \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --token-file "$token_file"; then
            report_status success
          else
            report_status failure
            exit 1
          fi
