name: Publish Reviewed Helm Charts To Harbor
run-name: Helm charts @ ${{ github.sha }}

# checkov:skip=CKV_GHA_7: expected_sha binds publication to reviewed current main.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit with reviewed chart hashes
        required: true
        type: string
      chart_scope:
        description: Fixed reviewed chart inventory to publish
        required: true
        default: current
        type: choice
        options: [current, istio-1.28.10]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate reviewed inventory and publisher
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          bash -n scripts/ci/harbor-chart-publish.sh
          nix develop --command python3 -I scripts/ci/harbor-chart-publish.py --check
          nix develop --command python3 -I scripts/ci/harbor-chart-publish.py --check-istio-1.28.10
          nix develop --command python3 -I scripts/ci/harbor-chart-publish-test.py

  publish:
    needs: validate
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: harbor-mirror-production
      cancel-in-progress: false
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-
      - name: Verify Current Main Before Credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CHART_SCOPE: ${{ inputs.chart_scope }}
        run: |
          set -euo pipefail
          case "$CHART_SCOPE" in current|istio-1.28.10) ;; *) exit 2 ;; esac
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "$current_main_sha" = "$GITHUB_SHA"
      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-harbor-charts-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true
      - name: Publish and independently verify chart packages
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CHART_SCOPE: ${{ inputs.chart_scope }}
          HARBOR_CHART_DESTINATION: harbor.stinkyboi.com/mirror/helm
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash scripts/ci/harbor-chart-publish.sh >"$private_log" 2>&1; then
            echo '::error::Harbor chart publication failed; private transport output withheld.'
            exit 1
          fi
          echo 'Reviewed Helm packages published with authenticated reader pulls and matching package hashes.'
          if [[ "$CHART_SCOPE" == istio-1.28.10 ]]; then
            receipt="$RUNNER_TEMP/harbor-istio-charts-receipt.json"
            test -s "$receipt"
            jq -e --arg sha "$GITHUB_SHA" --arg dest "$HARBOR_CHART_DESTINATION" '
              .sourceSha == $sha and .destination == $dest and
              (.charts | length) == 5 and
              ([.charts[].chart] | sort) == ["base", "cni", "gateway", "istiod", "ztunnel"] and
              all(.charts[]; .version == "1.28.10" and
                (.packageSha256 | test("^[0-9a-f]{64}$")) and
                (.manifestDigest | test("^sha256:[0-9a-f]{64}$")))
            ' "$receipt" >/dev/null
            {
              echo '## Istio 1.28.10 Harbor OCI receipt'
              echo "Source main: \`$GITHUB_SHA\`"
              echo '| Chart | Package SHA-256 | OCI manifest digest |'
              echo '| --- | --- | --- |'
              jq -r '.charts[] | "| \(.chart) | `\(.packageSha256)` | `\(.manifestDigest)` |"' "$receipt"
            } >>"$GITHUB_STEP_SUMMARY"
            echo 'Five Istio OCI manifests verified; digest receipt recorded in the job summary.'
          fi
      - name: Upload Istio Chart Digest Receipt
        if: inputs.chart_scope == 'istio-1.28.10'
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: harbor-istio-charts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harbor-istio-charts-receipt.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
