name: NOFX Registry Credential

# checkov:skip=CKV_GHA_7: expected_sha only pins reviewed current main; credential and SSM targets are fixed.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit to bootstrap or rotate the private NOFX pull credential
        required: true
        type: string

permissions: {}

concurrency:
  group: nofx-registry-credential-production
  cancel-in-progress: false

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: nix develop --command bash scripts/ci/static-checks.sh

      - name: Run Conftest Policies
        run: nix develop --command bash scripts/ci/conftest-policies.sh

  credential:
    name: Validate And Store Dedicated Pull Credential
    needs: [static-policy]
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Verify Current Main Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-nofx-registry-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":"ssm:DescribeParameters","Resource":"*"},
            {"Effect":"Allow","Action":"ssm:PutParameter","Resource":"arn:aws:ssm:us-west-2:*:parameter/homelab/nofx/ghcr-read-token"},
            {"Effect":"Allow","Action":"kms:Encrypt","Resource":"*","Condition":{"StringEquals":{"kms:ViaService":"ssm.us-west-2.amazonaws.com"},"StringLike":{"kms:EncryptionContext:PARAMETER_ARN":"arn:aws:ssm:us-west-2:*:parameter/homelab/nofx/ghcr-read-token"}}}]}

      - name: Validate Private Pulls And Store Credential
        env:
          NOFX_GHCR_READ_TOKEN: ${{ secrets.NOFX_GHCR_READ_TOKEN }}
        run: python3 -I scripts/nofx-registry-credential.py
