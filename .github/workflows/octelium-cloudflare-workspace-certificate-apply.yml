name: Order Cordium Workspace Certificate

# checkov:skip=CKV_GHA_7: expected_sha binds the protected mutation to reviewed main.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to apply
        required: true
        type: string

run-name: Order Cordium workspace certificate @ ${{ github.sha }}

permissions: {}

concurrency:
  group: octelium-cloudflare-workspace-certificate
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Verify Current Main Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "${ACTUAL_REF}" = "refs/heads/main" || { echo "::error::Certificate dispatches must use main, got ${ACTUAL_REF}."; exit 1; }
          test "${EXPECTED_SHA}" = "${ACTUAL_SHA}" || { echo "::error::Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."; exit 1; }
          current_main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)" || {
            echo "::error::Unable to resolve the current main SHA."
            exit 1
          }
          test "${ACTUAL_SHA}" = "${current_main_sha}" || {
            echo "::error::Dispatch ${ACTUAL_SHA} is stale; current main is ${current_main_sha}."
            exit 1
          }

      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Order or Restart Cordium Workspace Certificate
        env:
          CLOUDFLARE_SSL_CERTIFICATES_TOKEN: ${{ secrets.CLOUDFLARE_SSL_CERTIFICATES_WRITE_TOKEN }}
        run: scripts/octelium-cloudflare-workspace-certificate.sh apply
