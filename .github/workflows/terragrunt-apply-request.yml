name: Terragrunt Apply Request

on:
  push:

permissions: {}

jobs:
  request:
    name: Request Latest Main Apply
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    steps:
      - name: Show Exact Apply Command
        env:
          GH_REPO: ${{ github.repository }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          printf '## Terragrunt Apply Request\n\n    %s\n' \
            "gh workflow run terragrunt-apply.yml --repo ${GH_REPO} --ref main -f expected_sha=${REQUEST_SHA}" >>"${GITHUB_STEP_SUMMARY}"
