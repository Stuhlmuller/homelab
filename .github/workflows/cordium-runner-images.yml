name: Cordium Runner Image Builds

on:
  pull_request:
    paths:
      - '.cordium/**'
      - 'builds/cordium-runner/Dockerfile*'
      - 'builds/cordium-runner/build.sh'
      - 'scripts/cordium-*.py'
      - 'scripts/ci/install-octelium-client.sh'
      - 'scripts/ci/install-cordium-client.sh'
      - 'scripts/ci/cordium-runner-probe.sh'
      - 'scripts/policy-bot-webhook.py'
      - '.github/workflows/cordium-runner-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Public Source
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Build And Smoke Test Images
        run: bash builds/cordium-runner/build.sh
