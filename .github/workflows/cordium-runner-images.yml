name: Cordium Runner Image Builds

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.cordium/**'
      - 'builds/cordium-runner/Dockerfile*'
      - 'builds/cordium-runner/build.sh'
      - 'builds/cordium-runner/nix-packages.nix'
      - 'flake.lock'
      - 'scripts/cordium-*.py'
      - 'scripts/ci/install-octelium-client.sh'
      - 'scripts/ci/install-cordium-client.sh'
      - 'scripts/ci/cordium-runner-probe.sh'
      - 'scripts/policy-bot-webhook.py'
      - '.github/workflows/cordium-runner-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cordium-runner-images-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Public Source
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Build And Smoke Test Images
        run: bash builds/cordium-runner/build.sh
