---
name: Restore egress boundary
on:
  pull_request:
    paths:
      - images/postgres-restore-egress/**
      - scripts/ci/restore-egress/**
      - scripts/ci/restore-egress-check.py
      - flake.nix
      - flake.lock
      - .github/workflows/restore-egress.yml
      - .github/workflows/restore-image-publish.yml
      - scripts/ci/restore-image-publish.py
      - scripts/ci/restore-image-publish-test.py
      - scripts/ci/restore-image-export-check.py
  push:
    branches: [main]
    paths:
      - images/postgres-restore-egress/**
      - scripts/ci/restore-egress/**
      - scripts/ci/restore-egress-check.py
      - flake.nix
      - flake.lock
      - .github/workflows/restore-egress.yml
      - .github/workflows/restore-image-publish.yml
      - scripts/ci/restore-image-publish.py
      - scripts/ci/restore-image-publish-test.py
      - scripts/ci/restore-image-export-check.py
permissions:
  contents: read
jobs:
  image-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install locked Nix toolchain
        uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee
      - name: Build local image and prove inherited network denial
        run: >-
          nix shell --inputs-from . nixpkgs#skopeo --command
          python3 scripts/ci/restore-image-export-check.py
