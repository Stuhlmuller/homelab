name: Terragrunt Apply

# checkov:skip=CKV_GHA_7: inputs pin reviewed main and optionally select one fixed Application unit; they cannot alter commands.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to apply
        required: true
        type: string
      argocd_app:
        description: Optional exact Argo CD Application unit to reconcile
        required: false
        type: string
      existing_argocd_only:
        description: Reconcile only Argo CD Applications already registered live
        required: false
        default: false
        type: boolean
      repair_argocd_app_state:
        description: Untaint the selected Argo CD Application before reconciling it
        required: false
        default: false
        type: boolean
      application_backup_storage:
        description: Apply only the versioned OpenClaw legacy archive bucket
        required: false
        default: false
        type: boolean

run-name: ${{ inputs.application_backup_storage && format('Backup storage @ {0}', github.sha) || inputs.argocd_app == '' && format('Full @ {0}', github.sha) || format('Targeted {0} @ {1}', inputs.argocd_app, github.sha) }}

permissions: {}

env:
  AWS_REGION: us-east-1
  KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${ACTUAL_REF}" = refs/heads/main
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"
          nix develop --command bash scripts/ci/static-checks.sh --offline-verified

  terragrunt-apply:
    name: Terragrunt Apply
    needs:
      - static-policy
    concurrency:
      group: terragrunt-apply-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 90
    env:
      TERRAGRUNT_ARGOCD_APP: ${{ inputs.argocd_app }}
      TERRAGRUNT_EXISTING_ARGOCD_ONLY: ${{ inputs.existing_argocd_only }}
      TERRAGRUNT_REPAIR_ARGOCD_APP_STATE: ${{ inputs.repair_argocd_app_state }}
      TERRAGRUNT_APPLICATION_BACKUP_STORAGE: ${{ inputs.application_backup_storage }}
    steps:
      - name: Verify Current Main Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${ACTUAL_REF}" = refs/heads/main
          test "${EXPECTED_SHA}" = "${ACTUAL_SHA}"
          current_main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Last Successful Apply
        shell: bash
        env:
          APPLY_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base_sha="$(
            gh api --paginate --slurp \
              "repos/${GH_REPO}/actions/workflows/terragrunt-apply.yml/runs?branch=main&status=success&per_page=100" |
              jq -er '[.[].workflow_runs[] | select(.event == "push" or (.event == "workflow_dispatch" and (.display_title | startswith("Full @ "))))] | max_by(.run_number) | .head_sha'
          )"
          git merge-base --is-ancestor "${base_sha}" "${APPLY_HEAD_SHA}"
          printf 'APPLY_BASE_SHA=%s\n' "${base_sha}" >>"${GITHUB_ENV}"

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Kubernetes Credentials
        env:
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
        run: |
          umask 077
          nix develop --command bash scripts/ci/install-kubeconfig.sh >/dev/null 2>&1
          nix develop --command kubectl --request-timeout=15s version >/dev/null 2>&1

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 7200
          role-session-name: homelab-terragrunt-apply-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Run Live Terragrunt Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.AZUREAD_CLIENT_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_CLI: "false"
          ARM_USE_MSI: "false"
          ARM_TENANT_ID: ${{ secrets.AZUREAD_TENANT_ID }}
        run: nix develop --command bash scripts/ci/terragrunt-apply.sh >/dev/null 2>&1
