name: Terragrunt Apply

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".checkov.yaml"
      - "IaC/**"
      - "clusters/**"
      - "docs/**"
      - "flake.lock"
      - "flake.nix"
      - "policy/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to apply
        required: true
        type: string
      argocd_app:
        description: Optional exact Argo CD Application unit to reconcile
        required: false
        type: string
      repair_argocd_app_state:
        description: Untaint the selected Argo CD Application before reconciling it
        required: false
        default: false
        type: boolean

permissions: {}

env:
  AWS_REGION: us-east-1
  KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${ACTUAL_REF}" = "refs/heads/main" || { echo "::error::Production dispatches must use main, got ${ACTUAL_REF}."; exit 1; }
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}" || { echo "::error::Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."; exit 1; }

      - name: Check Out Repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action@v31
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Run Static Checks
        run: nix develop --command bash scripts/ci/static-checks.sh

      - name: Run Conftest Policies
        run: nix develop --command bash scripts/ci/conftest-policies.sh

  terragrunt-apply:
    name: Terragrunt Apply
    needs:
      - static-policy
    concurrency:
      group: terragrunt-apply-production
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 90
    env:
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
      ARM_CLIENT_ID: ${{ vars.AZUREAD_CLIENT_ID || secrets.AZUREAD_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZUREAD_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZUREAD_TENANT_ID || secrets.AZUREAD_TENANT_ID }}
      APPLY_HEAD_SHA: ${{ github.sha }}
      TERRAGRUNT_ARGOCD_APP: ${{ inputs.argocd_app }}
      TERRAGRUNT_REPAIR_ARGOCD_APP_STATE: ${{ inputs.repair_argocd_app_state }}
    steps:
      - name: Check Out Repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Last Successful Apply
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! base_sha="$(
            gh api \
              "repos/${GH_REPO}/actions/workflows/terragrunt-apply.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty'
          )"; then
            echo "::error::Unable to resolve the latest successful Terragrunt Apply SHA."
            exit 1
          fi

          if [[ -z "${base_sha}" ]]; then
            echo "::error::No successful Terragrunt Apply SHA exists; refusing to checkpoint an unknown deleted-unit range."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${base_sha}" "${APPLY_HEAD_SHA}"; then
            echo "::error::The latest successful Terragrunt Apply ${base_sha} is not an ancestor of ${APPLY_HEAD_SHA}."
            exit 1
          fi

          echo "Using last successful Terragrunt Apply ${base_sha} as the affected-unit base."
          printf 'APPLY_BASE_SHA=%s\n' "${base_sha}" >>"${GITHUB_ENV}"

      - name: Install Nix
        # cachix/install-nix-action@v31
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Production Apply Inputs
        env:
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
        run: |
          test -n "${AWS_APPLY_ROLE_ARN}" || { echo "AWS_ROLE_TO_ASSUME_HOMELAB must be set as a repository or homelab-production environment variable or secret."; exit 1; }
          test -n "${OCTELIUM_AUTH_TOKEN}" || { echo "OCTELIUM_CI_AUTH_TOKEN must be set as a homelab-production environment secret."; exit 1; }

      - name: Configure AWS Credentials
        # aws-actions/configure-aws-credentials@v6.1.1
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: homelab-terragrunt-apply-${{ github.run_id }}
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          unset-current-credentials: true

      - name: Run Live Terragrunt Apply
        env:
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: ${{ env.KUBE_API_SERVER_URL }}
        run: |
          nix develop --command bash <<'EOF'
          set -euo pipefail
          bash scripts/ci/install-kubeconfig.sh
          kubectl --request-timeout=15s version
          bash scripts/ci/terragrunt-apply.sh
          EOF
