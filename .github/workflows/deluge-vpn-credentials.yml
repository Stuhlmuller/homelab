name: Deluge VPN Credentials

# checkov:skip=CKV_GHA_7: expected_sha pins reviewed main and path selects one of two fixed SSM target sets.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit for the credential transfer
        required: true
        type: string
      path:
        description: Deluge VPN path to provision
        required: true
        type: choice
        options: [a, b]

permissions: {}

concurrency:
  group: deluge-vpn-credentials-production
  cancel-in-progress: false

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit And Path
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPN_PATH: ${{ inputs.path }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REF" = refs/heads/main
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          [[ "$VPN_PATH" == a || "$VPN_PATH" == b ]]

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"
          nix develop --command bash scripts/ci/static-checks.sh --offline-verified
          python3 -B scripts/ci/deluge-vpn-credentials-test.py

  credential:
    name: Validate And Store Deluge VPN Credentials
    needs: [static-policy]
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Verify Current Main Commit
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "$ACTUAL_SHA" = "$current_main_sha"

      - name: Install WireGuard Key Validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard-tools

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-duration-seconds: 900
          role-session-name: homelab-deluge-vpn-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":"ssm:DescribeParameters","Resource":"*"},
            {"Effect":"Allow","Action":"ssm:PutParameter","Resource":[
            "arn:aws:ssm:us-west-2:*:parameter/homelab/deluge/vpn/${{ inputs.path }}/airvpn-profile",
            "arn:aws:ssm:us-west-2:*:parameter/homelab/deluge/vpn/${{ inputs.path }}/gateway-transit",
            "arn:aws:ssm:us-west-2:*:parameter/homelab/deluge/vpn/${{ inputs.path }}/client-transit"]},
            {"Effect":"Allow","Action":"kms:Encrypt","Resource":"*","Condition":{
            "StringEquals":{"kms:ViaService":"ssm.us-west-2.amazonaws.com"},
            "StringLike":{"kms:EncryptionContext:PARAMETER_ARN":[
            "arn:aws:ssm:us-west-2:*:parameter/homelab/deluge/vpn/${{ inputs.path }}/airvpn-profile",
            "arn:aws:ssm:us-west-2:*:parameter/homelab/deluge/vpn/${{ inputs.path }}/gateway-transit",
            "arn:aws:ssm:us-west-2:*:parameter/homelab/deluge/vpn/${{ inputs.path }}/client-transit"]}}}]}

      - name: Validate And Store Selected Path
        env:
          DELUGE_VPN_BUNDLE: ${{ secrets[inputs.path == 'a' && 'DELUGE_VPN_PATH_A_BUNDLE' || 'DELUGE_VPN_PATH_B_BUNDLE'] }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VPN_PATH: ${{ inputs.path }}
        run: python3 -I scripts/deluge-vpn-credentials.py "$VPN_PATH"
