name: Renovate Acceptance Credentials

# checkov:skip=CKV_GHA_7: expected_sha pins reviewed current main; credential and SSM targets are fixed.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit to provision the read-only acceptance App
        required: true
        type: string

permissions: {}

concurrency:
  group: renovate-acceptance-credentials-production
  cancel-in-progress: false

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: nix develop --command bash scripts/ci/static-checks.sh

  credential:
    name: Validate And Store Read-Only App Credentials
    needs: [static-policy]
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-renovate-acceptance-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":"ssm:DescribeParameters","Resource":"*"},
            {"Effect":"Allow","Action":"ssm:PutParameter","Resource":["arn:aws:ssm:us-west-2:*:parameter/homelab/renovate/acceptance/github-app/issuer-id","arn:aws:ssm:us-west-2:*:parameter/homelab/renovate/acceptance/github-app/private-key"]},
            {"Effect":"Allow","Action":"kms:Encrypt","Resource":"*","Condition":{"StringEquals":{"kms:ViaService":"ssm.us-west-2.amazonaws.com"},"StringLike":{"kms:EncryptionContext:PARAMETER_ARN":["arn:aws:ssm:us-west-2:*:parameter/homelab/renovate/acceptance/github-app/issuer-id","arn:aws:ssm:us-west-2:*:parameter/homelab/renovate/acceptance/github-app/private-key"]}}}]}

      - name: Store Read-Only App Credentials
        env:
          RENOVATE_ACCEPTANCE_APP_ISSUER_ID: ${{ secrets.RENOVATE_ACCEPTANCE_APP_ISSUER_ID }}
          RENOVATE_ACCEPTANCE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_ACCEPTANCE_APP_PRIVATE_KEY }}
        run: python3 -I scripts/renovate-acceptance-credentials.py
