name: Mirror Kubernetes Images To Harbor
run-name: Mirror ${{ inputs.image_scope || 'all' }} @ ${{ github.sha }}

# checkov:skip=CKV_GHA_7: expected_sha binds reviewed current main; image_scope selects only fixed all/Fleet/Bazarr/Mastodon/Traefik/Chainguard/Harbor inventories with unchanged destinations and verification.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit containing the reviewed Harbor image inventory
        required: true
        type: string
      image_scope:
        description: Fixed reviewed inventory to publish and verify
        required: true
        default: all
        type: choice
        options: [all, fleet, bazarr, mastodon, traefik, chainguard, harbor]

permissions: {}

jobs:
  static-policy:
    name: Validate Harbor Mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = refs/heads/main
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          if git cat-file -e origin/main:scripts/config/nix-cache.json 2>/dev/null; then
            git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          else
            # Bootstrap before the policy lands on main: build without this cache.
            printf '%s\n' '{"url":"","publicKey":""}' >"$cache_policy"
          fi
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"
          nix develop --command bash scripts/ci/static-checks.sh --offline-verified

      - name: Validate Harbor Publication Gates
        run: nix develop --command python3 -I scripts/ci/harbor-publish-test.py

  mirror:
    name: Copy Reviewed Public Images
    needs: [static-policy]
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      # Mirror runs share mutable aliases only within the public mirror project.
      group: harbor-mirror-production
      cancel-in-progress: false
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Current Main Commit Before Credentials
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_SCOPE: ${{ inputs.image_scope || 'all' }}
        run: |
          set -euo pipefail
          case "$IMAGE_SCOPE" in all|fleet|bazarr|mastodon|traefik|chainguard|harbor) ;; *) exit 2 ;; esac
          test "${ACTUAL_REF}" = refs/heads/main
          [[ "${ACTUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-harbor-mirror-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Copy And Verify Fixed Public Digests
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_SCOPE: ${{ inputs.image_scope || 'all' }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          public_status="$RUNNER_TEMP/harbor-mirror-status"
          rm -f "$public_status"
          trap 'rm -f "$private_log" "$public_status"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          case "$IMAGE_SCOPE" in
            all)
              bash scripts/ci/harbor-publish.sh mirror
              ;;
            fleet)
              bash scripts/ci/harbor-publish.sh mirror-fleet
              ;;
            mastodon)
              bash scripts/ci/harbor-publish.sh mirror-mastodon
              ;;
            bazarr)
              bash scripts/ci/harbor-publish.sh mirror-bazarr
              ;;
            chainguard)
              bash scripts/ci/harbor-publish.sh mirror-chainguard
              ;;
            traefik)
              bash scripts/ci/harbor-publish.sh mirror-traefik
              ;;
            harbor)
              bash scripts/ci/harbor-publish.sh mirror-harbor
              ;;
            *) exit 2 ;;
          esac
          EOF
          then
            if [[ -f "$public_status" ]] && sha256sum --check --status <<<'7a92efbc6efb4b42ebedc2140e9343be652785c56b71e4aecacdae7fa51787fa  scripts/ci/harbor-publish.sh' 2>/dev/null; then
              cat "$public_status"
            fi
            echo "::error::Harbor mirror failed; private transport and registry output withheld."
            exit 1
          fi
          echo "Selected inventory copied with matching digests and complete authenticated Harbor pulls; upstream sources retained; private output withheld."

      - name: Retain Only Encrypted Failure Diagnostic
        if: failure()
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: harbor-publication-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harbor-publication-error.gpg
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: false
