name: Mirror Kubernetes Images To Harbor
run-name: Mirror ${{ inputs.image_scope || 'all' }} @ ${{ github.sha }}

# checkov:skip=CKV_GHA_7: expected_sha binds reviewed current main; image_scope selects only fixed all/Fleet/Bazarr/Mastodon/Traefik/Chainguard/Harbor/Renovate/DNS/LiteLLM/Prometheus inventories with unchanged destinations and verification.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit containing the reviewed Harbor image inventory
        required: true
        type: string
      image_scope:
        description: Fixed reviewed inventory to publish and verify
        required: true
        default: all
        type: choice
        options: [all, fleet, bazarr, mastodon, traefik, chainguard, harbor, renovate, dns, litellm, prometheus]

permissions: {}

jobs:
  static-policy:
    name: Validate Harbor Mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = refs/heads/main
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          if git cat-file -e origin/main:scripts/config/nix-cache.json 2>/dev/null; then
            git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          else
            # Bootstrap before the policy lands on main: build without this cache.
            printf '%s\n' '{"url":"","publicKey":""}' >"$cache_policy"
          fi
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"
          nix develop --command bash scripts/ci/static-checks.sh --offline-verified

      - name: Validate Harbor Publication Gates
        run: nix develop --command python3 -I scripts/ci/harbor-publish-test.py

  mirror:
    name: Copy Reviewed Public Images
    needs: [static-policy]
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      # Mirror runs share mutable aliases only within the public mirror project.
      group: harbor-mirror-production
      cancel-in-progress: false
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Current Main Commit Before Credentials
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_SCOPE: ${{ inputs.image_scope || 'all' }}
        run: |
          set -euo pipefail
          case "$IMAGE_SCOPE" in all|fleet|bazarr|mastodon|traefik|chainguard|harbor|renovate|dns|litellm|prometheus) ;; *) exit 2 ;; esac
          test "${ACTUAL_REF}" = refs/heads/main
          [[ "${ACTUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Install Verified Tailscale Client
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/tailscale-state"
          cd "$RUNNER_TEMP/tailscale-state"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 120 \
            https://pkgs.tailscale.com/stable/tailscale_1.102.3_amd64.tgz -o release.tgz
          sha256sum --check --status <<<'36ddd9b51be57ffc2990cf76323cfa13643bfbb1b8a969f6183fa164741cdef5  release.tgz'
          tar xzf release.tgz tailscale_1.102.3_amd64/tailscale tailscale_1.102.3_amd64/tailscaled

      - name: Join Production Tailnet
        id: join
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +x
          set -euo pipefail
          exec >/dev/null 2>&1
          : "${TAILSCALE_AUTH_KEY:?Production enrollment key is missing}"
          export -n TAILSCALE_AUTH_KEY
          dir="$RUNNER_TEMP/tailscale-state"
          bin="$dir/tailscale_1.102.3_amd64"
          sudo systemd-run --quiet --collect --unit=harbor-mirror-tailscaled --property=Type=exec --property=TimeoutStopSec=20s \
            --property=StandardOutput=null \
            --property=StandardError=null "$bin/tailscaled" --statedir="$dir/state" --socket="$dir/tailscaled.sock"
          for _ in {1..30}; do
            [[ -S "$dir/tailscaled.sock" ]] && break
            sleep 0.5
          done
          test -S "$dir/tailscaled.sock"
          builtin printf '%s' "$TAILSCALE_AUTH_KEY" | sudo "$bin/tailscale" --socket="$dir/tailscaled.sock" up \
            --auth-key=file:/dev/stdin --hostname="harbor-mirror-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --accept-routes=false --accept-dns=true --timeout=2m >/dev/null 2>&1
          sudo "$bin/tailscale" --socket="$dir/tailscaled.sock" status --json 2>/dev/null | \
            jq -e '.BackendState == "Running" and .Self.Tags == ["tag:homelab-ci-apply"]' >/dev/null

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-harbor-mirror-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Copy And Verify Fixed Public Digests
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_SCOPE: ${{ inputs.image_scope || 'all' }}
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          public_status="$RUNNER_TEMP/harbor-mirror-status"
          rm -f "$public_status"
          trap 'rm -f "$private_log" "$public_status"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          case "$IMAGE_SCOPE" in
            all)
              bash scripts/ci/harbor-publish.sh mirror --tailscale
              ;;
            fleet)
              bash scripts/ci/harbor-publish.sh mirror-fleet --tailscale
              ;;
            mastodon)
              bash scripts/ci/harbor-publish.sh mirror-mastodon --tailscale
              ;;
            bazarr)
              bash scripts/ci/harbor-publish.sh mirror-bazarr --tailscale
              ;;
            chainguard)
              bash scripts/ci/harbor-publish.sh mirror-chainguard --tailscale
              ;;
            traefik)
              bash scripts/ci/harbor-publish.sh mirror-traefik --tailscale
              ;;
            harbor)
              bash scripts/ci/harbor-publish.sh mirror-harbor --tailscale
              ;;
            renovate)
              bash scripts/ci/harbor-publish.sh mirror-renovate --tailscale
              ;;
            dns)
              bash scripts/ci/harbor-publish.sh mirror-dns --tailscale
              ;;
            litellm)
              bash scripts/ci/harbor-publish.sh mirror-litellm --tailscale
              ;;
            prometheus)
              bash scripts/ci/harbor-publish.sh mirror-prometheus --tailscale
              ;;
            *) exit 2 ;;
          esac
          EOF
          then
            if [[ -f "$public_status" ]] && sha256sum --check --status <<<'cdc426b31d9c58fde8cff05d7a632fa1bdabc18be84f819ca3944581960a7a31  scripts/ci/harbor-publish.sh' 2>/dev/null; then
              cat "$public_status"
            fi
            echo "::error::Harbor mirror failed; private transport and registry output withheld."
            exit 1
          fi
          echo "Selected inventory copied with matching digests and complete authenticated Harbor pulls; upstream sources retained; private output withheld."

      - name: Retain Only Encrypted Failure Diagnostic
        if: failure()
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: harbor-publication-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harbor-publication-error.gpg
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: false

      - name: Leave Production Tailnet
        if: always() && steps.join.outcome != 'skipped'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tailscale-state"
          result=0
          if [[ -S "$dir/tailscaled.sock" ]]; then
            sudo timeout 20 "$dir/tailscale_1.102.3_amd64/tailscale" --socket="$dir/tailscaled.sock" logout >/dev/null 2>&1 || result=1
          fi
          sudo systemctl stop harbor-mirror-tailscaled || result=1
          sudo "$dir/tailscale_1.102.3_amd64/tailscaled" --cleanup >/dev/null 2>&1 || result=1
          sudo rm -rf -- "$dir"
          exit "$result"
