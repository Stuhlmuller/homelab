name: Deluge VPN Image

# checkov:skip=CKV_GHA_7: expected_sha pins current main; image, fixtures, and destination are fixed.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
    paths:
      - 'builds/deluge-vpn/**'
      - 'clusters/homelab/apps/deluge/**'
      - 'clusters/homelab/apps/prometheus/deluge-*.yaml'
      - 'IaC/homelab/us-west-2/apps/deluge/**'
      - 'IaC/terragrunt-catalog/units/live/aws-ssm-parameters/terragrunt.hcl'
      - '.github/workflows/deluge-vpn-image.yml'
      - 'scripts/ci/harbor-publish.sh'
      - 'scripts/ci/harbor-publish-test.py'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed current main commit for Deluge VPN publication
        required: true
        type: string

permissions: {}

jobs:
  test-build:
    name: Test Deluge VPN Routing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Run VPN Health Tests
        run: python3 -B -m unittest discover -s builds/deluge-vpn -p 'test_*.py'

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false

      - name: Validate Staged Deluge Manifests
        run: nix develop --command python3 -I builds/deluge-vpn/check-manifests.py

      - name: Build And Test Deluge VPN Routing
        run: |
          set -euo pipefail
          bash builds/deluge-vpn/build.sh
          sudo modprobe wireguard
          bash builds/deluge-vpn/test-network.sh

  publish:
    name: Publish Reviewed Deluge VPN Image
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: harbor-packages-production
      cancel-in-progress: false
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publication.outputs.image }}
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          [[ "${ACTUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Build And Test Deluge VPN Before Registry Credentials
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s builds/deluge-vpn -p 'test_*.py'
          bash builds/deluge-vpn/build.sh
          sudo modprobe wireguard
          bash builds/deluge-vpn/test-network.sh

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false

      - name: Validate Harbor Publication Gates
        run: nix develop --command python3 -I scripts/ci/harbor-publish-test.py

      - name: Verify Current Main Commit
        env:
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-harbor-publish-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Publish And Verify Private Harbor Image
        id: publication
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/harbor-publish.sh publish-deluge-vpn
          EOF
          then
            echo "::error::Harbor publication failed; private transport and registry output withheld."
            exit 1
          fi
          echo "Deluge VPN image published, completely pulled, signed, and verified; private output withheld."

  published-digest:
    name: Report Published Deluge VPN Digest
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate Published Reference
        env:
          IMAGE_REFERENCE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_REFERENCE:-}" =~ ^harbor\.stinkyboi\.com/homelab/homelab-deluge-vpn:homelab-${GITHUB_SHA}@sha256:[0-9a-f]{64}$ ]]
          set -o noclobber
          printf '%s\n' "$IMAGE_REFERENCE" >"${RUNNER_TEMP:?}/deluge-vpn-published-image.txt"
      - name: Upload Published Reference
        uses: chainguard-actions/actions-upload-artifact@ebf8f2543b7189e9a67dcac1af8cabbc5d7a3fd6 # v7.0.2
        with:
          name: deluge-vpn-published-image-${{ github.sha }}
          path: ${{ runner.temp }}/deluge-vpn-published-image.txt
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
