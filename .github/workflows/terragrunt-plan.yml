name: Terragrunt Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: terragrunt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com

jobs:
  terragrunt-plan:
    name: Terragrunt Plan
    runs-on: ubuntu-latest
    environment:
      name: homelab-plan
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Cache Terragrunt Providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/terragrunt/providers
          key: terragrunt-providers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'IaC/**/*.tf', 'IaC/terragrunt-catalog/**/*.hcl') }}
          restore-keys: |
            terragrunt-providers-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: homelab-terragrunt-plan-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Run Live Terragrunt Plan
        env:
          BASE_REF: ${{ github.base_ref }}
          ARM_CLIENT_ID: ${{ secrets.AZUREAD_CLIENT_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_CLI: "false"
          ARM_USE_MSI: "false"
          ARM_TENANT_ID: ${{ secrets.AZUREAD_TENANT_ID }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: ${{ env.KUBE_API_SERVER_URL }}
        run: |
          terragrunt run plan -all --filter-affected --filter-allow-destroy --log-format bare
