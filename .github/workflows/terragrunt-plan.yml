name: Terragrunt Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: terragrunt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      requires-live-plan: ${{ steps.live-plan-scope.outputs.requires-live-plan }}
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Live Terragrunt Plan Scope
        id: live-plan-scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          requires_live_plan=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/terragrunt-plan.yml|IaC/*|flake.nix|flake.lock|policy/kubernetes.rego|policy/terraform.rego)
                requires_live_plan=true
                ;;
              scripts/ci/install-kubeconfig.sh|scripts/ci/terragrunt-*|scripts/ci/tailscale-*|clusters/homelab/apps/tailscale/*|scripts/config/tailscale-*)
                requires_live_plan=true
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")

          echo "requires-live-plan=${requires_live_plan}" >>"${GITHUB_OUTPUT}"
          if [ "${requires_live_plan}" = "true" ]; then
            echo "Live Terragrunt plan is required for this pull request."
          else
            echo "No live Terragrunt plan inputs changed; skipping Tailscale, Kubernetes, and OpenTofu plan steps."
          fi

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          if git cat-file -e origin/main:scripts/config/nix-cache.json 2>/dev/null; then
            git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          else
            # Bootstrap before the policy lands on main: build without this cache.
            printf '%s\n' '{"url":"","publicKey":""}' >"$cache_policy"
          fi
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"
          nix develop --command bash scripts/ci/static-checks.sh --offline-verified

  terragrunt-plan:
    name: Terragrunt Plan
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.static-policy.outputs.requires-live-plan == 'true'
    needs:
      - static-policy
    runs-on: ubuntu-24.04
    environment:
      name: homelab-plan
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Live Plan Inputs
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
        run: |
          test -n "${AWS_PLAN_ROLE_ARN}" || { echo "AWS_ROLE_TO_ASSUME_HOMELAB must be set as a repository or homelab-plan environment variable or secret."; exit 1; }

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: homelab-terragrunt-plan-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Prepare Tailscale State
        timeout-minutes: 1
        run: |
          umask 077
          mkdir -- "$RUNNER_TEMP/tailscale-state"

      - name: Connect To Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          statedir: ${{ runner.temp }}/tailscale-state
          version: 1.102.3
          log-mode: quiet
          ping: homelab-tailscale-operator.tail67beb.ts.net

      - name: Verify Tailscale Identity
        timeout-minutes: 1
        run: python3 -I scripts/ci/tailscale-identity-check.py plan

      - name: Run Live Terragrunt Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZUREAD_CLIENT_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_CLI: "false"
          ARM_USE_MSI: "false"
          ARM_TENANT_ID: ${{ secrets.AZUREAD_TENANT_ID }}
        run: |
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          echo "::group::Kubeconfig setup"
          bash scripts/ci/install-kubeconfig.sh --tailscale
          python3 -I scripts/ci/tailscale-access-check.py plan
          echo "::group::Kubernetes API check"
          kubectl --request-timeout=15s version >/dev/null
          echo "::group::Argo CD bootstrap plan"
          bash scripts/ci/terragrunt-plan.sh
          EOF
          then
            if sha256sum --check --status <<<'aed6c96d6e74935108029cc3ee115bd68e1e4f8ca381380d413d67198c2fb15c  scripts/ci/terragrunt-plan-stage.sh' 2>/dev/null; then
              bash scripts/ci/terragrunt-plan-stage.sh <"$private_log"
            fi
            echo "::error::Live plan failed; detailed output was withheld because this is a public repository. Reproduce it locally."
            exit 1
          fi
          echo "Live plan and policy checks passed; details withheld."

  terragrunt-plan-skipped:
    name: Terragrunt Plan Skipped
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.static-policy.outputs.requires-live-plan != 'true'
    needs:
      - static-policy
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Record Live Plan Skip
        run: echo "No live Terragrunt plan inputs changed."

  terragrunt-gate:
    name: Terragrunt Gate
    if: ${{ always() }}
    needs:
      - static-policy
      - terragrunt-plan
      - terragrunt-plan-skipped
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require Applicable Checks
        env:
          LIVE_PLAN_REQUIRED: ${{ needs.static-policy.outputs.requires-live-plan }}
          LIVE_PLAN_RESULT: ${{ needs.terragrunt-plan.result }}
          SKIP_NOTE_RESULT: ${{ needs.terragrunt-plan-skipped.result }}
          STATIC_RESULT: ${{ needs.static-policy.result }}
          TRUSTED_HEAD: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          test "${STATIC_RESULT}" = "success" || {
            echo "::error::Static policy and security checks ended ${STATIC_RESULT}."
            exit 1
          }
          case "${LIVE_PLAN_REQUIRED}" in
            true|false) ;;
            *) echo "::error::Live plan scope was not resolved."; exit 1 ;;
          esac
          if [[ "${TRUSTED_HEAD}" = "true" && "${LIVE_PLAN_REQUIRED}" = "true" ]]; then
            test "${LIVE_PLAN_RESULT}" = "success" || {
              echo "::error::Required live Terragrunt plan ended ${LIVE_PLAN_RESULT}."
              exit 1
            }
            test "${SKIP_NOTE_RESULT}" = "skipped" || {
              echo "::error::Live plan skip check ended ${SKIP_NOTE_RESULT}; expected skipped."
              exit 1
            }
          elif [[ "${TRUSTED_HEAD}" = "true" ]]; then
            test "${LIVE_PLAN_RESULT}" = "skipped" || {
              echo "::error::Non-applicable live Terragrunt plan ended ${LIVE_PLAN_RESULT}; expected skipped."
              exit 1
            }
            test "${SKIP_NOTE_RESULT}" = "success" || {
              echo "::error::Live plan skip check ended ${SKIP_NOTE_RESULT}."
              exit 1
            }
          else
            test "${LIVE_PLAN_RESULT}" = "skipped" || {
              echo "::error::Non-applicable live Terragrunt plan ended ${LIVE_PLAN_RESULT}; expected skipped."
              exit 1
            }
            test "${SKIP_NOTE_RESULT}" = "skipped" || {
              echo "::error::Forked pull requests must skip the live plan check; got ${SKIP_NOTE_RESULT}."
              exit 1
            }
          fi
