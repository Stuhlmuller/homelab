name: Terragrunt Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: terragrunt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      requires-live-plan: ${{ steps.live-plan-scope.outputs.requires-live-plan }}
    steps:
      - name: Check Out Repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Live Terragrunt Plan Scope
        id: live-plan-scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          requires_live_plan=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/terragrunt-plan.yml|IaC/*|flake.nix|flake.lock|policy/kubernetes.rego|policy/terraform.rego)
                requires_live_plan=true
                ;;
              scripts/ci/connect-octelium.sh|scripts/ci/disconnect-octelium.sh|scripts/ci/install-kubeconfig.sh|scripts/ci/install-octelium-client.sh|scripts/ci/terragrunt-*)
                requires_live_plan=true
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")

          echo "requires-live-plan=${requires_live_plan}" >>"${GITHUB_OUTPUT}"
          if [ "${requires_live_plan}" = "true" ]; then
            echo "Live Terragrunt plan is required for this pull request."
          else
            echo "No live Terragrunt plan inputs changed; skipping Octelium, Kubernetes, and OpenTofu plan steps."
          fi

      - name: Install Nix
        # cachix/install-nix-action@v31
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Run Static Checks
        run: nix develop --command bash scripts/ci/static-checks.sh

      - name: Run Conftest Policies
        run: nix develop --command bash scripts/ci/conftest-policies.sh

  terragrunt-plan:
    name: Terragrunt Plan
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.static-policy.outputs.requires-live-plan == 'true'
    needs:
      - static-policy
    runs-on: ubuntu-24.04
    environment:
      name: homelab-plan
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Check Out Repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action@v31
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Live Plan Inputs
        env:
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
        run: |
          test -n "${AWS_PLAN_ROLE_ARN}" || { echo "AWS_ROLE_TO_ASSUME_HOMELAB must be set as a repository or homelab-plan environment variable or secret."; exit 1; }
          test -n "${OCTELIUM_AUTH_TOKEN}" || { echo "OCTELIUM_CI_AUTH_TOKEN must be set as a homelab-plan environment secret."; exit 1; }

      - name: Configure AWS Credentials
        # aws-actions/configure-aws-credentials@v6.1.1
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: homelab-terragrunt-plan-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Run Live Terragrunt Plan
        env:
          ARM_CLIENT_ID: ${{ vars.AZUREAD_CLIENT_ID || secrets.AZUREAD_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZUREAD_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZUREAD_TENANT_ID || secrets.AZUREAD_TENANT_ID }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
        run: |
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/install-kubeconfig.sh
          kubectl --request-timeout=15s version >/dev/null
          bash scripts/ci/terragrunt-plan.sh
          EOF
          then
            echo "::error::Live plan failed; detailed output was withheld because this is a public repository. Reproduce it locally."
            exit 1
          fi
          echo "Live plan and policy checks passed; details withheld."

  terragrunt-plan-skipped:
    name: Terragrunt Plan Skipped
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.static-policy.outputs.requires-live-plan != 'true'
    needs:
      - static-policy
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Record Live Plan Skip
        run: echo "No live Terragrunt plan inputs changed."

  terragrunt-gate:
    name: Terragrunt Gate
    if: ${{ always() }}
    needs:
      - static-policy
      - terragrunt-plan
      - terragrunt-plan-skipped
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require Applicable Checks
        env:
          LIVE_PLAN_REQUIRED: ${{ needs.static-policy.outputs.requires-live-plan }}
          LIVE_PLAN_RESULT: ${{ needs.terragrunt-plan.result }}
          SKIP_NOTE_RESULT: ${{ needs.terragrunt-plan-skipped.result }}
          STATIC_RESULT: ${{ needs.static-policy.result }}
          TRUSTED_HEAD: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          test "${STATIC_RESULT}" = "success" || {
            echo "::error::Static policy and security checks ended ${STATIC_RESULT}."
            exit 1
          }
          case "${LIVE_PLAN_REQUIRED}" in
            true|false) ;;
            *) echo "::error::Live plan scope was not resolved."; exit 1 ;;
          esac
          if [[ "${TRUSTED_HEAD}" = "true" && "${LIVE_PLAN_REQUIRED}" = "true" ]]; then
            test "${LIVE_PLAN_RESULT}" = "success" || {
              echo "::error::Required live Terragrunt plan ended ${LIVE_PLAN_RESULT}."
              exit 1
            }
            test "${SKIP_NOTE_RESULT}" = "skipped" || {
              echo "::error::Live plan skip check ended ${SKIP_NOTE_RESULT}; expected skipped."
              exit 1
            }
          elif [[ "${TRUSTED_HEAD}" = "true" ]]; then
            test "${LIVE_PLAN_RESULT}" = "skipped" || {
              echo "::error::Non-applicable live Terragrunt plan ended ${LIVE_PLAN_RESULT}; expected skipped."
              exit 1
            }
            test "${SKIP_NOTE_RESULT}" = "success" || {
              echo "::error::Live plan skip check ended ${SKIP_NOTE_RESULT}."
              exit 1
            }
          else
            test "${LIVE_PLAN_RESULT}" = "skipped" || {
              echo "::error::Non-applicable live Terragrunt plan ended ${LIVE_PLAN_RESULT}; expected skipped."
              exit 1
            }
            test "${SKIP_NOTE_RESULT}" = "skipped" || {
              echo "::error::Forked pull requests must skip the live plan check; got ${SKIP_NOTE_RESULT}."
              exit 1
            }
          fi
