name: Cordium Wrong-Workflow Login Denial

# checkov:skip=CKV_GHA_7: expected_sha pins reviewed main and cannot alter commands.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit for this fixed login-only denial case
        required: true
        type: string

permissions: {}

concurrency:
  group: homelab-cordium-check
  cancel-in-progress: false

jobs:
  deny:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify Dispatch Commit
        timeout-minutes: 1
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        timeout-minutes: 2
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false

      - name: Install Pinned Client
        timeout-minutes: 3
        run: scripts/ci/install-octelium-client.sh

      - name: Prepare Tailscale State
        timeout-minutes: 1
        run: |
          umask 077
          mkdir -- "$RUNNER_TEMP/tailscale-state"

      - name: Connect To Tailscale
        timeout-minutes: 2
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          authkey: ${{ secrets.TAILSCALE_CORDIUM_AUTH_KEY }}
          statedir: ${{ runner.temp }}/tailscale-state
          version: 1.102.3
          log-mode: quiet
          ping: homelab-ingress.tail67beb.ts.net

      - name: Verify Tailscale Identity
        timeout-minutes: 1
        run: python3 -I scripts/ci/tailscale-identity-check.py cordium

      - name: Observe Wrong-Workflow Rejection
        timeout-minutes: 8
        run: |
          execution_deadline=$(( $(date +%s) + 7 * 60 ))
          private_log="$(mktemp "${RUNNER_TEMP}/cordium-denial.XXXXXX")"
          chmod 600 "$private_log"
          trap 'rm -f -- "$private_log"' EXIT
          if ! nix develop --command bash scripts/ci/cordium-ci.sh "$execution_deadline" deny-workflow >"$private_log" 2>&1; then
            echo "::error::Expected wrong-workflow rejection was not established; private output withheld."
            exit 1
          fi
          echo "Observed the expected server rejection; correlate the authenticated audit record."
