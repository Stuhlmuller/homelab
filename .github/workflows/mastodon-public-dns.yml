name: Mastodon Public DNS

# checkov:skip=CKV_GHA_7: expected_sha only pins reviewed current main; hostname, SSM reads, and DNS target are fixed.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit to publish the fixed Mastodon DNS record
        required: true
        type: string

permissions: {}

env:
  KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com

concurrency:
  group: mastodon-public-dns-production
  cancel-in-progress: false

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Static Checks
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          if git cat-file -e origin/main:scripts/config/nix-cache.json 2>/dev/null; then
            git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          else
            # Bootstrap before the policy lands on main: build without this cache.
            printf '%s\n' '{"url":"","publicKey":""}' >"$cache_policy"
          fi
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"
          nix develop --command bash scripts/ci/static-checks.sh --offline-verified

  credential:
    name: Publish Reviewed Mastodon DNS
    needs: [static-policy]
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: homelab-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Verify Current Main Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "refs/heads/main"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Configure AWS Credentials
        uses: chainguard-actions/aws-actions-configure-aws-credentials@2ea09546a514e2cbdbe87dd880db44555f7d3508 # v6.2.0
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-mastodon-dns-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":"ssm:GetParameter","Resource":["arn:aws:ssm:us-west-2:*:parameter/homelab/cert-manager/cloudflare-api-token","arn:aws:ssm:us-west-2:*:parameter/homelab/octelium/cloudflare-tunnel-id"]},
            {"Effect":"Allow","Action":"kms:Decrypt","Resource":"*","Condition":{"StringEquals":{"kms:ViaService":"ssm.us-west-2.amazonaws.com"},"StringLike":{"kms:EncryptionContext:PARAMETER_ARN":["arn:aws:ssm:us-west-2:*:parameter/homelab/cert-manager/cloudflare-api-token","arn:aws:ssm:us-west-2:*:parameter/homelab/octelium/cloudflare-tunnel-id"]}}}]}

      - name: Install Readiness Kubeconfig
        env:
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/install-kubeconfig.sh
          EOF
          then
            echo "::error::Readiness kubeconfig installation failed; private details withheld."
            exit 1
          fi
          echo "Readiness kubeconfig installed; private details withheld."

      - name: Publish Fixed DNS Record
        run: python3 -I scripts/mastodon-public-dns.py
