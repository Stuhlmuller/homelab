name: Homelab Diagnostics

on:
  workflow_dispatch:
    inputs:
      target:
        description: Workload to inspect or repair
        required: true
        default: octobot
        type: choice
        options:
          - octobot
          - grafana
      action:
        description: Diagnostic action to run
        required: true
        default: restart
        type: choice
        options:
          - inspect
          - restart

permissions: {}

env:
  KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    environment:
      name: homelab-plan
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        # cachix/install-nix-action@v31
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Diagnostic Inputs
        env:
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
        run: |
          test -n "${OCTELIUM_AUTH_TOKEN}" || { echo "OCTELIUM_CI_AUTH_TOKEN must be set as a homelab-plan environment secret."; exit 1; }

      - name: Run Kubernetes Diagnostics Through Octelium
        env:
          ACTION: ${{ inputs.action }}
          KUBE_API_SERVER_URL: ${{ env.KUBE_API_SERVER_URL }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          nix develop --command bash <<'EOF'
          set -euo pipefail
          bash scripts/ci/install-kubeconfig.sh
          kubectl --request-timeout=15s version

          case "${TARGET}" in
            octobot)
              namespace=finance
              deployment=octobot
              selector=app.kubernetes.io/instance=octobot
              ;;
            grafana)
              namespace=monitoring
              deployment=grafana
              selector=app.kubernetes.io/name=grafana
              ;;
            *)
              echo "unsupported target: ${TARGET}" >&2
              exit 2
              ;;
          esac

          echo "::group::${TARGET} resources before ${ACTION}"
          kubectl -n "${namespace}" get deploy,rs,pod,svc,endpoints,endpointslice,pvc \
            -l "${selector}" -o wide || true
          kubectl -n "${namespace}" get deploy "${deployment}" -o wide || true
          kubectl -n "${namespace}" describe deployment "${deployment}" || true
          kubectl -n "${namespace}" get events \
            --field-selector involvedObject.namespace="${namespace}" \
            --sort-by=.lastTimestamp | tail -100 || true
          echo "::endgroup::"

          if [[ "${ACTION}" == "restart" ]]; then
            kubectl -n "${namespace}" rollout restart "deployment/${deployment}"
            kubectl -n "${namespace}" rollout status "deployment/${deployment}" --timeout=7m
          fi

          echo "::group::${TARGET} resources after ${ACTION}"
          kubectl -n "${namespace}" get deploy,rs,pod,svc,endpoints,endpointslice,pvc \
            -l "${selector}" -o wide || true
          kubectl -n "${namespace}" get deploy "${deployment}" -o jsonpath='{range .spec.template.spec.containers[*]}{.name}{"="}{.image}{"\n"}{end}' || true
          echo
          echo "::endgroup::"

          for pod in $(kubectl -n "${namespace}" get pod \
            -l "${selector}" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
            echo "::group::describe ${pod}"
            kubectl -n "${namespace}" describe pod "${pod}" || true
            echo "::endgroup::"
            echo "::group::logs ${pod}"
            kubectl -n "${namespace}" logs "${pod}" --all-containers --tail=200 || true
            echo "::endgroup::"
            echo "::group::previous logs ${pod}"
            kubectl -n "${namespace}" logs "${pod}" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done
          EOF
