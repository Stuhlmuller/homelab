name: Homelab Diagnostics

# checkov:skip=CKV_GHA_7: expected_sha binds diagnostics to reviewed main; it cannot alter commands or output.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to diagnose
        required: true
        type: string

permissions: {}

jobs:
  grafana:
    runs-on: ubuntu-24.04
    environment:
      name: homelab-plan
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Verify Dispatch Commit
        id: verify_main
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${ACTUAL_REF}" = "refs/heads/main" || { echo "::error::Diagnostics dispatches must use main, got ${ACTUAL_REF}."; exit 1; }
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}" || { echo "::error::Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."; exit 1; }

      - name: Check Out Repository
        id: checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        id: install_nix
        # cachix/install-nix-action@v31
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        id: restore_cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Install And Verify Octelium Kubeconfig
        id: install_kubeconfig
        env:
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
        run: |
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/install-kubeconfig.sh
          EOF
          then
            echo "::error::Octelium kubeconfig verification failed; detailed output was withheld because this is a public repository."
            exit 1
          fi
          echo "Octelium kubeconfig verified; output withheld."

      - name: Run Grafana Diagnostics Through Octelium
        id: live
        run: |
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          kubectl -n monitoring rollout status deployment/grafana --timeout=120s >/dev/null
          EOF
          then
            echo "::error::Grafana readiness check failed; live diagnostics were withheld because this is a public repository. Reproduce them locally."
            exit 1
          fi
          echo "Grafana readiness check passed; live details withheld."
