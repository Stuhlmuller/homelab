name: Homelab Diagnostics

# checkov:skip=CKV_GHA_7: expected_sha binds diagnostics to reviewed main; it cannot alter commands or output.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to diagnose
        required: true
        type: string

permissions: {}

jobs:
  grafana:
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${ACTUAL_REF}" = "refs/heads/main" || { echo "::error::Diagnostics dispatches must use main, got ${ACTUAL_REF}."; exit 1; }
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}" || { echo "::error::Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."; exit 1; }

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Prepare Tailscale State
        timeout-minutes: 1
        run: |
          umask 077
          mkdir -- "$RUNNER_TEMP/tailscale-state"

      - name: Connect To Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          statedir: ${{ runner.temp }}/tailscale-state
          version: 1.102.3
          log-mode: quiet
          ping: homelab-tailscale-operator.tail67beb.ts.net

      - name: Verify Tailscale Identity
        timeout-minutes: 1
        run: python3 -I scripts/ci/tailscale-identity-check.py apply

      - name: Run Grafana Diagnostics Through Tailscale
        run: |
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/install-kubeconfig.sh --tailscale
          python3 -I scripts/ci/tailscale-access-check.py apply
          kubectl --request-timeout=15s version >/dev/null
          kubectl -n monitoring rollout status deployment/grafana --timeout=120s >/dev/null
          EOF
          then
            echo "::error::Grafana readiness check failed; live diagnostics were withheld because this is a public repository. Reproduce them locally."
            exit 1
          fi
          echo "Grafana readiness check passed; live details withheld."
