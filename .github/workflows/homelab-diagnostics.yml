name: Homelab Diagnostics
run-name: Diagnose ${{ inputs.target }} @ ${{ github.sha }}

# checkov:skip=CKV_GHA_7: expected_sha binds reviewed main and target selects a fixed read-only diagnostic.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to diagnose
        required: true
        type: string
      target:
        description: Diagnostic target
        type: choice
        default: grafana
        options: [grafana, mastodon]

permissions: {}

env:
  KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com

jobs:
  grafana:
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${ACTUAL_REF}" = "refs/heads/main" || { echo "::error::Diagnostics dispatches must use main, got ${ACTUAL_REF}."; exit 1; }
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}" || { echo "::error::Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."; exit 1; }

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Diagnostic Inputs
        env:
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          DIAGNOSTIC_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$DIAGNOSTIC_TARGET" in grafana|mastodon) ;; *) exit 2 ;; esac
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -n "${OCTELIUM_AUTH_TOKEN}" || { echo "OCTELIUM_CI_AUTH_TOKEN must be set as a homelab-production environment secret."; exit 1; }

      - name: Run Diagnostics Through Octelium
        env:
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: ${{ env.KUBE_API_SERVER_URL }}
          DIAGNOSTIC_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          DIAGNOSTIC_SUMMARY="$(mktemp)"
          export DIAGNOSTIC_SUMMARY
          trap 'rm -f "$private_log" "$DIAGNOSTIC_SUMMARY"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/install-kubeconfig.sh
          kubectl --request-timeout=15s version >/dev/null
          case "$DIAGNOSTIC_TARGET" in
            grafana) kubectl -n monitoring rollout status deployment/grafana --timeout=120s >/dev/null ;;
            mastodon)
              sha256sum --check --status <<<'084f9bc520af5cec2cff32608a176760dc98ad5a259f90e9b82f13870174f1d7  scripts/ci/mastodon-diagnostic-summary.jq'
              kubectl --request-timeout=15s -n argocd get application mastodon -o json |
                jq -ce --arg revision "$GITHUB_SHA" -f scripts/ci/mastodon-diagnostic-summary.jq >"$DIAGNOSTIC_SUMMARY"
              jq -e '.revision_matches and .sync == "Synced" and .health == "Healthy"' "$DIAGNOSTIC_SUMMARY" >/dev/null
              ;;
            *) exit 2 ;;
          esac
          EOF
          then
            if [[ -s "$DIAGNOSTIC_SUMMARY" ]]; then cat "$DIAGNOSTIC_SUMMARY"; fi
            echo "::error::${DIAGNOSTIC_TARGET} readiness check failed; private live details were withheld."
            exit 1
          fi
          if [[ -s "$DIAGNOSTIC_SUMMARY" ]]; then cat "$DIAGNOSTIC_SUMMARY"; fi
          echo "${DIAGNOSTIC_TARGET} readiness check passed; private live details withheld."
