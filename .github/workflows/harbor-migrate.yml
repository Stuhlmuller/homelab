name: Migrate Custom Packages To Harbor

# checkov:skip=CKV_GHA_7: expected_sha binds the fixed migration inventory to reviewed current main; it cannot alter commands or destinations.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit containing the reviewed Harbor migration
        required: true
        type: string

permissions: {}

jobs:
  static-policy:
    name: Validate Harbor Migration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = refs/heads/main
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Run Static Checks
        run: nix develop --command bash scripts/ci/static-checks.sh

      - name: Run Conftest Policies
        run: nix develop --command bash scripts/ci/conftest-policies.sh

      - name: Validate Harbor Publication Gates
        run: nix develop --command python3 -I scripts/ci/harbor-publish-test.py

  migrate:
    name: Copy Reviewed Private Images
    needs: [static-policy]
    if: github.repository == 'Stuhlmuller/homelab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: harbor-packages-production
      cancel-in-progress: false
    environment:
      name: homelab-production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nix Store Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Verify Current Main Commit Before Credentials
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = refs/heads/main
          [[ "${ACTUAL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ACTUAL_SHA}"
          current_main_sha="$(git ls-remote https://github.com/Stuhlmuller/homelab.git refs/heads/main | cut -f1)"
          test "${ACTUAL_SHA}" = "${current_main_sha}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: homelab-harbor-migration-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_HOMELAB || secrets.AWS_ROLE_TO_ASSUME_HOMELAB }}
          unset-current-credentials: true

      - name: Copy And Verify Fixed GHCR Digests
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCTELIUM_AUTH_TOKEN: ${{ secrets.OCTELIUM_CI_AUTH_TOKEN }}
          KUBE_API_SERVER_URL: https://kubernetes-api-ci.stinkyboi.com
        run: |
          set -euo pipefail
          umask 077
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/harbor-publish.sh migrate
          EOF
          then
            echo "::error::Harbor migration failed; private transport and registry output withheld."
            exit 1
          fi
          echo "Both images copied with matching digests; GHCR sources retained; private output withheld."
