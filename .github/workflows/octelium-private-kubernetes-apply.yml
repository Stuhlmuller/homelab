name: Octelium Private Kubernetes Apply

# checkov:skip=CKV_GHA_7: expected_sha pins reviewed main; dispatch_id only identifies the exact run.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to apply
        required: true
        type: string
      dispatch_id:
        description: Unique identifier used to bind the caller to this run
        required: true
        type: string

run-name: Private Kubernetes @ ${{ github.sha }} / ${{ inputs.dispatch_id }}

permissions: {}

jobs:
  static-policy:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify Dispatch Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${ACTUAL_REF}" = "refs/heads/main" || { echo "::error::Production dispatches must use main, got ${ACTUAL_REF}."; exit 1; }
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}" || { echo "::error::Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."; exit 1; }

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false

      - name: Run Static Checks
        run: |
          git fetch --no-tags origin main
          cache_policy="${RUNNER_TEMP}/nix-cache-policy.json"
          if git cat-file -e origin/main:scripts/config/nix-cache.json 2>/dev/null; then
            git show origin/main:scripts/config/nix-cache.json >"$cache_policy"
          else
            # Bootstrap before the policy lands on main: build without this cache.
            printf '%s\n' '{"url":"","publicKey":""}' >"$cache_policy"
          fi
          bash scripts/ci/nix-checks.sh --policy "$cache_policy"
          nix develop --command bash scripts/ci/static-checks.sh --offline-verified

  reconcile:
    name: Reconcile Private Kubernetes Access
    needs:
      - static-policy
    concurrency:
      group: octelium-private-kubernetes-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: homelab-production
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Verify Current Main Commit
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "${ACTUAL_REF}" = "refs/heads/main" || { echo "::error::Production dispatches must use main, got ${ACTUAL_REF}."; exit 1; }
          test "${EXPECTED_SHA}" = "${ACTUAL_SHA}" || { echo "::error::Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."; exit 1; }
          current_main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)" || {
            echo "::error::Unable to resolve the current main SHA."
            exit 1
          }
          test "${ACTUAL_SHA}" = "${current_main_sha}" || {
            echo "::error::Dispatch ${ACTUAL_SHA} is stale; current main is ${current_main_sha}."
            exit 1
          }

      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false

      - name: Restore Nix Store Cache
        # nix-community/cache-nix-action@v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-develop-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-develop-${{ runner.os }}-

      - name: Prepare Tailscale State
        timeout-minutes: 1
        run: |
          umask 077
          mkdir -- "$RUNNER_TEMP/tailscale-state"

      - name: Connect To Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        timeout-minutes: 3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          statedir: ${{ runner.temp }}/tailscale-state
          version: 1.102.3
          log-mode: quiet
          ping: homelab-tailscale-operator.tail67beb.ts.net

      - name: Verify Tailscale Identity
        timeout-minutes: 1
        run: python3 -I scripts/ci/tailscale-identity-check.py apply

      - name: Reconcile Private Kubernetes Catalog
        env:
          OCTELIUM_CATALOG_AUTH_TOKEN: ${{ secrets.OCTELIUM_CATALOG_AUTH_TOKEN }}
        run: |
          private_log="$(mktemp)"
          trap 'rm -f "$private_log"' EXIT
          if ! nix develop --command bash >"$private_log" 2>&1 <<'EOF'
          set -euo pipefail
          umask 077
          bash scripts/ci/octelium-private-kubernetes-apply.sh
          EOF
          then
            echo "::error::Octelium private Kubernetes apply failed; detailed output was withheld because this is a public repository."
            exit 1
          fi
          echo "Octelium private Kubernetes apply completed; details withheld."
