name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 5"

permissions: {}

jobs:
  analyze-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: chainguard-actions/github-codeql-action/init@05a2b18f97905888db8f883471cc925f1a97a01c # v4.38.2
        with:
          languages: actions
          build-mode: none
      - name: Perform CodeQL analysis
        uses: chainguard-actions/github-codeql-action/analyze@05a2b18f97905888db8f883471cc925f1a97a01c # v4.38.2
