name: Argo CD runtime image ownership

on:
  pull_request:
    paths:
      - 'IaC/**'
      - 'clusters/homelab/apps/argocd-image-updater/**'
      - 'scripts/ci/argocd-image-updater*'
      - 'scripts/ci/argocd-registration-plan-check.py'
      - 'scripts/ci/terragrunt-apply.sh'
      - '.github/workflows/argocd-image-updater.yml'
      - 'flake.nix'
      - 'flake.lock'
  push:
    branches: [main]
    paths:
      - 'IaC/**'
      - 'clusters/homelab/apps/argocd-image-updater/**'
      - 'scripts/ci/argocd-image-updater*'
      - 'scripts/ci/argocd-registration-plan-check.py'
      - 'scripts/ci/terragrunt-apply.sh'
      - '.github/workflows/argocd-image-updater.yml'
      - 'flake.nix'
      - 'flake.lock'

permissions:
  contents: read

jobs:
  provider-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
      - name: Exercise actual provider against isolated API
        run: nix develop --no-update-lock-file --no-write-lock-file --command python3 -I scripts/ci/argocd-image-updater-provider-test.py
      - name: Render pinned controller and validate native configuration
        run: |
          # shellcheck disable=SC2016 # RUNNER_TEMP expands inside the Nix shell.
          nix develop --no-update-lock-file --no-write-lock-file --command bash -euo pipefail -c '
            helm template argocd-image-updater argocd-image-updater --repo https://argoproj.github.io/argo-helm --version 1.3.1 --namespace argocd -f clusters/homelab/apps/argocd-image-updater/values.yaml > "$RUNNER_TEMP/updater.yaml"
            python3 -I scripts/ci/argocd-image-updater-test.py --rendered-chart "$RUNNER_TEMP/updater.yaml" --unit
          '
