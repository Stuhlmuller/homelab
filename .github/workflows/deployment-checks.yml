name: Deployment Checks

on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Static Policy And Security Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out Repository
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false

      - name: Verify Dispatch Commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          bash scripts/ci/terragrunt-current-main.sh

      - name: Install Nix
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
        with:
          enable_kvm: false

      - name: Run Static Checks
        run: nix develop --command bash scripts/ci/static-checks.sh
