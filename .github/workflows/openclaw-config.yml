---
name: OpenClaw native config
on:
  pull_request:
    paths:
      - clusters/homelab/apps/openclaw/values.yaml
      - scripts/ci/openclaw-config-check.py
      - scripts/ci/openclaw-batch-native-check.py
      - .github/workflows/openclaw-config.yml
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths:
      - clusters/homelab/apps/openclaw/values.yaml
      - scripts/ci/openclaw-config-check.py
      - scripts/ci/openclaw-batch-native-check.py
      - .github/workflows/openclaw-config.yml
      - flake.nix
      - flake.lock
permissions:
  contents: read
jobs:
  native-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@9b08549f11b1cea64a914e482f95fa1413656505 # v5.0.1
        with:
          persist-credentials: false
      - name: Install locked toolchain
        uses: chainguard-actions/cachix-install-nix-action@043d5ae37e81d3c6b1604becbdc6aefbdc9fa909 # v31.11.1
      - name: Prove pinned vendor batch semantics on disposable state
        run: >-
          nix develop --command python3
          scripts/ci/openclaw-batch-native-check.py
