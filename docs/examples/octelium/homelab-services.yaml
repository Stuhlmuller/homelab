kind: ClusterConfig
metadata:
  name: default
spec:
  session:
    human:
      maxPerUser: 32
---
kind: Policy
metadata:
  name: homelab-human-web-access
spec:
  rules:
    - effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.spec.type == "HUMAN"
            - match: ctx.service.spec.mode == "WEB"
            - any:
                of:
                  - match: ctx.session.status.type == "CLIENT"
                  - match: ctx.session.status.type == "CLIENTLESS" && ctx.session.status.isBrowser
---
kind: Policy
metadata:
  name: homelab-workload-web-serve
spec:
  rules:
    - effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.metadata.name == "homelab-octelium-client"
            - match: ctx.user.spec.type == "WORKLOAD"
            - match: ctx.session.status.type == "CLIENT"
            - match: ctx.service.metadata.name == "homelab-demo.homelab"
            - match: ctx.service.spec.mode == "WEB"
---
kind: Policy
metadata:
  name: homelab-private-kubernetes-access
spec:
  attrs:
    cordiumDiscoveryPaths:
      - /api
      - /api/v1
      - /apis
      - /apis/apps/v1
      - /apis/batch/v1
    cordiumCoreResources:
      - events
      - pods
      - services
    cordiumAppsResources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    cordiumBatchResources:
      - cronjobs
      - jobs
  rules:
    - name: cordium-sensitive-read-deny
      effect: DENY
      condition:
        all:
          of:
            - match: ctx.user.metadata.name == "homelab-cordium-user"
            - match: ctx.user.spec.type == "HUMAN"
            - match: ctx.session.status.type == "CLIENT"
            - match: ctx.service.metadata.name == "kubernetes-api.homelab"
            - match: ctx.service.spec.mode == "KUBERNETES"
            - any:
                of:
                  - match: ctx.request.kubernetes.resource in ["secrets", "configmaps", "serviceaccounts", "tokenreviews", "subjectaccessreviews", "selfsubjectaccessreviews", "localsubjectaccessreviews", "selfsubjectrulesreviews"]
                  - match: ctx.request.kubernetes.subresource in ["proxy", "log", "exec", "attach", "portforward", "ephemeralcontainers", "token"]
    - name: operator-client
      effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.spec.type == "HUMAN"
            - match: ctx.session.status.type == "CLIENT"
            - match: ctx.service.metadata.name == "kubernetes-api.homelab"
            - match: ctx.service.spec.mode == "KUBERNETES"
            - match: ctx.user.metadata.name == "homelab-owner"
    - name: cordium-read-only-resources
      effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.spec.type == "HUMAN"
            - match: ctx.session.status.type == "CLIENT"
            - match: ctx.service.metadata.name == "kubernetes-api.homelab"
            - match: ctx.service.spec.mode == "KUBERNETES"
            - match: ctx.user.metadata.name == "homelab-cordium-user"
            - match: ctx.request.kubernetes.http.method == "GET"
            - match: ctx.request.kubernetes.verb in ["get", "list", "watch"]
            - match: has(ctx.request.kubernetes.namespace)
            - match: '!has(ctx.request.kubernetes.subresource)'
            - any:
                of:
                  - all:
                      of:
                        - match: ctx.request.kubernetes.apiPrefix == "api"
                        - match: '!has(ctx.request.kubernetes.apiGroup)'
                        - match: ctx.request.kubernetes.apiVersion == "v1"
                        - match: ctx.request.kubernetes.resource in attrs.cordiumCoreResources
                  - all:
                      of:
                        - match: ctx.request.kubernetes.apiPrefix == "apis"
                        - match: ctx.request.kubernetes.apiGroup == "apps"
                        - match: ctx.request.kubernetes.apiVersion == "v1"
                        - match: ctx.request.kubernetes.resource in attrs.cordiumAppsResources
                  - all:
                      of:
                        - match: ctx.request.kubernetes.apiPrefix == "apis"
                        - match: ctx.request.kubernetes.apiGroup == "batch"
                        - match: ctx.request.kubernetes.apiVersion == "v1"
                        - match: ctx.request.kubernetes.resource in attrs.cordiumBatchResources
    - name: cordium-read-only-discovery
      effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.spec.type == "HUMAN"
            - match: ctx.session.status.type == "CLIENT"
            - match: ctx.service.metadata.name == "kubernetes-api.homelab"
            - match: ctx.service.spec.mode == "KUBERNETES"
            - match: ctx.user.metadata.name == "homelab-cordium-user"
            - match: ctx.request.kubernetes.http.method == "GET"
            - match: ctx.request.kubernetes.verb == "get"
            - match: '!has(ctx.request.kubernetes.resource)'
            - match: '!has(ctx.request.kubernetes.subresource)'
            - match: ctx.request.kubernetes.http.path in attrs.cordiumDiscoveryPaths
---
kind: Policy
metadata:
  name: homelab-ci-kubernetes-api-access
spec:
  rules:
    - name: kubernetes-api-service
      effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.metadata.name == "homelab-ci"
            - match: ctx.user.spec.type == "WORKLOAD"
            - match: ctx.session.status.type == "CLIENTLESS"
            - match: ctx.service.metadata.name == "kubernetes-api-ci.default"
            - match: ctx.service.spec.mode == "KUBERNETES"
---
kind: Policy
metadata:
  name: homelab-cordium-user-access
spec:
  rules:
    - effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.metadata.name == "homelab-cordium-user"
            - match: ctx.user.spec.type == "HUMAN"
            - match: ctx.service.metadata.name == "default.cordium"
            - match: ctx.service.spec.mode == "WEB"
            - any:
                of:
                  - match: ctx.session.status.type == "CLIENT"
                  - match: ctx.session.status.type == "CLIENTLESS" && ctx.session.status.isBrowser
---
kind: Policy
metadata:
  name: homelab-cordium-agent-api-access
spec:
  rules:
    - effect: ALLOW
      condition:
        all:
          of:
            - match: ctx.user.metadata.name == "homelab-cordium-agent"
            - match: ctx.user.spec.type == "WORKLOAD"
            - match: ctx.session.status.type == "CLIENT"
            - match: ctx.service.metadata.name == "default-cordium.octelium-api"
            - match: ctx.service.spec.mode == "GRPC"
            - match: ctx.request.grpc.serviceFullName == "octelium.api.main.cordium.v1.ManagementService"
---
