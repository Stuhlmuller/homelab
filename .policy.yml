policy:
  approval:
    - pull request approved without review
  disapproval:
    requires:
      organizations:
        - "Stuhlmuller"

approval_rules:
  - name: pull request approved without review
    description: >-
      Approve without human or bot review. Required GitHub checks still gate
      merges, and organization members can explicitly disapprove a PR.
    requires:
      count: 0
