title = "homelab gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Octelium Enterprise package hash annotation"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''clusters/homelab/apps/octelium-enterprise/resources\.yaml''']
regexTarget = "line"
regexes = ['''octelium\.com/secret-manager-config:\s+[0-9a-f]{64}''']

[[allowlists]]
description = "Verified public Go module checksum lines in the Harbor dependency patch"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?m)^builds/harbor-core/patches/0003-security-dependencies\.patch$''']
regexTarget = "line"
regexes = [
  '''(?m)^\-github\.com/docker/docker\-credential\-helpers\ v0\.9\.3\ h1:gAm/VtF9wgqJMoxzT3Gj5p4AqIjCBS4wrsOh9yRqcz8=$''',
  '''(?m)^\+github\.com/docker/docker\-credential\-helpers\ v0\.9\.5\ h1:EFNN8DHvaiK8zVqFA2DT6BjXE0GzfLOZ38ggPTKePkY=$''',
  '''(?m)^\ golang\.org/x/oauth2\ v0\.36\.0\ h1:peZ/1z27fi9hUOFCAZaHyrpWG5lwe0RJEEEeH0ThlIs=$''',
  '''^\ k8s\.io/api\ v0\.37\.0\ h1:Z//Vj9N7RA/yS2sDmxyeo7h\+RR4zbUrd2vrd3Z0TbB4=$''',
]

[[allowlists]]
description = "Public Octelium Enterprise secretman NetworkPolicy name"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''docs/evidence/openclaw-enterprise-policy-review\.json''', '''scripts/ci/network-policy-inventory-test\.py''']
regexTarget = "line"
regexes = ['''(?m)^\s*"(?:secretman|octelium/octeliumee-secretman)": "149ba1bcf503716e2076c16d5092a989093d00e4f15df594a22ca01f151615a1",?$''']

[[allowlists]]
description = "Reviewed public Istio gateway source pins"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?m)^scripts/ci/istio-upgrade-gate\.py$''']
regexTarget = "line"
regexes = [
  '''(?m)^\s*"clusters/homelab/apps/istio/octelium-api-gateway-values\.yaml": "3cc751beb194a4dfd7c7d29fe360794f0924caf416379cd412415b5e40b6e832",$''',
  '''(?m)^\s*"clusters/homelab/apps/istio/octelium-api-gateway\.yaml": "737545be14f2ff76101139ee024e17c5ffc368d0541952ccaa09b3b1148e5038",$''',
  '''(?m)^\s*\("gateway", "octelium-api-ingressgateway", "7c79ecf1ca2b79760be73ad521b50cc1fa573297c41169042a116a13ce3005df"\),$''',
]
