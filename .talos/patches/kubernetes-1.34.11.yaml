# Control-plane bootstrap and offline config-render target only. Workers use
# worker-kubernetes-1.34.11.yaml. Never apply these version patches live:
# talosctl upgrade-k8s owns ordered sequencing.
machine:
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.34.11
cluster:
  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.34.11
  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.34.11
  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.34.11
  proxy:
    image: registry.k8s.io/kube-proxy:v1.34.11
