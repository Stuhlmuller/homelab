---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: npq-client-egress
  namespace: network-policy-canary
spec:
  podSelector:
    matchLabels:
      role: client
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: allowed
      ports:
        - protocol: TCP
          port: 8080
        - protocol: UDP
          port: 8080
