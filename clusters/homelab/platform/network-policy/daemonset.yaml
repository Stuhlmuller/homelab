# Firewall-only kube-router; registration stays disabled until canary admission.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-router-network-policy
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-router-network-policy
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, nodes, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-router-network-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-router-network-policy
subjects:
  - kind: ServiceAccount
    name: kube-router-network-policy
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router-network-policy
  namespace: kube-system
  annotations:
    checkov.io/skip1: CKV_K8S_37=Firewall programming requires host network capabilities.
    checkov.io/skip2: CKV_K8S_31=Host firewall control needs the privileged platform seccomp boundary.
    checkov.io/skip3: CKV_K8S_20=Privileged firewall control requires privilege escalation.
    checkov.io/skip4: CKV_K8S_40=Host firewall control requires root.
    checkov.io/skip5: CKV_K8S_16=This reviewed platform firewall exception must program host iptables.
    checkov.io/skip6: CKV_K8S_19=Policy rules must be installed in the host network namespace.
    checkov.io/skip7: CKV_K8S_22=The upstream firewall controller has not been qualified with a read-only root filesystem.
    checkov.io/skip8: CKV_K8S_28=Host firewall control requires the privileged capability set.
    checkov.io/skip9: CKV_K8S_29=The explicit privileged container context is the reviewed platform exception.
    checkov.io/skip10: CKV_K8S_38=The dedicated service account token is required to watch policies and Pods.
    checkov.io/skip11: CKV_K8S_23=Host firewall control requires root.
    checkov.io/skip12: CKV_K8S_11=CPU throttling can delay or interrupt policy convergence.
  labels:
    app.kubernetes.io/name: kube-router-network-policy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-router-network-policy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-router-network-policy
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: kube-router-network-policy
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        homelab.stinkyboi.com/network-policy-canary: "true"
      tolerations:
        - key: homelab.stinkyboi.com/network-policy-canary
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: kube-router
          image: harbor.stinkyboi.com/mirror/docker.io/cloudnativelabs/kube-router:64da9a538d29e13780e256ce3897a52932a68657793bef009063bbeb2762146a@sha256:64da9a538d29e13780e256ce3897a52932a68657793bef009063bbeb2762146a
          imagePullPolicy: IfNotPresent
          args:
            - --run-router=false
            - --run-service-proxy=false
            - --run-loadbalancer=false
            - --run-firewall=true
            - --enable-cni=false
            - --netpol-default-deny=true
            - --use-nftables-for-netpol=false
            - --enable-ipv4=true
            - --enable-ipv6=false
            - --health-addr=127.0.0.1
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: health
              containerPort: 20244
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 250Mi
            limits:
              memory: 512Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
