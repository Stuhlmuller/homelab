image:
  repository: harbor.stinkyboi.com/mirror/codeberg.org/k8s-gateway/k8s_gateway
  tag: 1.9.0@sha256:0b556f261d46873d7d2e86e5d345bb99db30de6b3869b83e32d273a466e980e4
replicaCount: 2
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
serviceType: LoadBalancer
service:
  name: tailnet-dns
  loadBalancerClass: tailscale
  annotations:
    tailscale.com/hostname: homelab-dns
    tailscale.com/tags: tag:homelab-ingress
servers:
  - zones: [{zone: ., use_tcp: true}]
    port: 1053
    servicePort: 53
    plugins:
      - name: errors
      - name: health
        configBlock: lameduck 10s
      - name: ready
      - name: view
        parameters: private-addresses
        # Keep this name set in sync with Traefik's approved hostname annotation.
        # Only these A/AAAA queries may reach k8s_gateway; no public fallback.
        configBlock: >-
          expr type() in ['A', 'AAAA'] && (
          name() in ['stinkyboi.com.', 'affine.stinkyboi.com.',
          'argocd.stinkyboi.com.', 'bazarr.stinkyboi.com.',
          'compass.stinkyboi.com.', 'deluge.stinkyboi.com.',
          'dispatcharr.stinkyboi.com.', 'fleet.stinkyboi.com.',
          'grafana.stinkyboi.com.', 'harbor.stinkyboi.com.',
          'kiali.stinkyboi.com.', 'langfuse.stinkyboi.com.',
          'litellm.stinkyboi.com.', 'multica.stinkyboi.com.',
          'n8n.stinkyboi.com.', 'nofx.stinkyboi.com.',
          'openclaw.stinkyboi.com.', 'policy-bot.stinkyboi.com.',
          'prowlarr.stinkyboi.com.', 'radarr.stinkyboi.com.',
          'sonarr.stinkyboi.com.', 'cordium.stinkyboi.com.',
          'console.stinkyboi.com.', 'octelium.stinkyboi.com.',
          'octelium-api.stinkyboi.com.', 'portal.stinkyboi.com.',
          'console.oce.stinkyboi.com.'] ||
          name() matches '^[^.]+\\.cordium\\.stinkyboi\\.com\\.$' ||
          name() matches '^[^.]+\\.agents\\.oce\\.stinkyboi\\.com\\.$')
      - name: k8s_gateway
        parameters: stinkyboi.com
        configBlock: |-
          ttl 30
          resources Service
          serviceLabelSelectors homelab.rst.io/private-dns=approved
          loadBalancerAddressPreference ip
      - name: cache
        parameters: "30"
      - name: reload
  - zones: [{zone: ., use_tcp: true}]
    port: 1053
    servicePort: 53
    plugins:
      - name: errors
      - name: forward
        parameters: . 1.1.1.1 1.0.0.1
      - name: cache
        parameters: "30"
      - name: reload
