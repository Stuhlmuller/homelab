# Trial migration values for Cilium chart 1.20.5.
kubeProxyReplacement: false
policyEnforcementMode: never

operator:
  unmanagedPodWatcher:
    restart: false

routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8473
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.245.0.0/16

cni:
  customConf: true
  exclusive: false
  uninstall: false

bpf:
  autoMount:
    enabled: false
  hostLegacyRouting: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
