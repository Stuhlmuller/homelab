image:
  repository: harbor.stinkyboi.com/mirror/quay.io/cilium/cilium
envoy:
  image:
    repository: harbor.stinkyboi.com/mirror/quay.io/cilium/cilium-envoy
operator:
  image:
    repository: harbor.stinkyboi.com/mirror/quay.io/cilium/operator
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - zimaboard-2
