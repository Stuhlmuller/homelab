apiVersion: v1
kind: Namespace
metadata:
  name: cordium-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    homelab.rst.io/privileged-namespace-justification: Rancher local-path helper Pods require hostPath access to provision Cordium Workspace volumes.
  labels:
    app.kubernetes.io/name: cordium-local-path-provisioner
    app.kubernetes.io/part-of: platform-storage
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
