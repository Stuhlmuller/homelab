apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: openrouter
  namespace: istio-egress
spec:
  hosts:
    - openrouter.ai
  location: MESH_EXTERNAL
  ports:
    - number: 443
      name: tls
      protocol: TLS
  resolution: DNS
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: openrouter-litellm
  namespace: istio-egress
spec:
  targetRefs:
    - group: networking.istio.io
      kind: ServiceEntry
      name: openrouter
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ai/sa/litellm
      to:
        - operation:
            ports: ["443"]
