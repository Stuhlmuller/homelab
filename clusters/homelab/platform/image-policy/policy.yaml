apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: harbor-only-images
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.startsWith('harbor.stinkyboi.com/'))
      message: harbor-only-images requires Harbor container images.
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          c.image.startsWith('harbor.stinkyboi.com/'))
      message: harbor-only-images requires Harbor init container images.
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c,
          c.image.startsWith('harbor.stinkyboi.com/'))
      message: harbor-only-images requires Harbor ephemeral container images.
