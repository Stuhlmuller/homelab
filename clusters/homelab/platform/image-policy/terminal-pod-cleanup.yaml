apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-image-cleanup
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terminal-image-cleanup
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: terminal-image-cleanup
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.96.0.1/32}
        - ipBlock: {cidr: 10.1.0.199/32}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: terminal-image-cleanup
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    checkov.io/skip1: CKV_K8S_38=This hook needs its token scoped to the reviewed pod names.
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terminal-image-cleanup
        app.kubernetes.io/part-of: homelab
    spec:
      serviceAccountName: terminal-image-cleanup
      automountServiceAccountToken: true
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cleanup
          image: harbor.stinkyboi.com/mirror/docker.io/library/python:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d
          command: [python3, -I, -B, /cleanup/terminal-pod-cleanup.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: cleanup, mountPath: /cleanup, readOnly: true}
      volumes:
        - name: cleanup
          configMap:
            name: terminal-image-cleanup
---
