---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-harbor-istio-oci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: argocd-harbor-istio-oci
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        url: oci://harbor.stinkyboi.com/mirror/helm
        type: oci
        project: homelab
        username: robot$mirror+pull
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/harbor/mirror-robot-pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
