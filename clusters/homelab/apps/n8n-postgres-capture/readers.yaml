apiVersion: v1
kind: Pod
metadata:
  name: n8n-checkpoint-n8n
  namespace: automation
  labels:
    app.kubernetes.io/name: n8n-checkpoint-reader
  annotations:
    checkov.io/skip1: CKV2_K8S_6=Reader Pods have no service or listeners and mount only their one source read-only.
    checkov.io/skip2: CKV_K8S_40=The read-only n8n reader preserves existing application UID 1000; source ownership must not be changed for capture.
spec:
  automountServiceAccountToken: false
  activeDeadlineSeconds: 3600
  terminationGracePeriodSeconds: 5
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - sleep 3590
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: reader-script
          mountPath: /capture
          readOnly: true
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - test -r /source && test -r /capture/read.sh
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -ec
            - test -r /source && test -r /capture/read.sh
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: n8n
        readOnly: true
    - name: reader-script
      configMap:
        name: n8n-checkpoint-reader
        defaultMode: 365
---
