apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbot
  namespace: ai
  annotations:
    checkov.io/skip1: CKV_K8S_43=OpenBot v0.0.5 is pinned by digest; version metadata is carried in the image annotation.
    checkov.io/skip2: CKV_K8S_22=The upstream OpenBot image runs Chromium and embedded PostgreSQL with image-managed writable runtime paths.
    checkov.io/skip3: CKV_K8S_40=The upstream image manages browser and database users internally; durable state is isolated to the OpenBot PVC.
  labels:
    app.kubernetes.io/name: openbot
    app.kubernetes.io/part-of: openbot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbot
  template:
    metadata:
      annotations:
        homelab.rst.io/openbot-version: v0.0.5
      labels:
        app.kubernetes.io/name: openbot
        app.kubernetes.io/part-of: openbot
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbot
          image: ghcr.io/copilotkit/openbot@sha256:48121505408002de301486859917cff567c254aeb3f7b1766ceb6328f661c7cf
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: SERVER_PORT
              value: "3001"
            - name: EMBEDDED_POSTGRES
              value: "on"
            - name: OPENBOT_SINGLE_USER
              value: "true"
            - name: BETTER_AUTH_URL
              value: https://openbot.stinkyboi.com
            - name: TRUSTED_ORIGINS
              value: https://openbot.stinkyboi.com
            - name: OPENBOT_PUBLIC_URL
              value: https://openbot.stinkyboi.com
            - name: OPENBOT_APP_URL
              value: https://openbot.stinkyboi.com
            - name: INTELLIGENCE_API_URL
              value: https://api.intelligence.copilotkit.ai
            - name: INTELLIGENCE_GATEWAY_WS_URL
              value: wss://realtime.intelligence.copilotkit.ai
            - name: OPENAI_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: BOT_MODEL
              value: openai/gpt-5.5
            - name: AGENT_STALL_TIMEOUT_MS
              value: "60000"
            - name: KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: openbot-secrets
                  key: KEY_ENCRYPTION_KEY
            - name: INTELLIGENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openbot-secrets
                  key: INTELLIGENCE_API_KEY
            - name: COPILOTKIT_LICENSE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbot-secrets
                  key: COPILOTKIT_LICENSE_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openbot-secrets
                  key: OPENAI_API_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbot-secrets
                  key: BETTER_AUTH_SECRET
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
              subPath: postgresql
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: data
              mountPath: /profiles
              subPath: profiles
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openbot-data
