apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: openbot-allow-tailnet-gateway
  namespace: ai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbot
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway
