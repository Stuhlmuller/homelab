apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbot-secrets
  namespace: ai
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: openbot-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: KEY_ENCRYPTION_KEY
      remoteRef:
        key: /homelab/openbot/key-encryption-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: INTELLIGENCE_API_KEY
      remoteRef:
        key: /homelab/openbot/intelligence-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: COPILOTKIT_LICENSE_TOKEN
      remoteRef:
        key: /homelab/openbot/copilotkit-license-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /homelab/openbot/openai-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: /homelab/openbot/better-auth-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
