apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik
resources:
  - serviceaccount.yaml
  - state-rbac.yaml
  - auth-externalsecret.yaml
  - headless-service.yaml
  - authorizationpolicy.yaml
  - statefulset.yaml
configMapGenerator:
  - name: traefik-sidecar-canary-routes
    files:
      - routes.yaml
      - tls.yaml
  - name: traefik-sidecar-canary-start
    files:
      - activate.sh
generatorOptions:
  disableNameSuffixHash: true
