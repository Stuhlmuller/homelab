apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-sidecar-canary-auth
  namespace: traefik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: traefik-sidecar-canary-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: auth-key
      remoteRef:
        key: /homelab/tailscale/traefik-sidecar-canary-auth-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
