apiVersion: v1
kind: Service
metadata:
  name: traefik-sidecar-canary
  namespace: traefik
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: traefik-sidecar-canary
    app.kubernetes.io/instance: traefik-sidecar-canary
  ports:
    - name: health
      protocol: TCP
      port: 9000
      targetPort: health
