apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik
  namespace: traefik
spec:
  secretName: traefik-tls
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - stinkyboi.com
    - "*.stinkyboi.com"
    - "*.cordium.stinkyboi.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
