apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-postgres-auth
  namespace: collaboration
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: affine-postgres-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        POSTGRES_PASSWORD: "{{ .admin_password }}"
        POSTGRES_APP_PASSWORD: "{{ .app_password }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: /homelab/affine/postgres-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: app_password
      remoteRef:
        key: /homelab/affine/postgres-app-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-postgres-client
  namespace: collaboration
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: affine-postgres-client
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        DB_PASSWORD: "{{ .app_password }}"
        DATABASE_URL: "postgresql://affine:{{ .app_password }}@affine-postgres.collaboration.svc.cluster.local:5432/affine"
  data:
    - secretKey: app_password
      remoteRef:
        key: /homelab/affine/postgres-app-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
