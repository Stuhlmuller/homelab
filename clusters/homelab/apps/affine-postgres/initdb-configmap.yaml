apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-postgres-initdb
  namespace: collaboration
data:
  00-create-affine-database.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    app_password="$(cat /run/secrets/affine-postgres/POSTGRES_APP_PASSWORD)"

    psql \
      -v ON_ERROR_STOP=1 \
      -v app_password="$app_password" \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" <<'SQL'
    CREATE USER affine WITH PASSWORD :'app_password';
    CREATE DATABASE affine OWNER affine;
    GRANT ALL PRIVILEGES ON DATABASE affine TO affine;
    \connect affine
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO affine;
    ALTER SCHEMA public OWNER TO affine;
    SQL
