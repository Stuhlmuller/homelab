apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nofx-frontend
  namespace: nofx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nofx
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nofx-backend
  namespace: nofx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nofx
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nofx
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
