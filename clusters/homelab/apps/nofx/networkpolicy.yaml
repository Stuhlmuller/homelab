apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nofx-frontend
  namespace: nofx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nofx
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nofx
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
        # Ambient encrypts the same backend connection over HBONE.
        - protocol: TCP
          port: 15008
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 80
    # HBONE is encrypted; AuthorizationPolicy checks workload identity and ports.
    - ports:
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nofx-backend
  namespace: nofx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nofx
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nofx
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8080
    # Ambient terminates HBONE on 15008; Istio checks identity.
    - ports:
        - protocol: TCP
          port: 15008
  egress:
    # Model/exchange APIs and the explicit OKX US public historical-data feed.
    # Harbor pulls run through the node kubelet, outside this pod egress rule.
    # imagePullSecrets does not grant the NOFX application registry access.
    - {}
