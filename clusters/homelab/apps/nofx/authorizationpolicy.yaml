apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nofx-frontend-allow-required-clients
  namespace: nofx
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nofx
      app.kubernetes.io/component: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway
              - cluster.local/ns/octelium-client/sa/octelium-client
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nofx-backend-allow-frontend
  namespace: nofx
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nofx
      app.kubernetes.io/component: backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/nofx/sa/default
