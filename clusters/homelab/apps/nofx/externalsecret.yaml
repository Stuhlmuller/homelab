apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nofx-secrets
  namespace: nofx
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: nofx-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /homelab/nofx/jwt-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DATA_ENCRYPTION_KEY
      remoteRef:
        key: /homelab/nofx/data-encryption-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: RSA_PRIVATE_KEY
      remoteRef:
        key: /homelab/nofx/rsa-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Kubernetes Secret key name, not secret material.
    - secretKey: CLAW402_WALLET_KEY
      remoteRef:
        key: /homelab/nofx/claw402-wallet-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
