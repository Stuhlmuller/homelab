apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: nofx
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"harbor.stinkyboi.com":{"username":"robot$homelab+pull","password":{{ .password | toJson }},"auth":"{{ printf "robot$homelab+pull:%s" .password | b64enc }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/nofx/harbor-pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
