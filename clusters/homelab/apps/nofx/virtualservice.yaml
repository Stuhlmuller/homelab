apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nofx-octelium
  namespace: nofx
  annotations:
    homelab.rst.io/access-plane: octelium
    homelab.rst.io/public-funnel: "false"
spec:
  hosts:
    - nofx.stinkyboi.com
  gateways:
    - istio-system/tailnet-gateway
  http:
    - route:
        - destination:
            host: nofx-frontend.nofx.svc.cluster.local
            port:
              number: 80
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: connect-failure,refused-stream,reset,5xx
