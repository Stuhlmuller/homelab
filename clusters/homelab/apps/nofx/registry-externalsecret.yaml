apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nofx-registry-auth
  namespace: nofx
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Refresh rotated pull credentials without restarting an application container.
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: nofx-registry-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        # Encode the entire credential before inserting it into JSON.
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"auth":"{{ printf "rstuhlmuller:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: /homelab/nofx/ghcr-read-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
