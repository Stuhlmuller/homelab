apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codex-cloud-signer
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: codex-cloud-signer
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: auth-key
      remoteRef:
        key: /homelab/tailscale/codex-cloud-signer/auth-key
    - secretKey: oauth-client-id
      remoteRef:
        key: /homelab/tailscale/codex-cloud-signer/oauth-client-id
    - secretKey: oauth-client-secret
      remoteRef:
        key: /homelab/tailscale/codex-cloud-signer/oauth-client-secret
    - secretKey: webhook-secret
      remoteRef:
        key: /homelab/tailscale/codex-cloud-signer/webhook-secret
