apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codex-cloud-signer
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codex-cloud-signer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8080}
