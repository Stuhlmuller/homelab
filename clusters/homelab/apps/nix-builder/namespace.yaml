apiVersion: v1
kind: Namespace
metadata:
  name: nix-builder
  annotations:
    homelab.rst.io/privileged-namespace-justification: Nix build sandboxes need root, mount namespaces, SYS_ADMIN and SYS_CHROOT, plus NET_ADMIN for private loopback when host user namespaces are disabled; this executor has no host mounts, network ingress or Kubernetes token.
  labels:
    app.kubernetes.io/name: nix-builder
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
