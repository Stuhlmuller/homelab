apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: automation
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: n8n-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        N8N_BOOTSTRAP_ENCRYPTION_KEY: "{{ .N8N_BOOTSTRAP_ENCRYPTION_KEY }}"
        CREDENTIALS_OVERWRITE_DATA: '{"openAiApi":{"apiKey":{{ .litellm_token | toJson }},"url":"http://litellm.ai.svc.cluster.local:4000/v1"}}'
  data:
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key name, not a secret value.
    - secretKey: N8N_BOOTSTRAP_ENCRYPTION_KEY
      remoteRef:
        key: /homelab/n8n/encryption-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key name, not a secret value.
    - secretKey: litellm_token
      remoteRef:
        key: /homelab/n8n/litellm-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
