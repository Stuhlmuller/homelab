serviceAccount:
  n8n: {}
controllers:
  n8n:
    serviceAccount:
      identifier: n8n
    pod:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    strategy: Recreate
    initContainers:
      wait-for-postgres:
        image:
          repository: postgres
          tag: 18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n-postgres/DB_POSTGRESDB_PASSWORD
        command:
          - /bin/sh
          - -ec
          - |
            : "${DB_POSTGRESDB_PASSWORD_FILE:?DB_POSTGRESDB_PASSWORD_FILE must point at the n8n Postgres client secret}"
            password="$(cat "$DB_POSTGRESDB_PASSWORD_FILE")"
            export PGPASSWORD="$password"

            for attempt in $(seq 1 60); do
              if psql \
                "host=n8n-postgres.automation.svc.cluster.local port=5432 user=n8n dbname=n8n connect_timeout=5" \
                -c 'select 1' >/dev/null; then
                exit 0
              fi

              echo "waiting for n8n-postgres to accept authenticated connections (${attempt}/60)" >&2
              sleep 2
            done

            echo "n8n-postgres did not become ready in time" >&2
            exit 1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      migrate-ai-workflow:
        image:
          repository: ghcr.io/n8n-io/n8n
          tag: "stable@sha256:b73045abaddb40cb4024e86eea1b1f69093501a7339f685a4cd486b7743d23ae"
        env:
          DB_TYPE: postgresdb
          DB_POSTGRESDB_HOST: n8n-postgres.automation.svc.cluster.local
          DB_POSTGRESDB_PORT: "5432"
          DB_POSTGRESDB_DATABASE: n8n
          DB_POSTGRESDB_USER: n8n
          DB_POSTGRESDB_SCHEMA: public
          DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n-postgres/DB_POSTGRESDB_PASSWORD
          N8N_BOOTSTRAP_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: N8N_BOOTSTRAP_ENCRYPTION_KEY
        command:
          - /bin/sh
          - -ec
          - |
            : "${DB_POSTGRESDB_PASSWORD_FILE:?DB_POSTGRESDB_PASSWORD_FILE must point at the n8n Postgres client secret}"
            test -s "$DB_POSTGRESDB_PASSWORD_FILE"

            if [ ! -s /home/node/.n8n/config ]; then
              : "${N8N_BOOTSTRAP_ENCRYPTION_KEY:?N8N bootstrap encryption key must be provided by n8n-secrets}"
              export N8N_ENCRYPTION_KEY="$N8N_BOOTSTRAP_ENCRYPTION_KEY"
            fi

            # The credential is deliberately blank. CREDENTIALS_OVERWRITE_DATA in
            # the application container supplies the dedicated LiteLLM key and URL.
            printf '%s\n' '[{"id":"litellm-managed","name":"LiteLLM Gateway","type":"openAiApi","data":{}}]' \
              >/tmp/litellm-credential.json
            n8n import:credentials --input=/tmp/litellm-credential.json

            n8n export:workflow --id=s1JVSbnvnmHMCbty --output=/tmp/ai-workflow.json
            node <<'NODE'
            const fs = require('node:fs');
            const path = '/tmp/ai-workflow.json';
            const workflow = JSON.parse(fs.readFileSync(path, 'utf8'));
            const node = workflow.nodes?.find((candidate) =>
              candidate.id === '5c52f616-3b9e-4483-89e3-effffc393750' &&
              candidate.name === 'AWS Bedrock Chat Model',
            );
            if (!node) throw new Error('expected n8n AI model node was not found');
            if (node.type === '@n8n/n8n-nodes-langchain.lmChatOpenAi' &&
                node.credentials?.openAiApi?.id === 'litellm-managed' &&
                node.parameters?.model?.value === 'openrouter/free') {
              fs.writeFileSync('/tmp/ai-workflow-changed', 'false');
              process.exit(0);
            }
            if (node.type !== '@n8n/n8n-nodes-langchain.lmChatAwsBedrock') {
              throw new Error(`refusing to migrate unexpected node type: ${node.type}`);
            }
            node.type = '@n8n/n8n-nodes-langchain.lmChatOpenAi';
            node.typeVersion = 1.3;
            node.parameters = {
              model: { __rl: true, mode: 'list', value: 'openrouter/free' },
              options: {},
            };
            node.credentials = {
              openAiApi: { id: 'litellm-managed', name: 'LiteLLM Gateway' },
            };
            fs.writeFileSync(path, JSON.stringify(workflow));
            fs.writeFileSync('/tmp/ai-workflow-changed', 'true');
            NODE
            if [ "$(cat /tmp/ai-workflow-changed)" != true ]; then
              exit 0
            fi

            n8n import:workflow --input=/tmp/ai-workflow.json
            n8n publish:workflow --id=s1JVSbnvnmHMCbty
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
    containers:
      app:
        image:
          repository: ghcr.io/n8n-io/n8n
          tag: "stable@sha256:b73045abaddb40cb4024e86eea1b1f69093501a7339f685a4cd486b7743d23ae"
        env:
          TZ: America/Los_Angeles
          GENERIC_TIMEZONE: America/Los_Angeles
          N8N_HOST: n8n.stinkyboi.com
          N8N_PORT: "5678"
          N8N_PROTOCOL: https
          N8N_PROXY_HOPS: "1"
          N8N_SECURE_COOKIE: "true"
          N8N_EDITOR_BASE_URL: https://n8n.stinkyboi.com
          WEBHOOK_URL: https://n8n-webhook.stinkyboi.com/
          DB_TYPE: postgresdb
          DB_POSTGRESDB_HOST: n8n-postgres.automation.svc.cluster.local
          DB_POSTGRESDB_PORT: "5432"
          DB_POSTGRESDB_DATABASE: n8n
          DB_POSTGRESDB_USER: n8n
          DB_POSTGRESDB_SCHEMA: public
          DB_POSTGRESDB_POOL_SIZE: "4"
          DB_POSTGRESDB_CONNECTION_TIMEOUT: "30000"
          DB_POSTGRESDB_IDLE_CONNECTION_TIMEOUT: "30000"
          DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n-postgres/DB_POSTGRESDB_PASSWORD
          N8N_BOOTSTRAP_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: N8N_BOOTSTRAP_ENCRYPTION_KEY
          CREDENTIALS_OVERWRITE_DATA:
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: CREDENTIALS_OVERWRITE_DATA
        command:
          - /bin/sh
          - -ec
          - |
            : "${DB_POSTGRESDB_PASSWORD_FILE:?DB_POSTGRESDB_PASSWORD_FILE must point at the n8n Postgres client secret}"
            if [ ! -s "$DB_POSTGRESDB_PASSWORD_FILE" ]; then
              echo "n8n Postgres password file is missing or empty" >&2
              exit 1
            fi

            if [ ! -s /home/node/.n8n/config ]; then
              : "${N8N_BOOTSTRAP_ENCRYPTION_KEY:?N8N bootstrap encryption key must be provided by n8n-secrets}"
              export N8N_ENCRYPTION_KEY="$N8N_BOOTSTRAP_ENCRYPTION_KEY"
            fi

            exec n8n
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 5678
              failureThreshold: 60
              periodSeconds: 5
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz/readiness
                port: 5678
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz/readiness
                port: 5678
              failureThreshold: 3
              periodSeconds: 30
              timeoutSeconds: 5
service:
  app:
    controller: n8n
    ports:
      http:
        port: 5678
persistence:
  data:
    enabled: true
    storageClass: nfs-default
    size: 20Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      n8n:
        app:
          - path: /home/node/.n8n
        migrate-ai-workflow:
          - path: /home/node/.n8n
  postgres-client:
    enabled: true
    type: secret
    name: n8n-postgres-client
    advancedMounts:
      n8n:
        app:
          - path: /run/secrets/n8n-postgres
            readOnly: true
        wait-for-postgres:
          - path: /run/secrets/n8n-postgres
            readOnly: true
        migrate-ai-workflow:
          - path: /run/secrets/n8n-postgres
            readOnly: true
