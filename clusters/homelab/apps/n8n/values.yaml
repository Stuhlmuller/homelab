serviceAccount:
  n8n: {}
controllers:
  n8n:
    serviceAccount:
      identifier: n8n
    pod:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    strategy: Recreate
    initContainers:
      wait-for-postgres:
        image:
          repository: postgres
          tag: 18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n-postgres/DB_POSTGRESDB_PASSWORD
        command:
          - /bin/sh
          - -ec
          - |
            : "${DB_POSTGRESDB_PASSWORD_FILE:?DB_POSTGRESDB_PASSWORD_FILE must point at the n8n Postgres client secret}"
            password="$(cat "$DB_POSTGRESDB_PASSWORD_FILE")"
            export PGPASSWORD="$password"

            for attempt in $(seq 1 60); do
              if psql \
                "host=n8n-postgres.automation.svc.cluster.local port=5432 user=n8n dbname=n8n connect_timeout=5" \
                -c 'select 1' >/dev/null; then
                exit 0
              fi

              echo "waiting for n8n-postgres to accept authenticated connections (${attempt}/60)" >&2
              sleep 2
            done

            echo "n8n-postgres did not become ready in time" >&2
            exit 1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      migrate-ai-workflow:
        image:
          repository: ghcr.io/n8n-io/n8n
          tag: "stable@sha256:3db21366be1d3c77c1708963129c051948573019659e8873e0294be035ffc1b2"
        env:
          DB_TYPE: postgresdb
          DB_POSTGRESDB_HOST: n8n-postgres.automation.svc.cluster.local
          DB_POSTGRESDB_PORT: "5432"
          DB_POSTGRESDB_DATABASE: n8n
          DB_POSTGRESDB_USER: n8n
          DB_POSTGRESDB_SCHEMA: public
          DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n-postgres/DB_POSTGRESDB_PASSWORD
          N8N_BOOTSTRAP_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: N8N_BOOTSTRAP_ENCRYPTION_KEY
        command:
          - /bin/sh
          - -ec
          - |
            : "${DB_POSTGRESDB_PASSWORD_FILE:?DB_POSTGRESDB_PASSWORD_FILE must point at the n8n Postgres client secret}"
            test -s "$DB_POSTGRESDB_PASSWORD_FILE"

            if [ ! -s /home/node/.n8n/config ]; then
              : "${N8N_BOOTSTRAP_ENCRYPTION_KEY:?N8N bootstrap encryption key must be provided by n8n-secrets}"
              export N8N_ENCRYPTION_KEY="$N8N_BOOTSTRAP_ENCRYPTION_KEY"
            fi

            # The credential is deliberately blank. CREDENTIALS_OVERWRITE_DATA in
            # the application container supplies the dedicated LiteLLM key and URL.
            printf '%s\n' '[{"id":"litellm-managed","name":"LiteLLM Gateway","type":"openAiApi","data":{}}]' \
              >/tmp/litellm-credential.json
            n8n import:credentials --input=/tmp/litellm-credential.json

            umask 077
            workflow_ids="$(n8n list:workflow --onlyId)"
            for workflow_id in s1JVSbnvnmHMCbty xaUDsbylSwaveMQ5 Wc0AMPBPqBegSey5; do
            if ! printf '%s\n' "$workflow_ids" | grep -Fxq "$workflow_id"; then
              echo "Skipping AI workflow migration for $workflow_id: workflow absent" >&2
              continue
            fi
            rm -f /tmp/ai-workflow.json
            n8n export:workflow --id="$workflow_id" --output=/tmp/ai-workflow.json
            test -s /tmp/ai-workflow.json
            rm -f /tmp/ai-workflow-active /tmp/ai-workflow-changed
            node - "$workflow_id" <<'NODE'
            const fs = require('node:fs');
            const path = '/tmp/ai-workflow.json';
            const workflows = JSON.parse(fs.readFileSync(path, 'utf8'));
            const targets = {
              s1JVSbnvnmHMCbty: ['5c52f616-3b9e-4483-89e3-effffc393750', 'lmChatAwsBedrock', 'anthropic.claude-3-sonnet-20240229-v1:0'],
              xaUDsbylSwaveMQ5: ['d8f30a03-c3a1-4bdd-b733-8e33da04b004', 'lmChatOpenAi', 'gpt-5.5'],
              Wc0AMPBPqBegSey5: ['3278c81b-c7cd-4181-aa17-ad91b9d932a8', 'lmChatAwsBedrock', 'anthropic.claude-3-sonnet-20240229-v1:0'],
            };
            const target = targets[process.argv[2]];
            if (!Array.isArray(workflows) || workflows.length !== 1 ||
                !target || workflows[0]?.id !== process.argv[2] ||
                typeof workflows[0]?.active !== 'boolean') {
              throw new Error('expected exactly the target workflow from n8n export');
            }
            const workflow = workflows[0];
            if (!Array.isArray(workflow.nodes) || !workflow.nodes.every(
                (candidate) => candidate && typeof candidate === 'object' &&
                  !Array.isArray(candidate) && typeof candidate.id === 'string')) {
              throw new Error('invalid n8n workflow nodes');
            }
            const matches = workflow.nodes.filter((candidate) => candidate.id === target[0]);
            if (matches.length === 0) {
              fs.writeFileSync('/tmp/ai-workflow-changed', 'skip');
              process.exit(0);
            }
            if (matches.length !== 1) throw new Error('duplicate n8n AI model node');
            const node = matches[0];
            if (typeof node.type !== 'string' || !node.parameters ||
                typeof node.parameters !== 'object' || Array.isArray(node.parameters)) {
              throw new Error('invalid n8n AI model node shape');
            }
            fs.writeFileSync('/tmp/ai-workflow-active', String(workflow.active));
            if (node.type === '@n8n/n8n-nodes-langchain.lmChatOpenAi' &&
                node.credentials?.openAiApi?.id === 'litellm-managed' &&
                node.parameters?.model?.value === 'openrouter/free' &&
                !node.parameters?.responsesApiEnabled &&
                !Object.keys(node.parameters?.builtInTools ?? {}).length &&
                !node.parameters?.options?.baseURL && !node.parameters?.options?.extraBody) {
              fs.writeFileSync('/tmp/ai-workflow-changed', 'false');
              process.exit(0);
            }
            if (node.type !== '@n8n/n8n-nodes-langchain.' + target[1] ||
                (node.parameters?.model?.value ?? node.parameters?.model) !== target[2] ||
                node.parameters?.responsesApiEnabled ||
                Object.keys(node.parameters?.options ?? {}).length ||
                Object.keys(node.parameters?.builtInTools ?? {}).length) {
              fs.writeFileSync('/tmp/ai-workflow-changed', 'skip');
              process.exit(0);
            }
            node.type = '@n8n/n8n-nodes-langchain.lmChatOpenAi';
            node.typeVersion = 1.3;
            node.parameters = {
              model: { __rl: true, mode: 'list', value: 'openrouter/free' },
              options: {},
            };
            node.credentials = {
              openAiApi: { id: 'litellm-managed', name: 'LiteLLM Gateway' },
            };
            fs.writeFileSync(path, JSON.stringify(workflows));
            fs.writeFileSync('/tmp/ai-workflow-changed', 'true');
            NODE
            migration_state="$(cat /tmp/ai-workflow-changed)"
            case "$migration_state" in
              skip)
                echo "Skipping AI workflow migration for $workflow_id: workflow no longer matches the inventoried model" >&2
                continue ;;
              false) continue ;;
              true) ;;
              *) echo "Invalid AI workflow migration result for $workflow_id" >&2; exit 1 ;;
            esac

            n8n import:workflow --input=/tmp/ai-workflow.json
            if [ "$(cat /tmp/ai-workflow-active)" = true ]; then
              n8n publish:workflow --id="$workflow_id"
            fi
            done

            n8n export:workflow --id=6wtwXT4PL5QuSGSD --output=/tmp/codex-review-workflow.json
            node <<'CODEX'
            const fs = require('node:fs');
            const workflows = JSON.parse(fs.readFileSync('/tmp/codex-review-workflow.json', 'utf8'));
            if (!Array.isArray(workflows) || workflows.length !== 1) {
              throw new Error('expected exactly the Codex Review Helper workflow');
            }
            const workflow = workflows[0];
            const expected = new Map([
              ['Webhook', 'n8n-nodes-base.webhook'],
              ['Filter', 'n8n-nodes-base.filter'],
              ['If', 'n8n-nodes-base.if'],
              ['Ask Codex for Help', 'n8n-nodes-base.github'],
              ['HTTP Request', 'n8n-nodes-base.httpRequest'],
              ['Stamp', 'n8n-nodes-base.github'],
            ]);
            const names = new Set();
            if (workflow.id !== '6wtwXT4PL5QuSGSD' || workflow.name !== 'Codex Review Helper' ||
                workflow.isArchived !== false || !Array.isArray(workflow.nodes) ||
                workflow.nodes.length !== expected.size || workflow.nodes.some((node) => {
                  if (!expected.has(node.name) || expected.get(node.name) !== node.type || names.has(node.name)) return true;
                  names.add(node.name);
                  return false;
                })) {
              throw new Error('Codex Review Helper workflow changed; refusing publication');
            }
            const webhook = workflow.nodes.find((node) => node.name === 'Webhook');
            if (webhook.webhookId !== '7cd61c45-077f-45e4-aafe-8e06ce68fbc4' ||
                webhook.parameters?.path !== '7cd61c45-077f-45e4-aafe-8e06ce68fbc4' ||
                webhook.parameters?.httpMethod !== 'POST') {
              throw new Error('Codex Review Helper webhook changed; refusing publication');
            }
            const canonical = (value) => Array.isArray(value) ? value.map(canonical) :
              value !== null && typeof value === 'object' ? Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonical(value[key])])) : value;
            const nodes = workflow.nodes.map((node) => ({
              name: node.name,
              type: node.type,
              typeVersion: node.typeVersion,
              webhookId: node.webhookId,
              parameters: node.parameters,
              credentials: node.credentials,
              disabled: node.disabled ?? false,
            })).sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
            const digest = require('node:crypto').createHash('sha256').update(JSON.stringify(canonical({
              nodes, connections: workflow.connections, settings: workflow.settings,
            }))).digest('hex');
            if (digest !== 'a0752f25efaa3d44f9c0a23001676dd39b0e9f308bd056b95f0e3580f0913bd2') {
              throw new Error('Codex Review Helper behavior changed; refusing publication');
            }
            const published = workflow.active === true &&
              typeof workflow.activeVersionId === 'string' && workflow.activeVersionId.length > 0;
            const unpublished = workflow.active === false && workflow.activeVersionId === null;
            if (!published && !unpublished) {
              throw new Error('Codex Review Helper publication state is inconsistent');
            }
            fs.writeFileSync('/tmp/codex-review-action', unpublished ? 'publish' : 'skip');
            CODEX
            if [ "$(cat /tmp/codex-review-action)" = publish ]; then
              n8n publish:workflow --id=6wtwXT4PL5QuSGSD
            fi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
    containers:
      app:
        image:
          repository: ghcr.io/n8n-io/n8n
          tag: "stable@sha256:3db21366be1d3c77c1708963129c051948573019659e8873e0294be035ffc1b2"
        env:
          TZ: America/Los_Angeles
          GENERIC_TIMEZONE: America/Los_Angeles
          N8N_HOST: n8n.stinkyboi.com
          N8N_PORT: "5678"
          N8N_PROTOCOL: https
          N8N_PROXY_HOPS: "1"
          N8N_SECURE_COOKIE: "true"
          N8N_EDITOR_BASE_URL: https://n8n.stinkyboi.com
          WEBHOOK_URL: https://n8n-webhook.tail67beb.ts.net/
          DB_TYPE: postgresdb
          DB_POSTGRESDB_HOST: n8n-postgres.automation.svc.cluster.local
          DB_POSTGRESDB_PORT: "5432"
          DB_POSTGRESDB_DATABASE: n8n
          DB_POSTGRESDB_USER: n8n
          DB_POSTGRESDB_SCHEMA: public
          DB_POSTGRESDB_POOL_SIZE: "4"
          DB_POSTGRESDB_CONNECTION_TIMEOUT: "30000"
          DB_POSTGRESDB_IDLE_CONNECTION_TIMEOUT: "30000"
          DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n-postgres/DB_POSTGRESDB_PASSWORD
          N8N_BOOTSTRAP_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: N8N_BOOTSTRAP_ENCRYPTION_KEY
          CREDENTIALS_OVERWRITE_DATA:
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: CREDENTIALS_OVERWRITE_DATA
        command:
          - /bin/sh
          - -ec
          - |
            : "${DB_POSTGRESDB_PASSWORD_FILE:?DB_POSTGRESDB_PASSWORD_FILE must point at the n8n Postgres client secret}"
            if [ ! -s "$DB_POSTGRESDB_PASSWORD_FILE" ]; then
              echo "n8n Postgres password file is missing or empty" >&2
              exit 1
            fi

            if [ ! -s /home/node/.n8n/config ]; then
              : "${N8N_BOOTSTRAP_ENCRYPTION_KEY:?N8N bootstrap encryption key must be provided by n8n-secrets}"
              export N8N_ENCRYPTION_KEY="$N8N_BOOTSTRAP_ENCRYPTION_KEY"
            fi

            exec n8n
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 5678
              failureThreshold: 60
              periodSeconds: 5
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz/readiness
                port: 5678
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz/readiness
                port: 5678
              failureThreshold: 3
              periodSeconds: 30
              timeoutSeconds: 5
service:
  app:
    controller: n8n
    ports:
      http:
        port: 5678
persistence:
  data:
    enabled: true
    storageClass: nfs-default
    size: 20Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      n8n:
        app:
          - path: /home/node/.n8n
        migrate-ai-workflow:
          - path: /home/node/.n8n
  postgres-client:
    enabled: true
    type: secret
    name: n8n-postgres-client
    advancedMounts:
      n8n:
        app:
          - path: /run/secrets/n8n-postgres
            readOnly: true
        wait-for-postgres:
          - path: /run/secrets/n8n-postgres
            readOnly: true
        migrate-ai-workflow:
          - path: /run/secrets/n8n-postgres
            readOnly: true
