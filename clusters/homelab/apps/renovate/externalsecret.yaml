apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
  namespace: automation
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: renovate
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: issuer-id
      remoteRef:
        key: /homelab/renovate/github-app/issuer-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key name, not a secret value.
    - secretKey: private-key
      remoteRef:
        # checkov:skip=CKV_SECRET_6: Public SSM parameter path, not credential material.
        key: /homelab/renovate/github-app/private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
