# Staged only: run after the read-only App and protected ledger are verified.
apiVersion: batch/v1
kind: Job
metadata:
  name: renovate-acceptance-policy-proof
  namespace: automation
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: acceptance-policy-proof
    app.kubernetes.io/part-of: homelab-automation
spec:
  suspend: true
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: renovate
        app.kubernetes.io/component: acceptance-policy-proof
        app.kubernetes.io/part-of: homelab-automation
    spec:
      automountServiceAccountToken: false
      serviceAccountName: renovate
      nodeSelector:
        kubernetes.io/hostname: acer
      restartPolicy: Never
      securityContext:
        runAsUser: 12021
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 12021
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy-proof
          image: harbor.stinkyboi.com/mirror/ghcr.io/renovatebot/renovate:44.167.4@sha256:82f2a1375a48339c02f9a74b14f8468386c5c5e88ff10aa1674aae31df52969d
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /usr/src/app/acceptance-policy-proof.js
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: observer
              mountPath: /usr/src/app/acceptance-observer.js
              subPath: acceptance-observer.js
              readOnly: true
            - name: observer
              mountPath: /usr/src/app/acceptance-inventory.js
              subPath: acceptance-inventory.js
              readOnly: true
            - name: observer
              mountPath: /usr/src/app/acceptance-policy-proof.js
              subPath: acceptance-policy-proof.js
              readOnly: true
            - name: config
              mountPath: /usr/src/app/config.js
              subPath: config.js
              readOnly: true
            - name: github-app
              mountPath: /var/run/secrets/renovate-acceptance
              readOnly: true
            - name: ledger
              mountPath: /ledger
            - name: podinfo
              mountPath: /var/run/podinfo
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: observer
          configMap:
            name: renovate-acceptance-observer
        - name: config
          configMap:
            name: renovate-config
        - name: github-app
          secret:
            secretName: renovate-acceptance
            defaultMode: 0440
            items:
              - key: issuer-id
                path: issuer-id
              - key: private-key
                path: private-key
        - name: ledger
          persistentVolumeClaim:
            claimName: renovate-acceptance-ledger
        - name: podinfo
          downwardAPI:
            items:
              - path: uid
                fieldRef:
                  fieldPath: metadata.uid
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
