# Stage outside Kustomize; activate only after the digest-guarded ledger cleanup succeeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: renovate-acceptance-ledger-finalize
  namespace: automation
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: acceptance-ledger-finalize
    app.kubernetes.io/part-of: homelab-automation
spec:
  suspend: true
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: renovate
        app.kubernetes.io/component: acceptance-ledger-finalize
        app.kubernetes.io/part-of: homelab-automation
    spec:
      automountServiceAccountToken: false
      serviceAccountName: renovate
      nodeSelector:
        kubernetes.io/hostname: acer
      restartPolicy: Never
      securityContext:
        runAsUser: 12021
        runAsGroup: 12021
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finalize
          image: docker.io/library/postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              root=/ledger
              private="$root/private"
              expected=REPLACE_WITH_REVIEWED_LEDGER_SHA256
              marker="$root/.renovate-acceptance-cleanup-$expected"
              refuse() { echo 'acceptance-ledger-finalize: refused' >&2; exit 1; }

              case "$expected" in *[!0-9a-f]*|'') refuse;; esac
              test "${#expected}" -eq 64 || refuse
              test -d "$root" && test ! -L "$root" || refuse
              test "$(stat -c '%u:%g:%a' "$root")" = '12021:12021:700' || refuse
              test "$(stat -c %m "$root")" = "$root" || refuse
              mountinfo=/proc/self/mountinfo
              test -r "$mountinfo" || refuse
              awk -v p="$root" '$5 != p && index($5, p "/") == 1 { found = 1 } END { exit found }' "$mountinfo" || refuse

              entries=0
              for entry in "$root"/* "$root"/.[!.]* "$root"/..?*; do
                test -e "$entry" || test -L "$entry" || continue
                entries=1
                case "$entry" in "$private"|"$marker") ;; *) refuse;; esac
              done
              if test "$entries" -eq 0; then
                echo 'acceptance-ledger-finalize: already-empty-prior-receipt-required'
                exit 0
              fi

              test -f "$marker" && test ! -L "$marker" || refuse
              test "$(stat -c '%u:%a' "$marker")" = '12021:600' || refuse
              actual_marker_sum="$(sha256sum "$marker")" || refuse
              expected_marker_sum="$(printf '%s\n' "$expected" | sha256sum)" || refuse
              test "${actual_marker_sum%% *}" = "${expected_marker_sum%% *}" || refuse
              if test -e "$private" || test -L "$private"; then
                test -d "$private" && test ! -L "$private" || refuse
                test "$(stat -c '%u:%a' "$private")" = '12021:700' || refuse
                test "$(stat -c %m "$private")" = "$root" || refuse
                remaining="$(find "$private" -mindepth 1 -maxdepth 1 -print -quit)" || refuse
                test -z "$remaining" || refuse
                rmdir -- "$private" || refuse
              fi
              rm -- "$marker" || refuse
              remaining="$(find "$root" -mindepth 1 -maxdepth 1 -print -quit)" || refuse
              test -z "$remaining" || refuse
              echo 'acceptance-ledger-finalize: ledger-root-empty'
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ledger
              mountPath: /ledger
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: renovate-acceptance-ledger
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renovate-acceptance-ledger-finalize
  namespace: automation
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renovate
      app.kubernetes.io/component: acceptance-ledger-finalize
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
