# Deliberately omitted from kustomization.yaml until private review inputs and recurring reports are ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: renovate-acceptance-pr-proof
  namespace: automation
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: acceptance-pr-proof
    app.kubernetes.io/part-of: homelab-automation
spec:
  suspend: true
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: renovate
        app.kubernetes.io/component: acceptance-pr-proof
        app.kubernetes.io/part-of: homelab-automation
    spec:
      automountServiceAccountToken: false
      serviceAccountName: renovate
      hostAliases:
        - ip: 10.96.0.50
          hostnames: [harbor.stinkyboi.com]
      restartPolicy: Never
      securityContext:
        runAsUser: 12021
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 12021
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: harbor.stinkyboi.com/mirror/ghcr.io/renovatebot/renovate:44.167.4@sha256:82f2a1375a48339c02f9a74b14f8468386c5c5e88ff10aa1674aae31df52969d
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /usr/src/app/acceptance-pr-proof.js
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: observer
              mountPath: /usr/src/app/acceptance-observer.js
              subPath: acceptance-observer.js
              readOnly: true
            - name: observer
              mountPath: /usr/src/app/acceptance-pr-proof.js
              subPath: acceptance-pr-proof.js
              readOnly: true
            - name: github-app
              mountPath: /var/run/secrets/renovate
              readOnly: true
            - name: ledger
              mountPath: /ledger
      volumes:
        - name: observer
          configMap:
            name: renovate-acceptance-observer
        - name: github-app
          secret:
            secretName: renovate-acceptance
            defaultMode: 0440
            items:
              - key: issuer-id
                path: issuer-id
              - key: private-key
                path: private-key
        - name: ledger
          persistentVolumeClaim:
            claimName: renovate-acceptance-ledger
