apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automation
resources:
  - acceptance-ledger-pvc.yaml
  - acceptance-observer-cronjob.yaml
  - cronjob.yaml
  - externalsecret.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - serviceaccount.yaml
configMapGenerator:
