apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-harbor-pull
  namespace: automation
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: renovate-harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # checkov:skip=CKV_SECRET_6: ExternalSecret key name, not a secret value.
    - secretKey: password
      remoteRef:
        # checkov:skip=CKV_SECRET_6: Public SSM path; no credential material.
        key: /homelab/renovate/harbor-pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
