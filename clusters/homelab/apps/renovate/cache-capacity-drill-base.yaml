# Staged only. Include this shared helper and policy only after dedicated-cache prerequisites.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-cache-capacity-drill
  namespace: automation
data:
  drill.sh: |
    #!/bin/sh
    set -eu
    umask 077

    # Verify the mounted export, not the PVC's unenforced size request.
    source=$(awk '$5 == "/cache" { for (i=1; i<=NF; i++) if ($i == "-") print $(i+1) " " $(i+2) }' /proc/self/mountinfo)
    [ "$source" = 'nfs 10.1.0.2:/renovate-cache' ] || { echo 'Unexpected cache export' >&2; exit 1; }
    size=$(df -Pk /cache | awk 'NR == 2 { print $2 }')
    case "$size" in ''|*[!0-9]*) exit 1 ;; esac
    if [ "$size" -lt 16777216 ] || [ "$size" -gt 25165824 ]; then
      echo 'Unexpected cache volume size' >&2
      exit 1
    fi

    filler=/cache/.renovate-capacity-drill
    probe=/cache/.renovate-capacity-probe
    case "${1:-}" in
      fill)
        [ ! -e "$probe" ] && [ ! -L "$probe" ] || exit 1
        [ ! -e "$filler" ] && [ ! -L "$filler" ] || exit 1
        free=$(df -Pk /cache | awk 'NR == 2 { print $4 }')
        case "$free" in ''|*[!0-9]*) exit 1 ;; esac
        [ "$free" -ge 1048576 ] || { echo 'Cache already near capacity' >&2; exit 1; }
        : > "$filler"
        if dd if=/dev/zero of="$filler" bs=1M count=24576 conv=fsync 2>/dev/null; then
          echo 'Dedicated volume did not reach capacity' >&2
          exit 1
        fi
        sync
        free=$(df -Pk /cache | awk 'NR == 2 { print $4 }')
        case "$free" in ''|*[!0-9]*) exit 1 ;; esac
        [ "$free" -lt 4 ] || { echo 'Dedicated volume still has probe space' >&2; exit 1; }
        if dd if=/dev/zero of="$probe" bs=4096 count=1 2>/dev/null; then
          rm -f "$probe"
          echo 'Cache probe unexpectedly succeeded' >&2
          exit 1
        fi
        rm -f "$probe"
        echo 'Dedicated cache volume capacity drill reached the write-probe boundary'
        ;;
      restore)
        if [ -e "$filler" ] || [ -L "$filler" ]; then
          [ -f "$filler" ] && [ ! -L "$filler" ] || exit 1
          rm "$filler"
        fi
        if [ -e "$probe" ] || [ -L "$probe" ]; then
          [ -f "$probe" ] && [ ! -L "$probe" ] || exit 1
          bytes=$(wc -c < "$probe")
          case "$bytes" in ''|*[!0-9]*) exit 1 ;; esac
          [ "$bytes" -le 4096 ] || exit 1
          rm "$probe"
        fi
        sync
        dd if=/dev/zero of="$probe" bs=4096 count=1 conv=fsync 2>/dev/null
        rm "$probe"
        free=$(df -Pk /cache | awk 'NR == 2 { print $4 }')
        case "$free" in ''|*[!0-9]*) exit 1 ;; esac
        [ "$free" -ge 32768 ] || { echo 'Cache capacity not restored' >&2; exit 1; }
        echo 'Dedicated cache volume restored; cache contents preserved'
        ;;
      *) exit 1 ;;
    esac
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renovate-cache-capacity-drill
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renovate-cache-capacity-drill
  policyTypes: [Ingress, Egress]
