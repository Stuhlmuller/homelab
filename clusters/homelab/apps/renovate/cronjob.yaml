apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: automation
  annotations:
    checkov.io/skip1: CKV_K8S_22=Renovate installs package-manager tools under image-managed paths at runtime; durable caches stay on the PVC.
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/part-of: homelab-automation
spec:
  suspend: true
  schedule: "0 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3300
      backoffLimit: 0
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
          labels:
            app.kubernetes.io/name: renovate
            app.kubernetes.io/part-of: homelab-automation
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 12021
            runAsGroup: 0
            runAsNonRoot: true
            fsGroup: 12021
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: harbor.stinkyboi.com/mirror/ghcr.io/renovatebot/renovate:44.167.4@sha256:82f2a1375a48339c02f9a74b14f8468386c5c5e88ff10aa1674aae31df52969d
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
                  ephemeral-storage: 8Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
              volumeMounts:
                - name: config
                  mountPath: /usr/src/app/config.js
                  subPath: config.js
                  readOnly: true
                - name: github-app
                  mountPath: /var/run/secrets/renovate
                  readOnly: true
                - name: cache
                  mountPath: /cache/renovate
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: github-app
              secret:
                secretName: renovate
                defaultMode: 0440
                items:
                  - key: issuer-id
                    path: issuer-id
                  - key: private-key
                    path: private-key
            - name: cache
              persistentVolumeClaim:
                claimName: renovate-cache
            - name: tmp
              emptyDir:
                sizeLimit: 8Gi
