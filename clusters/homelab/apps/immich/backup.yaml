apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-postgres-backup
spec:
  schedule: '20 10 * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-backup
        spec:
          serviceAccountName: immich-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: harbor.stinkyboi.com/mirror/ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  mkdir -p /library/postgres-dumps
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup="/library/postgres-dumps/immich-${timestamp}.dump"
                  temporary="$(mktemp "${backup}.XXXXXX")"
                  trap 'rm -f "$temporary"' EXIT
                  export PGPASSWORD="$(cat /run/immich-secrets/admin-password)"
                  pg_dump --host=immich-postgres --username=postgres --no-password \
                    --format=custom --file="$temporary" immich
                  pg_restore --list "$temporary" >/dev/null
                  mv "$temporary" "$backup"
                  find /library/postgres-dumps -maxdepth 1 -type f -name 'immich-*.dump' -mtime +14 -delete
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: "1", memory: 512Mi}
              volumeMounts:
                - name: library
                  mountPath: /library
                - name: credentials
                  mountPath: /run/immich-secrets
                  readOnly: true
          volumes:
            - name: library
              persistentVolumeClaim:
                claimName: immich-library
            - name: credentials
              secret:
                secretName: immich-postgres-admin
