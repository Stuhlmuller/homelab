apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-postgres
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-valkey
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-backup
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
automountServiceAccountToken: false
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: immich-default-deny
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: immich-ingress
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/traefik/sa/traefik]
      to:
        - operation:
            ports: ['2283']
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: immich-postgres
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/immich/sa/immich, cluster.local/ns/immich/sa/immich-backup]
      to:
        - operation:
            ports: ['5432']
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: immich-valkey
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/immich/sa/immich]
      to:
        - operation:
            ports: ['6379']
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-ingress
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # Ambient ztunnel enforces the authenticated, per-workload policies above.
    - ports:
        - {protocol: TCP, port: 15008}
