apiVersion: v1
kind: Service
metadata:
  namespace: immich
  name: immich-valkey
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  selector:
    app.kubernetes.io/name: immich-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: immich
  name: immich-valkey
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-valkey
    spec:
      serviceAccountName: immich-valkey
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: harbor.stinkyboi.com/mirror/docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          imagePullPolicy: Always
          args: [valkey-server, --save, "", --appendonly, "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
