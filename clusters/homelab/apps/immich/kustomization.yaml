apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - namespace.yaml
  - storage.yaml
  - externalsecret.yaml
  - postgres.yaml
  - server.yaml
  - valkey.yaml
  - access.yaml
  - backup.yaml
configMapGenerator:
  - name: immich-config
    files:
      - immich.json
  - name: immich-postgres-init
    files:
      - 99-immich.sql
    options:
      annotations:
        argocd.argoproj.io/sync-wave: '-2'
