apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: immich
  name: immich-postgres-admin
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: immich-postgres-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-password
      remoteRef:
        key: /homelab/immich/postgres-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: immich
  name: immich-postgres-app
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: immich-postgres-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app-password
      remoteRef:
        key: /homelab/immich/postgres-app-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
