apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-kuma-restore-verification-v1
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma-restore
        app.kubernetes.io/part-of: uptime-kuma
    spec:
      serviceAccountName: uptime-kuma-restore
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: acer
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: verify
        image: harbor.stinkyboi.com/mirror/docker.io/louislam/uptime-kuma:2.5.11@sha256:7554dba313c84e44fee921ef3b5626ba1c711e412e82815e8c957517026112a9
        command:
        - python3
        - /backup-code/backup.py
        - verify
        - --source
        - /backups/snapshots
        - --destination
        - /restore/data
        - --password-file
        - /secret/admin-password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: code
          mountPath: /backup-code
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
        - name: backups
          mountPath: /backups
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: restore
          mountPath: /restore
        - name: secret
          mountPath: /secret
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: uptime-kuma-backup
      - name: config
        configMap:
          name: uptime-kuma-config
      - name: backups
        persistentVolumeClaim:
          claimName: uptime-kuma-backups
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: restore
        emptyDir:
          sizeLimit: 5Gi
      - name: secret
        secret:
          secretName: uptime-kuma-admin
          defaultMode: 288
