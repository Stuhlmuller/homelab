apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/traefik/sa/traefik
    to:
    - operation:
        ports:
        - '3001'
