apiVersion: v1
kind: Pod
metadata:
  name: oce-bootstrap-reader
  namespace: openclaw-system
  labels:
    app.kubernetes.io/name: openclaw-enterprise-bootstrap-reader
    app.kubernetes.io/instance: oce
    app.kubernetes.io/part-of: openclaw-enterprise
  annotations:
    checkov.io/skip1: CKV_K8S_40=The upstream bootstrap service key is mode 0600 and owned by UID 1000; a higher UID cannot read it through the read-only mount.
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  nodeSelector:
    oce-role: control
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: reader
      image: harbor.stinkyboi.com/mirror/docker.io/library/python:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d
      command: [python3, -I, -c, "import time; time.sleep(1000000000)"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      livenessProbe:
        exec:
          command: [python3, -I, -c, "import os; os.kill(1, 0)"]
        periodSeconds: 30
        timeoutSeconds: 3
      readinessProbe:
        exec:
          command: [sh, -c, "test -f /var/lib/openclaw/bootstrap/initial-admin-service-key.json"]
        periodSeconds: 10
        timeoutSeconds: 3
      volumeMounts:
        - name: bootstrap
          mountPath: /var/lib/openclaw/bootstrap
          readOnly: true
  volumes:
    - name: bootstrap
      persistentVolumeClaim:
        claimName: occ-bootstrap-admin-password
        readOnly: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oce-bootstrap-reader-isolation
  namespace: openclaw-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise-bootstrap-reader
      app.kubernetes.io/instance: oce
  policyTypes: [Ingress, Egress]
