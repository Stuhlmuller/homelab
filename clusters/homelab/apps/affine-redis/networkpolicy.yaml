apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: affine-redis
  namespace: collaboration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: affine-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: affine
      ports:
        - protocol: TCP
          port: 6379
