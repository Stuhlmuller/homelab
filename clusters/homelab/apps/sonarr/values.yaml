serviceAccount:
  sonarr: {}
controllers:
  sonarr:
    serviceAccount:
      identifier: sonarr
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: zimaboard-0
      annotations:
        homelab.rst.io/access-mode: "octelium"
    strategy: Recreate
    initContainers:
      prepare-config:
        image:
          repository: busybox
          tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command:
          - /bin/sh
          - -ec
          - chown 1000:1000 /config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
          readOnlyRootFilesystem: true
      migrate-config:
        dependsOn: prepare-config
        image:
          repository: lscr.io/linuxserver/sonarr
          tag: 4.0.19@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
        command:
          - /bin/sh
          - /scripts/migrate-config.sh
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      configure-postgres:
        dependsOn: migrate-config
        image:
          repository: lscr.io/linuxserver/sonarr
          tag: 4.0.19@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
        envFrom:
          - secretRef:
              name: media-postgres-arr-env
        command:
          - /bin/sh
          - -ec
          - |
            config=/config/config.xml
            tmp="$(mktemp /tmp/sonarr-config.XXXXXXXXXX)"

            xml_escape() {
              printf '%s' "$1" \
                | sed \
                  -e 's/&/\&amp;/g' \
                  -e 's/</\&lt;/g' \
                  -e 's/>/\&gt;/g' \
                  -e 's/"/\&quot;/g' \
                  -e "s/'/\&apos;/g"
            }

            set_config_tag() {
              tag="$1"
              value="$(xml_escape "$2")"
              awk -v tag="$tag" -v value="$value" '
                BEGIN { inserted = 0 }
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" {
                  next
                }
                $0 ~ "^[[:space:]]*</Config>[[:space:]]*$" {
                  print "  <" tag ">" value "</" tag ">"
                  inserted = 1
                }
                { print }
                END {
                  if (inserted == 0) {
                    exit 1
                  }
                }
              ' "$config" > "$tmp"
              cat "$tmp" > "$config"
            }

            assert_single_config_tag() {
              tag="$1"
              expected="$2"
              total="$(awk -v tag="$tag" '
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" { count++ }
                END { print count + 0 }
              ' "$config")"
              matches="$(awk -v tag="$tag" -v expected="$expected" '
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" {
                  value = $0
                  sub("^[[:space:]]*<" tag ">", "", value)
                  sub("</" tag ">[[:space:]]*$", "", value)
                  if (value == expected) {
                    count++
                  }
                }
                END { print count + 0 }
              ' "$config")"

              if [ "$total" -ne 1 ] || [ "$matches" -ne 1 ]; then
                echo "Sonarr config.xml must contain exactly one ${tag}=${expected}; found ${matches}/${total}" >&2
                exit 1
              fi
            }

            assert_absent_config_tag() {
              tag="$1"
              total="$(awk -v tag="$tag" '
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" { count++ }
                END { print count + 0 }
              ' "$config")"

              if [ "$total" -ne 0 ]; then
                echo "Sonarr config.xml must not contain legacy ${tag}; found ${total}" >&2
                exit 1
              fi
            }

            remove_config_tag() {
              tag="$1"
              awk -v tag="$tag" '
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" {
                  next
                }
                { print }
              ' "$config" > "$tmp"
              cat "$tmp" > "$config"
            }

            : "${SONARR_POSTGRES_HOST:?}"
            : "${SONARR_POSTGRES_PORT:?}"
            : "${SONARR_POSTGRES_USER:?}"
            : "${SONARR_POSTGRES_PASSWORD:?}"
            : "${SONARR_POSTGRES_MAIN_DB:?}"
            : "${SONARR_POSTGRES_LOG_DB:?}"

            if [ ! -s "$config" ]; then
              printf '<Config>\n</Config>\n' > "$config"
            fi

            if ! grep -q '</Config>' "$config"; then
              echo "Sonarr config.xml is missing a closing </Config> tag" >&2
              exit 1
            fi

            set_config_tag PostgresUser "$SONARR_POSTGRES_USER"
            set_config_tag PostgresPassword "$SONARR_POSTGRES_PASSWORD"
            set_config_tag PostgresPort "$SONARR_POSTGRES_PORT"
            set_config_tag PostgresHost "$SONARR_POSTGRES_HOST"
            set_config_tag PostgresMainDb "$SONARR_POSTGRES_MAIN_DB"
            set_config_tag PostgresLogDb "$SONARR_POSTGRES_LOG_DB"

            # AuthenticationEnabled is a legacy switch that forces Forms auth
            # before Sonarr reads AuthenticationMethod. AuthenticationType is a
            # retired/incorrect auth-required key. Keep both out of the PVC.
            remove_config_tag AuthenticationEnabled
            remove_config_tag AuthenticationType
            set_config_tag AuthenticationMethod External
            set_config_tag AuthenticationRequired DisabledForLocalAddresses
            assert_absent_config_tag AuthenticationEnabled
            assert_absent_config_tag AuthenticationType
            assert_single_config_tag AuthenticationMethod External
            assert_single_config_tag AuthenticationRequired DisabledForLocalAddresses
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/sonarr
          tag: 4.0.19@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
        command:
          - /bin/sh
          - -ec
          - |
            rm -f /etc/cont-init.d/30-config
            exec /init
        env:
          TZ: America/Los_Angeles
          PUID: "1000"
          PGID: "1000"
          DELUGE_URL: http://deluge.media.svc.cluster.local:8112
          SONARR__AUTH__METHOD: External
          SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - curl -fsS -o /dev/null http://127.0.0.1:8989/initialize.json
              failureThreshold: 36
              periodSeconds: 5
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - curl -fsS -o /dev/null http://127.0.0.1:8989/initialize.json
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - curl -fsS -o /dev/null http://127.0.0.1:8989/initialize.json
              failureThreshold: 3
              periodSeconds: 30
              timeoutSeconds: 5
service:
  app:
    controller: sonarr
    ports:
      http:
        port: 8989
persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: sonarr-config-local
    advancedMounts:
      sonarr:
        prepare-config:
          - path: /config
        migrate-config:
          - path: /config
        app:
          - path: /config
        configure-postgres:
          - path: /config
  legacy-config:
    # Migration-only: remove this mount and migrate-config after the local
    # rollout marker and first scheduled backup are verified.
    enabled: true
    type: persistentVolumeClaim
    existingClaim: sonarr-config
    advancedMounts:
      sonarr:
        migrate-config:
          - path: /legacy-config
            readOnly: true
  migration-script:
    enabled: true
    type: configMap
    name: sonarr-config-migration
    advancedMounts:
      sonarr:
        migrate-config:
          - path: /scripts
            readOnly: true
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-tv
    advancedMounts:
      sonarr:
        app:
          - path: /tv
            subPath: tv
  downloads:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-downloads
    advancedMounts:
      sonarr:
        app:
          - path: /downloads
            subPath: downloads
