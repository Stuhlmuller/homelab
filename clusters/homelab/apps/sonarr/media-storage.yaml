---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: homelab-media
    homelab.stuhlmuller.dev/data-class: app-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-media
  namespace: media
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: homelab-media
    homelab.stuhlmuller.dev/data-class: legacy-migration-source
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: nfs-default
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-tv
  labels:
    app.kubernetes.io/name: media-tv
    app.kubernetes.io/part-of: homelab-media
    homelab.stuhlmuller.dev/storage-backend: qnap-media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 2Ti
  claimRef:
    name: media-tv
    namespace: media
  mountOptions:
    - nfsvers=3
  nfs:
    path: /media
    server: 10.1.0.2
  persistentVolumeReclaimPolicy: Retain
  storageClassName: media-qnap-static
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-tv
  namespace: media
  labels:
    app.kubernetes.io/name: media-tv
    app.kubernetes.io/part-of: homelab-media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  storageClassName: media-qnap-static
  volumeName: media-tv
---
apiVersion: batch/v1
kind: Job
metadata:
  name: media-tv-directories
  namespace: media
  labels:
    app.kubernetes.io/name: media-tv-directories
    app.kubernetes.io/part-of: homelab-media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-tv-directories
        app.kubernetes.io/part-of: homelab-media
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare-directories
          image: harbor.stinkyboi.com/mirror/cgr.dev/chainguard/busybox:latest@sha256:f7d9063f22547e726221275158930e5033be3c6d8340c6867afb7d0d779fad8d
          command:
            - /bin/sh
            - -ec
            - |
              umask 0000
              mkdir -p /target/tv

              chmod a+rwX /target/tv
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: media-tv
              mountPath: /target
      volumes:
        - name: media-tv
          persistentVolumeClaim:
            claimName: media-tv
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-tv-directories
  namespace: media
  labels:
    app.kubernetes.io/name: media-tv-directories
    app.kubernetes.io/part-of: homelab-media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media-tv-directories
      app.kubernetes.io/part-of: homelab-media
  policyTypes:
    - Ingress
    - Egress
