apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-config
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: fleet-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        mysql-password: "{{ .mysql_password }}"
        fleet.yml: |
          mysql:
            address: fleet-mysql.fleet.svc.cluster.local:3306
            database: fleet
            username: fleet
            password_path: /run/secrets/fleet/mysql-password
            max_open_conns: 20
            max_idle_conns: 10
          redis:
            address: fleet-redis.fleet.svc.cluster.local:6379
            password: {{ .redis_password | quote }}
          server:
            address: 0.0.0.0:8080
            tls: false
            private_key: {{ .server_private_key | quote }}
          logging:
            json: true
            disable_banner: true
          osquery:
            status_log_plugin: stdout
            result_log_plugin: stdout
          # Initial family MDM footprint; enable scanning only with sized
          # vulnerability-feed storage and memory, as described in README.md.
          vulnerabilities:
            disable_schedule: true
            disable_data_sync: true
  data:
    - secretKey: mysql_password
      remoteRef:
        key: /homelab/fleet/mysql-password
    - secretKey: redis_password
      remoteRef:
        key: /homelab/fleet/redis-password
    - secretKey: server_private_key
      remoteRef:
        key: /homelab/fleet/server-private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-mysql
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: fleet-mysql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        mysql-password: "{{ .mysql_password }}"
        mysql-root-password: "{{ .mysql_root_password }}"
        client.cnf: |
          [client]
          user=fleet
          password={{ .mysql_password }}
          host=127.0.0.1
          protocol=TCP
          database=fleet
        root.cnf: |
          [client]
          user=root
          password={{ .mysql_root_password }}
          socket=/var/run/mysqld/mysqld.sock
  data:
    - secretKey: mysql_password
      remoteRef:
        key: /homelab/fleet/mysql-password
    - secretKey: mysql_root_password
      remoteRef:
        key: /homelab/fleet/mysql-root-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-redis
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: fleet-redis
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        redis-password: "{{ .redis_password }}"
        redis.conf: |
          bind 0.0.0.0
          protected-mode yes
          port 6379
          dir /data
          appendonly yes
          appendfsync everysec
          save ""
          maxmemory 128mb
          maxmemory-policy noeviction
          requirepass {{ .redis_password }}
  data:
    - secretKey: redis_password
      remoteRef:
        key: /homelab/fleet/redis-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-admin
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: fleet-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key name, not a secret value.
    - secretKey: admin-password
      remoteRef:
        key: /homelab/fleet/admin-password
---
