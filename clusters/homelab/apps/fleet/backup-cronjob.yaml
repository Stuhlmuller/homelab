apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-mysql-backup
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    checkov.io/skip1: CKV_K8S_40=QNAP all-squash requires UID and GID 65534 for writable NFS backups.
    checkov.io/skip2: CKV2_K8S_6=Fleet backup Pods have no inbound server and are covered by the namespace default-deny NetworkPolicy.
spec:
  schedule: "45 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fleet-backup
        spec:
          serviceAccountName: fleet-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ec
                - |
                  umask 077
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  archive="fleet-${stamp}.sql"
                  pending="$(mktemp -d /backups/.pending-XXXXXXXX)"
                  trap 'rm -rf -- "$pending"' EXIT
                  mysqldump --defaults-extra-file=/run/secrets/fleet-backup/client.cnf \
                    --single-transaction --quick --skip-lock-tables \
                    --no-tablespaces --set-gtid-purged=OFF \
                    --result-file="${pending}/${archive}" fleet
                  test -s "${pending}/${archive}"
                  tail -n 2 "${pending}/${archive}" | grep -q '^-- Dump completed on '
                  (
                    cd "$pending"
                    sha256sum "$archive" > "${archive}.sha256"
                    sha256sum --check --status "${archive}.sha256"
                  )
                  # Publish only a complete dump; prune only after verification.
                  mv "${pending}/${archive}" "/backups/${archive}"
                  mv "${pending}/${archive}.sha256" "/backups/${archive}.sha256"
                  find /backups -maxdepth 1 -type f -name 'fleet-*.sql' -mtime +13 -print0 |
                    while IFS= read -r -d '' old; do
                      rm -f -- "$old" "${old}.sha256"
                    done
                  printf 'Published verified Fleet database backup %s\n' "$archive"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: credentials
                  mountPath: /run/secrets/fleet-backup
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: credentials
              secret:
                secretName: fleet-backup
                defaultMode: 0440
            - name: backups
              persistentVolumeClaim:
                claimName: fleet-mysql-backups
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
