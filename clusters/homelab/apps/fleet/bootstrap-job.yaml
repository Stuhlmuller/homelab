apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-bootstrap
  namespace: fleet
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    checkov.io/skip1: CKV_K8S_43=The image has an immutable digest pin.
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-bootstrap
    spec:
      serviceAccountName: fleet-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/library/python:3.14.7-alpine3.23@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d
          imagePullPolicy: IfNotPresent
          command: [python3, -I, -B, /scripts/bootstrap.py]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: fleet-bootstrap
            defaultMode: 0444
        - name: secrets
          secret:
            secretName: fleet-admin
            defaultMode: 0440
