apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-bootstrap
  namespace: fleet
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    checkov.io/skip1: CKV_K8S_43=The image has an immutable digest pin.
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-bootstrap
    spec:
      serviceAccountName: fleet-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: harbor.stinkyboi.com/mirror/cgr.dev/chainguard/python:latest@sha256:197cf542e9f4dc373864faecd4fd1a4f642622e654e9196881ca852e8fdf26bd
          imagePullPolicy: IfNotPresent
          command: [python3, -I, -B, /scripts/bootstrap.py]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: fleet-bootstrap
            defaultMode: 0444
        - name: secrets
          secret:
            secretName: fleet-admin
            defaultMode: 0440
