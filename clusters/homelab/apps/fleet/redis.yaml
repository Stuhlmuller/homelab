apiVersion: v1
kind: Service
metadata:
  name: fleet-redis
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-redis
  namespace: fleet
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    checkov.io/skip1: CKV_K8S_40=QNAP all-squash requires UID and GID 65534 for writable NFS data.
    checkov.io/skip2: CKV2_K8S_6=Fleet ingress is restricted by the sibling networkpolicy.yaml and authorizationpolicy.yaml.
  labels:
    app.kubernetes.io/name: fleet
    app.kubernetes.io/component: redis
spec:
  serviceName: fleet-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet
        app.kubernetes.io/component: redis
    spec:
      serviceAccountName: fleet-datastores
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2.16-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
          imagePullPolicy: IfNotPresent
          command: [redis-server, /run/secrets/fleet-redis/redis.conf]
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(printf 'AUTH %s\nPING\n' "$(cat /run/secrets/fleet-redis/redis-password)" | redis-cli --raw)" = "$(printf 'OK\nPONG')"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(printf 'AUTH %s\nPING\n' "$(cat /run/secrets/fleet-redis/redis-password)" | redis-cli --raw)" = "$(printf 'OK\nPONG')"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/fleet-redis
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: secrets
          secret:
            secretName: fleet-redis
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: fleet-redis-data
