apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - externalsecret.yaml
  - storage.yaml
  - mysql-configmap.yaml
  - mysql.yaml
  - redis.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - authorizationpolicy.yaml
  - backup-cronjob.yaml
  - virtualservice.yaml
  - bootstrap-job.yaml
configMapGenerator:
  - name: fleet-bootstrap
    namespace: fleet
    files:
      - bootstrap.py
