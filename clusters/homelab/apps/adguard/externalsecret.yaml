apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-config
  namespace: automation
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: adguard-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        config.json: |
          {{- if not (regexMatch "^[A-Za-z0-9]{32}$" .password) -}}
          {{- fail "AdGuard requires a generated 32-character ASCII credential" -}}
          {{- end -}}
          {
            "schema_version": 34,
            "http": {
              "address": "0.0.0.0:3000",
              "pprof": {"enabled": false, "port": 6060},
              "doh": {"insecure_enabled": false, "routes": []},
              "session_ttl": "24h"
            },
            "users": [{"name": "admin", "password": {{ .password | bcrypt | toJson }}}],
            "auth_attempts": 5,
            "block_auth_min": 15,
            "dns": {
              "bind_hosts": ["0.0.0.0"],
              "port": 53,
              "serve_plain_dns": true,
              "ratelimit": 0,
              "upstream_dns": ["1.1.1.2", "1.0.0.2", "[/stinkyboi.com/]PRIVATE_DNS_IP"],
              "bootstrap_dns": ["1.1.1.2", "1.0.0.2"],
              "fallback_dns": [],
              "upstream_timeout": "2s",
              "upstream_mode": "load_balance",
              "use_private_ptr_resolvers": false,
              "local_ptr_upstreams": [],
              "hostsfile_enabled": false,
              "anonymize_client_ip": true,
              "cache_enabled": true,
              "cache_optimistic": false,
              "aaaa_disabled": false
            },
            "tls": {"enabled": false},
            "dhcp": {"enabled": false},
            "querylog": {"enabled": false, "file_enabled": false},
            "statistics": {"enabled": false},
            "clients": {
              "runtime_sources": {"whois": false, "arp": false, "rdns": false, "dhcp": false, "hosts": false},
              "persistent": []
            },
            "filtering": {
              "protection_enabled": true,
              "filtering_enabled": true,
              "blocking_mode": "null_ip",
              "blocking_ipv4": "0.0.0.0",
              "blocking_ipv6": "::",
              "blocked_response_ttl": 10,
              "filters_update_interval": 24,
              "parental_enabled": false,
              "safebrowsing_enabled": false
            },
            "filters": [{
              "enabled": true,
              "url": "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt",
              "name": "AdGuard DNS filter",
              "id": 1
            }],
            "whitelist_filters": [],
            "user_rules": [],
            "log": {"enabled": true, "file": "", "verbose": false}
          }
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/adguard/admin-password
