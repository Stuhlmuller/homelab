apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: automation
  annotations:
    checkov.io/skip1: CKV2_K8S_6=The sibling networkpolicy.yaml declares the intended peers; existing Flannel does not enforce NetworkPolicy.
    checkov.io/skip2: CKV_K8S_25=The pinned AdGuard binary requires NET_BIND_SERVICE for DNS; all other capabilities are dropped and the exact profile is runtime-tested.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard
        istio.io/dataplane-mode: none
      annotations:
        homelab.stuhlmuller.dev/config-revision: "v2"
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - zimaboard-2
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: config
          image: harbor.stinkyboi.com/mirror/docker.io/library/python:3.14.7-alpine3.23@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d
          imagePullPolicy: IfNotPresent
          command: [python3, -I, -B, /app/init-config.py]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: secret, mountPath: /run/secrets/adguard, readOnly: true}
            - {name: config, mountPath: /config}
      containers:
        - name: adguard
          # Official multi-platform upstream artifact, published through the Harbor prerequisite.
          image: harbor.stinkyboi.com/mirror/docker.io/adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
          imagePullPolicy: IfNotPresent
          args: [--no-check-update, -c, /config/AdGuardHome.yaml, -w, /work]
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: http, containerPort: 3000, protocol: TCP}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          startupProbe:
            tcpSocket: {port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket: {port: dns-tcp}
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: work, mountPath: /work}
      volumes:
        - name: code
          configMap:
            name: adguard-init
            defaultMode: 0444
        - name: secret
          secret:
            secretName: adguard-config
            defaultMode: 0440
        - name: config
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: work
          persistentVolumeClaim:
            claimName: adguard-work
