# Unregistered HOME-59 proposal. Requires scripts/harbor-tls-render.py.
expose:
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-frontend-tls
  clusterIP:
    ports:
      httpsPort: 443
internalTLS:
  enabled: true
  certSource: secret
  core:
    secretName: harbor-core-tls
  portal:
    secretName: harbor-portal-tls
  jobservice:
    secretName: harbor-jobservice-tls
  registry:
    secretName: harbor-registry-tls
  trivy:
    secretName: harbor-trivy-tls

# Public CA only; supplied separately, never a signing key.
caBundleSecretName: harbor-internal-public-trust
nginx:
  podAnnotations:
    homelab.rst.io/tls-leaf-revision: "1"
    homelab.rst.io/tls-trust-revision: "1"
core:
  podAnnotations:
    homelab.rst.io/tls-leaf-revision: "1"
    homelab.rst.io/tls-trust-revision: "1"
portal:
  podAnnotations:
    homelab.rst.io/tls-leaf-revision: "1"
    homelab.rst.io/tls-trust-revision: "1"
jobservice:
  podAnnotations:
    homelab.rst.io/tls-leaf-revision: "1"
    homelab.rst.io/tls-trust-revision: "1"
registry:
  podAnnotations:
    homelab.rst.io/tls-leaf-revision: "1"
    homelab.rst.io/tls-trust-revision: "1"
trivy:
  podAnnotations:
    homelab.rst.io/tls-leaf-revision: "1"
    homelab.rst.io/tls-trust-revision: "1"
exporter:
  podAnnotations:
    homelab.rst.io/tls-leaf-revision: "1"
    homelab.rst.io/tls-trust-revision: "1"
