apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-postgres
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: n8n-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
      ports:
        - protocol: TCP
          port: 5432
        # Keep the same client selector for encrypted ambient traffic.
        - protocol: TCP
          port: 15008
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: n8n-postgres
  namespace: automation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/automation/sa/n8n"]
      to:
        - operation:
            ports: ["5432"]
