[SERVICE]
    Flush                     2
    Grace                     30
    Log_Level                 warn
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /buffers/chunks
    storage.sync              full
    storage.checksum          on
    storage.backlog.mem_limit  16M

[INPUT]
    Name                      tcp
    Tag                       talos
    Listen                    0.0.0.0
    Port                      5170
    Format                    json
    Source_Address_Key        source_address
    Chunk_Size                64
    Buffer_Size               1024
    storage.type              filesystem

[INPUT]
    Name                      kubernetes_events
    Tag                       kubernetes.event
    DB                        /buffers/events.db
    DB.sync                   full
    Kube_Watch_Timeout        5m
    storage.type              filesystem

[FILTER]
    Name                      record_modifier
    Match                     talos
    Record                    homelab_source talos

[FILTER]
    Name                      record_modifier
    Match                     kubernetes.event
    Record                    homelab_source kubernetes.event

# Preserve admitted large records across Wazuh's 64 KiB syslog limit.
[FILTER]
    Name                      lua
    Match                     *
    Script                    /etc/homelab/collector-size.lua
    Call                      wazuh_size
    Time_As_Table             On
    Enable_Flb_Null            On
    Type_Int_Key              fragment_index fragment_count original_timestamp_seconds original_timestamp_nanoseconds original_json_bytes

[OUTPUT]
    Name                      tcp
    Match                     *
    Host                      wazuh-manager.wazuh.svc.cluster.local
    Port                      5140
    Format                    json_lines
    Json_Date_Key             collected_at
    Json_Date_Format          iso8601
    Retry_Limit               False
    storage.total_limit_size  2G
