apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wazuh-collection
  namespace: wazuh
  labels:
    release: prometheus
spec:
  groups:
    - name: wazuh.collection
      rules:
        - alert: WazuhCollectorUnavailable
          expr: kube_daemonset_status_number_unavailable{namespace="wazuh",daemonset="wazuh-node-logs"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A node is missing its security log collector
            description: "Inspect the Wazuh DaemonSet before treating cluster log coverage as complete."
        - alert: WazuhLogDeliveryErrors
          expr: sum by (pod) (increase(fluentbit_output_errors_total{namespace="wazuh"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Wazuh log delivery is failing
            description: "Inspect collector connectivity and disk buffers; prolonged failure can exhaust the 2 GiB queue."
        - alert: WazuhLogsDropped
          expr: sum by (pod) (increase(fluentbit_output_dropped_records_total{namespace="wazuh"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: Security logs were dropped
            description: "Coverage is incomplete. Restore delivery and inspect source files for recoverable data."
        - alert: WazuhCoreUnavailable
          expr: kube_statefulset_replicas{namespace="wazuh"} - kube_statefulset_status_replicas_ready{namespace="wazuh"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: A Wazuh stateful component is unavailable
            description: "Collection and indexing may be interrupted. Check readiness and persistent storage."
