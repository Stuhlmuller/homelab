apiVersion: batch/v1
kind: CronJob
metadata:
  name: wazuh-backup
  namespace: wazuh
  annotations:
    checkov.io/skip9: CKV_K8S_40=The backup uses the upstream UID 1000 plus the Wazuh read group for archived files; only retained manager and NAS claims are mounted.
    argocd.argoproj.io/sync-wave: "3"
    checkov.io/skip1: CKV2_K8S_6=The workload is covered by sibling networkpolicy.yaml.
spec:
  schedule: "30 4 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wazuh-backup
            app.kubernetes.io/part-of: wazuh
        spec:
          serviceAccountName: wazuh
          automountServiceAccountToken: false
          nodeSelector: {kubernetes.io/hostname: acer}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [999]
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: docker.io/library/python:3.14.7-alpine3.23@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d
              imagePullPolicy: IfNotPresent
              command: [python3, -I, -B, /scripts/backup.py]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: manager, mountPath: /manager, readOnly: true}
                - {name: backups, mountPath: /backups}
                - {name: admin, mountPath: /run/admin, readOnly: true}
          volumes:
            - name: scripts
              configMap: {name: wazuh-core-config}
            - name: manager
              persistentVolumeClaim: {claimName: wazuh-manager-local, readOnly: true}
            - name: backups
              persistentVolumeClaim: {claimName: wazuh-backups}
            - name: admin
              secret: {secretName: wazuh-admin-tls, defaultMode: 0440}
