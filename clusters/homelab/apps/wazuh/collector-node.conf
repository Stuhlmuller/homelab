[SERVICE]
    Flush                     2
    Grace                     30
    Log_Level                 warn
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /buffers/chunks
    storage.sync              full
    storage.checksum          on
    storage.backlog.mem_limit  16M

[INPUT]
    Name                      tail
    Tag                       kube.*
    Path                      /var/log/containers/*.log
    # Collector error output can amplify its own delivery failures indefinitely.
    Exclude_Path              /var/log/containers/wazuh-node-logs-*_wazuh_*.log,/var/log/containers/wazuh-collector-*_wazuh_*.log
    multiline.parser          cri
    DB                        /buffers/containers.db
    DB.sync                   full
    Read_from_Head            On
    Rotate_Wait               30
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    storage.type              filesystem

[INPUT]
    Name                      tail
    Tag                       kubernetes.audit
    Path                      /var/log/audit/kube/kube-apiserver.log
    Parser                    json
    DB                        /buffers/audit.db
    DB.sync                   full
    Read_from_Head            On
    Rotate_Wait               30
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    storage.type              filesystem

[FILTER]
    Name                      kubernetes
    Match                     kube.*
    Kube_Tag_Prefix            kube.var.log.containers.
    Merge_Log                 Off
    Labels                    Off
    Annotations               Off
    Buffer_Size               0
    Kube_Meta_Cache_TTL        300s
    K8S-Logging.Exclude        Off

[FILTER]
    Name                      record_modifier
    Match                     kube.*
    Record                    homelab_source kubernetes.container

[FILTER]
    Name                      record_modifier
    Match                     kubernetes.audit
    Record                    homelab_source kubernetes.audit

# Preserve admitted large records across Wazuh's 64 KiB syslog limit.
[FILTER]
    Name                      lua
    Match                     *
    Script                    /etc/homelab/collector-size.lua
    Call                      wazuh_size
    Time_As_Table             On
    Enable_Flb_Null            On
    Type_Int_Key              fragment_index fragment_count original_timestamp_seconds original_timestamp_nanoseconds original_json_bytes

[OUTPUT]
    Name                      tcp
    Match                     *
    Host                      wazuh-manager.wazuh.svc.cluster.local
    Port                      5140
    Format                    json_lines
    Json_Date_Key             collected_at
    Json_Date_Format          iso8601
    Retry_Limit               False
    storage.total_limit_size  2G
    # Istio ambient STRICT mTLS authenticates this service account end to end.
