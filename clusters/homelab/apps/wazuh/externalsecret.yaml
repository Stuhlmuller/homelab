apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-credentials
  namespace: wazuh
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: wazuh-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        indexer-admin-password: "{{ .indexer_admin_password }}"
        api-password: "{{ .api_password }}"
        dashboard-password: "{{ .dashboard_password }}"
        agent-enrollment-password: "{{ .agent_enrollment_password }}"
        # No upstream demo users survive the first security-index initialization.
        internal_users.yml: |
          _meta:
            type: internalusers
            config_version: 2
          admin:
            hash: {{ htpasswd "admin" .indexer_admin_password "bcrypt" | trimPrefix "admin:" | quote }}
            reserved: true
            backend_roles: [admin]
            description: Homelab Wazuh administrator
          kibanaserver:
            hash: {{ htpasswd "kibanaserver" .dashboard_password "bcrypt" | trimPrefix "kibanaserver:" | quote }}
            reserved: true
            description: Wazuh dashboard service
        api-admin.json: |
          {"username":"wazuh-wui","password":{{ .api_password | toJson }}}
        filebeat.yml: |
          filebeat.modules:
            - module: wazuh
              alerts:
                enabled: true
              archives:
                enabled: true
          setup.template.json.enabled: true
          setup.template.overwrite: true
          setup.template.json.path: /etc/filebeat/wazuh-template.json
          setup.template.json.name: wazuh
          setup.ilm.enabled: false
          output.elasticsearch:
            hosts: [https://wazuh-indexer.wazuh.svc.cluster.local:9200]
            username: admin
            password: {{ .indexer_admin_password | quote }}
            ssl.verification_mode: full
            ssl.certificate_authorities: [/run/wazuh/tls/ca.crt]
            ssl.certificate: /run/wazuh/tls/tls.crt
            ssl.key: /run/wazuh/tls/tls.key
          logging.metrics.enabled: false
          seccomp:
            default_action: allow
            syscalls:
              - action: allow
                names: [rseq]
        opensearch_dashboards.yml: |
          server.host: 0.0.0.0
          server.port: 5601
          server.ssl.enabled: false
          opensearch.hosts: [https://wazuh-indexer.wazuh.svc.cluster.local:9200]
          opensearch.username: kibanaserver
          opensearch.password: {{ .dashboard_password | quote }}
          opensearch.ssl.verificationMode: full
          opensearch.ssl.certificateAuthorities: [/run/wazuh/ca/ca.crt]
          opensearch.requestHeadersWhitelist: [authorization, securitytenant]
          opensearch_security.multitenancy.enabled: false
          opensearch_security.readonly_mode.roles: [kibana_read_only]
          # The private Octelium native-client URL is HTTP inside its tunnel.
          opensearch_security.cookie.secure: false
          opensearch_security.cookie.ttl: 900000
          opensearch_security.session.ttl: 900000
          opensearch_security.session.keepalive: true
          uiSettings.overrides.defaultRoute: /app/wz-home
        wazuh.yml: |
          hosts:
            - homelab:
                url: https://wazuh-manager.wazuh.svc.cluster.local
                port: 55000
                username: wazuh-wui
                password: {{ .api_password | quote }}
                run_as: true
  data:
    - secretKey: indexer_admin_password
      remoteRef:
        key: /homelab/wazuh/indexer-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: api_password
      remoteRef:
        key: /homelab/wazuh/api-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: dashboard_password
      remoteRef:
        key: /homelab/wazuh/dashboard-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: agent_enrollment_password
      remoteRef:
        key: /homelab/wazuh/agent-enrollment-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
