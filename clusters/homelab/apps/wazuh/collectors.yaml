apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-collector
  namespace: wazuh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wazuh-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wazuh-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wazuh-collector
subjects:
  - kind: ServiceAccount
    name: wazuh-collector
    namespace: wazuh
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-node-logs
  namespace: wazuh
  annotations:
    checkov.io/skip9: CKV_K8S_40=Root reads Talos logs and writes dedicated node-local cursor directories; no host namespaces or capabilities are granted.
    checkov.io/skip1: CKV_K8S_23=Read-only root-owned Talos logs and host-owned cursor directories require root.
    checkov.io/skip2: CKV_K8S_22=Collector needs its Kubernetes token for metadata and events, with read-only RBAC.
    checkov.io/skip3: CKV_K8S_38=Collector needs its Kubernetes token for metadata and events, with read-only RBAC.
    checkov.io/skip4: CKV_K8S_43=Official collector digest is mirrored through the homelab catalog.
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-node-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-node-logs
        app.kubernetes.io/part-of: wazuh
    spec:
      serviceAccountName: wazuh-collector
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: docker.io/fluent/fluent-bit:5.1.3@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
          args: [-c, /etc/homelab/collector-node.conf]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: metrics
              containerPort: 2020
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/homelab
              readOnly: true
            - name: buffers
              mountPath: /buffers
            - name: logs
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: wazuh-collectors
        - name: buffers
          hostPath:
            path: /var/lib/wazuh-node-logs
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /var/log
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-collector
  namespace: wazuh
  annotations:
    checkov.io/skip9: CKV_K8S_40=Root reads Talos logs and writes dedicated node-local cursor directories; no host namespaces or capabilities are granted.
    checkov.io/skip1: CKV_K8S_23=Read-only root-owned Talos logs and host-owned cursor directories require root.
    checkov.io/skip2: CKV_K8S_22=Collector needs its Kubernetes token for metadata and events, with read-only RBAC.
    checkov.io/skip3: CKV_K8S_38=Collector needs its Kubernetes token for metadata and events, with read-only RBAC.
    checkov.io/skip4: CKV_K8S_43=Official collector digest is mirrored through the homelab catalog.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-collector
        app.kubernetes.io/part-of: wazuh
    spec:
      serviceAccountName: wazuh-collector
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/hostname: acer
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: docker.io/fluent/fluent-bit:5.1.3@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
          args: [-c, /etc/homelab/collector-central.conf]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - name: metrics
              containerPort: 2020
            - name: talos-json
              containerPort: 5170
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/homelab
              readOnly: true
            - name: buffers
              mountPath: /buffers
      volumes:
        - name: config
          configMap:
            name: wazuh-collectors
        - name: buffers
          hostPath:
            path: /var/lib/wazuh-collector
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-collector
  namespace: wazuh
spec:
  # Keep original Talos node addresses for the ingress allow-list.
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: wazuh-collector
  ports:
    - name: talos-json
      port: 5170
      targetPort: talos-json
      nodePort: 30517
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: wazuh-collectors
  namespace: wazuh
  labels:
    release: prometheus
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [wazuh-collector, wazuh-node-logs]
  podMetricsEndpoints:
    - port: metrics
      path: /api/v1/metrics/prometheus
      interval: 30s
