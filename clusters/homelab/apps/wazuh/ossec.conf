<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
  </global>
  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>
  <logging>
    <log_format>plain,json</log_format>
  </logging>
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>
  <remote>
    <connection>syslog</connection>
    <port>5140</port>
    <protocol>tcp</protocol>
    <allowed-ips>10.244.0.0/16</allowed-ips>
    <allowed-ips>127.0.0.1</allowed-ips>
  </remote>
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <use_password>yes</use_password>
    <purge>no</purge>
    <ssl_manager_cert>/run/wazuh/tls/tls.crt</ssl_manager_cert>
    <ssl_manager_key>/run/wazuh/tls/tls.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>
  <cluster>
    <disabled>yes</disabled>
  </cluster>
  <!-- Container self-scanning is not Talos host endpoint protection. -->
  <rootcheck><disabled>yes</disabled></rootcheck>
  <syscheck><disabled>yes</disabled></syscheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <vulnerability-detection>
    <!-- Enable after enrolling endpoint inventories and sizing the CTI feed. -->
    <enabled>no</enabled>
  </vulnerability-detection>
  <indexer>
    <enabled>no</enabled>
    <hosts><host>https://wazuh-indexer.wazuh.svc.cluster.local:9200</host></hosts>
    <ssl>
      <certificate_authorities><ca>/run/wazuh/tls/ca.crt</ca></certificate_authorities>
      <certificate>/run/wazuh/tls/tls.crt</certificate>
      <key>/run/wazuh/tls/tls.key</key>
    </ssl>
  </indexer>
  <localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs/api.json</location>
    <label key="homelab_source">wazuh.api</label>
  </localfile>
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-sources</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>32</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>
</ossec_config>
