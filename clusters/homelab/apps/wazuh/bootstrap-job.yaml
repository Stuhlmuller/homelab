apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-bootstrap
  namespace: wazuh
  annotations:
    checkov.io/skip9: CKV_K8S_40=The pinned upstream image owns its runtime directories as UID 1000; no host namespaces are shared.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    checkov.io/skip1: CKV2_K8S_6=The workload is covered by sibling networkpolicy.yaml.
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-bootstrap
        app.kubernetes.io/part-of: wazuh
    spec:
      serviceAccountName: wazuh
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: docker.io/library/python:3.14.7-alpine3.23@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d
          imagePullPolicy: IfNotPresent
          command: [python3, -I, -B, /scripts/bootstrap.py]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: credentials, mountPath: /run/credentials, readOnly: true}
            - {name: admin, mountPath: /run/admin, readOnly: true}
      volumes:
        - name: scripts
          configMap: {name: wazuh-core-config}
        - name: credentials
          secret:
            secretName: wazuh-credentials
            defaultMode: 0440
            items:
              - {key: internal_users.yml, path: internal_users.yml}
              - {key: indexer-admin-password, path: indexer-admin-password}
        - name: admin
          secret: {secretName: wazuh-admin-tls, defaultMode: 0440}
        - name: tmp
          emptyDir: {}
