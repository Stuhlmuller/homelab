apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: wazuh
  annotations:
    checkov.io/skip9: CKV_K8S_40=The pinned upstream image owns its runtime directories as UID 1000; no host namespaces are shared.
    checkov.io/skip1: CKV_K8S_23=Only the local-volume ownership init container runs as root; the indexer runs as UID 1000.
    checkov.io/skip2: CKV_K8S_37=The root init receives only CHOWN for the dedicated retained local data directory.
    checkov.io/skip3: CKV_K8S_25=The root init receives only CHOWN for the dedicated retained local data directory.
    checkov.io/skip4: CKV_K8S_22=The upstream indexer writes runtime plugin and keystore files within its image filesystem.
    checkov.io/skip5: CKV2_K8S_6=The workload is covered by sibling networkpolicy.yaml.
spec:
  replicas: 1
  serviceName: wazuh-indexer
  selector:
    matchLabels: {app.kubernetes.io/name: wazuh-indexer}
  template:
    metadata:
      annotations:
        homelab.stuhlmuller.dev/wazuh-revision: "v1"
      labels:
        app.kubernetes.io/name: wazuh-indexer
        app.kubernetes.io/part-of: wazuh
    spec:
      serviceAccountName: wazuh
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: acer}
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-local-data
          image: docker.io/wazuh/wazuh-indexer:4.14.8@sha256:6a9c1e3827da627a70859213b3e9cfe43193a492e358953de332b94de33b07de
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec, "test $(cat /proc/sys/vm/max_map_count) -ge 262144; chown 1000:1000 /data"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN]}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: indexer
          image: docker.io/wazuh/wazuh-indexer:4.14.8@sha256:6a9c1e3827da627a70859213b3e9cfe43193a492e358953de332b94de33b07de
          imagePullPolicy: IfNotPresent
          ports: [{name: https-indexer, containerPort: 9200}]
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            tcpSocket: {port: https-indexer}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - test "$(curl -sS --cacert /usr/share/wazuh-indexer/config/certs/ca.crt -o /dev/null -w '%{http_code}' https://localhost:9200/)" = 401
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: https-indexer}
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/wazuh-indexer}
            - {name: backup, mountPath: /snapshots}
            - {name: tls, mountPath: /usr/share/wazuh-indexer/config/certs, readOnly: true}
            - {name: config, mountPath: /usr/share/wazuh-indexer/config/opensearch.yml, subPath: opensearch.yml, readOnly: true}
            - {name: config, mountPath: /usr/share/wazuh-indexer/config/log4j2.properties, subPath: log4j2.properties, readOnly: true}
            - {name: config, mountPath: /usr/share/wazuh-indexer/config/jvm.options.d/homelab.options, subPath: jvm.options, readOnly: true}
            - {name: users, mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml, subPath: internal_users.yml, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: wazuh-indexer-local}
        - name: backup
          persistentVolumeClaim: {claimName: wazuh-backups}
        - name: config
          configMap: {name: wazuh-core-config}
        - name: tls
          secret: {secretName: wazuh-indexer-tls, defaultMode: 0440}
        - name: users
          secret:
            secretName: wazuh-credentials
            defaultMode: 0440
            items: [{key: internal_users.yml, path: internal_users.yml}]
