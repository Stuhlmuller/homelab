apiVersion: v1
kind: Namespace
metadata:
  name: wazuh
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    homelab.rst.io/privileged-namespace-justification: "Read-only node log mounts, persistent collector offsets, and local SIEM volumes require hostPath; Wazuh manager requires root. No privileged containers or host namespaces."
  labels:
    app.kubernetes.io/part-of: homelab
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
