apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - storage.yaml
  - externalsecret.yaml
  - initdb-configmap.yaml
  - postgres.yaml
  - redis.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml
  - initial-backup-job.yaml
  - restore-verification-job.yaml
  - configmap.yaml
  - runtime-externalsecret.yaml
  - database-role-job.yaml
  - migration.yaml
  - bootstrap-job.yaml
  - workloads.yaml
  - virtualservice.yaml
  - authorizationpolicy.yaml
replacements:
  - source:
      kind: CronJob
      name: mastodon-backup
      fieldPath: spec.jobTemplate.spec
    targets:
      - select:
          kind: Job
          name: mastodon-initial-backup-v1
        fieldPaths: [spec]
configMapGenerator:
  - name: mastodon-launcher
    namespace: mastodon
    options:
      annotations:
        argocd.argoproj.io/sync-wave: '-2'
    files:
      - launch.rb
      - bootstrap.rb
