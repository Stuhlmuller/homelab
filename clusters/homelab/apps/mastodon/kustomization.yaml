apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - storage.yaml
  - externalsecret.yaml
  - initdb-configmap.yaml
  - postgres.yaml
  - redis.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml
  - configmap.yaml
  - runtime-externalsecret.yaml
  - migration.yaml
  - bootstrap-job.yaml
  - workloads.yaml
  - virtualservice.yaml
  - authorizationpolicy.yaml
configMapGenerator:
  - name: mastodon-launcher
    namespace: mastodon
    options:
      annotations:
        argocd.argoproj.io/sync-wave: '-2'
    files:
      - launch.rb
      - bootstrap.rb
