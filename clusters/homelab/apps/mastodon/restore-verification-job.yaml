apiVersion: batch/v1
kind: Job
metadata:
  name: mastodon-restore-verification-v2
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-restore-verification
    app.kubernetes.io/part-of: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '4'
# Keep raw security defaults for scanners; Kustomize copies the full scheduled template.
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
