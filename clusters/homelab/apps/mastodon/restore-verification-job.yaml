apiVersion: batch/v1
kind: Job
metadata:
  name: mastodon-restore-verification-v2
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-restore-verification
    app.kubernetes.io/part-of: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '4'
# Kustomize copies the scheduled verifier template for immediate first verification.
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
