apiVersion: v1
kind: Service
metadata:
  name: mastodon-redis
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  labels:
    app.kubernetes.io/name: mastodon-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mastodon
spec:
  selector:
    app.kubernetes.io/name: mastodon-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mastodon-redis
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    checkov.io/skip1: CKV_K8S_40=The bounded init container owns the new local volume directory; the datastore runs as UID 65534.
    checkov.io/skip5: CKV_K8S_25=Only the bounded directory-ownership init container adds CHOWN and FOWNER; datastore containers drop all capabilities.
  labels:
    app.kubernetes.io/name: mastodon-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mastodon
spec:
  serviceName: mastodon-redis
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: mastodon
    spec:
      serviceAccountName: mastodon
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              password="$(cat /run/secrets/mastodon/REDIS_PASSWORD)"
              if [ -z "$password" ] || [ "$password" = "REPLACE_ME" ]; then
                echo "Mastodon Redis password is missing or still uses the placeholder" >&2
                exit 1
              fi

              umask 077
              cat > /tmp/redis.conf <<EOF
              bind 0.0.0.0
              protected-mode yes
              port 6379
              dir /data
              appendonly yes
              appendfsync everysec
              save 900 1
              requirepass ${password}
              EOF
              exec redis-server /tmp/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli --no-auth-warning -a "$(cat /run/secrets/mastodon/REDIS_PASSWORD)" ping | grep -qx PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli --no-auth-warning -a "$(cat /run/secrets/mastodon/REDIS_PASSWORD)" ping | grep -qx PONG
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/mastodon
              readOnly: true
            - name: runtime-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: mastodon-datastores
        - name: runtime-data
          persistentVolumeClaim:
            claimName: mastodon-redis-local
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      initContainers:
        - name: own-local-directory
          image: docker.io/library/redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - chown 65534:65534 /data; chmod 0770 /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: runtime-data
              mountPath: /data
