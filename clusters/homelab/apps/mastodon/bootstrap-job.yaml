apiVersion: batch/v1
kind: Job
metadata:
  name: mastodon-owner-bootstrap
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-migrate
    app.kubernetes.io/part-of: mastodon
  annotations:
    checkov.io/skip1: CKV_K8S_40=The pinned upstream Mastodon image requires its unprivileged UID 991 to access its private application directory.
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon-owner-bootstrap
    spec:
      serviceAccountName: mastodon
      nodeSelector:
        kubernetes.io/hostname: acer
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 991
        runAsGroup: 991
        runAsNonRoot: true
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: harbor.stinkyboi.com/mirror/ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
          command:
            - ruby
            - /run/launcher/launch.rb
            - bundle
            - exec
            - rails
            - runner
            - /run/launcher/bootstrap.rb
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime
              mountPath: /opt/mastodon/.env.production
              subPath: .env.production
              readOnly: true
            - name: runtime
              mountPath: /run/mastodon/vapid.pem
              subPath: vapid.pem
              readOnly: true
            - name: runtime
              mountPath: /run/mastodon/smtp-password
              subPath: smtp-password
              readOnly: true
            - name: launcher
              mountPath: /run/launcher
              readOnly: true
            - name: media
              mountPath: /opt/mastodon/public/system
            - name: tmp
              mountPath: /opt/mastodon/tmp
            - name: tmp
              mountPath: /tmp
            - name: log
              mountPath: /opt/mastodon/log
            - name: runtime
              mountPath: /run/mastodon/admin-password
              subPath: admin-password
              readOnly: true
      volumes:
        - name: runtime
          secret:
            secretName: mastodon-runtime
        - name: launcher
          configMap:
            name: mastodon-launcher
        - name: media
          persistentVolumeClaim:
            claimName: mastodon-media
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: log
          emptyDir:
            sizeLimit: 64Mi
