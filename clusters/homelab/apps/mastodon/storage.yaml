  name: mastodon-media
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-media
    app.kubernetes.io/part-of: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
