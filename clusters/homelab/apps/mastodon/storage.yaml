apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mastodon-postgres-local
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mastodon-postgres-local
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: '-2'
  labels:
    app.kubernetes.io/name: mastodon-postgres
    app.kubernetes.io/part-of: mastodon
    homelab.stuhlmuller.dev/storage-backend: talos-ephemeral-local
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 3Gi
  claimRef:
    name: mastodon-postgres-local
    namespace: mastodon
  hostPath:
    path: /var/lib/mastodon-postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - zimaboard-0
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mastodon-postgres-local
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mastodon-postgres-local
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: '-2'
  labels:
    app.kubernetes.io/name: mastodon-postgres
    app.kubernetes.io/part-of: mastodon
    homelab.stuhlmuller.dev/storage-backend: talos-ephemeral-local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
  storageClassName: mastodon-postgres-local
  volumeMode: Filesystem
  volumeName: mastodon-postgres-local
---
