apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-runtime
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-runtime
    app.kubernetes.io/part-of: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    homelab.stuhlmuller.dev/generated-secret-revision: v1
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: mastodon-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        vapid.pem: '{{ .vapid }}'
      templateFrom:
        - target: Data
          configMap:
            name: mastodon-config
            items:
              - key: .env.production
                templateAs: Values  # codespell:ignore templateas
              - key: streaming.env
                templateAs: Values  # codespell:ignore templateas
  data:
    - secretKey: postgres_password
      remoteRef:
        key: /homelab/mastodon/postgres-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: redis_password
      remoteRef:
        key: /homelab/mastodon/redis-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret_key_base
      remoteRef:
        key: /homelab/mastodon/secret-key-base
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: encryption_primary_key
      remoteRef:
        key: /homelab/mastodon/encryption-primary-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: encryption_deterministic_key
      remoteRef:
        key: /homelab/mastodon/encryption-deterministic-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: encryption_salt
      remoteRef:
        key: /homelab/mastodon/encryption-salt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: vapid
      remoteRef:
        key: /homelab/mastodon/vapid-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: smtp_password
      remoteRef:
        key: /homelab/mastodon/smtp-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
