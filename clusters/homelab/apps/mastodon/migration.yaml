apiVersion: batch/v1
kind: Job
metadata:
  name: mastodon-migrate
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-migrate
    app.kubernetes.io/part-of: mastodon
  annotations:
    checkov.io/skip1: CKV_K8S_40=The pinned upstream Mastodon image requires its unprivileged UID 991 to access its private application directory.
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon-migrate
    spec:
      serviceAccountName: mastodon
      nodeSelector:
        kubernetes.io/hostname: acer
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 991
        runAsGroup: 991
        runAsNonRoot: true
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/mastodon/mastodon:v4.7.3@sha256:0bf26ebfb7d694bddd2fcf0c5769642ac29d997eb42169c540963cf0f27ee6ca
          command:
            - ruby
            - /run/launcher/launch.rb
            - bundle
            - exec
            - rails
            - db:prepare
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime
              mountPath: /opt/mastodon/.env.production
              subPath: .env.production
              readOnly: true
            - name: runtime
              mountPath: /run/mastodon/vapid.pem
              subPath: vapid.pem
              readOnly: true
            - name: runtime
              mountPath: /run/mastodon/smtp-password
              subPath: smtp-password
              readOnly: true
            - name: launcher
              mountPath: /run/launcher
              readOnly: true
            - name: media
              mountPath: /opt/mastodon/public/system
            - name: tmp
              mountPath: /opt/mastodon/tmp
            - name: tmp
              mountPath: /tmp
            - name: log
              mountPath: /opt/mastodon/log
      volumes:
        - name: runtime
          secret:
            secretName: mastodon-runtime
            # This key appears atomically with the app-role credentials on upgrade.
            items:
              - key: runtime-v2
                path: runtime-v2
              - key: .env.production
                path: .env.production
              - key: vapid.pem
                path: vapid.pem
              - key: smtp-password
                path: smtp-password
        - name: launcher
          configMap:
            name: mastodon-launcher
        - name: media
          persistentVolumeClaim:
            claimName: mastodon-media
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: log
          emptyDir:
            sizeLimit: 64Mi
