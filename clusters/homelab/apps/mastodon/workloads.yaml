            - name: media
              mountPath: /opt/mastodon/public/system
            - name: tmp
              mountPath: /opt/mastodon/tmp
            - name: tmp
              mountPath: /tmp
            - name: log
              mountPath: /opt/mastodon/log
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "kill -0 1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - kill -0 1
            periodSeconds: 30
            failureThreshold: 6
