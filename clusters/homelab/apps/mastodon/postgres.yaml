apiVersion: v1
kind: Service
metadata:
  name: mastodon-postgres
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-postgres
    app.kubernetes.io/part-of: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    app.kubernetes.io/name: mastodon-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mastodon-postgres
  namespace: mastodon
  labels:
    app.kubernetes.io/name: mastodon-postgres
    app.kubernetes.io/part-of: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    checkov.io/skip1: CKV_K8S_40=The bounded init container owns the new local volume directory; the datastore runs as UID 65534.
    checkov.io/skip5: CKV_K8S_25=Only the bounded directory-ownership init container adds CHOWN and FOWNER; datastore containers drop all capabilities.
spec:
  serviceName: mastodon-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: own-local-directory
          image: docker.io/library/postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - chown 65534:65534 /data; chmod 0770 /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: local-data
              mountPath: /data
        - name: require-real-password
          image: docker.io/library/postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - test -s /run/secrets/mastodon/POSTGRES_PASSWORD; test "$(cat /run/secrets/mastodon/POSTGRES_PASSWORD)" != REPLACE_ME
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/mastodon
              readOnly: true
      containers:
        - name: postgres
          image: docker.io/library/postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
          imagePullPolicy: Always
          args:
            - -c
            - listen_addresses=*
            - -c
            - unix_socket_directories=/var/run/postgresql,/var/lib/postgresql
          env:
            - name: POSTGRES_USER
              value: mastodon
            - name: POSTGRES_DB
              value: mastodon
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/mastodon/POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mastodon
                - -d
                - mastodon
            failureThreshold: 180
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - psql -U mastodon -d mastodon -Atqc 'SELECT 1' >/dev/null
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - psql
                - -U
                - mastodon
                - -d
                - mastodon
                - -Atqc
                - SELECT 1
            failureThreshold: 60
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/mastodon
              readOnly: true
            - name: local-data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: socket
              mountPath: /var/run/postgresql
      volumes:
        - name: auth
          secret:
            secretName: mastodon-datastores
        - name: local-data
          persistentVolumeClaim:
            claimName: mastodon-postgres-local
        - name: initdb
          configMap:
            name: mastodon-initdb
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: socket
          emptyDir:
            sizeLimit: 16Mi
      serviceAccountName: mastodon
