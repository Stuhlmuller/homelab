---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-updater-canary
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-updater-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-updater-canary
        istio.io/dataplane-mode: none
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: harbor.stinkyboi.com/mirror/docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command: ["/bin/sleep", "2147483647"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
