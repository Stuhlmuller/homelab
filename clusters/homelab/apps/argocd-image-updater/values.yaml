# An idle controller is safe: only explicit native ImageUpdater CRs enroll apps.
# Workload tags are operator-selected; each CR uses digest + argocd write-back.
crds:
  install: true
  keep: true

replicaCount: 1
image:
  repository: harbor.stinkyboi.com/mirror/quay.io/argoprojlabs/argocd-image-updater
  tag: v1.3.0@sha256:cb009167015c6212ea21de55dd5734cf123d8b8e95f40ac09b1f1aa1839fad5b
extraArgs:
  - --interval=2m
config:
  log.level: info
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
