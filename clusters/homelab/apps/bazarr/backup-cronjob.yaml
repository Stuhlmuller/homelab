apiVersion: batch/v1
kind: CronJob
metadata:
  name: bazarr-config-backup
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    checkov.io/skip1: CKV_K8S_40=The backup runs as Bazarr UID 1000 to read its private config and database.
  labels:
    app.kubernetes.io/name: bazarr-config-backup
    app.kubernetes.io/part-of: homelab-media
spec:
  schedule: "45 4 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bazarr-config-backup
            app.kubernetes.io/part-of: homelab-media
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: zimaboard-0
          restartPolicy: Never
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: harbor.stinkyboi.com/mirror/ghcr.io/linuxserver/bazarr:1.6.2@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
              command: [/lsiopy/bin/python3, /bootstrap/bootstrap.py, backup]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: local-config
                  mountPath: /config
                  readOnly: true
                - name: backups
                  mountPath: /backup
                - name: bootstrap
                  mountPath: /bootstrap
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: local-config
              persistentVolumeClaim:
                claimName: bazarr-config-local
                readOnly: true
            - name: backups
              persistentVolumeClaim:
                claimName: bazarr-config-backups
            - name: bootstrap
              configMap:
                name: bazarr-bootstrap
                defaultMode: 0444
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
