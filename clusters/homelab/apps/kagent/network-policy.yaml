apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-private
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kagent-private
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: [kagent]
