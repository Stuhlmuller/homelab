apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-litellm
  namespace: kagent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: kagent-litellm
  data:
    - secretKey: token
      remoteRef:
        key: /homelab/kagent/litellm-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres
  namespace: kagent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: kagent-postgres
    template:
      data:
        password: "{{ .password }}"
        url: "postgres://kagent:{{ .password }}@kagent-postgres:5432/kagent?sslmode=disable"
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/kagent/postgres-password
