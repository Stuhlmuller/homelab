apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: media-postgres
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    checkov.io/skip1: CKV_K8S_40=PostgreSQL runs as UID 65534 to preserve the migrated database ownership.
    checkov.io/skip2: CKV_K8S_22=PostgreSQL requires writable image-managed runtime paths; persistent data is isolated on the data PVC.
    checkov.io/skip3: CKV_K8S_43=Image tags are pinned for GitOps review; digest pinning is tracked separately for homelab images.
    checkov.io/skip4: CKV2_K8S_6=media-postgres is covered by networkpolicy.yaml; diff-only scans do not include sibling manifests.
    checkov.io/skip5: CKV_K8S_23=The local-volume ownership init container runs as root; PostgreSQL and the migration remain non-root.
    checkov.io/skip6: CKV_K8S_37=The ownership init container receives only CHOWN for the dedicated local volume.
    checkov.io/skip7: CKV_K8S_25=The ownership init container receives only CHOWN for the dedicated local volume.
  labels:
    app.kubernetes.io/name: media-postgres
    app.kubernetes.io/part-of: homelab-media
spec:
  serviceName: media-postgres
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: media-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-postgres
        app.kubernetes.io/part-of: homelab-media
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: require-real-password
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              password="$(cat /run/secrets/media-postgres/POSTGRES_PASSWORD)"
              if [ -z "$password" ]; then
                echo "media-postgres password is empty; update /homelab/media-postgres/app-password in SSM" >&2
                exit 1
              fi
              if [ "$password" = "REPLACE_ME" ]; then
                echo "media-postgres password still uses the REPLACE_ME placeholder in SSM" >&2
                exit 1
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/media-postgres
              readOnly: true
        - name: prepare-local-data
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              chown 65534:65534 /target
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: local-data
              mountPath: /target
        - name: migrate-nfs-data
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              source=/source/pgdata
              target=/target/pgdata
              partial=/target/pgdata.migrating

              if [ -e "$target" ]; then
                test -f "$target/.nfs-migration-complete"
                test "$(cat "$target/PG_VERSION")" = "14"
                echo "local PostgreSQL data already exists; skipping NFS copy"
                exit 0
              fi

              test "$(cat "$source/PG_VERSION")" = "14"
              rm -rf -- "$partial"
              mkdir "$partial"
              cp -a --no-preserve=ownership "$source"/. "$partial"/
              test "$(cat "$partial/PG_VERSION")" = "14"
              rm -f -- "$partial/postmaster.pid"
              touch "$partial/.nfs-migration-complete"
              mv "$partial" "$target"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: data
              mountPath: /source
              readOnly: true
            - name: local-data
              mountPath: /target
      containers:
        - name: postgres
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          args:
            - -c
            - listen_addresses=
            - -c
            - default_transaction_read_only=on
            - -c
            - unix_socket_directories=/var/run/postgresql,/var/lib/postgresql/data
          env:
            - name: POSTGRES_USER_FILE
              value: /run/secrets/media-postgres/POSTGRES_USER
            - name: POSTGRES_DB_FILE
              value: /run/secrets/media-postgres/POSTGRES_DB
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/media-postgres/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - media_apps
                - -d
                - media_apps
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - psql -U media_apps -d media_apps -Atqc 'SELECT 1' >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - media_apps
                - -d
                - media_apps
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/media-postgres
              readOnly: true
            - name: local-data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: media-postgres-auth
        - name: initdb
          configMap:
            name: media-postgres-initdb
        - name: local-data
          persistentVolumeClaim:
            claimName: media-postgres-local
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: media-postgres
          app.kubernetes.io/part-of: homelab-media
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-default
        resources:
          requests:
            storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: media-postgres-local
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    checkov.io/skip1: CKV_K8S_40=PostgreSQL runs as the UID that owns the migrated local data.
    checkov.io/skip2: CKV_K8S_22=PostgreSQL requires writable image-managed runtime paths; persistent data is isolated on the local PVC.
    checkov.io/skip3: CKV_K8S_43=Image tags are pinned for GitOps review; digest pinning is tracked separately for homelab images.
    checkov.io/skip4: CKV2_K8S_6=media-postgres-local is covered by networkpolicy.yaml; diff-only scans do not include sibling manifests.
  labels:
    app.kubernetes.io/name: media-postgres
    app.kubernetes.io/instance: local
    app.kubernetes.io/part-of: homelab-media
spec:
  serviceName: media-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media-postgres
      app.kubernetes.io/instance: local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-postgres
        app.kubernetes.io/instance: local
        app.kubernetes.io/part-of: homelab-media
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: require-real-password
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              password="$(cat /run/secrets/media-postgres/POSTGRES_PASSWORD)"
              if [ -z "$password" ]; then
                echo "media-postgres password is empty; update /homelab/media-postgres/app-password in SSM" >&2
                exit 1
              fi
              if [ "$password" = "REPLACE_ME" ]; then
                echo "media-postgres password still uses the REPLACE_ME placeholder in SSM" >&2
                exit 1
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/media-postgres
              readOnly: true
        - name: require-local-data
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              data=/var/lib/postgresql/data/pgdata
              fence=/var/lib/postgresql/data/.local-cutover-fenced
              test "$(cat "$data/PG_VERSION")" = "14"
              if [ ! -f "$data/.nfs-migration-complete" ] &&
                 [ ! -f "$data/.logical-restore-complete" ]; then
                echo "local PostgreSQL data has no completed migration or restore marker" >&2
                exit 1
              fi
              if [ -e /var/lib/postgresql/data/.logical-restore-in-progress ]; then
                echo "a logical restore is still in progress" >&2
                exit 1
              fi
              if [ ! -f "$fence" ]; then
                if [ -e "$data/postmaster.pid" ] ||
                   [ -S /var/lib/postgresql/data/.s.PGSQL.5432 ]; then
                  echo "the staged PostgreSQL writer has not stopped yet" >&2
                  exit 1
                fi
                touch "$fence"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: local-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          args:
            - -c
            - "listen_addresses=*"
            - -c
            - unix_socket_directories=/var/run/postgresql,/var/lib/postgresql/data
          env:
            - name: POSTGRES_USER_FILE
              value: /run/secrets/media-postgres/POSTGRES_USER
            - name: POSTGRES_DB_FILE
              value: /run/secrets/media-postgres/POSTGRES_DB
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/media-postgres/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - media_apps
                - -d
                - media_apps
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - psql -U media_apps -d media_apps -Atqc 'SELECT 1' >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - media_apps
                - -d
                - media_apps
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth
              mountPath: /run/secrets/media-postgres
              readOnly: true
            - name: local-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: auth
          secret:
            secretName: media-postgres-auth
        - name: local-data
          persistentVolumeClaim:
            claimName: media-postgres-local
