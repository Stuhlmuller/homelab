apiVersion: batch/v1
kind: Job
metadata:
  name: media-postgres-cutover-backup
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: media-postgres-cutover-backup
    app.kubernetes.io/part-of: homelab-media
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-postgres-cutover-backup
        app.kubernetes.io/part-of: homelab-media
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: acer
      restartPolicy: Never
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              umask 0077
              timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
              backup_root=/backup/logical-backups
              partial="${backup_root}/.${timestamp}.partial"
              complete="${backup_root}/${timestamp}"
              mkdir -p "$partial"

              pg_dumpall \
                --host=/local \
                --port=5432 \
                --username=media_apps \
                --globals-only > "${partial}/globals.sql"

              for database in \
                sonarr-main sonarr-log \
                radarr-main radarr-log \
                prowlarr-main prowlarr-log
              do
                pg_dump \
                  --host=/local \
                  --port=5432 \
                  --username=media_apps \
                  --format=custom \
                  --file="${partial}/${database}.dump" \
                  "$database"
                pg_restore --list "${partial}/${database}.dump" >/dev/null
              done

              (
                cd "$partial"
                sha256sum globals.sql ./*.dump > SHA256SUMS
              )
              mv "$partial" "$complete"
              (
                cd "$complete"
                sha256sum --check SHA256SUMS
              )
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: local-data
              mountPath: /local
              readOnly: true
            - name: legacy-data
              mountPath: /backup
      volumes:
        - name: local-data
          persistentVolumeClaim:
            claimName: media-postgres-local
            readOnly: true
        - name: legacy-data
          persistentVolumeClaim:
            claimName: data-media-postgres-0
