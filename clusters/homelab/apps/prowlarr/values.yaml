serviceAccount:
  prowlarr: {}
controllers:
  prowlarr:
    serviceAccount:
      identifier: prowlarr
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: zimaboard-0
      annotations:
        homelab.rst.io/access-mode: "octelium"
    initContainers:
      configure-postgres:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.5.2@sha256:91844fa2c927ad6ede5630127183cc7868b175f6223e83e6a5da1fffea2aa782
        envFrom:
          - secretRef:
              name: media-postgres-arr-env
        command:
          - /bin/sh
          - -ec
          - |
            config=/config/config.xml
            tmp="$(mktemp /tmp/prowlarr-config.XXXXXXXXXX)"

            xml_escape() {
              printf '%s' "$1" \
                | sed \
                  -e 's/&/\&amp;/g' \
                  -e 's/</\&lt;/g' \
                  -e 's/>/\&gt;/g' \
                  -e 's/"/\&quot;/g' \
                  -e "s/'/\&apos;/g"
            }

            set_config_tag() {
              tag="$1"
              value="$(xml_escape "$2")"
              awk -v tag="$tag" -v value="$value" '
                BEGIN { inserted = 0 }
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" {
                  next
                }
                $0 ~ "^[[:space:]]*</Config>[[:space:]]*$" {
                  print "  <" tag ">" value "</" tag ">"
                  inserted = 1
                }
                { print }
                END {
                  if (inserted == 0) {
                    exit 1
                  }
                }
              ' "$config" > "$tmp"
              cat "$tmp" > "$config"
            }

            assert_single_config_tag() {
              tag="$1"
              expected="$(xml_escape "$2")"
              total="$(awk -v tag="$tag" '
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" { count++ }
                END { print count + 0 }
              ' "$config")"
              matches="$(awk -v tag="$tag" -v expected="$expected" '
                $0 ~ "^[[:space:]]*<" tag ">.*</" tag ">[[:space:]]*$" {
                  value = $0
                  sub("^[[:space:]]*<" tag ">", "", value)
                  sub("</" tag ">[[:space:]]*$", "", value)
                  if (value == expected) {
                    count++
                  }
                }
                END { print count + 0 }
              ' "$config")"

              if [ "$total" -ne 1 ] || [ "$matches" -ne 1 ]; then
                echo "Prowlarr config.xml must contain exactly one valid ${tag}; found ${matches}/${total}" >&2
                exit 1
              fi
            }

            : "${PROWLARR_POSTGRES_HOST:?}"
            : "${PROWLARR_POSTGRES_PORT:?}"
            : "${PROWLARR_POSTGRES_USER:?}"
            : "${PROWLARR_POSTGRES_PASSWORD:?}"
            : "${PROWLARR_POSTGRES_MAIN_DB:?}"
            : "${PROWLARR_POSTGRES_LOG_DB:?}"

            if [ ! -s "$config" ]; then
              printf '<Config>\n</Config>\n' > "$config"
            fi

            if ! grep -q '</Config>' "$config"; then
              echo "Prowlarr config.xml is missing a closing </Config> tag" >&2
              exit 1
            fi

            set_config_tag PostgresUser "$PROWLARR_POSTGRES_USER"
            set_config_tag PostgresPassword "$PROWLARR_POSTGRES_PASSWORD"
            set_config_tag PostgresPort "$PROWLARR_POSTGRES_PORT"
            set_config_tag PostgresHost "$PROWLARR_POSTGRES_HOST"
            set_config_tag PostgresMainDb "$PROWLARR_POSTGRES_MAIN_DB"
            set_config_tag PostgresLogDb "$PROWLARR_POSTGRES_LOG_DB"
            assert_single_config_tag PostgresUser "$PROWLARR_POSTGRES_USER"
            assert_single_config_tag PostgresPassword "$PROWLARR_POSTGRES_PASSWORD"
            assert_single_config_tag PostgresPort "$PROWLARR_POSTGRES_PORT"
            assert_single_config_tag PostgresHost "$PROWLARR_POSTGRES_HOST"
            assert_single_config_tag PostgresMainDb "$PROWLARR_POSTGRES_MAIN_DB"
            assert_single_config_tag PostgresLogDb "$PROWLARR_POSTGRES_LOG_DB"
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.5.2@sha256:91844fa2c927ad6ede5630127183cc7868b175f6223e83e6a5da1fffea2aa782
        env:
          TZ: America/Los_Angeles
          PUID: "1000"
          PGID: "1000"
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - curl -fsS -o /dev/null http://127.0.0.1:9696/initialize.json
              failureThreshold: 180
              periodSeconds: 10
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - curl -fsS -o /dev/null http://127.0.0.1:9696/initialize.json
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - curl -fsS -o /dev/null http://127.0.0.1:9696/initialize.json
              failureThreshold: 60
              periodSeconds: 30
              timeoutSeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 192Mi
          limits:
            cpu: 100m
            memory: 256Mi
service:
  app:
    controller: prowlarr
    ports:
      http:
        port: 9696
persistence:
  config:
    enabled: true
    storageClass: nfs-default
    size: 5Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      prowlarr:
        app:
          - path: /config
        configure-postgres:
          - path: /config
