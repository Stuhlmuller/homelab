apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: deluge-vpn
  namespace: monitoring
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/part-of: homelab-media
    homelab.stuhlmuller.dev/cluster: homelab
spec:
  namespaceSelector:
    matchNames:
      - media
  selector:
    matchLabels:
      app.kubernetes.io/instance: deluge
      app.kubernetes.io/name: deluge
      app.kubernetes.io/service: deluge-metrics
  endpoints:
    - port: vpn-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
      honorLabels: false
