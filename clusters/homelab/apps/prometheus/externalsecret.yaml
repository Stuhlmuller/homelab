apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
  annotations:
    homelab.rst.io/discord-webhook-ssm-version: "2"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          inhibit_rules:
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity =~ "warning|info"']
              equal: [namespace, alertname]
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: [namespace, alertname]
            - source_matchers: ['alertname = "InfoInhibitor"']
              target_matchers: ['severity = "info"']
              equal: [namespace]
            - target_matchers: ['alertname = "InfoInhibitor"']
          route:
            group_by: [grafana_folder, alertname, namespace, pod, container, app, reason, name, project, health_status, sync_status, workflow_name, head_branch, run_event, conclusion]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 1h
            receiver: homelab-notifications
            routes:
              - receiver: "null"
                matchers: ['alertname = "Watchdog"']
              - receiver: "null"
                matchers: ['alertname = "InfoInhibitor"']
          receivers:
            - name: "null"
            - name: homelab-notifications
              discord_configs:
                - send_resolved: true
                  webhook_url: "{{ .DISCORD_WEBHOOK_URL }}"
          templates: [/etc/alertmanager/config/*.tmpl]
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: /homelab/grafana/discord-webhook-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
