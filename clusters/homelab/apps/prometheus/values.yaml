grafana:
  enabled: false
nodeExporter:
  enabled: false
kube-state-metrics:
  image:
    registry: harbor.stinkyboi.com/mirror/registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.18.0@sha256:1545919b72e3ae035454fc054131e8d0f14b42ef6fc5b2ad5c751cafa6b2130e
    sha: ""
  resources:
    requests:
      memory: 128Mi
prometheusOperator:
  prometheusDefaultBaseImageRegistry: harbor.stinkyboi.com
  prometheusDefaultBaseImage: mirror/quay.io/prometheus/prometheus
  alertmanagerDefaultBaseImageRegistry: harbor.stinkyboi.com
  alertmanagerDefaultBaseImage: mirror/quay.io/prometheus/alertmanager
  thanosImage:
    registry: harbor.stinkyboi.com/mirror/quay.io
    repository: thanos/thanos
    tag: v0.41.0@sha256:cf3e9b292e4302ad4a4955b56379703aea39516607d382a57604a3d003c35d10
    sha: ""
  image:
    registry: harbor.stinkyboi.com/mirror/quay.io
    repository: prometheus-operator/prometheus-operator
    tag: v0.90.1@sha256:52a6a92d915ea2fa94314748d99db7a94922e3fe63274f6182fc033b9126b573
    sha: ""
  admissionWebhooks:
    patch:
      image:
        registry: harbor.stinkyboi.com/mirror/ghcr.io
        repository: jkroepke/kube-webhook-certgen
        tag: 1.8.2@sha256:e133b64c08377a107298ac3352504bd3cd21f13282bc2aac099a88a7888b3f54
        sha: ""
  resources:
    requests:
      memory: 128Mi
  prometheusConfigReloader:
    image:
      registry: harbor.stinkyboi.com/mirror/quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: v0.90.1@sha256:693faa0b87243cddca2cffb13586e4e2778b0cdf319cb2e601ba7af3fd19ef7d
      sha: ""
    resources:
      requests:
        memory: 32Mi
defaultRules:
  rules:
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  disabled:
    Watchdog: true
    # Replaced by job-prometheusrules.yaml with proven CronJob recovery.
    KubeJobFailed: true
    # Non-HA capacity policy; replaced by memory-prometheusrules.yaml.
    KubeMemoryOvercommit: true
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    version: v3.11.3-distroless
    image:
      registry: harbor.stinkyboi.com/mirror/quay.io
      repository: prometheus/prometheus
      tag: v3.11.3-distroless@sha256:cff72a3f49918f41c4b5c8a6174dd8433036bebf7878120da538b3720ba3fa0d
      sha: ""
    resources:
      requests:
        memory: 1536Mi
    retention: 15d
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [monitoring, harbor]
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
alertmanager:
  enabled: true
  alertmanagerSpec:
    version: v0.32.1
    image:
      registry: harbor.stinkyboi.com/mirror/quay.io
      repository: prometheus/alertmanager
      tag: v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
      sha: ""
    # checkov:skip=CKV_SECRET_6: Kubernetes Secret resource name, not secret material.
    configSecret: alertmanager-discord-webhook
    podMetadata:
      annotations:
        homelab.rst.io/discord-webhook-ssm-version: "2"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
