grafana:
  enabled: false
nodeExporter:
  enabled: false
kube-state-metrics:
  podAnnotations:
    homelab.rst.io/recovery-revision: "2026-08-21"
  resources:
    requests:
      memory: 128Mi
prometheusOperator:
  podAnnotations:
    homelab.rst.io/recovery-revision: "2026-08-21"
  resources:
    requests:
      memory: 128Mi
  prometheusConfigReloader:
    resources:
      requests:
        memory: 32Mi
defaultRules:
  rules:
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  disabled:
    Watchdog: true
    # Replaced by job-prometheusrules.yaml with proven CronJob recovery.
    KubeJobFailed: true
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    resources:
      requests:
        memory: 1536Mi
    retention: 15d
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
alertmanager:
  enabled: true
  alertmanagerSpec:
    # checkov:skip=CKV_SECRET_6: Kubernetes Secret resource name, not secret material.
    configSecret: alertmanager-discord-webhook
    podMetadata:
      annotations:
        homelab.rst.io/discord-webhook-ssm-version: "2"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
