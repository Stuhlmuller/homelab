grafana:
  enabled: false
nodeExporter:
  enabled: false
kubelet:
  serviceMonitor:
    # Helm replaces lists. Keep chart 85.2.0's drops before the mapped-root exception.
    cAdvisorMetricRelabelings:
      # Drop less useful container CPU metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
      # Drop less useful container / always zero filesystem metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      # Drop less useful / always zero container memory metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      # Drop less useful container process metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      # Drop container_memory_failures_total{scope="hierarchy"} metrics,
      # we only need the container scope.
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      # Drop container_network_... metrics that match various interfaces that
      # correspond to CNI and similar interfaces. This avoids capturing network
      # metrics for host network containers.
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      # Drop container spec metrics that overlap with kube-state-metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      # Only this mapping may set the volume label used by the rules.
      - action: labeldrop
        regex: homelab_talos_volume
      - action: replace
        sourceLabels: [id, pod, __name__, node, device]
        regex: '/;;container_fs_(limit_bytes|usage_bytes|inodes_free|inodes_total);(acer;/dev/sda4|zimaboard-[0-2];/dev/mmcblk0p4)'
        targetLabel: homelab_talos_volume
        replacement: EPHEMERAL
      - action: drop
        sourceLabels: [id, pod, homelab_talos_volume]
        regex: '.+;;'
kube-state-metrics:
  image:
    registry: harbor.stinkyboi.com
    repository: mirror/registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.18.0@sha256:1545919b72e3ae035454fc054131e8d0f14b42ef6fc5b2ad5c751cafa6b2130e
  resources:
    requests:
      memory: 128Mi
prometheusOperator:
  admissionWebhooks:
    patch:
      image:
        registry: harbor.stinkyboi.com
        repository: mirror/ghcr.io/jkroepke/kube-webhook-certgen
        tag: 1.8.2
        sha: e133b64c08377a107298ac3352504bd3cd21f13282bc2aac099a88a7888b3f54
  image:
    registry: harbor.stinkyboi.com
    repository: mirror/quay.io/prometheus-operator/prometheus-operator
    tag: v0.90.1
    sha: 52a6a92d915ea2fa94314748d99db7a94922e3fe63274f6182fc033b9126b573
  resources:
    requests:
      memory: 128Mi
  prometheusConfigReloader:
    image:
      registry: harbor.stinkyboi.com
      repository: mirror/quay.io/prometheus-operator/prometheus-config-reloader
      tag: v0.90.1
      sha: 693faa0b87243cddca2cffb13586e4e2778b0cdf319cb2e601ba7af3fd19ef7d
    resources:
      requests:
        memory: 32Mi
defaultRules:
  rules:
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  disabled:
    Watchdog: true
    # Replaced by job-prometheusrules.yaml with proven CronJob recovery.
    KubeJobFailed: true
    # Non-HA capacity policy; replaced by memory-prometheusrules.yaml.
    KubeMemoryOvercommit: true
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    image:
      registry: harbor.stinkyboi.com
      repository: mirror/quay.io/prometheus/prometheus
      tag: v3.11.3-distroless
      sha: cff72a3f49918f41c4b5c8a6174dd8433036bebf7878120da538b3720ba3fa0d
    resources:
      requests:
        memory: 1536Mi
    retention: 15d
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [monitoring, harbor]
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
alertmanager:
  enabled: true
  alertmanagerSpec:
    image:
      registry: harbor.stinkyboi.com
      repository: mirror/quay.io/prometheus/alertmanager
      tag: v0.32.1
      sha: 51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    # checkov:skip=CKV_SECRET_6: Kubernetes Secret resource name, not secret material.
    configSecret: alertmanager-discord-webhook
    podMetadata:
      annotations:
        homelab.rst.io/discord-webhook-ssm-version: "2"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
