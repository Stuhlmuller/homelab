grafana:
  enabled: false
nodeExporter:
  enabled: false
kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[octelium.com/component,octelium.com/svc]
  podAnnotations:
    homelab.rst.io/recovery-revision: "2026-08-21"
prometheusOperator:
  podAnnotations:
    homelab.rst.io/recovery-revision: "2026-08-21"
defaultRules:
  rules:
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  disabled:
    Watchdog: true
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 15d
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
alertmanager:
  enabled: true
  alertmanagerSpec:
    # checkov:skip=CKV_SECRET_6: Kubernetes Secret resource name, not secret material.
    configSecret: alertmanager-discord-webhook
    podMetadata:
      annotations:
        homelab.rst.io/discord-webhook-ssm-version: "2"
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-default
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
