# Candidate only: SSM value, exact IAM grant, receiver approval required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-independent-heartbeat
  namespace: monitoring
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: alertmanager-independent-heartbeat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          inhibit_rules:
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity =~ "warning|info"']
              equal: [namespace, alertname]
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: [namespace, alertname]
            - source_matchers: ['alertname = "InfoInhibitor"']
              target_matchers: ['severity = "info"']
              equal: [namespace]
            - target_matchers: ['alertname = "InfoInhibitor"']
          route:
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 1h
            receiver: homelab-notifications
            routes:
              - receiver: independent-heartbeat
                matchers: ['alertname = "Watchdog"']
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
                continue: false
              - receiver: "null"
                matchers: ['alertname = "InfoInhibitor"']
          receivers:
            - name: independent-heartbeat
              webhook_configs:
                - url: "{{ .HEARTBEAT_URL }}"
                  send_resolved: false
                  max_alerts: 1
                  http_config:
                    follow_redirects: false
            - name: "null"
            - name: homelab-notifications
              discord_configs:
                - send_resolved: true
                  title: >-
                    {{ `{{ .Status | toUpper }}:
                    {{ .GroupLabels.alertname }}` }}
                  message: >-
                    {{ `Firing: {{ len .Alerts.Firing }} |
                    Resolved: {{ len .Alerts.Resolved }} |
                    Namespace: {{ with .GroupLabels.namespace }}{{ . }}{{ else }}cluster{{ end }}` }}
                  webhook_url: "{{ .DISCORD_WEBHOOK_URL }}"
          templates: [/etc/alertmanager/config/*.tmpl]
  data:
  - secretKey: DISCORD_WEBHOOK_URL
    remoteRef:
      key: /homelab/grafana/discord-webhook-url
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: HEARTBEAT_URL
    remoteRef:
      key: /homelab/monitoring/heartbeat-url
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
