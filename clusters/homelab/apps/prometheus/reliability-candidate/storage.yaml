      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - REQUIRES-VERIFIED-STORAGE-NODE
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-local-v1-alertmanager-prometheus-kube-prometheus-alertmanager-0
