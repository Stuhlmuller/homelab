apiVersion: batch/v1
kind: CronJob
metadata:
  name: octelium-public-grpc-probe
  namespace: monitoring
  annotations:
    checkov.io/skip1: CKV2_K8S_6=This credential-free probe must reach public Cloudflare DNS and HTTPS addresses; the cluster CNI does not enforce NetworkPolicy yet.
  labels:
    app.kubernetes.io/name: octelium-public-grpc-probe
    app.kubernetes.io/part-of: octelium
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: octelium-public-grpc-probe
            app.kubernetes.io/part-of: octelium
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: probe
              image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
              command:
                - /bin/sh
                - -ec
                - |
                  endpoint="https://octelium-api.stinkyboi.com/octelium.api.main.user.v1.MainService/GetStatus"
                  if ! response="$(
                    curl --silent --show-error \
                      --http2 \
                      --ipv4 \
                      --doh-url https://1.1.1.1/dns-query \
                      --connect-timeout 10 \
                      --max-time 20 \
                      --header 'content-type: application/grpc' \
                      --header 'te: trailers' \
                      --data-binary '' \
                      --output /dev/null \
                      --dump-header - \
                      --write-out '\n__RESULT__ %{http_code} %{http_version}\n' \
                      "${endpoint}"
                  )"; then
                    echo "public Octelium gRPC request failed" >&2
                    exit 1
                  fi

                  response="$(printf '%s\n' "${response}" | tr -d '\r')"
                  result="$(printf '%s\n' "${response}" | awk '$1 == "__RESULT__" {print $2 " " $3}' | tail -1)"
                  grpc_status="$(printf '%s\n' "${response}" | awk -F ': *' 'tolower($1) == "grpc-status" {print $2}' | tail -1)"
                  server="$(printf '%s\n' "${response}" | awk -F ': *' 'tolower($1) == "server" {print tolower($2)}' | tail -1)"

                  if [ "${result}" != "200 2" ] || [ "${grpc_status}" != "16" ] || [ "${server}" != "cloudflare" ]; then
                    echo "public Octelium gRPC contract failed: HTTP/version=${result:-missing}, grpc-status=${grpc_status:-missing}, server=${server:-missing}" >&2
                    exit 1
                  fi
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: octelium-unauthorized-route-probe
  namespace: monitoring
  annotations:
    checkov.io/skip1: CKV2_K8S_6=This credential-free probe must reach public Cloudflare DNS and HTTPS addresses; the cluster CNI does not enforce NetworkPolicy yet.
  labels:
    app.kubernetes.io/name: octelium-unauthorized-route-probe
    app.kubernetes.io/part-of: octelium
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: octelium-unauthorized-route-probe
            app.kubernetes.io/part-of: octelium
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: probe
              image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
              command:
                - /bin/sh
                - -ec
                - |
                  for path in / /api/health; do
                    endpoint="https://nofx.stinkyboi.com${path}"
                    if ! response="$(
                      curl --silent --show-error \
                        --ipv4 \
                        --doh-url https://1.1.1.1/dns-query \
                        --connect-timeout 10 \
                        --max-time 20 \
                        --output /dev/null \
                        --dump-header - \
                        --write-out '\n__RESULT__ %{http_code}\n' \
                        "${endpoint}"
                    )"; then
                      echo "unauthorized Octelium route request failed for ${endpoint}" >&2
                      exit 1
                    fi

                    response="$(printf '%s\n' "${response}" | tr -d '\r')"
                    http_code="$(printf '%s\n' "${response}" | awk '$1 == "__RESULT__" {print $2}' | tail -1)"
                    unauthorized="$(printf '%s\n' "${response}" | awk -F ': *' 'tolower($1) == "x-octelium-unauthorized" {print tolower($2)}' | tail -1)"

                    if [ "${http_code}" != "401" ] || [ "${unauthorized}" != "true" ]; then
                      echo "unauthorized Octelium route contract failed for ${endpoint}: HTTP=${http_code:-missing}, x-octelium-unauthorized=${unauthorized:-missing}" >&2
                      exit 1
                    fi
                  done
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
