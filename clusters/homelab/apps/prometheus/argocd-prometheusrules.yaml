apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-application-health
  namespace: monitoring
  labels:
    app.kubernetes.io/name: argocd-application-health
    app.kubernetes.io/part-of: argocd
    homelab.stuhlmuller.dev/cluster: homelab
spec:
  groups:
    - name: homelab.argocd
      interval: 1m
      rules:
        - alert: ArgoCDApplicationMetricsMissing
          expr: absent(argocd_app_info)
          for: 10m
          labels:
            severity: critical
            managed_by: prometheus-rule
          annotations:
            summary: Prometheus is not receiving Argo CD application metrics.
            description: The argocd_app_info metric has been absent for at least 10 minutes, so Argo CD application health and sync alerts may be blind.
            runbook_url: https://github.com/Stuhlmuller/homelab/blob/main/clusters/homelab/apps/prometheus/README.md
        - alert: ArgoCDApplicationUnhealthy
          expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 10m
          labels:
            severity: critical
            managed_by: prometheus-rule
          annotations:
            summary: Argo CD application {{ $labels.name }} is {{ $labels.health_status }}.
            description: Argo CD reports application {{ $labels.name }} in project {{ $labels.project }} with health status {{ $labels.health_status }} for at least 10 minutes.
            runbook_url: https://github.com/Stuhlmuller/homelab/blob/main/docs/validation-runbook.md
        - alert: ArgoCDApplicationProgressingStuck
          expr: argocd_app_info{health_status="Progressing"} == 1
          for: 30m
          labels:
            severity: warning
            managed_by: prometheus-rule
          annotations:
            summary: Argo CD application {{ $labels.name }} is still Progressing.
            description: Argo CD reports application {{ $labels.name }} in project {{ $labels.project }} as Progressing for at least 30 minutes.
            runbook_url: https://github.com/Stuhlmuller/homelab/blob/main/docs/validation-runbook.md
        - alert: ArgoCDApplicationOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 30m
          labels:
            severity: warning
            managed_by: prometheus-rule
          annotations:
            summary: Argo CD application {{ $labels.name }} is OutOfSync.
            description: Argo CD reports application {{ $labels.name }} in project {{ $labels.project }} as OutOfSync for at least 30 minutes.
            runbook_url: https://github.com/Stuhlmuller/homelab/blob/main/docs/validation-runbook.md
