image:
  repository: harbor.stinkyboi.com/mirror/ghcr.io/berriai/litellm-database
  tag: 2791e3241d7fa59ad942c54c237fb0d53a140b52fad2bd4b40c14a873dbc14a8@sha256:2791e3241d7fa59ad942c54c237fb0d53a140b52fad2bd4b40c14a873dbc14a8
environmentSecrets:
  - litellm-provider-keys
command:
  - python
  - /etc/litellm-hooks/gateway.py
numWorkers: 1
# Reserve measured gateway memory; hold rollout until Acer can fit two Pods.
resources:
  requests:
    memory: 1Gi
nodeSelector:
  kubernetes.io/hostname: acer
serviceAccount:
  create: true
  name: litellm
  automount: false
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
service:
  type: ClusterIP
  port: 4000
podAnnotations:
  homelab.stuhlmuller.dev/app-identity-revision: "12"
  ambient.istio.io/dns-capture: "true"
volumes:
  - name: app-identity
    configMap:
      name: litellm-app-identity
  - name: app-keys
    secret:
      secretName: litellm-app-keys
  - name: telemetry
    secret:
      secretName: litellm-telemetry
  - name: postgres
    secret:
      secretName: litellm-postgres-client
  - name: bedrock
    secret:
      secretName: litellm-bedrock
      optional: true
      defaultMode: 0400
volumeMounts:
  - name: app-identity
    mountPath: /etc/litellm-hooks
    readOnly: true
  - name: app-keys
    mountPath: /var/run/secrets/litellm-apps
    readOnly: true
  - name: telemetry
    mountPath: /var/run/secrets/litellm-telemetry
    readOnly: true
  - name: postgres
    mountPath: /var/run/secrets/litellm-postgres
    readOnly: true
  - name: bedrock
    mountPath: /root/.aws
    readOnly: true
masterkeySecretName: litellm-provider-keys
masterkeySecretKey: LITELLM_MASTER_KEY
proxy_config:
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    store_model_in_db: true
    supported_db_objects: []
  litellm_settings:
    set_verbose: false
    log_raw_request_response: false
    callbacks:
      - /etc/litellm-hooks/app_identity.attribution
      - /etc/litellm-hooks/app_identity.langfuse
  model_list:
    - model_name: openrouter/free
      litellm_params:
        model: openai/openrouter/free
        api_base: https://openrouter.ai/api/v1
    - model_name: bedrock/claude-sonnet-4-5
      litellm_params:
        model: bedrock/converse/us.anthropic.claude-sonnet-4-5-20250929-v1:0
        aws_region_name: us-west-2
        aws_profile_name: litellm-bedrock
    - model_name: bedrock/nova-lite
      litellm_params:
        model: bedrock/converse/us.amazon.nova-lite-v1:0
        aws_region_name: us-west-2
        aws_profile_name: litellm-bedrock
    - model_name: bedrock/gpt-6.2-sol
      litellm_params:
        model: bedrock/converse/us.openai.gpt-6.2-sol
        aws_region_name: us-west-2
        aws_profile_name: litellm-bedrock
    - model_name: bedrock/deepseek-v3.2
      litellm_params:
        model: bedrock/converse/deepseek.v3.2
        aws_region_name: us-west-2
        aws_profile_name: litellm-bedrock
db:
  deployStandalone: false
migrationJob:
  enabled: false
