image:
  repository: ghcr.io/berriai/litellm-database
  tag: main-v1.80.8-stable@sha256:3305291fc9fa1b53196e21567a97f4c51e3a38bdc4e19704e38a551ee7712cd8
environmentSecrets:
  - litellm-provider-keys
command:
  - python
  - /etc/litellm-hooks/gateway.py
numWorkers: 1
serviceAccount:
  create: true
  name: litellm
  automount: false
service:
  type: ClusterIP
  port: 4000
podAnnotations:
  homelab.stuhlmuller.dev/app-identity-revision: "10"
volumes:
  - name: app-identity
    configMap:
      name: litellm-app-identity
  - name: app-keys
    secret:
      secretName: litellm-app-keys
  - name: telemetry
    secret:
      secretName: litellm-telemetry
  - name: postgres
    secret:
      secretName: litellm-postgres-client
volumeMounts:
  - name: app-identity
    mountPath: /etc/litellm-hooks
    readOnly: true
  - name: app-keys
    mountPath: /var/run/secrets/litellm-apps
    readOnly: true
  - name: telemetry
    mountPath: /var/run/secrets/litellm-telemetry
    readOnly: true
  - name: postgres
    mountPath: /var/run/secrets/litellm-postgres
    readOnly: true
masterkeySecretName: litellm-provider-keys
masterkeySecretKey: LITELLM_MASTER_KEY
proxy_config:
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    store_model_in_db: true
    supported_db_objects: []
  litellm_settings:
    set_verbose: false
    log_raw_request_response: false
    callbacks:
      - /etc/litellm-hooks/app_identity.attribution
      - /etc/litellm-hooks/app_identity.langfuse
  model_list:
    - model_name: openrouter/free
      litellm_params:
        model: openai/openrouter/free
        api_base: https://openrouter.ai/api/v1
db:
  deployStandalone: false
migrationJob:
  enabled: false
