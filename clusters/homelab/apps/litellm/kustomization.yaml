apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - authorizationpolicy.yaml
  - virtualservice.yaml
configMapGenerator:
  - name: litellm-app-identity
    namespace: ai
    files:
      - app_identity.py
generatorOptions:
  disableNameSuffixHash: true
