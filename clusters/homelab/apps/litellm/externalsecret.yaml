apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-provider-keys
  namespace: ai
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: litellm-provider-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: /homelab/litellm/master-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /homelab/litellm/openai-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: /homelab/langfuse/project-public-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public environment key name, not secret material.
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: /homelab/langfuse/project-secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-app-keys
  namespace: ai
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: litellm-app-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: operator
      remoteRef:
        key: /homelab/litellm/master-key
    - secretKey: openclaw
      remoteRef:
        key: /homelab/openclaw/litellm-token
    - secretKey: nofx
      remoteRef:
        key: /homelab/nofx/litellm-token
    - secretKey: multica
      remoteRef:
        key: /homelab/multica/litellm-token
