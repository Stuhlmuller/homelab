apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-provider-keys
  namespace: ai
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: litellm-provider-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key name, not secret value.
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: /homelab/litellm/master-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-app-keys
  namespace: ai
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v2"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: litellm-app-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key names, not secret values.
    - secretKey: operator
      remoteRef:
        key: /homelab/litellm/master-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: openclaw
      remoteRef:
        key: /homelab/openclaw/litellm-app-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: nofx
      remoteRef:
        key: /homelab/nofx/litellm-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: multica
      remoteRef:
        key: /homelab/multica/litellm-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: n8n
      remoteRef:
        key: /homelab/n8n/litellm-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: openrouter
      remoteRef:
        key: /homelab/litellm/openai-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-telemetry
  namespace: ai
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: litellm-telemetry
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key names, not secret values.
    - secretKey: public-key
      remoteRef:
        key: /homelab/langfuse/project-public-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret-key
      remoteRef:
        key: /homelab/langfuse/project-secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
