apiVersion: v1
kind: ServiceAccount
metadata:
  name: cordium-genesis
  namespace: octelium
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cordium-genesis
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
    checkov.io/skip1: CKV_K8S_158=Cordium genesis must create privileged upstream-managed RBAC during bootstrap.
    checkov.io/skip2: CKV_K8S_157=Cordium genesis must bind upstream-managed RBAC during bootstrap.
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - namespaces
      - secrets
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - roles
    verbs:
      - bind
      - escalate
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - bind
      - create
      - escalate
      - update
      - patch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cordium-genesis
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cordium-genesis
subjects:
  - kind: ServiceAccount
    name: cordium-genesis
    namespace: octelium
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cordium-genesis
  namespace: octelium
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis
    app.kubernetes.io/part-of: homelab
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
    checkov.io/skip1: CKV_K8S_22=The upstream genesis command writes temporary bootstrap state while creating Cordium managed services.
    checkov.io/skip2: CKV_K8S_38=The bootstrap job needs a Kubernetes service-account token to create Cordium controller resources.
    checkov.io/skip3: CKV_K8S_40=The upstream image runs as its bundled non-root octelium user with UID 100.
    checkov.io/skip4: CKV2_K8S_6=The parent Cordium app applies the cordium-genesis NetworkPolicy before creating this bootstrap app.
    homelab.rst.io/cordium-genesis-revision: "4"
spec:
  activeDeadlineSeconds: 720
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cordium
        app.kubernetes.io/component: genesis
        app.kubernetes.io/part-of: homelab
      annotations:
        homelab.rst.io/cordium-genesis-revision: "4"
    spec:
      serviceAccountName: cordium-genesis
      restartPolicy: OnFailure
      nodeSelector:
        octelium.com/node-mode-controlplane: ""
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: genesis
          image: ghcr.io/octelium/cordium-genesis:0.12.7@sha256:bc2911c5c17dc431d6b39471235c5bfe929241979a215a491a97fb53f5bbc401
          imagePullPolicy: IfNotPresent
          args:
            - init
            - --ingress-front-proxy
          env:
            - name: OCTELIUM_REGION_NAME
              value: default
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 65533
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cordium-genesis-cleanup
  namespace: octelium
  annotations:
    homelab.rst.io/cordium-genesis-revision: "4"
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis-cleanup
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cordium-genesis-cleanup
  namespace: octelium
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis-cleanup
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - cordium-genesis
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cordium-genesis-cleanup
  namespace: octelium
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis-cleanup
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cordium-genesis-cleanup
subjects:
  - kind: ServiceAccount
    name: cordium-genesis-cleanup
    namespace: octelium
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cordium-genesis-cleanup
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis-cleanup
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    resourceNames:
      - cordium-genesis
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cordium-genesis-cleanup
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis-cleanup
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cordium-genesis-cleanup
subjects:
  - kind: ServiceAccount
    name: cordium-genesis-cleanup
    namespace: octelium
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cordium-genesis-cleanup
  namespace: octelium
  labels:
    app.kubernetes.io/name: cordium
    app.kubernetes.io/component: genesis
    app.kubernetes.io/part-of: homelab
  annotations:
    argocd.argoproj.io/hook: PostSync,SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
    checkov.io/skip1: CKV_K8S_38=The cleanup hook needs its narrowly scoped Kubernetes service-account token.
    checkov.io/skip2: CKV2_K8S_6=The parent Cordium app applies the cordium-genesis NetworkPolicy before creating this bootstrap app.
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cordium
        app.kubernetes.io/component: genesis
        app.kubernetes.io/part-of: homelab
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      serviceAccountName: cordium-genesis-cleanup
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          imagePullPolicy: IfNotPresent
          args:
            - delete
            - clusterrolebinding.rbac.authorization.k8s.io/cordium-genesis
            - clusterrole.rbac.authorization.k8s.io/cordium-genesis
            - serviceaccount/cordium-genesis
            - --namespace=octelium
            - --ignore-not-found=true
            - --wait=false
            - --cache-dir=/tmp/kubectl-cache
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
