apiVersion: batch/v1
kind: CronJob
metadata:
  name: octelium-api-upnp
  namespace: istio-system
  annotations:
    checkov.io/skip1: CKV_K8S_19=UPnP only accepts the mapping when the request originates from the target worker, so this pod must use that worker's network.
  labels:
    app.kubernetes.io/name: octelium-api-upnp
    app.kubernetes.io/part-of: octelium
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: octelium-api-upnp
            app.kubernetes.io/part-of: octelium
        spec:
          automountServiceAccountToken: false
          hostNetwork: true
          nodeSelector:
            kubernetes.io/hostname: zimaboard-0
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: docker.io/queeup/upnpc-container:v2.3.3-r2@sha256:5bf14ccbe1cac2994e34c01bc6a677010e68e28705c6176a9ef7b3ebfbf5bec6
              args:
                - -a
                - 10.1.0.200
                - "30443"
                - "8443"
                - TCP
                - "86400"
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
