apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-storage
  namespace: octelium-storage
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - octelium-postgres
          - octelium-redis
  policyTypes:
    - Ingress
    - Egress
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: octelium
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-postgres-backup
  namespace: octelium-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: octelium-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: octelium-postgres-backup
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-storage-default-deny
  namespace: octelium-storage
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-postgres-backup-egress
  namespace: octelium-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: octelium-postgres-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: octelium-postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
