apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-storage
  namespace: octelium-storage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: octelium
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-postgres-backup
  namespace: octelium-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: octelium-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: octelium-postgres-backup
      ports:
        - protocol: TCP
          port: 5432
