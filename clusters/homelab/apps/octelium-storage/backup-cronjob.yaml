apiVersion: batch/v1
kind: CronJob
metadata:
  name: octelium-postgres-backup
  namespace: octelium-storage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: octelium-postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: octelium
spec:
  schedule: "30 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: octelium-postgres-backup
        app.kubernetes.io/component: backup
        app.kubernetes.io/part-of: octelium
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: octelium-postgres-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: octelium
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:14.23-bookworm@sha256:70b9c8977b5fb87bd55c9e29472d778d76d56a6266143d47259da13d78a72afa
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -ec
                - |
                  umask 0077
                  password="$(cat /run/secrets/octelium-storage/POSTGRES_PASSWORD)"
                  if [ -z "$password" ] || [ "$password" = "REPLACE_ME" ]; then
                    echo "Octelium PostgreSQL password is empty or still uses REPLACE_ME in SSM" >&2
                    exit 1
                  fi
                  export PGPASSWORD="$password"
                  unset password

                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup_root=/backup/logical-backups
                  partial="${backup_root}/.${timestamp}.partial"
                  complete="${backup_root}/${timestamp}"
                  mkdir -p "$backup_root"
                  mkdir "$partial"

                  pg_dumpall \
                    --host=octelium-postgres \
                    --port=5432 \
                    --username=octelium \
                    --no-role-passwords \
                    --globals-only > "${partial}/globals.sql"

                  pg_dump \
                    --host=octelium-postgres \
                    --port=5432 \
                    --username=octelium \
                    --format=custom \
                    --file="${partial}/octelium.dump" \
                    octelium
                  unset PGPASSWORD

                  pg_restore --list "${partial}/octelium.dump" >/dev/null
                  (
                    cd "$partial" || exit 1
                    sha256sum globals.sql octelium.dump > SHA256SUMS
                    sha256sum --check SHA256SUMS
                  )
                  mv "$partial" "$complete"
                  (
                    cd "$complete" || exit 1
                    sha256sum --check SHA256SUMS
                  )
                  echo "completed backup ${timestamp}: ${complete}"

                  find "$backup_root" \
                    -mindepth 1 -maxdepth 1 -type d \
                    -name '20[0-9][0-9][01][0-9][0-3][0-9]T[0-2][0-9][0-5][0-9][0-5][0-9]Z' \
                    -mtime +13 -exec rm -r -- {} +
                  find "$backup_root" \
                    -mindepth 1 -maxdepth 1 -type d \
                    -name '.*.partial' -mtime +1 -exec rm -r -- {} +
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: auth
                  mountPath: /run/secrets/octelium-storage
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: auth
              secret:
                secretName: octelium-storage-auth
            - name: backup
              persistentVolumeClaim:
                claimName: octelium-postgres-backup
