apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bulldozer
  namespace: automation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bulldozer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # HBONE is encrypted; the mesh checks workload identity and port.
    - ports:
        - protocol: TCP
          port: 15008
