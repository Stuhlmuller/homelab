apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulldozer-config
  namespace: automation
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: bulldozer-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        bulldozer.yml: |
          server:
            address: "0.0.0.0"
            port: 8080
          logging:
            text: false
            level: info
          github:
            web_url: "https://github.com"
            v3_api_url: "https://api.github.com"
            app:
              integration_id: {{ .integration_id }}
              webhook_secret: "{{ .webhook_secret }}"
              private_key: |
                {{ .private_key | replace "\n" "\n      " }}
          options:
            configuration_path: .bulldozer.yml
            disable_update_feature: true
            default_repository_config:
              version: 1
              merge:
                method: squash
                allow_merge_with_no_checks: true
  data:
    - secretKey: integration_id
      remoteRef:
        key: /homelab/bulldozer/github-app/integration-id
    - secretKey: webhook_secret
      remoteRef:
        key: /homelab/bulldozer/github-app/webhook-secret
    - secretKey: private_key
      remoteRef:
        key: /homelab/bulldozer/github-app/private-key
