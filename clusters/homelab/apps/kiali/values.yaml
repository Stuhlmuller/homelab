metrics:
  enabled: true

debug:
  enabled: false

onlyViewOnlyMode: true
allowAdHocKialiNamespace: false
allowAdHocKialiImage: false
allowAdHocOSSMConsoleImage: false
# Required for the reviewed readiness init container and its numeric non-root UID.
# The operator otherwise replaces its securityContext, dropping runAsUser.
allowAdHocContainers: true
allowSecurityContextOverride: true

cr:
  create: true
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  spec:
    istio_namespace: istio-system
    auth:
      strategy: anonymous
    deployment:
      namespace: monitoring
      cluster_wide_access: true
      service_type: ClusterIP
      view_only_mode: true
      additional_pod_init_containers_yaml:
        - name: wait-for-prometheus
          image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until curl --fail --silent --show-error --max-time 10 \
                http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/-/ready; do
                sleep 5
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    external_services:
      grafana:
        enabled: true
        external_url: https://grafana.stinkyboi.com
        internal_url: http://grafana.monitoring.svc.cluster.local
      prometheus:
        enabled: true
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    server:
      web_fqdn: kiali.stinkyboi.com
      web_port: "443"
      web_root: /
      web_schema: https
