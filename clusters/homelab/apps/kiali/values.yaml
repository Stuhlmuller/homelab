image:
  repo: harbor.stinkyboi.com/mirror/quay.io/kiali/kiali-operator
  tag: v2.26.0@sha256:ca2e4c356e946849883f42e9c9fe41080145cb442f93200cfca4e55a89a62039
  digest: ""
# Override the operator's supported default without permitting ad-hoc CR images.
env:
  - name: RELATED_IMAGE_kiali_default
    value: harbor.stinkyboi.com/mirror/quay.io/kiali/kiali:v2.26.0@sha256:59cce98a9811ce53ff3da771225d1df00f0ca4ae0819311291ae7316349a13e9

metrics:
  enabled: true

debug:
  enabled: false

onlyViewOnlyMode: true
allowAdHocKialiNamespace: false
allowAdHocKialiImage: false
allowAdHocOSSMConsoleImage: false
# Required for the reviewed readiness init container and its numeric non-root UID.
# The operator otherwise replaces its securityContext, dropping runAsUser.
allowAdHocContainers: true
allowSecurityContextOverride: true

cr:
  create: true
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  spec:
    istio_namespace: istio-system
    auth:
      strategy: anonymous
    deployment:
      namespace: monitoring
      cluster_wide_access: true
      service_type: ClusterIP
      view_only_mode: true
      additional_pod_init_containers_yaml:
        - name: wait-for-prometheus
          image: harbor.stinkyboi.com/mirror/docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until curl --fail --silent --show-error --max-time 10 \
                http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/-/ready; do
                sleep 5
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    external_services:
      grafana:
        enabled: true
        external_url: https://grafana.stinkyboi.com
        internal_url: http://grafana.monitoring.svc.cluster.local
      prometheus:
        enabled: true
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    server:
      web_fqdn: kiali.stinkyboi.com
      web_port: "443"
      web_root: /
      web_schema: https
