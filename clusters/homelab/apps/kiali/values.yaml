metrics:
  enabled: true

debug:
  enabled: false

onlyViewOnlyMode: true
allowAdHocKialiNamespace: false
allowAdHocKialiImage: false
allowAdHocOSSMConsoleImage: false
# Required for the reviewed readiness init container and its numeric non-root UID.
# The operator otherwise replaces its securityContext, dropping runAsUser.
allowAdHocContainers: true
allowSecurityContextOverride: true

cr:
  create: true
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  spec:
    istio_namespace: istio-system
    auth:
      strategy: anonymous
    deployment:
      namespace: monitoring
      cluster_wide_access: true
      service_type: ClusterIP
      view_only_mode: true
      additional_pod_init_containers_yaml:
        - name: wait-for-prometheus
          image: harbor.stinkyboi.com/mirror/cgr.dev/chainguard/curl:latest@sha256:cdf9f4e08dbf9878a12a46d679607735bad96bc8a9dde7752df6b328d7eba0a4
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/curl"]
          args:
            - --fail
            - --silent
            - --show-error
            - --retry
            - "60"
            - --retry-all-errors
            - --retry-delay
            - "5"
            - --retry-max-time
            - "600"
            - --max-time
            - "10"
            - http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/-/ready
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    external_services:
      grafana:
        enabled: true
        external_url: https://grafana.stinkyboi.com
        internal_url: http://grafana.monitoring.svc.cluster.local
      prometheus:
        enabled: true
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    server:
      web_fqdn: kiali.stinkyboi.com
      web_port: "443"
      web_root: /
      web_schema: https
