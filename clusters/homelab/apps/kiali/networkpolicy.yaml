apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kiali-server-ingress
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kiali
      app.kubernetes.io/name: kiali
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 20001
        - protocol: TCP
          port: 9090
