apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: compass-discovery
  labels:
    app.kubernetes.io/name: compass
    app.kubernetes.io/part-of: homelab
spec:
  controller: homelab.stinkyboi.com/compass-discovery
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compass-discovery-argocd
  namespace: monitoring
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/href: https://argocd.stinkyboi.com
    gethomepage.dev/description: GitOps control plane and application sync status.
    gethomepage.dev/icon: argo-cd.png
    gethomepage.dev/group: Platform
spec:
  ingressClassName: compass-discovery
  rules:
    - host: argocd.stinkyboi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compass
                port:
                  number: 8080
---
