apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-generated-rollout
  namespace: octelium
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-generated-rollout
  namespace: octelium
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-generated-rollout
  namespace: octelium
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-generated-rollout
subjects:
  - kind: ServiceAccount
    name: harbor-generated-rollout
    namespace: octelium
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-generated-rollout
  namespace: octelium
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
    checkov.io/skip1: CKV_K8S_38=The scoped rollout hook needs its bound ServiceAccount token to verify admission and restart generated Deployments.
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: harbor-generated-rollout
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollout
          image: harbor.stinkyboi.com/mirror/docker.io/library/python:ab62bdaec8f090e565b8c76a8cac990229c28a42725f356cc32d9f4dea29806d@sha256:ab62bdaec8f090e565b8c76a8cac990229c28a42725f356cc32d9f4dea29806d
          command: [python3, /app/harbor-generated-rollout.py]
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: harbor-generated-rollout
