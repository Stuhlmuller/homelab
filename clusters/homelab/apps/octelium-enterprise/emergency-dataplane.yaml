---
# Temporary: remove after a native dataplane node is Ready and the four
# package-managed Deployments represented here have Ready replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-octelium-ingress
  namespace: octelium
  annotations:
    checkov.io/skip1: CKV2_K8S_6=Octelium dataplane traffic uses the package-managed Multus network and existing Service authorization model.
  labels:
    app: octelium
    octelium.com/component: ingress-dataplane
    octelium.com/component-type: cluster
    homelab.rst.io/emergency-dataplane: ingress
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: octelium
      octelium.com/component: ingress-dataplane
      octelium.com/component-type: cluster
      homelab.rst.io/emergency-dataplane: ingress
  template:
    metadata:
      labels:
        app: octelium
        octelium.com/component: ingress-dataplane
        octelium.com/component-type: cluster
        homelab.rst.io/emergency-dataplane: ingress
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: acer
      securityContext:
        runAsGroup: 34567
        runAsNonRoot: true
        runAsUser: 34567
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.38.0@sha256:8146b97ee61a42cd216514709e4e3198af75f014974e3d9f310aef9c901fcbdf
          imagePullPolicy: IfNotPresent
          command:
            - envoy
          args:
            - -c
            - /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 11012
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ready
              port: 11012
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: config
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: ingress-dataplane-envoy-config
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-octelium-octovigil
  namespace: octelium
  annotations:
    checkov.io/skip1: CKV_K8S_40=The Octovigil image declares non-root UID 3454; this temporary copy preserves the validated package identity.
    checkov.io/skip2: CKV2_K8S_6=The native octelium-octovigil NetworkPolicy selects this temporary replica.
  labels:
    app: octelium
    octelium.com/component: octovigil
    octelium.com/component-type: cluster
    homelab.rst.io/emergency-dataplane: octovigil
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: octelium
      octelium.com/component: octovigil
      octelium.com/component-type: cluster
      homelab.rst.io/emergency-dataplane: octovigil
  template:
    metadata:
      labels:
        app: octelium
        octelium.com/component: octovigil
        octelium.com/component-type: cluster
        homelab.rst.io/emergency-dataplane: octovigil
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: acer
      securityContext:
        runAsNonRoot: true
        runAsUser: 3454
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: octovigil
          image: ghcr.io/octelium/octelium-octovigil:0.35.0@sha256:907e4c87e6e3923d52bb14143c2a5156afc6f56c7001994034f232396182fb99
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            grpc:
              port: 49090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            grpc:
              port: 49090
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-octelium-octobot-public
  namespace: octelium
  annotations:
    checkov.io/skip1: CKV_K8S_40=The Vigil image declares non-root UID 3454; this temporary copy preserves the validated package identity.
    checkov.io/skip2: CKV2_K8S_6=The temporary Vigil keeps the existing Octelium Service selector and authorization model.
  labels:
    app: octelium
    octelium.com/component: svc
    octelium.com/component-type: cluster
    octelium.com/namespace: default
    octelium.com/svc: octobot.default
    octelium.com/svc-uid: edf7e56a-34bd-475a-9865-e7a36525c7df
    homelab.rst.io/emergency-dataplane: octobot-public
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: octelium
      octelium.com/component: svc
      octelium.com/component-type: cluster
      octelium.com/namespace: default
      octelium.com/svc: octobot.default
      octelium.com/svc-uid: edf7e56a-34bd-475a-9865-e7a36525c7df
      homelab.rst.io/emergency-dataplane: octobot-public
  template:
    metadata:
      labels:
        app: octelium
        octelium.com/component: svc
        octelium.com/component-type: cluster
        octelium.com/namespace: default
        octelium.com/svc: octobot.default
        octelium.com/svc-uid: edf7e56a-34bd-475a-9865-e7a36525c7df
        homelab.rst.io/emergency-dataplane: octobot-public
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: acer
      securityContext:
        runAsNonRoot: true
        runAsUser: 3454
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "1"
      containers:
        - name: vigil
          image: ghcr.io/octelium/octelium-vigil:0.35.0@sha256:a8d60479c8d7c0e1deb63c9ef33bb3bb0701b2cf589bc709a2bdef6e5a3f2390
          imagePullPolicy: IfNotPresent
          env:
            - name: OCTELIUM_SVC_UID
              value: edf7e56a-34bd-475a-9865-e7a36525c7df
            - name: OCTELIUM_SVC_NAME
              value: octobot.default
            - name: OCTELIUM_REGION_NAME
              value: default
            - name: OCTELIUM_REGION_UID
              value: caa83d24-d1e2-4b97-a409-bb6446e48b76
            - name: OCTELIUM_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OCTELIUM_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            grpc:
              port: 49094
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            grpc:
              port: 49094
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
