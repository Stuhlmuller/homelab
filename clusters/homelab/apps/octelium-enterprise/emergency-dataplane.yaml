---
# Temporary: remove after a native dataplane node is Ready and the eight
# package-managed Deployments represented here have Ready replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-octelium-ingress
  namespace: octelium
  annotations:
    checkov.io/skip1: CKV2_K8S_6=Octelium dataplane traffic uses the package-managed Multus network and existing Service authorization model.
  labels:
    app: octelium
    octelium.com/component: ingress-dataplane
    octelium.com/component-type: cluster
    homelab.rst.io/emergency-dataplane: ingress
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: octelium
      octelium.com/component: ingress-dataplane
      octelium.com/component-type: cluster
      homelab.rst.io/emergency-dataplane: ingress
  template:
    metadata:
      labels:
        app: octelium
        octelium.com/component: ingress-dataplane
        octelium.com/component-type: cluster
        homelab.rst.io/emergency-dataplane: ingress
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: acer
      securityContext:
        runAsGroup: 34567
        runAsNonRoot: true
        runAsUser: 34567
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.38.0@sha256:8146b97ee61a42cd216514709e4e3198af75f014974e3d9f310aef9c901fcbdf
          imagePullPolicy: IfNotPresent
          command:
            - envoy
          args:
            - -c
            - /etc/envoy/envoy.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 11012
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ready
              port: 11012
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: config
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: ingress-dataplane-envoy-config
      terminationGracePeriodSeconds: 30
---
