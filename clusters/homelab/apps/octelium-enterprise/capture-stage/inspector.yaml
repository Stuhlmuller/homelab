apiVersion: v1
kind: Pod
metadata:
  name: octelium-rscstore-capture-inspector
  namespace: octelium
  labels:
    app.kubernetes.io/name: octelium-rscstore-capture-inspector
    app.kubernetes.io/part-of: octelium-enterprise
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  nodeSelector:
    octelium.com/node-mode-controlplane: ""
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: inspection
      image: harbor.stinkyboi.com/mirror/docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec", "exec sleep infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: octelium-rscstore
        readOnly: true
