config: |
  organization:
    name: Homelab
    description: Services and operator links discovered from the cluster.
    logo: lucide:compass

  ui:
    default_group_by: tags

  debug:
    enabled: false

  header_links:
    - label: Grafana
      url: https://grafana.stinkyboi.com
      icon: selfhst:grafana
    - label: Argo CD
      url: https://argocd.stinkyboi.com
      icon: selfhst:argo-cd
    - label: Kiali
      url: https://kiali.stinkyboi.com
      icon: selfhst:kiali

  services:
    filters:
      dedupe_www: true
      exclude_wildcard_hosts: true
    sources:
      - type: kubernetes
        name: homelab
        tags: [kubernetes]
        kubernetes:
          namespaces: []
          auto_discover_all: true

image:
  repository: harbor.stinkyboi.com/mirror/docker.io/adinhodovic/compass
  tag: "0.13.0@sha256:f1f4a6bc529eb8a424b6125c39e839d108b06e975cf314181f8398bbc55fd498"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceMonitor:
  enabled: true
  scrapeInterval: 30s
