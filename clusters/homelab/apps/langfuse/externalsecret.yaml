apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: langfuse-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        salt: "{{ .salt }}"
        encryption-key: "{{ .encryption_key }}"
        nextauth-secret: "{{ .nextauth_secret }}"
        postgres-password: "{{ .postgres_password }}"
        redis-password: "{{ .redis_password }}"
        valkey.conf: |
          appendonly yes
          dir /data
          requirepass "{{ .redis_password }}"
          maxmemory-policy noeviction
        clickhouse-password: "{{ .clickhouse_password }}"
        s3-access-key-id: "{{ .s3_access_key_id }}"
        s3-secret-access-key: "{{ .s3_secret_access_key }}"
        project-public-key: "{{ .project_public_key }}"
        project-secret-key: "{{ .project_secret_key }}"
        init-user-password: "{{ .init_user_password }}"
  data:
    - secretKey: salt
      remoteRef:
        key: /homelab/langfuse/salt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: encryption_key
      remoteRef:
        key: /homelab/langfuse/encryption-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: nextauth_secret
      remoteRef:
        key: /homelab/langfuse/nextauth-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgres_password
      remoteRef:
        key: /homelab/langfuse/postgres-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: redis_password
      remoteRef:
        key: /homelab/langfuse/redis-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: clickhouse_password
      remoteRef:
        key: /homelab/langfuse/clickhouse-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: s3_access_key_id
      remoteRef:
        # checkov:skip=CKV_SECRET_6: Public SSM parameter path, not a credential.
        key: /homelab/langfuse/s3-access-key-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: s3_secret_access_key
      remoteRef:
        # checkov:skip=CKV_SECRET_6: Public SSM parameter path, not a credential.
        key: /homelab/langfuse/s3-secret-access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: project_public_key
      remoteRef:
        key: /homelab/langfuse/project-public-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: project_secret_key
      remoteRef:
        key: /homelab/langfuse/project-secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: init_user_password
      remoteRef:
        key: /homelab/langfuse/init-user-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
