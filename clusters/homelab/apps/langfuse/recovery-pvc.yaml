apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-migration-recovery
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-default
  resources:
    requests:
      storage: 1Gi
