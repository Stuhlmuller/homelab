apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-migration-recovery
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-default
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-empty-schema-recovery-20261001
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    checkov.io/skip1: CKV_K8S_40=QNAP all-squash maps NFS ownership to UID 65534.
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: langfuse
    app.kubernetes.io/component: migration-recovery
spec:
  # No automatic deadline may interrupt DDL after the migrator marks it dirty.
  # Inspect a stalled job read-only before approving any cancellation.
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse
        app.kubernetes.io/instance: langfuse
        app.kubernetes.io/component: migration-recovery
    spec:
      serviceAccountName: langfuse
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recover
          image: docker.io/langfuse/langfuse:4.35.0@sha256:a5d8d2457702ab7e051bc0788d73871970caebd10aae6635e87cfb736e4067cd
          imagePullPolicy: IfNotPresent
          # Replace the image entrypoint: it would migrate before the backup.
          command: ["node", "/recovery-code/recover-empty-schema.mjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: code
              mountPath: /recovery-code
              readOnly: true
            - name: credentials
              mountPath: /run/secrets/langfuse
              readOnly: true
            - name: recovery
              mountPath: /recovery
      volumes:
        - name: code
          configMap:
            name: langfuse-empty-schema-recovery
            defaultMode: 0444
        - name: credentials
          secret:
            secretName: langfuse-secrets
            defaultMode: 0440
            items:
              - key: clickhouse-password
                path: clickhouse-password
        - name: recovery
          persistentVolumeClaim:
            claimName: langfuse-migration-recovery
