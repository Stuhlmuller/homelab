apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: langfuse-ingress
  namespace: langfuse
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 8123}
        - {protocol: TCP, port: 9000}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - {protocol: TCP, port: 3000}
    # Ambient traffic arrives as HBONE; AuthorizationPolicy enforces identity/port.
    - ports:
        - {protocol: TCP, port: 15008}
