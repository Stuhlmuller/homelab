apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cordium-user-namespace-sysctl
  namespace: cordium
  annotations:
    checkov.io/skip1: CKV_K8S_16=The init container needs host privilege to set the Talos user-namespace sysctl.
    checkov.io/skip2: CKV_K8S_20=Host sysctl writes require privilege escalation during the one-shot init.
    checkov.io/skip3: CKV_K8S_28=Privileged init receives all capabilities; the steady-state container drops all.
    checkov.io/skip4: CKV_K8S_37=Privileged init receives all capabilities; the steady-state container drops all.
    checkov.io/skip5: CKV_K8S_11=The idle probe container keeps a request but no CPU quota to avoid false throttling alerts.
  labels:
    app.kubernetes.io/name: cordium-user-namespace-sysctl
    app.kubernetes.io/part-of: cordium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cordium-user-namespace-sysctl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cordium-user-namespace-sysctl
        app.kubernetes.io/part-of: cordium
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostUsers: true
      nodeSelector:
        kubernetes.io/hostname: zimaboard-1
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: enable-user-namespaces
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - printf '%s\n' 28633 > /host-sysctl/user.max_user_namespaces
          volumeMounts:
            - name: user-namespace-sysctl
              mountPath: /host-sysctl/user.max_user_namespaces
          securityContext:
            appArmorProfile:
              type: Unconfined
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
      containers:
        - name: status
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - exec sleep 2147483647
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(cat /host-sysctl/user.max_user_namespaces)" -ge 28633
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -r /host-sysctl/user.max_user_namespaces
            periodSeconds: 30
          volumeMounts:
            - name: user-namespace-sysctl
              mountPath: /host-sysctl/user.max_user_namespaces
              readOnly: true
          securityContext:
            appArmorProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
      terminationGracePeriodSeconds: 5
      volumes:
        - name: user-namespace-sysctl
          hostPath:
            path: /proc/sys/user/max_user_namespaces
            type: File
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cordium-user-namespace-sysctl
  namespace: cordium
  labels:
    app.kubernetes.io/name: cordium-user-namespace-sysctl
    app.kubernetes.io/part-of: cordium
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cordium-user-namespace-sysctl
  policyTypes:
    - Ingress
    - Egress
