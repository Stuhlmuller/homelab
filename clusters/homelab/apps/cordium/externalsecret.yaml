apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cordium-agent-auth
  namespace: octelium
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: cordium-agent-auth-v1
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # checkov:skip=CKV_SECRET_6: ExternalSecret target key name, not a secret value.
    - secretKey: auth-token
      remoteRef:
        # checkov:skip=CKV_SECRET_6: SSM parameter path, not a secret value.
        key: /homelab/cordium/agent-auth-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
