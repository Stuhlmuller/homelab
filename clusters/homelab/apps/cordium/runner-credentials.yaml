apiVersion: v1
kind: Namespace
metadata:
  name: cordium-runners
  labels:
    app.kubernetes.io/name: cordium-runners
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cordium-runner-credentials
  namespace: cordium-runners
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: cordium-runner-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # checkov:skip=CKV_SECRET_6: Secret key name and SSM reference only; no credential material.
    - secretKey: github-app-private-key
      remoteRef:
        key: /homelab/cordium-runners/github-app-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Secret key name and SSM reference only; no credential material.
    - secretKey: auth-token
      remoteRef:
        key: /homelab/cordium-runners/auth-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
