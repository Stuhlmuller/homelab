apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cordium-nocturne-pull
  namespace: octelium
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: cordium-nocturne-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"harbor.stinkyboi.com":{"username":"robot$homelab+pull","password":{{ .password | toJson }},"auth":"{{ printf "robot$homelab+pull:%s" .password | b64enc }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/cordium/nocturne-harbor-pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
