apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - genesis.yaml
  - cluster-config-job.yaml
  - user-namespace-sysctl.yaml
  - networkpolicy.yaml
