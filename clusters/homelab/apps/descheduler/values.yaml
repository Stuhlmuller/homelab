kind: Deployment
image:
  repository: harbor.stinkyboi.com/mirror/registry.k8s.io/descheduler/descheduler
  tag: v0.33.0@sha256:de38c88dcb1e7d822c4bd320551cc55e541c160c6ba380d99772949b0c967ab0
deschedulerPolicy:
  maxNoOfPodsToEvictTotal: 1
  profiles:
    - name: conservative
      pluginConfig:
        - name: DefaultEvictor
          args:
            evictSystemCriticalPods: false
            ignorePvcPods: true
            minReplicas: 2
            nodeFit: true
        - name: RemovePodsViolatingInterPodAntiAffinity
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 20
              memory: 20
              pods: 20
            targetThresholds:
              cpu: 50
              memory: 50
              pods: 50
      plugins:
        balance:
          enabled:
            - LowNodeUtilization
        deschedule:
          enabled:
            - RemovePodsViolatingInterPodAntiAffinity
deschedulingInterval: 30m
