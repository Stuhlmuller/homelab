serviceAccount:
  dispatcharr: {}
configMaps:
  media-route:
    includeInChecksum: true
    includeChecksumInControllers:
      - dispatcharr
    data:
      dispatcharr-media.conf: |
        # Raw, exact query allowlists also reject encoded or duplicate parameters.
        map $args $dispatcharr_media_export_query_allowed {
            default 0;
            "" 1;
            ~^cachedlogos=false$ 1;
        }
        map $args $dispatcharr_media_stream_query_allowed {
            default 0;
            "" 1;
            ~^output_profile=[0-9]+$ 1;
        }
        server {
            listen 9192;
            server_name _;

            # NodePort externalTrafficPolicy: Local preserves the NAS TCP source.
            # Do not enable real_ip header trust on this listener.
            allow 10.1.0.2;
            deny all;

            if ($request_method !~ ^(GET|HEAD)$) { return 405; }

            # Keep exports on the stable LAN endpoint, ignoring client headers.
            proxy_set_header Host 10.1.0.199:31991;
            proxy_set_header X-Forwarded-Host 10.1.0.199:31991;
            proxy_set_header X-Forwarded-Port 31991;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Reuse the image's existing uWSGI, streaming and logo-cache routes.
            location ~ ^/output/(m3u|epg)(/Sports)?/?$ {
                if ($dispatcharr_media_export_query_allowed = 0) { return 400; }
                proxy_pass http://127.0.0.1:9191;
            }
            location ~ ^/hdhr/(Sports/)?(discover|lineup|lineup_status)\.json$ {
                if ($args != "") { return 400; }
                proxy_pass http://127.0.0.1:9191;
            }
            location ~ "^/proxy/ts/stream/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" {
                if ($dispatcharr_media_stream_query_allowed = 0) { return 400; }
                proxy_pass http://127.0.0.1:9191;
            }
            location ~ ^/api/channels/logos/[0-9]+/cache/?$ {
                if ($args != "") { return 400; }
                proxy_pass http://127.0.0.1:9191;
            }
            location / { return 404; }
        }
controllers:
  dispatcharr:
    replicas: 1
    serviceAccount:
      identifier: dispatcharr
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: acer
      annotations:
        homelab.rst.io/access-mode: "octelium"
    containers:
      app:
        image:
          repository: ghcr.io/dispatcharr/dispatcharr
          tag: latest@sha256:b7d695c5cc98b9abd64c74a94539c1ebffc23d965021613c820c67e25dea41a3
        command:
          - /bin/bash
          - -c
          - |
            usermod -s /bin/bash nobody
            exec /app/docker/entrypoint.sh
        envFrom:
          - secretRef:
              name: dispatcharr-postgres-env
        env:
          TZ: America/Los_Angeles
          PUID: "65534"
          PGID: "65534"
          DISPATCHARR_ENV: modular
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          CELERY_BROKER_URL: redis://localhost:6379/0
          DISPATCHARR_LOG_LEVEL: info
          DISPATCHARR_ENABLE_IP_LOOKUP: "false"
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 9191
              failureThreshold: 12
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 9191
              failureThreshold: 6
              periodSeconds: 30
              timeoutSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 4Gi
      celery:
        image:
          repository: ghcr.io/dispatcharr/dispatcharr
          tag: latest@sha256:b7d695c5cc98b9abd64c74a94539c1ebffc23d965021613c820c67e25dea41a3
        command:
          - /app/docker/entrypoint.celery.sh
        envFrom:
          - secretRef:
              name: dispatcharr-postgres-env
        env:
          TZ: America/Los_Angeles
          DISPATCHARR_ENV: modular
          DISPATCHARR_PORT: "9191"
          DISPATCHARR_WEB_HOST: localhost
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          CELERY_BROKER_URL: redis://localhost:6379/0
          DISPATCHARR_LOG_LEVEL: info
          DISPATCHARR_ENABLE_IP_LOOKUP: "false"
          DJANGO_SETTINGS_MODULE: dispatcharr.settings
          PYTHONUNBUFFERED: "1"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      redis:
        image:
          repository: redis
          tag: 8.10.1-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
              failureThreshold: 6
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 6379
              failureThreshold: 3
              periodSeconds: 30
              timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
service:
  app:
    # Preserve the existing dispatcharr:9191 Service when adding a second one.
    forceRename: dispatcharr
    controller: dispatcharr
    ports:
      http:
        port: 9191
  media:
    controller: dispatcharr
    type: NodePort
    externalTrafficPolicy: Local
    ports:
      http:
        port: 9192
        targetPort: 9192
        nodePort: 31991
persistence:
  media-route:
    type: configMap
    identifier: media-route
    advancedMounts:
      dispatcharr:
        app:
          - path: /etc/nginx/conf.d/dispatcharr-media.conf
            subPath: dispatcharr-media.conf
            readOnly: true
  data:
    enabled: true
    storageClass: nfs-default
    size: 20Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      dispatcharr:
        app:
          - path: /data
        celery:
          - path: /data
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 512Mi
    advancedMounts:
      dispatcharr:
        app:
          - path: /dev/shm
        celery:
          - path: /dev/shm
