---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatcharr-paired-capture
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dispatcharr-paired-capture
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dispatcharr-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
