---
apiVersion: batch/v1
kind: Job
metadata:
  name: dispatcharr-paired-capture
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Inclusion alone must not start an unverified capture.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatcharr-paired-capture
        app.kubernetes.io/part-of: dispatcharr
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: acer
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capture
          image: harbor.stinkyboi.com/mirror/docker.io/library/postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
          imagePullPolicy: Always
          command:
            - /bin/sh
            - /capture/capture.sh
          env:
            - name: FENCE_REF
              value: REPLACE_WITH_SIGNED_FENCE_COMMIT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: capture
              mountPath: /capture
              readOnly: true
            - name: auth
              mountPath: /run/secrets/dispatcharr-postgres
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: capture
          configMap:
            name: dispatcharr-paired-capture
            defaultMode: 0444
        - name: auth
          secret:
            secretName: dispatcharr-postgres-env
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr
            readOnly: true
        - name: backup
          persistentVolumeClaim:
            claimName: dispatcharr-paired-backup
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
