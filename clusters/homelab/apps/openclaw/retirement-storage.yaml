apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-retirement-archive
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: openclaw-retirement
    app.kubernetes.io/part-of: homelab-ai
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-default
  resources:
    requests:
      storage: 75Gi
