serviceAccount:
  openclaw: {}
controllers:
  openclaw:
    serviceAccount:
      identifier: openclaw
    replicas: 1
    revisionHistoryLimit: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: zimaboard-1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - acer
                  - key: octelium.com/node-mode-dataplane
                    operator: DoesNotExist
      annotations:
        homelab.rst.io/openclaw-assistant-sha256: "559e5c277d71ca514f3dfacb80093ea3d92f4ce01ceea4b0c195869bf015e042"
        homelab.rst.io/openclaw-discord-bot-token-ssm-version: "2"
        homelab.rst.io/openclaw-grafana-login-ssm-version: "1"
        homelab.rst.io/openclaw-grafana-alert-hook-ssm-version: "2"
        homelab.rst.io/openclaw-github-app-credentials-ssm-version: "1"
    initContainers:
      00-operator-toolbox:
        image:
          repository: docker.io/nixos/nix
          tag: "2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c"
        env:
          NIXPKGS_REF: github:NixOS/nixpkgs/29916453413845e54a65b8a1cf996842300cd299
        command:
          - /bin/sh
          - -ec
          - |
            export NIX_CONFIG="experimental-features = nix-command flakes"
            nix profile install --profile /toolbox/profile \
              "$NIXPKGS_REF#actionlint" \
              "$NIXPKGS_REF#argocd" \
              "$NIXPKGS_REF#awscli2" \
              "$NIXPKGS_REF#bash" \
              "$NIXPKGS_REF#cloudflared" \
              "$NIXPKGS_REF#conftest" \
              "$NIXPKGS_REF#coreutils" \
              "$NIXPKGS_REF#curl" \
              "$NIXPKGS_REF#findutils" \
              "$NIXPKGS_REF#gh" \
              "$NIXPKGS_REF#git" \
              "$NIXPKGS_REF#gitleaks" \
              "$NIXPKGS_REF#gnugrep" \
              "$NIXPKGS_REF#gnused" \
              "$NIXPKGS_REF#gnutar" \
              "$NIXPKGS_REF#gogcli" \
              "$NIXPKGS_REF#gzip" \
              "$NIXPKGS_REF#jq" \
              "$NIXPKGS_REF#k9s" \
              "$NIXPKGS_REF#kubernetes-helm" \
              "$NIXPKGS_REF#kubectl" \
              "$NIXPKGS_REF#kustomize" \
              "$NIXPKGS_REF#nix" \
              "$NIXPKGS_REF#opentofu" \
              "$NIXPKGS_REF#openssh" \
              "$NIXPKGS_REF#pre-commit" \
              "$NIXPKGS_REF#ripgrep" \
              "$NIXPKGS_REF#shellcheck" \
              "$NIXPKGS_REF#shfmt" \
              "$NIXPKGS_REF#sops" \
              "$NIXPKGS_REF#talosctl" \
              "$NIXPKGS_REF#terragrunt" \
              "$NIXPKGS_REF#unzip" \
              "$NIXPKGS_REF#yamllint" \
              "$NIXPKGS_REF#yq-go"
            mkdir -p /nix-shared/store /nix-shared/var/nix
            cp -a /nix/store/. /nix-shared/store/
            cp -a /nix/var/nix/db /nix-shared/var/nix/db
            chown -R 1000:1000 /nix-shared
            # The NAS maps file ownership to 65534; coordinator locks need local UID ownership.
            chown 1000:1000 /openclaw-coordinator
            chmod 700 /openclaw-coordinator
            /toolbox/profile/bin/jq --version
            /toolbox/profile/bin/rg --version
            /toolbox/profile/bin/gh --version
            /toolbox/profile/bin/kubectl version --client=true
            /toolbox/profile/bin/argocd version --client --short
            /toolbox/profile/bin/talosctl version --client
            /toolbox/profile/bin/terragrunt --version
            /toolbox/profile/bin/tofu version
            /toolbox/profile/bin/pre-commit --version
            # Initialize only the hostPath root; runtime verification runs as UID 1000.
            chown 1000:1000 /openclaw-runtime-volume
            chmod 700 /openclaw-runtime-volume
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 3Gi
      01-runtime-storage:
        dependsOn: 00-operator-toolbox
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: [ALL]
        command: [python3, /etc/openclaw-assistant/runtime-storage.py, verify]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      bootstrap-config:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        dependsOn: 01-runtime-storage
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1200m
            memory: 2Gi
        env:
          OPENCLAW_HOME: /data/openclaw
          OPENCLAW_CONFIG_PATH: /data/openclaw/config/openclaw.json
          OPENCLAW_STATE_DIR: /data/openclaw
          OPENCLAW_WORKSPACE_DIR: /data/openclaw/workspace
          OPENCLAW_SUPERVISOR_MODE: external
          OPENCLAW_SERVICE_REPAIR_POLICY: external
          OPENCLAW_NO_AUTO_UPDATE: "1"
          GIT_CONFIG_GLOBAL: /data/openclaw/gitconfig
          NIX_CONFIG: experimental-features = nix-command flakes
          PATH: /toolbox/profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: APP_SECRET
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          GRAFANA_ALERT_HOOK_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_ALERT_HOOK_TOKEN
          LITELLM_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: LITELLM_TOKEN
        command:
          - /bin/sh
          - -ec
          - |
            : "${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN must be provided by openclaw-secrets APP_SECRET}"
            # Verify the exact mounted files before any CLI can create fresh state.
            python3 /etc/openclaw-assistant/runtime-storage.py verify-mounts
            had_existing_state=false
            if [ -d "$OPENCLAW_STATE_DIR" ] &&
              [ -n "$(find "$OPENCLAW_STATE_DIR" -mindepth 1 -maxdepth 1 \
                ! -name npm ! -name extensions -print -quit)" ]; then
              had_existing_state=true
            fi
            backup_root=/data/openclaw-backups
            backup_name=pre-2026.9.5
            backup_marker="$OPENCLAW_STATE_DIR/.backup-verified-for-2026.9.5"
            backup_dir="$backup_root/$backup_name"
            backup_staging="$backup_root/.$backup_name.partial"
            backup_archive=openclaw.tar.gz
            backup_checksum="$backup_archive.sha256"
            verify_backup_dir() {
              [ -d "$1" ] &&
                [ -s "$1/$backup_archive" ] &&
                [ -s "$1/$backup_checksum" ] &&
                tar -tzf "$1/$backup_archive" >/dev/null &&
                (cd "$1" && sha256sum -c "$backup_checksum")
            }
            if "$had_existing_state" && [ ! -s "$backup_marker" ]; then
              echo "Creating or verifying offline pre-2026.9.5 OpenClaw backup"
              (
                umask 077
                mkdir -p "$backup_root"
                # A Pod replacement may interrupt tar before its checksum is written.
                # Preserve the unpublished archive, then rebuild from the stopped state.
                if [ ! -e "$backup_dir" ] && [ -d "$backup_staging" ] &&
                  [ ! -L "$backup_staging" ] && ! verify_backup_dir "$backup_staging"; then
                  interrupted="$backup_root/$backup_name.interrupted-$(date -u +%Y%m%dT%H%M%SZ)"
                  if [ -e "$interrupted" ]; then
                    echo "Interrupted backup preservation target already exists" >&2
                    exit 1
                  fi
                  mv "$backup_staging" "$interrupted"
                  echo "Preserved interrupted OpenClaw backup; rebuilding offline archive"
                fi
                if [ -e "$backup_dir" ]; then
                  if [ -e "$backup_staging" ]; then
                    echo "OpenClaw backup staging still exists; preserve both paths for review" >&2
                    exit 1
                  fi
                  if ! verify_backup_dir "$backup_dir"; then
                    echo "OpenClaw backup is incomplete or corrupt: $backup_dir" >&2
                    exit 1
                  fi
                elif [ -e "$backup_staging" ]; then
                  if ! verify_backup_dir "$backup_staging"; then
                    echo "OpenClaw backup staging is incomplete; preserve it for review" >&2
                    exit 1
                  fi
                  mv "$backup_staging" "$backup_dir"
                else
                  state_kib="$(du -skx "$OPENCLAW_STATE_DIR" "$OPENCLAW_STATE_DIR/state" "$OPENCLAW_STATE_DIR/agents/main/agent" | awk '{sum += $1} END {print sum}')"
                  available_kib="$(df -Pk /data | awk 'NR == 2 {print $4}')"
                  required_kib=$((state_kib * 2 + 2097152))
                  if [ "$available_kib" -lt "$required_kib" ]; then
                    echo "OpenClaw backup needs ${required_kib}KiB free; only ${available_kib}KiB available" >&2
                    exit 1
                  fi
                  mkdir "$backup_staging"
                  tar --one-file-system \
                    --exclude=openclaw/npm \
                    --exclude=openclaw/extensions \
                    -C /data \
                    -czf "$backup_staging/$backup_archive" openclaw openclaw/state openclaw/agents/main/agent
                  tar -tzf "$backup_staging/$backup_archive" >/dev/null
                  (
                    cd "$backup_staging" || exit 1
                    sha256sum "$backup_archive" > "$backup_checksum"
                    sha256sum -c "$backup_checksum"
                  )
                  mv "$backup_staging" "$backup_dir"
                fi
                verify_backup_dir "$backup_dir"
                printf 'verified pre-2026.9.5 archive\n' > "$backup_marker"
              )
            fi
            mkdir -p "$OPENCLAW_STATE_DIR" "$OPENCLAW_WORKSPACE_DIR"
            mkdir -p "$OPENCLAW_WORKSPACE_DIR/.openclaw/trash" "$OPENCLAW_STATE_DIR/src"
            mkdir -p "$(dirname "$OPENCLAW_CONFIG_PATH")"
            : "${LITELLM_TOKEN:?LITELLM_TOKEN must be provided by openclaw-secrets}"
            umask 077
            printf '%s\n' "$LITELLM_TOKEN" > /data/openclaw/tmp/openclaw-1000/litellm-token.tmp
            chmod 600 /data/openclaw/tmp/openclaw-1000/litellm-token.tmp
            mv /data/openclaw/tmp/openclaw-1000/litellm-token.tmp /data/openclaw/tmp/openclaw-1000/litellm-token
            if ! command -v ssh-keygen >/dev/null 2>&1 && [ ! -x "$OPENCLAW_STATE_DIR/tools/usr/bin/ssh-keygen" ]; then
              mkdir -p "$OPENCLAW_STATE_DIR/apt/state/lists/partial" \
                "$OPENCLAW_STATE_DIR/apt/cache/archives/partial" \
                "$OPENCLAW_STATE_DIR/pkg-cache" \
                "$OPENCLAW_STATE_DIR/tools"
              apt-get \
                -o Dir::State="$OPENCLAW_STATE_DIR/apt/state" \
                -o Dir::Cache="$OPENCLAW_STATE_DIR/apt/cache" \
                -o Debug::NoLocking=1 \
                update
              (
                cd "$OPENCLAW_STATE_DIR/pkg-cache" || exit 1
                apt-get \
                  -o Dir::State="$OPENCLAW_STATE_DIR/apt/state" \
                  -o Dir::Cache="$OPENCLAW_STATE_DIR/apt/cache" \
                  -o Debug::NoLocking=1 \
                  download openssh-client
                dpkg-deb -x "$(ls -t openssh-client_*.deb | head -n1)" "$OPENCLAW_STATE_DIR/tools"
              )
            fi
            SSH_KEYGEN="$(command -v ssh-keygen || printf '%s\n' "$OPENCLAW_STATE_DIR/tools/usr/bin/ssh-keygen")"
            SIGNING_KEY="$OPENCLAW_STATE_DIR/signing/claw_ed25519"
            mkdir -p "$OPENCLAW_STATE_DIR/signing" "$OPENCLAW_STATE_DIR/git"
            chmod 700 "$OPENCLAW_STATE_DIR/signing"
            if [ ! -s "$SIGNING_KEY" ]; then
              "$SSH_KEYGEN" -q -t ed25519 -N '' -C 'Claw homelab commit signing' -f "$SIGNING_KEY"
            fi
            chmod 600 "$SIGNING_KEY"
            chmod 644 "$SIGNING_KEY.pub"
            printf 'claw %s\n' "$(cat "$SIGNING_KEY.pub")" > "$OPENCLAW_STATE_DIR/git/allowed_signers"
            touch "$GIT_CONFIG_GLOBAL"
            git config --global --replace-all safe.directory "$OPENCLAW_WORKSPACE_DIR"
            git config --global --add safe.directory "$OPENCLAW_STATE_DIR/src/*"
            git config --global user.name 'Claw'
            git config --global user.email 'claw@openclaw.local'
            git config --global gpg.format ssh
            git config --global user.signingkey "$SIGNING_KEY.pub"
            git config --global gpg.ssh.program "$SSH_KEYGEN"
            git config --global gpg.ssh.allowedSignersFile "$OPENCLAW_STATE_DIR/git/allowed_signers"
            git config --global commit.gpgsign true
            git config --global log.showSignature true
            git config --global --replace-all credential.https://github.com.helper ''
            git config --global --add credential.https://github.com.helper '!/etc/openclaw-assistant/gh auth git-credential'
            if [ ! -s "$OPENCLAW_CONFIG_PATH" ]; then
              printf '{}\n' > "$OPENCLAW_CONFIG_PATH"
            fi

            openclaw_version="$(openclaw --version | awk 'NR == 1 { if ($1 == "OpenClaw") print $2; else print $1 }')"
            : "${openclaw_version:?failed to parse OpenClaw version for Discord plugin install}"
            verify_discord_plugin() {
              openclaw plugins inspect discord --runtime --json |
                python3 -c '
            import json
            import pathlib
            import sys

            expected_version, expected_status = sys.argv[1:]
            report = json.load(sys.stdin)
            plugin = report["plugin"]
            install = report.get("install") or {}
            root = pathlib.Path(plugin["rootDir"])
            package = json.loads((root / "package.json").read_text())
            valid = (
                plugin.get("id") == "discord"
                and plugin.get("origin") == "global"
                and install.get("source") == "npm"
                and install.get("spec") == f"@openclaw/discord@{expected_version}"
                and install.get("version") == expected_version
                and package.get("name") == "@openclaw/discord"
                and package.get("version") == expected_version
                and (expected_status != "loaded" or plugin.get("status") == "loaded")
            )
            valid or sys.exit("Discord external runtime verification failed")
            ' "$openclaw_version" "$1"
            }
            if ! verify_discord_plugin installed; then
              installed=false
              for delay in 0 5 15 30; do
                [ "$delay" -eq 0 ] || sleep "$delay"
                echo "Installing Discord channel plugin (retry delay ${delay}s)"
                if openclaw plugins install \
                  "npm:@openclaw/discord@${openclaw_version}" \
                  --pin --force --accept-capabilities; then
                  installed=true
                  break
                fi
              done
              "$installed" || {
                echo "Exact Discord plugin install failed after bounded retries" >&2
                exit 1
              }
            fi
            verify_discord_plugin installed
            openclaw config validate

            # Config CLI batches preserve unrelated keys in one validated write per phase.
            config_batch_dir="$(mktemp -d /tmp/openclaw-config-batch.XXXXXX)"
            trap 'rm -rf "$config_batch_dir"' 0
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM
            config_batch() {
              python3 -c '
            import json, os, sys
            data = sys.stdin.buffer.read(1048577)
            if len(data) > 1048576:
                raise SystemExit("Config batch exceeds 1 MiB")
            entries = json.loads(data)
            if not isinstance(entries, list):
                raise SystemExit("Config batch must be a list")
            fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
            with os.fdopen(fd, "wb") as output:
                output.write(data)
            ' "$config_batch_dir/assignments.json"
              openclaw config set --batch-file "$config_batch_dir/assignments.json"
              rm "$config_batch_dir/assignments.json"
            }
            config_batch <<'OPENCLAW_GATEWAY_BATCH'
            [
              {"path":"gateway.mode","value":"local"},
              {"path":"gateway.auth.mode","value":"token"},
              {"path":"gateway.auth.token","ref":{"source":"env","provider":"default","id":"OPENCLAW_GATEWAY_TOKEN"}},
              {"path":"gateway.controlUi.allowedOrigins","value":["https://openclaw.stinkyboi.com","http://openclaw.homelab","https://openclaw.homelab"]}
            ]
            OPENCLAW_GATEWAY_BATCH

            if [ -z "${GRAFANA_ALERT_HOOK_TOKEN:-}" ] || [ "$GRAFANA_ALERT_HOOK_TOKEN" = "REPLACE_ME" ]; then
              echo "GRAFANA_ALERT_HOOK_TOKEN is not populated; skipping hooks bootstrap"
            else
              config_batch <<'OPENCLAW_HOOK_ENABLE_BATCH'
            [
              {"path":"hooks.enabled","value":true},
              {"path":"hooks.path","value":"/hooks"}
            ]
            OPENCLAW_HOOK_ENABLE_BATCH
              HOOK_TOKEN_JSON="$(python3 -c 'import json, os; print(json.dumps(os.environ["GRAFANA_ALERT_HOOK_TOKEN"]))')"
              config_batch <<OPENCLAW_HOOK_BATCH
            [
              {"path":"hooks.token","value":$HOOK_TOKEN_JSON},
              {"path":"hooks.defaultSessionKey","value":"agent:main:hooks:grafana-alerts"},
              {"path":"hooks.allowedAgentIds","value":["main"]},
              {"path":"hooks.allowRequestSessionKey","value":false}
            ]
            OPENCLAW_HOOK_BATCH
              unset HOOK_TOKEN_JSON
            fi

            config_batch <<'OPENCLAW_PLUGIN_BATCH'
            [
              {"path":"plugins.entries.memory-wiki.enabled","value":true},
              {"path":"plugins.entries.openrouter.enabled","value":true}
            ]
            OPENCLAW_PLUGIN_BATCH

            python3 /etc/openclaw-assistant/bootstrap.py
            openclaw config validate

            config_batch <<'OPENCLAW_SANDBOX_BATCH'
            [
              {"path":"agents.defaults.sandbox.mode","value":"off"},
              {"path":"tools.fs.workspaceOnly","value":true}
            ]
            OPENCLAW_SANDBOX_BATCH

            if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ "$DISCORD_BOT_TOKEN" = "REPLACE_ME" ]; then
              echo "DISCORD_BOT_TOKEN is not populated; skipping Discord channel config"
            else
              echo "DISCORD_BOT_TOKEN is populated; configuring the Discord channel"
              openclaw plugins enable discord --accept-capabilities
              verify_discord_plugin loaded
              config_batch <<'OPENCLAW_DISCORD_BATCH'
            [
              {"path":"channels.discord.enabled","value":true},
              {"path":"channels.discord.token","ref":{"source":"env","provider":"default","id":"DISCORD_BOT_TOKEN"}}
            ]
            OPENCLAW_DISCORD_BATCH
            fi

    containers:
      app:
        lifecycle:
          postStart:
            exec:
              command:
                - python3
                - /etc/openclaw-assistant/reconcile.py
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218"
        env:
          OPENCLAW_HOME: /data/openclaw
          OPENCLAW_CONFIG_PATH: /data/openclaw/config/openclaw.json
          OPENCLAW_STATE_DIR: /data/openclaw
          OPENCLAW_WORKSPACE_DIR: /data/openclaw/workspace
          OPENCLAW_SUPERVISOR_MODE: external
          OPENCLAW_NO_AUTO_UPDATE: "1"
          GIT_CONFIG_GLOBAL: /data/openclaw/gitconfig
          NIX_CONFIG: experimental-features = nix-command flakes
          PATH: /etc/openclaw-assistant:/toolbox/profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: APP_SECRET
          GITHUB_APP_PRIVATE_KEY_PATH: /var/run/secrets/openclaw/github-app/private-key.pem
          LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000
          LITELLM_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: LITELLM_TOKEN
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          GRAFANA_USERNAME:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_USERNAME
          GRAFANA_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_PASSWORD
          GITHUB_APP_ID:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GITHUB_APP_ID
          GITHUB_APP_INSTALLATION_ID:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GITHUB_APP_INSTALLATION_ID
        resources:
          requests:
            cpu: 1
            memory: 2Gi
            ephemeral-storage: 8Gi
          limits:
            cpu: 1500m
            memory: 4Gi
            ephemeral-storage: 10Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 72
              periodSeconds: 5
              timeoutSeconds: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 2
              periodSeconds: 5
              timeoutSeconds: 3
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 36
              periodSeconds: 10
              timeoutSeconds: 3
      proxy:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218"
        command:
          - python3
          - -u
          - -c
          - |
            import asyncio
            import contextlib

            LISTEN_HOST = "0.0.0.0"
            LISTEN_PORT = 8080
            TARGET_HOST = "127.0.0.1"
            TARGET_PORT = 18789

            async def pipe(reader, writer):
                try:
                    while data := await reader.read(65536):
                        writer.write(data)
                        await writer.drain()
                except (BrokenPipeError, ConnectionError):
                    pass
                finally:
                    with contextlib.suppress(Exception):
                        writer.write_eof()
                    writer.close()
                    with contextlib.suppress(Exception):
                        await writer.wait_closed()

            async def handle(client_reader, client_writer):
                peer = client_writer.get_extra_info("peername")
                try:
                    upstream_reader, upstream_writer = await asyncio.open_connection(
                        TARGET_HOST,
                        TARGET_PORT,
                    )
                except OSError as exc:
                    print(f"failed to connect upstream for {peer}: {exc}", flush=True)
                    client_writer.close()
                    with contextlib.suppress(Exception):
                        await client_writer.wait_closed()
                    return

                await asyncio.gather(
                    pipe(client_reader, upstream_writer),
                    pipe(upstream_reader, client_writer),
                    return_exceptions=True,
                )

            async def main():
                server = await asyncio.start_server(
                    handle,
                    LISTEN_HOST,
                    LISTEN_PORT,
                    backlog=256,
                )
                print(
                    f"proxying {LISTEN_HOST}:{LISTEN_PORT} to {TARGET_HOST}:{TARGET_PORT}",
                    flush=True,
                )
                async with server:
                    await server.serve_forever()

            asyncio.run(main())
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 3
              periodSeconds: 5
              timeoutSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi
