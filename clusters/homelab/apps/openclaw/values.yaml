serviceAccount:
  openclaw: {}
controllers:
  openclaw:
    serviceAccount:
      identifier: openclaw
    revisionHistoryLimit: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - acer
                  - key: octelium.com/node-mode-dataplane
                    operator: DoesNotExist
      annotations:
        homelab.rst.io/openclaw-discord-bot-token-ssm-version: "2"
        homelab.rst.io/openclaw-grafana-login-ssm-version: "1"
        homelab.rst.io/openclaw-grafana-alert-hook-ssm-version: "2"
        homelab.rst.io/openclaw-github-app-credentials-ssm-version: "1"
    initContainers:
      00-operator-toolbox:
        image:
          repository: docker.io/nixos/nix
          tag: "2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c"
        env:
          NIXPKGS_REF: github:NixOS/nixpkgs/29916453413845e54a65b8a1cf996842300cd299
        command:
          - /bin/sh
          - -ec
          - |
            export NIX_CONFIG="experimental-features = nix-command flakes"
            nix profile install --profile /toolbox/profile \
              "$NIXPKGS_REF#actionlint" \
              "$NIXPKGS_REF#argocd" \
              "$NIXPKGS_REF#awscli2" \
              "$NIXPKGS_REF#bash" \
              "$NIXPKGS_REF#cloudflared" \
              "$NIXPKGS_REF#conftest" \
              "$NIXPKGS_REF#coreutils" \
              "$NIXPKGS_REF#curl" \
              "$NIXPKGS_REF#findutils" \
              "$NIXPKGS_REF#gh" \
              "$NIXPKGS_REF#git" \
              "$NIXPKGS_REF#gitleaks" \
              "$NIXPKGS_REF#gnugrep" \
              "$NIXPKGS_REF#gnused" \
              "$NIXPKGS_REF#gnutar" \
              "$NIXPKGS_REF#gzip" \
              "$NIXPKGS_REF#jq" \
              "$NIXPKGS_REF#k9s" \
              "$NIXPKGS_REF#kubernetes-helm" \
              "$NIXPKGS_REF#kubectl" \
              "$NIXPKGS_REF#kustomize" \
              "$NIXPKGS_REF#nix" \
              "$NIXPKGS_REF#opentofu" \
              "$NIXPKGS_REF#openssh" \
              "$NIXPKGS_REF#pre-commit" \
              "$NIXPKGS_REF#ripgrep" \
              "$NIXPKGS_REF#shellcheck" \
              "$NIXPKGS_REF#shfmt" \
              "$NIXPKGS_REF#sops" \
              "$NIXPKGS_REF#talosctl" \
              "$NIXPKGS_REF#terragrunt" \
              "$NIXPKGS_REF#unzip" \
              "$NIXPKGS_REF#yamllint" \
              "$NIXPKGS_REF#yq-go"
            mkdir -p /nix-shared/store /nix-shared/var/nix
            cp -a /nix/store/. /nix-shared/store/
            cp -a /nix/var/nix/db /nix-shared/var/nix/db
            chown -R 1000:1000 /nix-shared
            /toolbox/profile/bin/jq --version
            /toolbox/profile/bin/rg --version
            /toolbox/profile/bin/gh --version
            /toolbox/profile/bin/kubectl version --client=true
            /toolbox/profile/bin/argocd version --client --short
            /toolbox/profile/bin/talosctl version --client
            /toolbox/profile/bin/terragrunt --version
            /toolbox/profile/bin/tofu version
            /toolbox/profile/bin/pre-commit --version
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 3Gi
      bootstrap-config:
        dependsOn: 00-operator-toolbox
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.8.2@sha256:5d25165995041caa6a7175bec82b25ad98c44eb269bb42435da8e27ec06e6be4"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1200m
            memory: 2Gi
        env:
          OPENCLAW_HOME: /data/openclaw
          OPENCLAW_CONFIG_PATH: /data/openclaw/config/openclaw.json
          OPENCLAW_STATE_DIR: /data/openclaw
          OPENCLAW_WORKSPACE_DIR: /data/openclaw/workspace
          OPENCLAW_SUPERVISOR_MODE: external
          OPENCLAW_SERVICE_REPAIR_POLICY: external
          OPENCLAW_NO_AUTO_UPDATE: "1"
          GIT_CONFIG_GLOBAL: /data/openclaw/gitconfig
          NIX_CONFIG: experimental-features = nix-command flakes
          PATH: /toolbox/profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: APP_SECRET
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          GRAFANA_ALERT_HOOK_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_ALERT_HOOK_TOKEN
        command:
          - /bin/sh
          - -ec
          - |
            : "${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN must be provided by openclaw-secrets APP_SECRET}"
            had_existing_state=false
            if [ -d "$OPENCLAW_STATE_DIR" ] &&
              [ -n "$(find "$OPENCLAW_STATE_DIR" -mindepth 1 -maxdepth 1 \
                ! -name npm ! -name extensions -print -quit)" ]; then
              had_existing_state=true
            fi
            backup_root=/data/openclaw-backups
            backup_name=pre-2026.8.2
            backup_dir="$backup_root/$backup_name"
            backup_staging="$backup_root/.$backup_name.partial"
            backup_archive=openclaw.tar.gz
            backup_checksum="$backup_archive.sha256"
            migration_marker="$OPENCLAW_STATE_DIR/.migrated-to-2026.8.2"
            verify_backup_dir() {
              [ -d "$1" ] &&
                [ -s "$1/$backup_archive" ] &&
                [ -s "$1/$backup_checksum" ] &&
                tar -tzf "$1/$backup_archive" >/dev/null &&
                (cd "$1" && sha256sum -c "$backup_checksum")
            }
            if "$had_existing_state" && [ ! -s "$migration_marker" ]; then
              echo "Creating or verifying offline pre-2026.8.2 OpenClaw backup"
              (
                umask 077
                mkdir -p "$backup_root"
                if [ -e "$backup_dir" ]; then
                  if [ -e "$backup_staging" ]; then
                    echo "OpenClaw backup staging still exists; preserve both paths for review" >&2
                    exit 1
                  fi
                  if ! verify_backup_dir "$backup_dir"; then
                    echo "OpenClaw backup is incomplete or corrupt: $backup_dir" >&2
                    exit 1
                  fi
                elif [ -e "$backup_staging" ]; then
                  if ! verify_backup_dir "$backup_staging"; then
                    echo "OpenClaw backup staging is incomplete; preserve it for review" >&2
                    exit 1
                  fi
                  mv "$backup_staging" "$backup_dir"
                else
                  state_kib="$(du -skx "$OPENCLAW_STATE_DIR" | awk '{print $1}')"
                  available_kib="$(df -Pk /data | awk 'NR == 2 {print $4}')"
                  required_kib=$((state_kib * 2 + 2097152))
                  if [ "$available_kib" -lt "$required_kib" ]; then
                    echo "OpenClaw migration needs ${required_kib}KiB free; only ${available_kib}KiB available" >&2
                    exit 1
                  fi
                  mkdir "$backup_staging"
                  tar --one-file-system \
                    --exclude=openclaw/npm \
                    --exclude=openclaw/extensions \
                    -C /data \
                    -czf "$backup_staging/$backup_archive" openclaw
                  tar -tzf "$backup_staging/$backup_archive" >/dev/null
                  (
                    cd "$backup_staging" || exit 1
                    sha256sum "$backup_archive" > "$backup_checksum"
                    sha256sum -c "$backup_checksum"
                  )
                  mv "$backup_staging" "$backup_dir"
                fi
                verify_backup_dir "$backup_dir"
              )
            fi
            mkdir -p "$OPENCLAW_STATE_DIR" "$OPENCLAW_WORKSPACE_DIR"
            mkdir -p "$OPENCLAW_WORKSPACE_DIR/.openclaw/trash" "$OPENCLAW_STATE_DIR/src"
            mkdir -p "$(dirname "$OPENCLAW_CONFIG_PATH")"
            if ! command -v ssh-keygen >/dev/null 2>&1 && [ ! -x "$OPENCLAW_STATE_DIR/tools/usr/bin/ssh-keygen" ]; then
              mkdir -p "$OPENCLAW_STATE_DIR/apt/state/lists/partial" \
                "$OPENCLAW_STATE_DIR/apt/cache/archives/partial" \
                "$OPENCLAW_STATE_DIR/pkg-cache" \
                "$OPENCLAW_STATE_DIR/tools"
              apt-get \
                -o Dir::State="$OPENCLAW_STATE_DIR/apt/state" \
                -o Dir::Cache="$OPENCLAW_STATE_DIR/apt/cache" \
                -o Debug::NoLocking=1 \
                update
              (
                cd "$OPENCLAW_STATE_DIR/pkg-cache" || exit 1
                apt-get \
                  -o Dir::State="$OPENCLAW_STATE_DIR/apt/state" \
                  -o Dir::Cache="$OPENCLAW_STATE_DIR/apt/cache" \
                  -o Debug::NoLocking=1 \
                  download openssh-client
                dpkg-deb -x "$(ls -t openssh-client_*.deb | head -n1)" "$OPENCLAW_STATE_DIR/tools"
              )
            fi
            SSH_KEYGEN="$(command -v ssh-keygen || printf '%s\n' "$OPENCLAW_STATE_DIR/tools/usr/bin/ssh-keygen")"
            SIGNING_KEY="$OPENCLAW_STATE_DIR/signing/claw_ed25519"
            mkdir -p "$OPENCLAW_STATE_DIR/signing" "$OPENCLAW_STATE_DIR/git"
            chmod 700 "$OPENCLAW_STATE_DIR/signing"
            if [ ! -s "$SIGNING_KEY" ]; then
              "$SSH_KEYGEN" -q -t ed25519 -N '' -C 'Claw homelab commit signing' -f "$SIGNING_KEY"
            fi
            chmod 600 "$SIGNING_KEY"
            chmod 644 "$SIGNING_KEY.pub"
            printf 'claw %s\n' "$(cat "$SIGNING_KEY.pub")" > "$OPENCLAW_STATE_DIR/git/allowed_signers"
            touch "$GIT_CONFIG_GLOBAL"
            git config --global --replace-all safe.directory "$OPENCLAW_WORKSPACE_DIR"
            git config --global --add safe.directory "$OPENCLAW_STATE_DIR/src/*"
            git config --global user.name 'Claw'
            git config --global user.email 'claw@openclaw.local'
            git config --global gpg.format ssh
            git config --global user.signingkey "$SIGNING_KEY.pub"
            git config --global gpg.ssh.program "$SSH_KEYGEN"
            git config --global gpg.ssh.allowedSignersFile "$OPENCLAW_STATE_DIR/git/allowed_signers"
            git config --global commit.gpgsign true
            git config --global log.showSignature true
            if [ ! -s "$OPENCLAW_CONFIG_PATH" ]; then
              printf '{}\n' > "$OPENCLAW_CONFIG_PATH"
            fi

            # Targeted 2026.8.2 config migration; the offline backup above owns rollback.
            python3 - "$OPENCLAW_CONFIG_PATH" <<'OPENCLAW_CONFIG_MIGRATION'
            import json
            import os
            import pathlib
            import sys
            import tempfile

            path = pathlib.Path(sys.argv[1])
            config = json.loads(path.read_text())
            before = json.dumps(config)
            for section, key in (
                ("meta", "lastTouchedAt"),
                ("commands", "ownerDisplay"),
                ("hooks", "maxBodyBytes"),
                ("plugins", "bundledDiscovery"),
            ):
                config.get(section, {}).pop(key, None)
            defaults = config.get("agents", {}).get("defaults", {})
            models = defaults.get("models", {})
            migrated = config.get("meta", {}).get("migrations", {}).get("modelPolicyAllowlist")
            if models and "modelPolicy" not in defaults and migrated is not True:
                defaults["modelPolicy"] = {"allow": list(models)}
            if json.dumps(config) != before:
                fd, temporary = tempfile.mkstemp(prefix=".config-migration-", dir=path.parent)
                try:
                    with os.fdopen(fd, "w") as output:
                        json.dump(config, output, indent=2)
                        output.write("\n")
                        output.flush()
                        os.fsync(output.fileno())
                    os.replace(temporary, path)
                finally:
                    if os.path.exists(temporary):
                        os.unlink(temporary)
            OPENCLAW_CONFIG_MIGRATION

            openclaw_version="$(openclaw --version | awk 'NR == 1 { if ($1 == "OpenClaw") print $2; else print $1 }')"
            : "${openclaw_version:?failed to parse OpenClaw version for Discord plugin install}"
            verify_discord_plugin() {
              openclaw plugins inspect discord --runtime --json |
                python3 -c '
            import json
            import pathlib
            import sys

            expected_version, expected_status = sys.argv[1:]
            report = json.load(sys.stdin)
            plugin = report["plugin"]
            install = report.get("install") or {}
            root = pathlib.Path(plugin["rootDir"])
            package = json.loads((root / "package.json").read_text())
            valid = (
                plugin.get("id") == "discord"
                and plugin.get("origin") == "global"
                and install.get("source") == "npm"
                and install.get("spec") == f"@openclaw/discord@{expected_version}"
                and install.get("version") == expected_version
                and package.get("name") == "@openclaw/discord"
                and package.get("version") == expected_version
                and (expected_status != "loaded" or plugin.get("status") == "loaded")
            )
            valid or sys.exit("Discord external runtime verification failed")
            ' "$openclaw_version" "$1"
            }
            if ! verify_discord_plugin installed; then
              installed=false
              for delay in 0 5 15 30; do
                [ "$delay" -eq 0 ] || sleep "$delay"
                echo "Installing Discord channel plugin (retry delay ${delay}s)"
                if openclaw plugins install \
                  "npm:@openclaw/discord@${openclaw_version}" \
                  --pin --force --accept-capabilities; then
                  installed=true
                  break
                fi
              done
              "$installed" || {
                echo "Exact Discord plugin install failed after bounded retries" >&2
                exit 1
              }
            fi
            verify_discord_plugin installed

            session_sqlite() {
              report_dir="$OPENCLAW_STATE_DIR/session-sqlite-reports"
              mkdir -p "$report_dir"
              report="$(mktemp "$report_dir/$2.XXXXXX")"
              status=0
              openclaw doctor "$@" --json > "$report" || status=$?
              python3 - "$report" "$status" "$2" <<'OPENCLAW_SESSION_REPORT'
            import json
            import sys

            path, status, mode = sys.argv[1:]
            with open(path, encoding="utf-8") as source:
                report = json.load(source)
            issues = [(target["agentId"], issue)
                      for target in report["targets"] for issue in target["issues"]]
            allowed = all(
                agent == "main"
                and issue["code"] == "transcript_missing"
                and issue.get("sessionKey") == "agent:main:healthcheck-20260813"
                for agent, issue in issues
            )
            valid = (
                report["mode"] == mode
                and bool(report["targets"])
                and report["totals"]["issues"] == len(issues)
                and int(status) in (0, 1)
                and (int(status) == 0 or bool(issues))
                and allowed
            )
            print(f"session-sqlite {mode}: {json.dumps(report['totals'], sort_keys=True)}")
            print(f"Private migration report: {path}")
            if not valid:
                sys.exit("Session migration report rejected; preserve report and backup for review")
            if issues:
                print("Known missing healthcheck transcript: preserve metadata through upstream import")
            OPENCLAW_SESSION_REPORT
            }

            session_preservation() {
              python3 - "$1" "$report" "$report_dir/expected-sessions.json" <<'OPENCLAW_SESSION_PRESERVATION'
            import json
            import os
            import pathlib
            import sqlite3
            import sys

            mode, report_path, expected_path = sys.argv[1:]
            expected_path = pathlib.Path(expected_path)
            if mode == "snapshot" and not expected_path.exists():
                report = json.loads(pathlib.Path(report_path).read_text())
                expected = []
                for target in report["targets"]:
                    store = pathlib.Path(target["storePath"])
                    entries = json.loads(store.read_text()) if store.exists() else {}
                    if len(entries) != target["legacyEntries"]:
                        sys.exit("Legacy session inventory changed before import")
                    expected.append({"sqlitePath": target["sqlitePath"], "sessions": {
                        key: entry["sessionId"] for key, entry in entries.items()
                    }})
                temporary = expected_path.with_suffix(".tmp")
                with open(temporary, "w", encoding="utf-8") as output:
                    os.chmod(temporary, 0o600)
                    json.dump(expected, output)
                    output.flush()
                    os.fsync(output.fileno())
                os.replace(temporary, expected_path)
            expected = json.loads(expected_path.read_text())
            if not expected:
                sys.exit("Missing pre-import session inventory")
            if mode == "verify":
                for target in expected:
                    uri = pathlib.Path(target["sqlitePath"]).resolve().as_uri() + "?mode=ro"
                    with sqlite3.connect(uri, uri=True) as db:
                        for key, session_id in target["sessions"].items():
                            row = db.execute(
                                "SELECT current_session_id FROM session_nodes WHERE session_key = ?",
                                (key,),
                            ).fetchone()
                            if row != (session_id,):
                                sys.exit("Imported session identity missing or changed; preserve backup and reports")
                print("Verified every pre-import session key and identity in SQLite")
            OPENCLAW_SESSION_PRESERVATION
            }

            if "$had_existing_state" && [ ! -s "$migration_marker" ]; then
              echo "Migrating session state to OpenClaw 2026.8.2"
              session_sqlite --session-sqlite inspect \
                --session-sqlite-all-agents
              session_sqlite --session-sqlite dry-run \
                --session-sqlite-all-agents
              session_preservation snapshot
              session_sqlite --session-sqlite import \
                --session-sqlite-all-agents
              session_sqlite --session-sqlite inspect \
                --session-sqlite-all-agents
              session_preservation verify
              printf 'session SQLite migration imported and inspected\n' > "$migration_marker.tmp"
              mv "$migration_marker.tmp" "$migration_marker"
            fi

            openclaw config validate

            openclaw config set --strict-json \
              gateway.mode \
              '"local"'

            openclaw config set --strict-json \
              gateway.auth.mode \
              '"token"'

            openclaw config set \
              gateway.auth.token \
              --ref-provider default \
              --ref-source env \
              --ref-id OPENCLAW_GATEWAY_TOKEN

            openclaw config set --strict-json \
              gateway.controlUi.allowedOrigins \
              '["https://openclaw.stinkyboi.com","http://openclaw.homelab","https://openclaw.homelab"]'

            if [ -z "${GRAFANA_ALERT_HOOK_TOKEN:-}" ] || [ "$GRAFANA_ALERT_HOOK_TOKEN" = "REPLACE_ME" ]; then
              echo "GRAFANA_ALERT_HOOK_TOKEN is not populated; skipping hooks bootstrap"
            else
              openclaw config set --strict-json \
                hooks.enabled \
                'true'
              openclaw config set --strict-json \
                hooks.path \
                '"/hooks"'
              HOOK_TOKEN_JSON="$(python3 -c 'import json, os; print(json.dumps(os.environ["GRAFANA_ALERT_HOOK_TOKEN"]))')"
              openclaw config set --strict-json \
                hooks.token \
                "$HOOK_TOKEN_JSON"
              openclaw config set --strict-json \
                hooks.defaultSessionKey \
                '"agent:main:hooks:grafana-alerts"'
              openclaw config set --strict-json \
                hooks.allowedAgentIds \
                '["main"]'
              openclaw config set --strict-json \
                hooks.allowRequestSessionKey \
                'false'
            fi

            openclaw config set --strict-json \
              plugins.entries.codex.enabled \
              'true'

            openclaw config set --strict-json \
              plugins.entries.memory-wiki.enabled \
              'true'

            openclaw config patch --stdin <<'OPENCLAW_MODEL_PATCH'
            {
              "agents": {
                "defaults": {
                  "model": {
                    "primary": "openai/gpt-5.5"
                  },
                  "maxConcurrent": 4,
                  "models": {
                    "openai/gpt-5.5": {
                      "agentRuntime": {
                        "id": "codex"
                      }
                    }
                  }
                }
              }
            }
            OPENCLAW_MODEL_PATCH

            openclaw config set --strict-json \
              agents.defaults.sandbox.mode \
              '"off"'

            openclaw config set --strict-json \
              tools.fs.workspaceOnly \
              'true'

            if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ "$DISCORD_BOT_TOKEN" = "REPLACE_ME" ]; then
              echo "DISCORD_BOT_TOKEN is not populated; skipping Discord channel config"
            else
              echo "DISCORD_BOT_TOKEN is populated; configuring the Discord channel"
              openclaw plugins enable discord --accept-capabilities
              verify_discord_plugin loaded
              openclaw config set --strict-json \
                channels.discord.enabled \
                'true'
              openclaw config set \
                channels.discord.token \
                --ref-provider default \
                --ref-source env \
                --ref-id DISCORD_BOT_TOKEN
            fi
    containers:
      app:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.8.2@sha256:5d25165995041caa6a7175bec82b25ad98c44eb269bb42435da8e27ec06e6be4"
        env:
          OPENCLAW_HOME: /data/openclaw
          OPENCLAW_CONFIG_PATH: /data/openclaw/config/openclaw.json
          OPENCLAW_STATE_DIR: /data/openclaw
          OPENCLAW_WORKSPACE_DIR: /data/openclaw/workspace
          OPENCLAW_SUPERVISOR_MODE: external
          OPENCLAW_NO_AUTO_UPDATE: "1"
          GIT_CONFIG_GLOBAL: /data/openclaw/gitconfig
          NIX_CONFIG: experimental-features = nix-command flakes
          PATH: /toolbox/profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: APP_SECRET
          GITHUB_APP_PRIVATE_KEY_PATH: /var/run/secrets/openclaw/github-app/private-key.pem
          LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000
          LITELLM_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: LITELLM_TOKEN
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          GRAFANA_USERNAME:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_USERNAME
          GRAFANA_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_PASSWORD
          GITHUB_APP_ID:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GITHUB_APP_ID
          GITHUB_APP_INSTALLATION_ID:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GITHUB_APP_INSTALLATION_ID
        resources:
          requests:
            cpu: 1
            memory: 2Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: 1500m
            memory: 4Gi
            ephemeral-storage: 6Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 24
              periodSeconds: 5
              timeoutSeconds: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 2
              periodSeconds: 5
              timeoutSeconds: 3
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 36
              periodSeconds: 10
              timeoutSeconds: 3
      proxy:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.8.2@sha256:5d25165995041caa6a7175bec82b25ad98c44eb269bb42435da8e27ec06e6be4"
        command:
          - python3
          - -u
          - -c
          - |
            import asyncio
            import contextlib

            LISTEN_HOST = "0.0.0.0"
            LISTEN_PORT = 8080
            TARGET_HOST = "127.0.0.1"
            TARGET_PORT = 18789

            async def pipe(reader, writer):
                try:
                    while data := await reader.read(65536):
                        writer.write(data)
                        await writer.drain()
                except (BrokenPipeError, ConnectionError):
                    pass
                finally:
                    with contextlib.suppress(Exception):
                        writer.write_eof()
                    writer.close()
                    with contextlib.suppress(Exception):
                        await writer.wait_closed()

            async def handle(client_reader, client_writer):
                peer = client_writer.get_extra_info("peername")
                try:
                    upstream_reader, upstream_writer = await asyncio.open_connection(
                        TARGET_HOST,
                        TARGET_PORT,
                    )
                except OSError as exc:
                    print(f"failed to connect upstream for {peer}: {exc}", flush=True)
                    client_writer.close()
                    with contextlib.suppress(Exception):
                        await client_writer.wait_closed()
                    return

                await asyncio.gather(
                    pipe(client_reader, upstream_writer),
                    pipe(upstream_reader, client_writer),
                    return_exceptions=True,
                )

            async def main():
                server = await asyncio.start_server(
                    handle,
                    LISTEN_HOST,
                    LISTEN_PORT,
                    backlog=256,
                )
                print(
                    f"proxying {LISTEN_HOST}:{LISTEN_PORT} to {TARGET_HOST}:{TARGET_PORT}",
                    flush=True,
                )
                async with server:
                    await server.serve_forever()

            asyncio.run(main())
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 3
              periodSeconds: 5
              timeoutSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi
service:
  app:
    controller: openclaw
    ports:
      http:
        port: 8080
persistence:
  config:
    enabled: true
    storageClass: nfs-default
    size: 10Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      openclaw:
        app:
          - path: /data
        bootstrap-config:
          - path: /data
  plugin-cache:
    enabled: true
    type: emptyDir
    advancedMounts:
      openclaw:
        app:
          - path: /data/openclaw/npm
        bootstrap-config:
          - path: /data/openclaw/npm
  plugin-extensions:
    enabled: true
    type: emptyDir
    advancedMounts:
      openclaw:
        app:
          - path: /data/openclaw/extensions
        bootstrap-config:
          - path: /data/openclaw/extensions
  codex-runtime:
    enabled: true
    type: emptyDir
    sizeLimit: 2Gi
    advancedMounts:
      openclaw:
        app:
          - path: /data/openclaw/agents/main/agent/codex-home
  operator-toolbox:
    enabled: true
    type: emptyDir
    advancedMounts:
      openclaw:
        00-operator-toolbox:
          - path: /toolbox
        app:
          - path: /toolbox
            readOnly: true
        bootstrap-config:
          - path: /toolbox
            readOnly: true
  operator-nix-store:
    enabled: true
    type: emptyDir
    advancedMounts:
      openclaw:
        00-operator-toolbox:
          - path: /nix-shared
        app:
          - path: /nix
        bootstrap-config:
          - path: /nix
  github-app-private-key:
    enabled: true
    type: secret
    name: openclaw-github-app-private-key
    items:
      - key: private-key.pem
        path: private-key.pem
    advancedMounts:
      openclaw:
        app:
          - path: /var/run/secrets/openclaw/github-app
            readOnly: true
