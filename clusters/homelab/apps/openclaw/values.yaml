serviceAccount:
  openclaw: {}
controllers:
  openclaw:
    serviceAccount:
      identifier: openclaw
    replicas: 1
    revisionHistoryLimit: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: zimaboard-1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - acer
                  - key: octelium.com/node-mode-dataplane
                    operator: DoesNotExist
      annotations:
        homelab.rst.io/openclaw-assistant-sha256: "af0cf57601370fa294268e60316d091b576e31fb97a9c373cf0b04ee696c5c93"
        homelab.rst.io/openclaw-discord-bot-token-ssm-version: "2"
        homelab.rst.io/openclaw-grafana-login-ssm-version: "1"
        homelab.rst.io/openclaw-grafana-alert-hook-ssm-version: "2"
        homelab.rst.io/openclaw-github-app-credentials-ssm-version: "1"
    initContainers:
      00-operator-toolbox:
        image:
          repository: docker.io/nixos/nix
          tag: "2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c"
        env:
          NIXPKGS_REF: github:NixOS/nixpkgs/29916453413845e54a65b8a1cf996842300cd299
        command:
          - /bin/sh
          - -ec
          - |
            export NIX_CONFIG="experimental-features = nix-command flakes"
            nix profile install --profile /toolbox/profile \
              "$NIXPKGS_REF#actionlint" \
              "$NIXPKGS_REF#argocd" \
              "$NIXPKGS_REF#awscli2" \
              "$NIXPKGS_REF#bash" \
              "$NIXPKGS_REF#cloudflared" \
              "$NIXPKGS_REF#conftest" \
              "$NIXPKGS_REF#coreutils" \
              "$NIXPKGS_REF#curl" \
              "$NIXPKGS_REF#findutils" \
              "$NIXPKGS_REF#gh" \
              "$NIXPKGS_REF#git" \
              "$NIXPKGS_REF#gitleaks" \
              "$NIXPKGS_REF#gnugrep" \
              "$NIXPKGS_REF#gnused" \
              "$NIXPKGS_REF#gnutar" \
              "$NIXPKGS_REF#gzip" \
              "$NIXPKGS_REF#jq" \
              "$NIXPKGS_REF#k9s" \
              "$NIXPKGS_REF#kubernetes-helm" \
              "$NIXPKGS_REF#kubectl" \
              "$NIXPKGS_REF#kustomize" \
              "$NIXPKGS_REF#nix" \
              "$NIXPKGS_REF#opentofu" \
              "$NIXPKGS_REF#openssh" \
              "$NIXPKGS_REF#pre-commit" \
              "$NIXPKGS_REF#ripgrep" \
              "$NIXPKGS_REF#shellcheck" \
              "$NIXPKGS_REF#shfmt" \
              "$NIXPKGS_REF#sops" \
              "$NIXPKGS_REF#talosctl" \
              "$NIXPKGS_REF#terragrunt" \
              "$NIXPKGS_REF#unzip" \
              "$NIXPKGS_REF#yamllint" \
              "$NIXPKGS_REF#yq-go"
            mkdir -p /nix-shared/store /nix-shared/var/nix
            cp -a /nix/store/. /nix-shared/store/
            cp -a /nix/var/nix/db /nix-shared/var/nix/db
            chown -R 1000:1000 /nix-shared
            # The NAS maps file ownership to 65534; coordinator locks need local UID ownership.
            chown 1000:1000 /openclaw-coordinator
            chmod 700 /openclaw-coordinator
            /toolbox/profile/bin/jq --version
            /toolbox/profile/bin/rg --version
            /toolbox/profile/bin/gh --version
            /toolbox/profile/bin/kubectl version --client=true
            /toolbox/profile/bin/argocd version --client --short
            /toolbox/profile/bin/talosctl version --client
            /toolbox/profile/bin/terragrunt --version
            /toolbox/profile/bin/tofu version
            /toolbox/profile/bin/pre-commit --version
            # Astra requires Codex 0.153.1+; use a verified release asset.
            case "$(uname -m)" in
              x86_64) codex_arch=x86_64; codex_sha=e8cd1160071f725d2a10cab81073dd6818fc8b096372125d27ef6e66fdf0979e; codex_host_sha=177a4507b9cc7f97f113ac034697b39f6a71a876a8bd508ff6d7f52f342ebe4a ;;
              aarch64) codex_arch=aarch64; codex_sha=878693f9b370320ea21793f99ea1f5687b7d9aa1f2c733de693d9ec0baa4e62a; codex_host_sha=70fe485e6919a038b75f70be71aa5782a19a5f36ee85597301e90bd1c9bcbf07 ;;
              *) echo "Unsupported Codex architecture" >&2; exit 1 ;;
            esac
            mkdir -p /toolbox/codex
            /toolbox/profile/bin/curl --fail --location --retry 3 --max-time 180 \
              "https://github.com/openai/codex/releases/download/rust-v0.153.2/codex-${codex_arch}-unknown-linux-musl.tar.gz" \
              --output /tmp/codex.tar.gz
            printf '%s  /tmp/codex.tar.gz\n' "$codex_sha" | /toolbox/profile/bin/sha256sum --check --strict
            /toolbox/profile/bin/tar -xzf /tmp/codex.tar.gz -C /toolbox/codex
            mv "/toolbox/codex/codex-${codex_arch}-unknown-linux-musl" /toolbox/codex/codex
            chmod 755 /toolbox/codex/codex
            /toolbox/codex/codex --version
            # Code-mode tool calls launch this sibling executable by absolute path.
            /toolbox/profile/bin/curl --fail --location --retry 3 --max-time 180 \
              "https://github.com/openai/codex/releases/download/rust-v0.153.2/codex-code-mode-host-${codex_arch}-unknown-linux-musl.tar.gz" \
              --output /tmp/codex-code-mode-host.tar.gz
            printf '%s  /tmp/codex-code-mode-host.tar.gz\n' "$codex_host_sha" | /toolbox/profile/bin/sha256sum --check --strict
            /toolbox/profile/bin/tar -xzf /tmp/codex-code-mode-host.tar.gz -C /toolbox/codex
            mv "/toolbox/codex/codex-code-mode-host-${codex_arch}-unknown-linux-musl" /toolbox/codex/codex-code-mode-host
            chmod 755 /toolbox/codex/codex-code-mode-host
            # Initialize only the hostPath root; migration itself runs as UID 1000.
            chown 1000:1000 /openclaw-runtime-volume
            chmod 700 /openclaw-runtime-volume
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 3Gi
      01-runtime-storage:
        dependsOn: 00-operator-toolbox
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.2@sha256:a8604855b76cd613cbaa45d6db093dc017b09a2faea5dc9cee023fb7ac262250"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: [ALL]
        command: [python3, /etc/openclaw-assistant/runtime-storage.py, migrate]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      bootstrap-config:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        dependsOn: 01-runtime-storage
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.2@sha256:a8604855b76cd613cbaa45d6db093dc017b09a2faea5dc9cee023fb7ac262250"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1200m
            memory: 2Gi
        env:
          OPENCLAW_HOME: /data/openclaw
          OPENCLAW_CONFIG_PATH: /data/openclaw/config/openclaw.json
          OPENCLAW_STATE_DIR: /data/openclaw
          OPENCLAW_WORKSPACE_DIR: /data/openclaw/workspace
          OPENCLAW_SUPERVISOR_MODE: external
          OPENCLAW_SERVICE_REPAIR_POLICY: external
          OPENCLAW_NO_AUTO_UPDATE: "1"
          GIT_CONFIG_GLOBAL: /data/openclaw/gitconfig
          NIX_CONFIG: experimental-features = nix-command flakes
          PATH: /toolbox/profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: APP_SECRET
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          GRAFANA_ALERT_HOOK_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_ALERT_HOOK_TOKEN
        command:
          - /bin/sh
          - -ec
          - |
            : "${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN must be provided by openclaw-secrets APP_SECRET}"
            # Verify the exact mounted files before any CLI can create fresh state.
            python3 /etc/openclaw-assistant/runtime-storage.py verify-mounts
            runtime_checkpoint="$OPENCLAW_STATE_DIR/.runtime-checkpoint-for-2026.9.2"
            if [ ! -s "$runtime_checkpoint" ]; then
              python3 /etc/openclaw-assistant/runtime-storage.py checkpoint
              printf 'verified canonical database checkpoint\n' > "$runtime_checkpoint"
            fi
            doctor_marker="$OPENCLAW_STATE_DIR/.doctor-state-migrated-to-2026.8.2"
            doctor_reports="$OPENCLAW_STATE_DIR/doctor-state-reports"
            doctor_config_snapshot="$doctor_reports/config-before.json"
            restore_doctor_config() {
              cp "$doctor_config_snapshot" "$OPENCLAW_CONFIG_PATH.doctor-restore"
              chmod 600 "$OPENCLAW_CONFIG_PATH.doctor-restore"
              mv "$OPENCLAW_CONFIG_PATH.doctor-restore" "$OPENCLAW_CONFIG_PATH"
            }
            # Resume an interrupted doctor before applying this rollout's config.
            if [ ! -s "$doctor_marker" ] && [ -s "$doctor_config_snapshot" ]; then
              restore_doctor_config
            fi
            had_existing_state=false
            if [ -d "$OPENCLAW_STATE_DIR" ] &&
              [ -n "$(find "$OPENCLAW_STATE_DIR" -mindepth 1 -maxdepth 1 \
                ! -name npm ! -name extensions -print -quit)" ]; then
              had_existing_state=true
            fi
            backup_root=/data/openclaw-backups
            backup_name=pre-2026.9.2
            backup_marker="$OPENCLAW_STATE_DIR/.backup-verified-for-2026.9.2"
            backup_dir="$backup_root/$backup_name"
            backup_staging="$backup_root/.$backup_name.partial"
            backup_archive=openclaw.tar.gz
            backup_checksum="$backup_archive.sha256"
            migration_marker="$OPENCLAW_STATE_DIR/.migrated-to-2026.8.2"
            verify_backup_dir() {
              [ -d "$1" ] &&
                [ -s "$1/$backup_archive" ] &&
                [ -s "$1/$backup_checksum" ] &&
                tar -tzf "$1/$backup_archive" >/dev/null &&
                (cd "$1" && sha256sum -c "$backup_checksum")
            }
            if "$had_existing_state" && [ ! -s "$backup_marker" ]; then
              echo "Creating or verifying offline pre-2026.9.2 OpenClaw backup"
              (
                umask 077
                mkdir -p "$backup_root"
                # A Pod replacement may interrupt tar before its checksum is written.
                # Preserve the unpublished archive, then rebuild from the stopped state.
                if [ ! -e "$backup_dir" ] && [ -d "$backup_staging" ] &&
                  [ ! -L "$backup_staging" ] && ! verify_backup_dir "$backup_staging"; then
                  interrupted="$backup_root/$backup_name.interrupted-$(date -u +%Y%m%dT%H%M%SZ)"
                  if [ -e "$interrupted" ]; then
                    echo "Interrupted backup preservation target already exists" >&2
                    exit 1
                  fi
                  mv "$backup_staging" "$interrupted"
                  echo "Preserved interrupted OpenClaw backup; rebuilding offline archive"
                fi
                if [ -e "$backup_dir" ]; then
                  if [ -e "$backup_staging" ]; then
                    echo "OpenClaw backup staging still exists; preserve both paths for review" >&2
                    exit 1
                  fi
                  if ! verify_backup_dir "$backup_dir"; then
                    echo "OpenClaw backup is incomplete or corrupt: $backup_dir" >&2
                    exit 1
                  fi
                elif [ -e "$backup_staging" ]; then
                  if ! verify_backup_dir "$backup_staging"; then
                    echo "OpenClaw backup staging is incomplete; preserve it for review" >&2
                    exit 1
                  fi
                  mv "$backup_staging" "$backup_dir"
                else
                  state_kib="$(du -skx "$OPENCLAW_STATE_DIR" "$OPENCLAW_STATE_DIR/state" "$OPENCLAW_STATE_DIR/agents/main/agent" | awk '{sum += $1} END {print sum}')"
                  available_kib="$(df -Pk /data | awk 'NR == 2 {print $4}')"
                  required_kib=$((state_kib * 2 + 2097152))
                  if [ "$available_kib" -lt "$required_kib" ]; then
                    echo "OpenClaw migration needs ${required_kib}KiB free; only ${available_kib}KiB available" >&2
                    exit 1
                  fi
                  mkdir "$backup_staging"
                  tar --one-file-system \
                    --exclude=openclaw/npm \
                    --exclude=openclaw/extensions \
                    -C /data \
                    -czf "$backup_staging/$backup_archive" openclaw openclaw/state openclaw/agents/main/agent
                  tar -tzf "$backup_staging/$backup_archive" >/dev/null
                  (
                    cd "$backup_staging" || exit 1
                    sha256sum "$backup_archive" > "$backup_checksum"
                    sha256sum -c "$backup_checksum"
                  )
                  mv "$backup_staging" "$backup_dir"
                fi
                verify_backup_dir "$backup_dir"
                printf 'verified pre-2026.9.2 archive\n' > "$backup_marker"
              )
            fi
            mkdir -p "$OPENCLAW_STATE_DIR" "$OPENCLAW_WORKSPACE_DIR"
            mkdir -p "$OPENCLAW_WORKSPACE_DIR/.openclaw/trash" "$OPENCLAW_STATE_DIR/src"
            mkdir -p "$(dirname "$OPENCLAW_CONFIG_PATH")"
            if ! command -v ssh-keygen >/dev/null 2>&1 && [ ! -x "$OPENCLAW_STATE_DIR/tools/usr/bin/ssh-keygen" ]; then
              mkdir -p "$OPENCLAW_STATE_DIR/apt/state/lists/partial" \
                "$OPENCLAW_STATE_DIR/apt/cache/archives/partial" \
                "$OPENCLAW_STATE_DIR/pkg-cache" \
                "$OPENCLAW_STATE_DIR/tools"
              apt-get \
                -o Dir::State="$OPENCLAW_STATE_DIR/apt/state" \
                -o Dir::Cache="$OPENCLAW_STATE_DIR/apt/cache" \
                -o Debug::NoLocking=1 \
                update
              (
                cd "$OPENCLAW_STATE_DIR/pkg-cache" || exit 1
                apt-get \
                  -o Dir::State="$OPENCLAW_STATE_DIR/apt/state" \
                  -o Dir::Cache="$OPENCLAW_STATE_DIR/apt/cache" \
                  -o Debug::NoLocking=1 \
                  download openssh-client
                dpkg-deb -x "$(ls -t openssh-client_*.deb | head -n1)" "$OPENCLAW_STATE_DIR/tools"
              )
            fi
            SSH_KEYGEN="$(command -v ssh-keygen || printf '%s\n' "$OPENCLAW_STATE_DIR/tools/usr/bin/ssh-keygen")"
            SIGNING_KEY="$OPENCLAW_STATE_DIR/signing/claw_ed25519"
            mkdir -p "$OPENCLAW_STATE_DIR/signing" "$OPENCLAW_STATE_DIR/git"
            chmod 700 "$OPENCLAW_STATE_DIR/signing"
            if [ ! -s "$SIGNING_KEY" ]; then
              "$SSH_KEYGEN" -q -t ed25519 -N '' -C 'Claw homelab commit signing' -f "$SIGNING_KEY"
            fi
            chmod 600 "$SIGNING_KEY"
            chmod 644 "$SIGNING_KEY.pub"
            printf 'claw %s\n' "$(cat "$SIGNING_KEY.pub")" > "$OPENCLAW_STATE_DIR/git/allowed_signers"
            touch "$GIT_CONFIG_GLOBAL"
            git config --global --replace-all safe.directory "$OPENCLAW_WORKSPACE_DIR"
            git config --global --add safe.directory "$OPENCLAW_STATE_DIR/src/*"
            git config --global user.name 'Claw'
            git config --global user.email 'claw@openclaw.local'
            git config --global gpg.format ssh
            git config --global user.signingkey "$SIGNING_KEY.pub"
            git config --global gpg.ssh.program "$SSH_KEYGEN"
            git config --global gpg.ssh.allowedSignersFile "$OPENCLAW_STATE_DIR/git/allowed_signers"
            git config --global commit.gpgsign true
            git config --global log.showSignature true
            if [ ! -s "$OPENCLAW_CONFIG_PATH" ]; then
              printf '{}\n' > "$OPENCLAW_CONFIG_PATH"
            fi

            # Targeted 2026.8.2 config migration; the offline backup above owns rollback.
            python3 - "$OPENCLAW_CONFIG_PATH" <<'OPENCLAW_CONFIG_MIGRATION'
            import json
            import os
            import pathlib
            import sys
            import tempfile

            path = pathlib.Path(sys.argv[1])
            config = json.loads(path.read_text())
            before = json.dumps(config)
            for section, key in (
                ("meta", "lastTouchedAt"),
                ("commands", "ownerDisplay"),
                ("hooks", "maxBodyBytes"),
                ("plugins", "bundledDiscovery"),
            ):
                config.get(section, {}).pop(key, None)
            defaults = config.get("agents", {}).get("defaults", {})
            models = defaults.get("models", {})
            migrated = config.get("meta", {}).get("migrations", {}).get("modelPolicyAllowlist")
            if models and "modelPolicy" not in defaults and migrated is not True:
                defaults["modelPolicy"] = {"allow": list(models)}
            if json.dumps(config) != before:
                fd, temporary = tempfile.mkstemp(prefix=".config-migration-", dir=path.parent)
                try:
                    with os.fdopen(fd, "w") as output:
                        json.dump(config, output, indent=2)
                        output.write("\n")
                        output.flush()
                        os.fsync(output.fileno())
                    os.replace(temporary, path)
                finally:
                    if os.path.exists(temporary):
                        os.unlink(temporary)
            OPENCLAW_CONFIG_MIGRATION

            openclaw_version="$(openclaw --version | awk 'NR == 1 { if ($1 == "OpenClaw") print $2; else print $1 }')"
            : "${openclaw_version:?failed to parse OpenClaw version for Discord plugin install}"
            verify_discord_plugin() {
              openclaw plugins inspect discord --runtime --json |
                python3 -c '
            import json
            import pathlib
            import sys

            expected_version, expected_status = sys.argv[1:]
            report = json.load(sys.stdin)
            plugin = report["plugin"]
            install = report.get("install") or {}
            root = pathlib.Path(plugin["rootDir"])
            package = json.loads((root / "package.json").read_text())
            valid = (
                plugin.get("id") == "discord"
                and plugin.get("origin") == "global"
                and install.get("source") == "npm"
                and install.get("spec") == f"@openclaw/discord@{expected_version}"
                and install.get("version") == expected_version
                and package.get("name") == "@openclaw/discord"
                and package.get("version") == expected_version
                and (expected_status != "loaded" or plugin.get("status") == "loaded")
            )
            valid or sys.exit("Discord external runtime verification failed")
            ' "$openclaw_version" "$1"
            }
            if ! verify_discord_plugin installed; then
              installed=false
              for delay in 0 5 15 30; do
                [ "$delay" -eq 0 ] || sleep "$delay"
                echo "Installing Discord channel plugin (retry delay ${delay}s)"
                if openclaw plugins install \
                  "npm:@openclaw/discord@${openclaw_version}" \
                  --pin --force --accept-capabilities; then
                  installed=true
                  break
                fi
              done
              "$installed" || {
                echo "Exact Discord plugin install failed after bounded retries" >&2
                exit 1
              }
            fi
            verify_discord_plugin installed
            python3 /etc/openclaw-assistant/install-codex.py

            session_sqlite() {
              report_dir="$OPENCLAW_STATE_DIR/session-sqlite-reports"
              mkdir -p "$report_dir"
              report="$report_dir/$2.latest.json"
              if [ -f "$report" ]; then
                mv "$report" "$report_dir/$2.previous.json"
              fi
              (umask 077; : > "$report")
              status=0
              openclaw doctor "$@" --json > "$report" || status=$?
              python3 - "$report" "$status" "$2" <<'OPENCLAW_SESSION_REPORT'
            import json
            import sys

            path, status, mode = sys.argv[1:]
            with open(path, encoding="utf-8") as source:
                report = json.load(source)
            issues = [(target["agentId"], issue)
                      for target in report["targets"] for issue in target["issues"]]
            allowed = all(
                agent == "main"
                and issue["code"] == "transcript_missing"
                and issue.get("sessionKey") == "agent:main:healthcheck-20260813"
                for agent, issue in issues
            )
            valid = (
                report["mode"] == mode
                and bool(report["targets"])
                and report["totals"]["issues"] == len(issues)
                and int(status) in (0, 1)
                and (int(status) == 0 or bool(issues))
                and allowed
            )
            print(f"session-sqlite {mode}: {json.dumps(report['totals'], sort_keys=True)}")
            print(f"Private migration report: {path}")
            if not valid:
                sys.exit("Session migration report rejected; preserve report and backup for review")
            if issues:
                print("Known missing healthcheck transcript: preserve metadata through upstream import")
            OPENCLAW_SESSION_REPORT
            }

            session_preservation() {
              python3 - "$1" "$report" "$report_dir/expected-sessions.json" <<'OPENCLAW_SESSION_PRESERVATION'
            import json
            import os
            import pathlib
            import sqlite3
            import sys

            mode, report_path, expected_path = sys.argv[1:]
            expected_path = pathlib.Path(expected_path)
            if mode == "snapshot" and not expected_path.exists():
                report = json.loads(pathlib.Path(report_path).read_text())
                expected = []
                for target in report["targets"]:
                    store = pathlib.Path(target["storePath"])
                    entries = json.loads(store.read_text()) if store.exists() else {}
                    if len(entries) != target["legacyEntries"]:
                        sys.exit("Legacy session inventory changed before import")
                    expected.append({"sqlitePath": target["sqlitePath"], "sessions": {
                        key: entry["sessionId"] for key, entry in entries.items()
                    }})
                temporary = expected_path.with_suffix(".tmp")
                with open(temporary, "w", encoding="utf-8") as output:
                    os.chmod(temporary, 0o600)
                    json.dump(expected, output)
                    output.flush()
                    os.fsync(output.fileno())
                os.replace(temporary, expected_path)
            expected = json.loads(expected_path.read_text())
            if not expected:
                sys.exit("Missing pre-import session inventory")
            if mode == "verify":
                for target in expected:
                    uri = pathlib.Path(target["sqlitePath"]).resolve().as_uri() + "?mode=ro"
                    with sqlite3.connect(uri, uri=True) as db:
                        for key, session_id in target["sessions"].items():
                            row = db.execute(
                                "SELECT current_session_id FROM session_nodes WHERE session_key = ?",
                                (key,),
                            ).fetchone()
                            if row != (session_id,):
                                sys.exit("Imported session identity missing or changed; preserve backup and reports")
                print("Verified every pre-import session key and identity in SQLite")
            OPENCLAW_SESSION_PRESERVATION
            }

            if "$had_existing_state" && [ ! -s "$migration_marker" ]; then
              echo "Migrating session state to OpenClaw 2026.8.2"
              session_sqlite --session-sqlite inspect \
                --session-sqlite-all-agents
              session_sqlite --session-sqlite dry-run \
                --session-sqlite-all-agents
              session_preservation snapshot
              session_sqlite --session-sqlite import \
                --session-sqlite-all-agents
              session_sqlite --session-sqlite inspect \
                --session-sqlite-all-agents
              session_preservation verify
              printf 'session SQLite migration imported and inspected\n' > "$migration_marker.tmp"
              mv "$migration_marker.tmp" "$migration_marker"
            fi

            openclaw config validate

            # Config CLI batches preserve unrelated keys in one validated write per phase.
            config_batch_dir="$(mktemp -d /tmp/openclaw-config-batch.XXXXXX)"
            trap 'rm -rf "$config_batch_dir"' 0
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM
            config_batch() {
              python3 -c '
            import json, os, sys
            data = sys.stdin.buffer.read(1048577)
            if len(data) > 1048576:
                raise SystemExit("Config batch exceeds 1 MiB")
            entries = json.loads(data)
            if not isinstance(entries, list):
                raise SystemExit("Config batch must be a list")
            fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
            with os.fdopen(fd, "wb") as output:
                output.write(data)
            ' "$config_batch_dir/assignments.json"
              openclaw config set --batch-file "$config_batch_dir/assignments.json"
              rm "$config_batch_dir/assignments.json"
            }
            config_batch <<'OPENCLAW_GATEWAY_BATCH'
            [
              {"path":"gateway.mode","value":"local"},
              {"path":"gateway.auth.mode","value":"token"},
              {"path":"gateway.auth.token","ref":{"source":"env","provider":"default","id":"OPENCLAW_GATEWAY_TOKEN"}},
              {"path":"gateway.controlUi.allowedOrigins","value":["https://openclaw.stinkyboi.com","http://openclaw.homelab","https://openclaw.homelab"]}
            ]
            OPENCLAW_GATEWAY_BATCH

            if [ -z "${GRAFANA_ALERT_HOOK_TOKEN:-}" ] || [ "$GRAFANA_ALERT_HOOK_TOKEN" = "REPLACE_ME" ]; then
              echo "GRAFANA_ALERT_HOOK_TOKEN is not populated; skipping hooks bootstrap"
            else
              config_batch <<'OPENCLAW_HOOK_ENABLE_BATCH'
            [
              {"path":"hooks.enabled","value":true},
              {"path":"hooks.path","value":"/hooks"}
            ]
            OPENCLAW_HOOK_ENABLE_BATCH
              # Clear the old authored env reference; otherwise OpenClaw preserves it.
              if python3 - "$OPENCLAW_CONFIG_PATH" <<'OPENCLAW_HOOK_REFERENCE'
            import json
            import pathlib
            import sys

            config = json.loads(pathlib.Path(sys.argv[1]).read_text())
            token = config.get("hooks", {}).get("token")
            sys.exit(0 if token == "${GRAFANA_ALERT_HOOK_TOKEN}" else 1)
            OPENCLAW_HOOK_REFERENCE
              then
                openclaw config unset hooks.token
              fi
              HOOK_TOKEN_JSON="$(python3 -c 'import json, os; print(json.dumps(os.environ["GRAFANA_ALERT_HOOK_TOKEN"]))')"
              config_batch <<OPENCLAW_HOOK_BATCH
            [
              {"path":"hooks.token","value":$HOOK_TOKEN_JSON},
              {"path":"hooks.defaultSessionKey","value":"agent:main:hooks:grafana-alerts"},
              {"path":"hooks.allowedAgentIds","value":["main"]},
              {"path":"hooks.allowRequestSessionKey","value":false}
            ]
            OPENCLAW_HOOK_BATCH
              unset HOOK_TOKEN_JSON
            fi

            config_batch <<'OPENCLAW_PLUGIN_BATCH'
            [
              {"path":"plugins.entries.codex.enabled","value":true},
              {"path":"plugins.entries.memory-wiki.enabled","value":true}
            ]
            OPENCLAW_PLUGIN_BATCH

            python3 /etc/openclaw-assistant/bootstrap.py
            openclaw config validate

            config_batch <<'OPENCLAW_SANDBOX_BATCH'
            [
              {"path":"agents.defaults.sandbox.mode","value":"off"},
              {"path":"tools.fs.workspaceOnly","value":true}
            ]
            OPENCLAW_SANDBOX_BATCH

            if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ "$DISCORD_BOT_TOKEN" = "REPLACE_ME" ]; then
              echo "DISCORD_BOT_TOKEN is not populated; skipping Discord channel config"
            else
              echo "DISCORD_BOT_TOKEN is populated; configuring the Discord channel"
              openclaw plugins enable discord --accept-capabilities
              verify_discord_plugin loaded
              config_batch <<'OPENCLAW_DISCORD_BATCH'
            [
              {"path":"channels.discord.enabled","value":true},
              {"path":"channels.discord.token","ref":{"source":"env","provider":"default","id":"DISCORD_BOT_TOKEN"}}
            ]
            OPENCLAW_DISCORD_BATCH
            fi

            if [ ! -s "$doctor_marker" ]; then
              if "$had_existing_state" && ! verify_backup_dir "$backup_dir"; then
                echo "Verified pre-upgrade backup required before doctor state migration" >&2
                exit 1
              fi
              mkdir -p "$doctor_reports"
              chmod 700 "$doctor_reports"
              cp "$OPENCLAW_CONFIG_PATH" "$doctor_config_snapshot.tmp"
              chmod 600 "$doctor_config_snapshot.tmp"
              mv "$doctor_config_snapshot.tmp" "$doctor_config_snapshot"
              if [ -f "$doctor_reports/latest.log" ]; then
                mv "$doctor_reports/latest.log" "$doctor_reports/previous.log"
              fi
              echo "Migrating remaining legacy state with pinned OpenClaw doctor"
              doctor_status=0
              (umask 077; timeout --signal=TERM --kill-after=30s 10m \
                openclaw doctor --fix --non-interactive \
                --no-workspace-suggestions > "$doctor_reports/latest.log" 2>&1) || doctor_status=$?
              # Doctor owns state migration; reviewed bootstrap owns configuration.
              restore_doctor_config
              if [ "$doctor_status" -ne 0 ]; then
                echo "Doctor migration failed; preserve private report and backup for review" >&2
                exit 1
              fi
              if [ -s "$migration_marker" ]; then
                report_dir="$OPENCLAW_STATE_DIR/session-sqlite-reports"
                session_preservation verify
              fi
              openclaw config validate
              printf 'doctor state migration and readiness checks passed\n' > "$doctor_marker.tmp"
              mv "$doctor_marker.tmp" "$doctor_marker"
            fi
    containers:
      app:
        lifecycle:
          postStart:
            exec:
              command:
                - python3
                - /etc/openclaw-assistant/reconcile.py
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.2@sha256:a8604855b76cd613cbaa45d6db093dc017b09a2faea5dc9cee023fb7ac262250"
        env:
          OPENCLAW_HOME: /data/openclaw
          OPENCLAW_CONFIG_PATH: /data/openclaw/config/openclaw.json
          OPENCLAW_STATE_DIR: /data/openclaw
          OPENCLAW_WORKSPACE_DIR: /data/openclaw/workspace
          OPENCLAW_SUPERVISOR_MODE: external
          OPENCLAW_NO_AUTO_UPDATE: "1"
          GIT_CONFIG_GLOBAL: /data/openclaw/gitconfig
          NIX_CONFIG: experimental-features = nix-command flakes
          PATH: /toolbox/profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: APP_SECRET
          GITHUB_APP_PRIVATE_KEY_PATH: /var/run/secrets/openclaw/github-app/private-key.pem
          LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000
          LITELLM_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: LITELLM_TOKEN
          DISCORD_BOT_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: DISCORD_BOT_TOKEN
          GRAFANA_USERNAME:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_USERNAME
          GRAFANA_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GRAFANA_PASSWORD
          GITHUB_APP_ID:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GITHUB_APP_ID
          GITHUB_APP_INSTALLATION_ID:
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GITHUB_APP_INSTALLATION_ID
        resources:
          requests:
            cpu: 1
            memory: 2Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: 1500m
            memory: 4Gi
            ephemeral-storage: 6Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 24
              periodSeconds: 5
              timeoutSeconds: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 2
              periodSeconds: 5
              timeoutSeconds: 3
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 36
              periodSeconds: 10
              timeoutSeconds: 3
      proxy:
        image:
          repository: ghcr.io/openclaw/openclaw
          tag: "2026.9.2@sha256:a8604855b76cd613cbaa45d6db093dc017b09a2faea5dc9cee023fb7ac262250"
        command:
          - python3
          - -u
          - -c
          - |
            import asyncio
            import contextlib

            LISTEN_HOST = "0.0.0.0"
            LISTEN_PORT = 8080
            TARGET_HOST = "127.0.0.1"
            TARGET_PORT = 18789

            async def pipe(reader, writer):
                try:
                    while data := await reader.read(65536):
                        writer.write(data)
                        await writer.drain()
                except (BrokenPipeError, ConnectionError):
                    pass
                finally:
                    with contextlib.suppress(Exception):
                        writer.write_eof()
                    writer.close()
                    with contextlib.suppress(Exception):
                        await writer.wait_closed()

            async def handle(client_reader, client_writer):
                peer = client_writer.get_extra_info("peername")
                try:
                    upstream_reader, upstream_writer = await asyncio.open_connection(
                        TARGET_HOST,
                        TARGET_PORT,
                    )
                except OSError as exc:
                    print(f"failed to connect upstream for {peer}: {exc}", flush=True)
                    client_writer.close()
                    with contextlib.suppress(Exception):
                        await client_writer.wait_closed()
                    return

                await asyncio.gather(
                    pipe(client_reader, upstream_writer),
                    pipe(upstream_reader, client_writer),
                    return_exceptions=True,
                )

            async def main():
                server = await asyncio.start_server(
                    handle,
                    LISTEN_HOST,
                    LISTEN_PORT,
                    backlog=256,
                )
                print(
                    f"proxying {LISTEN_HOST}:{LISTEN_PORT} to {TARGET_HOST}:{TARGET_PORT}",
                    flush=True,
                )
                async with server:
                    await server.serve_forever()

            asyncio.run(main())
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              failureThreshold: 3
              periodSeconds: 5
              timeoutSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi
