apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - externalsecret.yaml
  - networkpolicy.yaml
  - virtualservice.yaml
configMapGenerator:
  - name: openclaw-assistant
    files:
      - assistant/AGENTS.md
      - assistant/SOUL.md
      - assistant/TOOLS.md
      - assistant/HEARTBEAT.md
      - assistant/config.json
      - assistant/jobs.json
      - assistant/retired-jobs.json
      - assistant/bootstrap.py
      - assistant/reconcile.py
generatorOptions:
  disableNameSuffixHash: true
