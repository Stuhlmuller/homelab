apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-updater-busybox-canary
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: image-updater-busybox-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-updater-busybox-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: busybox
          image: harbor.stinkyboi.com/mirror/docker.io/library/busybox:issue-1846-canary
          imagePullPolicy: Always
          command: ["/bin/sleep", "86400"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
