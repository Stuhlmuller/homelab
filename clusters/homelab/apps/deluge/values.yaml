serviceAccount:
  deluge: {}
controllers:
  deluge:
    serviceAccount:
      identifier: deluge
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: zimaboard-0
      annotations:
        homelab.rst.io/rollout-strategy: "recreate-singleton"
        homelab.rst.io/wireguard-address-mode: "ipv4-only"
        homelab.rst.io/wireguard-profile-renderer-revision: "strip-ipv6-routes-v1"
        homelab.rst.io/wireguard-profile-ssm-version: "4"
    strategy: Recreate
    initContainers:
      download-dirs:
        image:
          repository: busybox
          tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command:
          - /bin/sh
          - -ec
          - |
            mkdir -p \
              /downloads/incomplete \
              /downloads/complete/radarr \
              /downloads/complete/sonarr \
              /downloads/complete/manual
      gluetun:
        image:
          repository: ghcr.io/qdm12/gluetun
          tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        restartPolicy: Always
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - (ip rule del table 51820; ip -6 rule del table 51820) || true
        command:
          - /bin/sh
          - -ec
          - |
            profile_value() {
              awk -F= -v key="$1" '
                tolower($1) ~ "^[[:space:]]*" key "[[:space:]]*$" {
                  value=substr($0, index($0, "=") + 1)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                  exit
                }
              ' /vpn-source/wg0.conf
            }
            export WIREGUARD_PRIVATE_KEY="$(profile_value privatekey)"
            export WIREGUARD_PRESHARED_KEY="$(profile_value presharedkey)"
            export WIREGUARD_ADDRESSES="$(
              profile_value address |
                tr ',' '\n' |
                awk '
                  /^[[:space:]]*[0-9]+([.][0-9]+){3}\/[0-9]+[[:space:]]*$/ {
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                    print
                    exit
                  }
                '
            )"
            test -n "$WIREGUARD_PRIVATE_KEY"
            test -n "$WIREGUARD_PRESHARED_KEY"
            test -n "$WIREGUARD_ADDRESSES"
            exec /gluetun-entrypoint
        env:
          TZ: America/Los_Angeles
          VPN_SERVICE_PROVIDER: airvpn
          VPN_TYPE: wireguard
          FIREWALL: "on"
          FIREWALL_INPUT_PORTS: "8112"
          FIREWALL_VPN_INPUT_PORTS: "5983"
          HEALTH_RESTART_VPN: "on"
          PUBLICIP_ENABLED: "off"
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /gluetun-entrypoint
                  - healthcheck
              failureThreshold: 36
              periodSeconds: 5
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /gluetun-entrypoint
                  - healthcheck
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /gluetun-entrypoint
                  - healthcheck
              failureThreshold: 3
              periodSeconds: 30
              timeoutSeconds: 5
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/deluge
          tag: 18.04.1@sha256:0ac8716243944d28890565f759c7cedfc9e36a3fd5a827c9d0927abc0c8f97c9
        command:
          - /bin/sh
          - -ec
          - |
            validate_session_states() {
              timeout 15s python3 - "$@" <<'PY'
            import libtorrent as lt, sys
            session = lt.session()
            for path in sys.argv[1:]:
                with open(path, "rb") as state_file:
                    state = lt.bdecode(state_file.read())
                session.load_state(state)
            PY
            }

            normalize_web_daemon_host() {
              python3 - <<'PY'
            import os
            from deluge.config import Config

            if os.path.exists("/config/hostlist.conf"):
                config = Config("hostlist.conf", config_dir="/config")
                hosts = config.get("hosts", [])
                changed = False
                for host in hosts:
                    if isinstance(host, list) and len(host) > 1 and host[1] == "localhost":
                        host[1] = "127.0.0.1"
                        changed = True
                if changed:
                    config["hosts"] = hosts
                    if not config.save():
                        raise RuntimeError("Unable to save normalized Deluge hostlist")
                    print("Normalized Deluge Web daemon host to 127.0.0.1")
            PY
            }

            state=/config/session.state
            backup=${state}.bak
            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"

            if ! [ -e "$state" ] && ! [ -e "$backup" ]; then
              echo "No persisted session state found; allowing Deluge to initialize it"
            elif ! [ -s "$state" ] || ! validate_session_states "$state"; then
              test -s "$backup"
              validate_session_states "$backup"
              if [ -e "$state" ]; then
                archive="${state}.broken-${timestamp}"
                cp -a "$state" "$archive"
                echo "Archived invalid session state at $archive"
              fi
              cp -a "$backup" "$state"
              echo "Restored validated session state backup"
            elif [ -e "$backup" ]; then
              if ! [ -s "$backup" ] || ! validate_session_states "$state" "$backup"; then
                archive="${backup}.broken-${timestamp}"
                cp -a "$backup" "$archive"
                cp -a "$state" "$backup"
                echo "Archived incompatible session state backup at $archive and refreshed it from current state"
              fi
            fi

            python3 /scripts/recover-torrent-catalog.py
            normalize_web_daemon_host
            chown "${PUID}:${PGID}" /config
            rm -f /etc/cont-init.d/30-config
            exec /init
        env:
          TZ: America/Los_Angeles
          PUID: "1000"
          PGID: "1000"
        resources:
          requests:
            cpu: 450m
            memory: 256Mi
          limits:
            cpu: 600m
            memory: 512Mi
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - s6-svc -d /var/run/s6/services/deluged && timeout 20s s6-svwait -d /var/run/s6/services/deluged || true
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - timeout 25s deluge-console -c /config status >/dev/null 2>&1
              failureThreshold: 180
              periodSeconds: 10
              timeoutSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - timeout 10s curl -fsS -o /dev/null http://127.0.0.1:8112/
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 15
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - timeout 25s deluge-console -c /config status >/dev/null 2>&1
              failureThreshold: 60
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 30
      port-config:
        image:
          repository: lscr.io/linuxserver/deluge
          tag: 18.04.1@sha256:0ac8716243944d28890565f759c7cedfc9e36a3fd5a827c9d0927abc0c8f97c9
        env:
          DELUGE_INCOMING_PORT: "5983"
        command:
          - /bin/sh
          - -ec
          - |
            marker=/tmp/deluge-port-configured
            rm -f "$marker"
            port_command="config --set random_port false"
            port_command="${port_command}; config --set listen_ports (${DELUGE_INCOMING_PORT}, ${DELUGE_INCOMING_PORT})"
            port_command="${port_command}; config --set random_outgoing_ports true"

            verify_port_config() {
              python3 - <<'PY'
            import os
            from deluge.config import Config

            port = int(os.environ["DELUGE_INCOMING_PORT"])
            config = Config("core.conf", config_dir="/config")
            actual = {
                "listen_ports": tuple(config.get("listen_ports", ())),
                "random_outgoing_ports": config.get("random_outgoing_ports"),
                "random_port": config.get("random_port"),
            }
            expected = {
                "listen_ports": (port, port),
                "random_outgoing_ports": True,
                "random_port": False,
            }
            if actual != expected:
                raise SystemExit(f"Deluge port configuration has not converged: {actual!r}")
            PY
            }

            reconcile_port_config() {
              verify_port_config && return 0
              timeout 30s deluge-console -c /config "$port_command" || return 1
              sleep 2
              verify_port_config
            }

            until reconcile_port_config; do
              echo "Deluge is not ready for port reconciliation; retrying in 60 seconds" >&2
              sleep 60
            done
            touch "$marker"

            while true; do
              sleep 300
              if reconcile_port_config; then
                touch "$marker"
              else
                rm -f "$marker"
                echo "Deluge port reconciliation failed; retrying after the normal interval" >&2
              fi
            done
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 1
            memory: 64Mi
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
      daemon-metrics:
        image:
          repository: lscr.io/linuxserver/deluge
          tag: 18.04.1@sha256:0ac8716243944d28890565f759c7cedfc9e36a3fd5a827c9d0927abc0c8f97c9
        command:
          - python3
          - -c
          - |
            import subprocess
            import textwrap
            import threading
            import time
            import urllib.request
            from http.server import BaseHTTPRequestHandler, HTTPServer


            REFRESH_SECONDS = 60
            cached_metrics = (0, 0, 0, 0)


            def parse_status(output):
                total = errors = 0
                for line in output.splitlines():
                    key, _, value = line.partition(":")
                    if key.strip() == "Total torrents":
                        total = int(value.strip() or 0)
                    elif key.strip() == "Error":
                        errors = int(value.strip() or 0)
                return total, errors


            assert parse_status("Total torrents: 2\nError: 1\n") == (2, 1)


            def deluge_status():
                try:
                    result = subprocess.run(
                        ["deluge-console", "-c", "/config", "status"],
                        stdout=subprocess.PIPE,
                        stderr=subprocess.PIPE,
                        universal_newlines=True,
                        timeout=20,
                    )
                    if result.returncode != 0:
                        return 0, 0, 0
                    total, errors = parse_status(result.stdout)
                    return 1, total, errors
                except Exception:
                    return 0, 0, 0


            def vpn_healthy():
                try:
                    urllib.request.urlopen("http://127.0.0.1:9999/", timeout=5).close()
                    return 1
                except Exception:
                    return 0


            def refresh_metrics():
                global cached_metrics
                while True:
                    healthy, total, errors = deluge_status()
                    cached_metrics = (healthy, vpn_healthy(), total, errors)
                    time.sleep(REFRESH_SECONDS)


            class MetricsHandler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path != "/metrics":
                        self.send_response(404)
                        self.end_headers()
                        return
                    healthy, vpn, total, errors = cached_metrics
                    body = textwrap.dedent(f"""\
                        # HELP deluge_daemon_rpc_healthy Whether deluge-console can query the Deluge daemon.
                        # TYPE deluge_daemon_rpc_healthy gauge
                        deluge_daemon_rpc_healthy {healthy}
                        # HELP deluge_vpn_healthy Whether the Gluetun VPN health endpoint is healthy.
                        # TYPE deluge_vpn_healthy gauge
                        deluge_vpn_healthy {vpn}
                        # HELP deluge_torrents_total Number of torrents reported by Deluge.
                        # TYPE deluge_torrents_total gauge
                        deluge_torrents_total {total}
                        # HELP deluge_torrents_error Number of torrents currently in Deluge Error state.
                        # TYPE deluge_torrents_error gauge
                        deluge_torrents_error {errors}
                    """).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "text/plain; version=0.0.4")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)

                def log_message(self, format, *args):
                    return


            threading.Thread(target=refresh_metrics, daemon=True).start()
            HTTPServer(("0.0.0.0", 9797), MetricsHandler).serve_forever()
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 1
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 1000
          runAsUser: 1000
service:
  app:
    controller: deluge
    ports:
      http:
        port: 8112
      metrics:
        port: 9797
persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: deluge-config-local
    advancedMounts:
      deluge:
        app:
          - path: /config
        port-config:
          - path: /config
        daemon-metrics:
          - path: /config
            readOnly: true
  downloads:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-downloads
    advancedMounts:
      deluge:
        download-dirs:
          - path: /downloads
            subPath: downloads
        app:
          - path: /downloads
            subPath: downloads
  recovery-script:
    enabled: true
    type: configMap
    name: deluge-catalog-recovery
    advancedMounts:
      deluge:
        app:
          - path: /scripts
            readOnly: true
  tun:
    enabled: true
    type: hostPath
    hostPath: /dev/net/tun
    hostPathType: CharDevice
    advancedMounts:
      deluge:
        gluetun:
          - path: /dev/net/tun
  vpn-profile-source:
    enabled: true
    type: secret
    name: deluge-vpn
    items:
      - key: wg0.conf
        path: wg0.conf
    advancedMounts:
      deluge:
        gluetun:
          - path: /vpn-source
            readOnly: true
