apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - gateway.yaml
  - election-access.yaml
configMapGenerator:
  - name: deluge-gluetun-wrapper
    files:
      - gluetun-wrapper.sh
    options:
      disableNameSuffixHash: true
images:
