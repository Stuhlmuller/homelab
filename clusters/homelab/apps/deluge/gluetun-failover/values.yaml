# Load after the original values only after the former in-pod Gluetun has stopped.
configMaps:
  gluetun-profiling:
    enabled: false
controllers:
  deluge:
    pod:
      imagePullSecrets:
        - name: deluge-vpn-harbor-pull
      dnsPolicy: None
      dnsConfig: {nameservers: [127.0.0.1]}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
    initContainers:
      download-dirs:
        dependsOn: vpn-guard
        securityContext: &applicationSecurity
          allowPrivilegeEscalation: false
          capabilities: {drop: [NET_ADMIN, NET_RAW]}
      gluetun:
        enabled: false
      vpn-guard:
        image: &helperImage
          repository: harbor.stinkyboi.com/homelab/homelab-deluge-vpn
          tag: staged
          pullPolicy: IfNotPresent
        command: [python3, -B, /opt/deluge-gluetun/network.py, client-init]
        securityContext: &helperSecurity
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          capabilities: {drop: [ALL], add: [NET_ADMIN]}
        resources:
          requests: {cpu: 40m, memory: 32Mi}
          limits: {cpu: 200m, memory: 64Mi}
    containers:
      app:
        securityContext: *applicationSecurity
      port-config:
        securityContext: *applicationSecurity
      daemon-metrics:
        securityContext: *applicationSecurity
      vpn-health:
        image: *helperImage
        command: [python3, -B, /opt/deluge-gluetun/health.py]
        securityContext:
          <<: *helperSecurity
          capabilities: {drop: [ALL], add: [NET_ADMIN, NET_BIND_SERVICE]}
        resources:
          requests: {cpu: 50m, memory: 48Mi}
          limits: {cpu: 300m, memory: 128Mi}
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: [python3, -B, /opt/deluge-gluetun/health.py, check]
              periodSeconds: 3
              timeoutSeconds: 2
              failureThreshold: 1
service:
  app:
    forceRename: deluge
    primary: true
    ports:
      metrics:
        enabled: false
  metrics:
    forceRename: deluge-metrics
    controller: deluge
    publishNotReadyAddresses: true
    ports:
      metrics: {port: 9797}
persistence:
  gluetun-profiling:
    enabled: false
  tun:
    enabled: false
  vpn-profile-source:
    defaultMode: 256
    advancedMounts:
      deluge:
        vpn-guard:
          - {path: /vpn-source, readOnly: true}
        vpn-health:
          - {path: /vpn-source, readOnly: true}
