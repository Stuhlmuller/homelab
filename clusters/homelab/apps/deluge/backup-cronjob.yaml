apiVersion: batch/v1
kind: CronJob
metadata:
  name: deluge-config-backup
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    checkov.io/skip1: CKV_K8S_40=The backup must run as Deluge UID 1000 to read mode-600 config files without weakening their permissions.
  labels:
    app.kubernetes.io/name: deluge-config-backup
    app.kubernetes.io/part-of: homelab-media
spec:
  schedule: "30 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: deluge-config-backup
            app.kubernetes.io/part-of: homelab-media
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: zimaboard-0
          restartPolicy: Never
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: harbor.stinkyboi.com/mirror/cgr.dev/chainguard/busybox:latest@sha256:f7d9063f22547e726221275158930e5033be3c6d8340c6867afb7d0d779fad8d
              command:
                - /bin/sh
                - -ec
                - |
                  umask 0077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup_root=/backup/local-backups
                  partial="${backup_root}/.${timestamp}.tar.gz.partial"
                  complete="${backup_root}/${timestamp}.tar.gz"
                  mkdir -p "$backup_root"

                  tar -czf "$partial" -C /config .
                  tar -tzf "$partial" >/dev/null
                  mv "$partial" "$complete"
                  echo "completed backup ${timestamp}: ${complete}"

                  find "$backup_root" \
                    -maxdepth 1 -type f \
                    -name '20[0-9][0-9][01][0-9][0-3][0-9]T[0-2][0-9][0-5][0-9][0-5][0-9]Z.tar.gz' \
                    -mtime +13 -delete
                  find "$backup_root" \
                    -maxdepth 1 -type f \
                    -name '.*.partial' -mtime +1 -delete
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: local-config
                  mountPath: /config
                  readOnly: true
                - name: backup-config
                  mountPath: /backup
          volumes:
            - name: local-config
              persistentVolumeClaim:
                claimName: deluge-config-local
                readOnly: true
            - name: backup-config
              persistentVolumeClaim:
                claimName: deluge-config
