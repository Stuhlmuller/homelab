---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-config
  namespace: media
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/part-of: homelab-media
    homelab.stuhlmuller.dev/data-class: app-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-downloads
  namespace: media
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/part-of: homelab-media
    homelab.stuhlmuller.dev/data-class: legacy-migration-source
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: nfs-default
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-downloads
  labels:
    app.kubernetes.io/name: media-downloads
    app.kubernetes.io/part-of: homelab-media
    homelab.stuhlmuller.dev/storage-backend: qnap-media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 500Gi
  claimRef:
    name: media-downloads
    namespace: media
  mountOptions:
    - nfsvers=3
  nfs:
    path: /media
    server: 10.1.0.2
  persistentVolumeReclaimPolicy: Retain
  storageClassName: media-qnap-static
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-downloads
  namespace: media
  labels:
    app.kubernetes.io/name: media-downloads
    app.kubernetes.io/part-of: homelab-media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: media-qnap-static
  volumeName: media-downloads
---
apiVersion: batch/v1
kind: Job
metadata:
  name: media-downloads-directories
  namespace: media
  labels:
    app.kubernetes.io/name: media-downloads-directories
    app.kubernetes.io/part-of: homelab-media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-downloads-directories
        app.kubernetes.io/part-of: homelab-media
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare-directories
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              umask 0000
              mkdir -p \
                /target/downloads/incomplete \
                /target/downloads/complete/radarr \
                /target/downloads/complete/sonarr \
                /target/downloads/complete/manual

              chmod a+rwX /target/downloads /target/downloads/incomplete /target/downloads/complete /target/downloads/complete/radarr /target/downloads/complete/sonarr /target/downloads/complete/manual
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: media-downloads
              mountPath: /target
      volumes:
        - name: media-downloads
          persistentVolumeClaim:
            claimName: media-downloads
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-downloads-directories
  namespace: media
  labels:
    app.kubernetes.io/name: media-downloads-directories
    app.kubernetes.io/part-of: homelab-media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media-downloads-directories
      app.kubernetes.io/part-of: homelab-media
  policyTypes:
    - Ingress
    - Egress
