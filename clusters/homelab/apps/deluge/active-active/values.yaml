# Load after ../values.yaml only once both standalone gateways have passed acceptance.
configMaps:
  gluetun-profiling:
    enabled: false
controllers:
  deluge:
    pod:
      annotations:
        homelab.rst.io/vpn-transit-revision: "1"
      imagePullSecrets:
        - name: deluge-vpn-harbor-pull
      dnsPolicy: None
      dnsConfig:
        nameservers: [127.0.0.1]
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    initContainers:
      download-dirs:
        dependsOn: vpn-client-preflight
        securityContext: &applicationSecurity
          allowPrivilegeEscalation: false
          capabilities:
            drop: [NET_RAW, NET_ADMIN]
      gluetun:
        enabled: false
      vpn-guard:
        image: &vpnImage
          # Replace the staged tag with the published immutable tag and digest before activation.
          repository: harbor.stinkyboi.com/homelab/homelab-deluge-vpn
          tag: staged
        command: [python3, /opt/deluge-vpn/network.py, client-init]
        securityContext: &networkSecurity
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          capabilities:
            drop: [ALL]
            add: [NET_ADMIN]
        resources:
          requests: {cpu: 50m, memory: 24Mi}
          limits: {cpu: 200m, memory: 64Mi}
      vpn-client-preflight:
        dependsOn: vpn-guard
        image:
          repository: harbor.stinkyboi.com/mirror/lscr.io/linuxserver/deluge
          tag: 18.04.1@sha256:0ac8716243944d28890565f759c7cedfc9e36a3fd5a827c9d0927abc0c8f97c9
        command: [python3, -B, /scripts/vpn-client-preflight.py]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 128Mi}
    containers:
      app:
        securityContext: *applicationSecurity
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  for service in /run/service/svc-deluged /var/run/s6/services/deluged; do
                    if [ -d "$service" ]; then
                      s6-svc -d "$service"
                      timeout 20s s6-svwait -d "$service"
                      break
                    fi
                  done
        probes:
          readiness:
            spec:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - timeout 10s curl -fsS -o /dev/null http://127.0.0.1:8112/ && python3 -B /vpn-preflight/vpn-client-preflight.py --listeners
      port-config:
        securityContext: *applicationSecurity
      daemon-metrics:
        securityContext: *applicationSecurity
      vpn-health:
        image: *vpnImage
        command: [python3, /opt/deluge-vpn/health.py]
        securityContext:
          <<: *networkSecurity
          capabilities:
            drop: [ALL]
            add: [NET_ADMIN, NET_BIND_SERVICE]
        resources:
          requests: {cpu: 75m, memory: 48Mi}
          limits: {cpu: 300m, memory: 128Mi}
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - python3
                  - -c
                  - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/', timeout=1).close()
              periodSeconds: 3
              timeoutSeconds: 2
              failureThreshold: 1
      vpn-metrics:
        image: *vpnImage
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 24Mi}
          limits: {cpu: 100m, memory: 64Mi}
        command:
          - python3
          - -c
          - |
            from http.server import BaseHTTPRequestHandler, HTTPServer
            from urllib.request import urlopen

            class MetricsProxy(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path != '/metrics':
                        self.send_error(404)
                        return
                    try:
                        with urlopen('http://127.0.0.1:9999/metrics', timeout=2) as response:
                            payload = response.read(16384)
                    except OSError:
                        self.send_error(503)
                        return
                    self.send_response(200)
                    self.send_header('Content-Type', 'text/plain; version=0.0.4')
                    self.send_header('Content-Length', str(len(payload)))
                    self.end_headers()
                    self.wfile.write(payload)

                def log_message(self, format, *args):
                    return

            HTTPServer(('0.0.0.0', 9798), MetricsProxy).serve_forever()
service:
  app:
    forceRename: deluge
    primary: true
    ports:
      metrics:
        enabled: false
  metrics:
    forceRename: deluge-metrics
    controller: deluge
    publishNotReadyAddresses: true
    ports:
      metrics: {port: 9797}
      vpn-metrics: {port: 9798}
persistence:
  gluetun-profiling:
    enabled: false
  tun:
    enabled: false
  vpn-profile-source:
    enabled: false
  config:
    advancedMounts:
      deluge:
        vpn-client-preflight:
          - {path: /config, readOnly: true}
  vpn-client-preflight:
    type: configMap
    name: deluge-vpn-client-preflight
    advancedMounts:
      deluge:
        vpn-client-preflight:
          - {path: /scripts, readOnly: true}
        app:
          - {path: /vpn-preflight, readOnly: true}
  vpn-transit:
    type: secret
    name: deluge-vpn-client-transit
    defaultMode: 256
    advancedMounts:
      deluge:
        vpn-guard:
          - {path: /vpn/transit, readOnly: true}
        vpn-health:
          - {path: /vpn/transit, readOnly: true}
