apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - gateways.yaml
  - externalsecrets.yaml
configMapGenerator:
  - name: deluge-vpn-client-preflight
    files:
      - vpn-client-preflight.py
generatorOptions:
  disableNameSuffixHash: true
images:
  # Replace with the protected Harbor publisher's immutable tag and digest before staging.
  - name: harbor.stinkyboi.com/homelab/homelab-deluge-vpn
    newTag: staged
