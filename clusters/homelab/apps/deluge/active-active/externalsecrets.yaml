apiVersion: v1
kind: List
items:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: deluge-vpn-harbor-pull
      annotations:
        homelab.stuhlmuller.dev/generated-secret-revision: "v1"
    spec:
      refreshPolicy: OnChange
      secretStoreRef: &store {kind: ClusterSecretStore, name: aws-ssm}
      target:
        creationPolicy: Owner
        deletionPolicy: Retain
        template:
          engineVersion: v2
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: >-
              {"auths":{"harbor.stinkyboi.com":{"username":"robot$homelab+pull","password":{{ .password | toJson }},"auth":"{{ printf "robot$homelab+pull:%s" .password | b64enc }}"}}}
      data:
        - secretKey: password
          remoteRef: {key: /homelab/deluge/harbor-pull-password}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: deluge-vpn-a-airvpn
      annotations: &profileAnnotations
        homelab.rst.io/vpn-profile-revision: "1"
    spec: &airvpnSpec
      refreshPolicy: OnChange
      secretStoreRef: *store
      target: &target {creationPolicy: Owner, deletionPolicy: Retain}
      data:
        - secretKey: wg0.conf
          remoteRef: {key: /homelab/deluge/vpn/a/airvpn-profile}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: deluge-vpn-b-airvpn
      annotations: *profileAnnotations
    spec:
      <<: *airvpnSpec
      data:
        - secretKey: wg0.conf
          remoteRef: {key: /homelab/deluge/vpn/b/airvpn-profile}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: deluge-vpn-a-transit
      annotations: *profileAnnotations
    spec: &transitSpec
      refreshPolicy: OnChange
      secretStoreRef: *store
      target: *target
      data:
        - secretKey: private
          remoteRef: {key: /homelab/deluge/vpn/a/gateway-transit, property: private}
        - secretKey: peer.public
          remoteRef: {key: /homelab/deluge/vpn/a/gateway-transit, property: peer_public}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: deluge-vpn-b-transit
      annotations: *profileAnnotations
    spec:
      <<: *transitSpec
      data:
        - secretKey: private
          remoteRef: {key: /homelab/deluge/vpn/b/gateway-transit, property: private}
        - secretKey: peer.public
          remoteRef: {key: /homelab/deluge/vpn/b/gateway-transit, property: peer_public}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: deluge-vpn-client-transit
      annotations:
        homelab.rst.io/vpn-transit-revision: "1"
    spec:
      <<: *transitSpec
      data:
        - secretKey: a.private
          remoteRef: {key: /homelab/deluge/vpn/a/client-transit, property: private}
        - secretKey: a.public
          remoteRef: {key: /homelab/deluge/vpn/a/client-transit, property: peer_public}
        - secretKey: b.private
          remoteRef: {key: /homelab/deluge/vpn/b/client-transit, property: private}
        - secretKey: b.public
          remoteRef: {key: /homelab/deluge/vpn/b/client-transit, property: peer_public}
