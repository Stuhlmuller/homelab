            - --ignore-not-found=true
            - --wait=false
            - --cache-dir=/tmp/kubectl-cache
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: remove-cutover-identity
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          command:
            - kubectl
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: "10.1.0.199"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
          args:
            - --namespace=media
            - delete
            - job/deluge-namespace-cutover
            - rolebinding.rbac.authorization.k8s.io/deluge-namespace-cutover
            - role.rbac.authorization.k8s.io/deluge-namespace-cutover
            - serviceaccount/deluge-namespace-cutover
            - --ignore-not-found=true
            - --wait=false
            - --cache-dir=/tmp/kubectl-cache
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
