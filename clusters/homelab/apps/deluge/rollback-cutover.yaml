apiVersion: v1
kind: ServiceAccount
metadata:
  name: deluge-namespace-cutover
  namespace: media
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deluge-namespace-cutover
  namespace: deluge
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - deluge
    verbs:
      - delete
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deluge-namespace-cutover
  namespace: deluge
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deluge-namespace-cutover
subjects:
  - kind: ServiceAccount
    name: deluge-namespace-cutover
    namespace: media
---
apiVersion: batch/v1
kind: Job
metadata:
  name: deluge-namespace-cutover
  namespace: media
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
    checkov.io/skip1: CKV_K8S_38=The scoped rollback Job needs a ServiceAccount token to delete only the named Deluge Deployment.
spec:
  activeDeadlineSeconds: 360
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deluge-namespace-cutover
        app.kubernetes.io/part-of: homelab-media
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: deluge-namespace-cutover
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stop-isolated-deluge
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          command:
            - kubectl
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: "10.1.0.199"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
          args:
            - --namespace=deluge
            - delete
            - deployment
            - deluge
            - --ignore-not-found=true
            - --cascade=foreground
            - --wait=true
            - --timeout=300s
            - --cache-dir=/tmp/kubectl-cache
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
