apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multica-backend-github-secrets
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: multica-backend-github-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        DATABASE_URL: "postgres://multica:{{ .POSTGRES_PASSWORD }}@multica-postgres:5432/multica?sslmode=disable"
        MULTICA_DEV_VERIFICATION_CODE: "{{ .MULTICA_DEV_VERIFICATION_CODE }}"
        GITHUB_APP_SLUG: "{{ .GITHUB_APP_SLUG }}"
        GITHUB_APP_ID: "{{ .GITHUB_APP_ID }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY }}"
        GITHUB_WEBHOOK_SECRET: "{{ .GITHUB_WEBHOOK_SECRET }}"
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /homelab/multica/jwt-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /homelab/multica/postgres-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: MULTICA_DEV_VERIFICATION_CODE
      remoteRef:
        key: /homelab/multica/dev-verification-code
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GITHUB_APP_SLUG
      remoteRef:
        key: /homelab/multica/github-app/slug
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: /homelab/multica/github-app/id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: /homelab/multica/github-app/private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Multica environment key name, not secret material.
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: /homelab/multica/github-app/webhook-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
