apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multica-secrets
  namespace: ai
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: multica-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        DATABASE_URL: "postgres://multica:{{ .POSTGRES_PASSWORD }}@multica-postgres:5432/multica?sslmode=disable"
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /homelab/multica/jwt-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /homelab/multica/postgres-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
