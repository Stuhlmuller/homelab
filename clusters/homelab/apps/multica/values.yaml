images:
  backend:
    repository: ghcr.io/multica-ai/multica-backend
    # checkov:skip=CKV_SECRET_6: OCI image digest pin, not secret material.
    tag: v0.4.29@sha256:d7a11917ee768aabc2cab34e89b6897de1c45b321ca44a6c5e5e33e223276f66
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/multica-ai/multica-web
    # checkov:skip=CKV_SECRET_6: OCI image digest pin, not secret material.
    tag: v0.4.29@sha256:2aba8c3507fb869c1562eca50cc27e5a696bdca8880678c8c8ccecc113572e4f
    pullPolicy: IfNotPresent
  postgres:
    repository: pgvector/pgvector
    # checkov:skip=CKV_SECRET_6: OCI image digest pin, not secret material.
    tag: pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    pullPolicy: IfNotPresent

existingSecret: multica-secrets

postgres:
  external:
    enabled: false
  database: multica
  user: multica
  persistence:
    size: 20Gi
    storageClass: nfs-default
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

backend:
  replicas: 1
  uploads:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: nfs-default
      accessModes:
        - ReadWriteOnce
  config:
    appEnv: production
    appUrl: https://multica.stinkyboi.com
    frontendOrigin: https://multica.stinkyboi.com
    corsAllowedOrigins: ""
    cookieDomain: ""
    resendFromEmail: noreply@stinkyboi.com
    allowSignup: true
    allowedEmails: ""
    allowedEmailDomains: ""
    disableWorkspaceCreation: false
    vcsIntegrationEnabled: false
    googleClientId: ""
    googleRedirectUri: https://multica.stinkyboi.com/auth/callback
    s3Bucket: ""
    s3Region: us-west-2
    cloudfrontDomain: ""
    cloudfrontKeyPairId: ""
    localUploadBaseUrl: https://multica.stinkyboi.com
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

frontend:
  replicas: 1
  config:
    remoteApiUrl: http://multica-backend:8080
    docsUrl: ""
    publicApiUrl: ""
    publicWsUrl: ""
  compatibility:
    backendAlias: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

ingress:
  enabled: false

monitoring:
  prometheusRule:
    enabled: false
