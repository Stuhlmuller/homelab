images:
  backend:
    repository: ghcr.io/multica-ai/multica-backend
    # checkov:skip=CKV_SECRET_6: OCI image digest pin, not secret material.
    tag: v0.6.1@sha256:824d42a4a4436efad96a2d15354a5512786c895672ac48fa05f9b2be4d8fbd5c
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/multica-ai/multica-web
    # checkov:skip=CKV_SECRET_6: OCI image digest pin, not secret material.
    tag: v0.6.1@sha256:cc8260b0371661896dce52f968c8822d8275e0b275a43484347e5a59efffbb7c
    pullPolicy: IfNotPresent
  postgres:
    repository: pgvector/pgvector
    # checkov:skip=CKV_SECRET_6: OCI image digest pin, not secret material.
    tag: pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    pullPolicy: IfNotPresent

# checkov:skip=CKV_SECRET_6: Kubernetes Secret name, not secret material.
existingSecret: multica-backend-secrets

postgres:
  external:
    enabled: true
  database: multica
  user: multica
  persistence:
    size: 20Gi
    storageClass: nfs-default
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

backend:
  replicas: 1
  uploads:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: nfs-default
      accessModes:
        - ReadWriteOnce
  config:
    # Fixed-code sign-in is available only outside production; Octelium gates access.
    appEnv: development
    appUrl: https://multica.stinkyboi.com
    frontendOrigin: https://multica.stinkyboi.com
    corsAllowedOrigins: ""
    cookieDomain: ""
    resendFromEmail: noreply@stinkyboi.com
    allowSignup: true
    allowedEmails: ""
    allowedEmailDomains: ""
    disableWorkspaceCreation: false
    # Keep self-host usage telemetry disabled across upgrades.
    doNotTrack: "1"
    vcsIntegrationEnabled: false
    googleClientId: ""
    googleRedirectUri: https://multica.stinkyboi.com/auth/callback
    s3Bucket: ""
    s3Region: us-west-2
    cloudfrontDomain: ""
    cloudfrontKeyPairId: ""
    localUploadBaseUrl: https://multica.stinkyboi.com
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

frontend:
  replicas: 1
  config:
    remoteApiUrl: http://multica-backend:8080
    docsUrl: ""
    publicApiUrl: ""
    publicWsUrl: ""
  compatibility:
    backendAlias: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

ingress:
  enabled: false
