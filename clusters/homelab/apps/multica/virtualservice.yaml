apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: multica-octelium
  namespace: ai
  annotations:
    homelab.rst.io/access-plane: octelium
    homelab.rst.io/public-funnel: "false"
spec:
  hosts:
    - multica.stinkyboi.com
  gateways:
    - istio-system/tailnet-gateway
  http:
    - match:
        - uri:
            prefix: /api
        - uri:
            prefix: /auth
        - uri:
            prefix: /ws
      route:
        - destination:
            host: multica-backend.ai.svc.cluster.local
            port:
              number: 8080
    - route:
        - destination:
            host: multica-frontend.ai.svc.cluster.local
            port:
              number: 3000
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: connect-failure,refused-stream,reset,5xx
