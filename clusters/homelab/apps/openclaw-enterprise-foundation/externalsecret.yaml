apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: occ-postgres-admin
  namespace: openclaw-system
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef: {kind: ClusterSecretStore, name: aws-ssm}
  target:
    name: occ-postgres-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/openclaw-enterprise/postgres-admin-password
---
