apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: occ-database
  namespace: openclaw-system
  annotations:
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef: {kind: ClusterSecretStore, name: aws-ssm}
  target:
    name: occ-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # shortcut: Generated passwords are alphanumeric; URL-encode if that source contract changes.
        application-url: 'postgresql://occ_app:{{ .app_password }}@occ-postgres.openclaw-system.svc.cluster.local:5432/openclaw_enterprise?sslmode=verify-full&sslrootcert=/etc/openclaw/database-ca/tls.crt'
        migration-url: 'postgresql://occ_migrator:{{ .migrator_password }}@occ-postgres.openclaw-system.svc.cluster.local:5432/openclaw_enterprise?sslmode=verify-full&sslrootcert=/etc/openclaw/database-ca/tls.crt'
  data:
    - secretKey: app_password
      remoteRef:
        key: /homelab/openclaw-enterprise/postgres-app-password
    - secretKey: migrator_password
      remoteRef:
        key: /homelab/openclaw-enterprise/postgres-migrator-password
---
