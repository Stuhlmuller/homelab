apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-system-default-deny-ingress
  namespace: openclaw-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occ-postgres-ingress
  namespace: openclaw-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occ-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw-enterprise
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, initialization]
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: occ-postgres-backup
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occ-postgres-restore-drill-isolation
  namespace: openclaw-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occ-postgres-restore-drill
  policyTypes: [Ingress, Egress]
---
# Dormant T051 reader boundary. NetworkPolicy is additive: a future protected
# coordinator must reject other matching egress allows and prove enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occ-operator-reader-isolation
  namespace: openclaw-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occ-recovery-reader
      app.kubernetes.io/component: operator
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occ-tenant-reader-isolation
  namespace: openclaw-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occ-recovery-reader
      app.kubernetes.io/component: tenant
  policyTypes: [Ingress, Egress]
