apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-postgres-backup
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    checkov.io/skip1: CKV2_K8S_6=The backup workload is covered by sibling networkpolicy.yaml.
spec:
  schedule: "35 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: harbor-postgres-backup
            app.kubernetes.io/part-of: harbor
        spec:
          serviceAccountName: harbor
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: docker.io/library/postgres:18.6-bookworm@sha256:7d3852670a11f0cb9cb1cd50916dc02a0021143fb22d96b78eeef26348abe55c
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/backup.sh
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: backup
                  mountPath: /backup
                - name: auth
                  mountPath: /run/secrets/harbor
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: harbor-backup
            - name: backup
              persistentVolumeClaim:
                claimName: harbor-postgres-backup
            - name: auth
              secret:
                secretName: harbor-secrets
                defaultMode: 0440
                items:
                  - key: pgpass
                    path: pgpass
            - name: tmp
              emptyDir: {}
