apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-bootstrap
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: homelab
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: homelab
    spec:
      serviceAccountName: harbor
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: harbor.stinkyboi.com/mirror/cgr.dev/chainguard/python:latest@sha256:197cf542e9f4dc373864faecd4fd1a4f642622e654e9196881ca852e8fdf26bd
          imagePullPolicy: IfNotPresent
          command: [python3, -I, -B, /scripts/bootstrap.py]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /scripts/bootstrap.py
              subPath: bootstrap.py
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: replication
              mountPath: /replication/chainguard-replication.json
              subPath: chainguard-replication.json
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: harbor-bootstrap
            defaultMode: 0444
        - name: secrets
          secret:
            secretName: harbor-secrets
            defaultMode: 0440
            items:
              - key: admin-password
                path: admin-password
              - key: robot-pull-password
                path: robot-pull-password
              - key: robot-push-password
                path: robot-push-password
              - key: mirror-robot-push-password
                path: mirror-robot-push-password
        - name: replication
          configMap:
            name: harbor-chainguard-replication
            defaultMode: 0444
