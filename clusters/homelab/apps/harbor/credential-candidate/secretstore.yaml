# Unregistered proposal. Dedicated reader principal/key custody is not provisioned
# or approved. Never source this credential from the shared aws-ssm store.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: harbor-vulnerability-reader
  namespace: harbor
  annotations:
    homelab.rst.io/approval-required: HOME-57-HOME-62
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: harbor-vulnerability-reader-auth
            key: access-key-id
          secretAccessKeySecretRef:
            name: harbor-vulnerability-reader-auth
            key: secret-access-key
