apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-vulnerability-exporter
  namespace: harbor
  annotations:
    homelab.rst.io/approval-required: HOME-57
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: harbor-vulnerability-reader
  target:
    name: harbor-vulnerability-exporter
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
  data:
    - secretKey: robot-password
      remoteRef:
        key: /homelab/harbor/vulnerability-robot-password
        property: secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
