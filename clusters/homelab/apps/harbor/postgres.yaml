apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-postgres-config
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  POSTGRES_DB: registry
  POSTGRES_USER: harbor
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-postgres
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: harbor-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-postgres
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    checkov.io/skip1: CKV_K8S_23=Only the volume ownership init container runs as root; PostgreSQL runs as UID 999.
    checkov.io/skip2: CKV_K8S_40=The upstream PostgreSQL image uses UID 999 and its data is owned by this UID.
    checkov.io/skip3: CKV_K8S_37=The ownership init container receives only CHOWN for its dedicated retained local volume.
    checkov.io/skip4: CKV_K8S_25=The ownership init container receives only CHOWN for its dedicated retained local volume.
    checkov.io/skip5: CKV2_K8S_6=The PostgreSQL workload is covered by sibling networkpolicy.yaml.
spec:
  replicas: 1
  serviceName: harbor-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-postgres
        app.kubernetes.io/part-of: harbor
    spec:
      serviceAccountName: harbor
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: acer
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-local-data
          image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec, "chown 999:999 /data"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: [CHOWN]
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=100
            - -c
            - shared_buffers=128MB
            - -c
            - wal_compression=on
            - -c
            - checkpoint_timeout=15min
          # The upstream entrypoint reads desired values and the password from
          # mounted files. No secret value is injected into the Pod environment.
          env:
            - name: POSTGRES_DB_FILE
              value: /etc/harbor-postgres/POSTGRES_DB
            - name: POSTGRES_USER_FILE
              value: /etc/harbor-postgres/POSTGRES_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/harbor/database-password
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, harbor, -d, registry]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command: [psql, -U, harbor, -d, registry, -Atqc, "SELECT 1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [psql, -U, harbor, -d, registry, -Atqc, "SELECT 1"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: auth
              mountPath: /run/secrets/harbor
              readOnly: true
            - name: config
              mountPath: /etc/harbor-postgres
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harbor-postgres-local
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: auth
          secret:
            secretName: harbor-secrets
            defaultMode: 0440
            items:
              - key: database-password
                path: database-password
        - name: config
          configMap:
            name: harbor-postgres-config
