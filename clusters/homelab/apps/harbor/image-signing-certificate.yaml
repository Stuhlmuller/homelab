apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-image-signing
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  secretName: harbor-image-signing
  commonName: harbor-image-signing
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Never
  usages:
    - digital signature
  issuerRef:
    name: harbor-token-selfsigned
    kind: Issuer
