apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    homelab.stuhlmuller.dev/generated-secret-revision: "v1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: harbor-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        admin-password: "{{ .adminPassword }}"
        HARBOR_ADMIN_PASSWORD: "{{ .adminPassword }}"
        secretKey: "{{ .secretKey }}"
        secret: "{{ .coreSecret }}"
        CSRF_KEY: "{{ .xsrfKey }}"
        JOBSERVICE_SECRET: "{{ .jobserviceSecret }}"
        REGISTRY_HTTP_SECRET: "{{ .registryHttpSecret }}"
        REGISTRY_PASSWD: "{{ .registryPassword }}"
        REGISTRY_HTPASSWD: '{{ htpasswd "harbor_registry_user" .registryPassword "bcrypt" }}'
        password: "{{ .databasePassword }}"
        database-password: "{{ .databasePassword }}"
        pgpass: "harbor-postgres:5432:*:harbor:{{ .databasePassword }}"
        robot-pull-password: "{{ .robotPullPassword }}"
        robot-push-password: "{{ .robotPushPassword }}"
  data:
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: adminPassword
      remoteRef:
        key: /homelab/harbor/admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secretKey
      remoteRef:
        key: /homelab/harbor/secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: coreSecret
      remoteRef:
        key: /homelab/harbor/core-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: xsrfKey
      remoteRef:
        key: /homelab/harbor/xsrf-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: jobserviceSecret
      remoteRef:
        key: /homelab/harbor/jobservice-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: registryHttpSecret
      remoteRef:
        key: /homelab/harbor/registry-http-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: registryPassword
      remoteRef:
        key: /homelab/harbor/registry-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: databasePassword
      remoteRef:
        key: /homelab/harbor/database-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: robotPullPassword
      remoteRef:
        key: /homelab/harbor/robot-pull-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # checkov:skip=CKV_SECRET_6: Public ESO template key name, not secret material.
    - secretKey: robotPushPassword
      remoteRef:
        key: /homelab/harbor/robot-push-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
