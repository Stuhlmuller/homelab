# Harbor chart 1.19.2 / Harbor 2.15.4. All bootstrap images stay upstream so
# recovering the registry never requires pulling an image from that registry.
expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80
externalURL: https://harbor.stinkyboi.com
ipFamily:
  ipv6:
    enabled: false
imagePullPolicy: IfNotPresent
updateStrategy:
  type: Recreate
# checkov:skip=CKV_SECRET_6: Public Kubernetes Secret name, not a password.
existingSecretAdminPassword: harbor-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secrets
internalTLS:
  enabled: false
containerSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: [ALL]
persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry
    jobservice:
      jobLog:
        existingClaim: harbor-jobservice
    redis:
      existingClaim: harbor-redis
    trivy:
      existingClaim: harbor-trivy
  imageChartStorage:
    type: filesystem
    disableredirect: true
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
nginx:
  image:
    repository: docker.io/goharbor/nginx-photon
    tag: v2.15.4@sha256:7eff0287d5ad0f35754e162c8481ced04bbde107153ce586cefb15ee74fa1311
  serviceAccountName: harbor
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 3
portal:
  image:
    repository: docker.io/goharbor/harbor-portal
    tag: v2.15.4@sha256:01edf478505b21dba23a83c095f6ecac0c1e705690093edbab41e9a4d6754a75
  serviceAccountName: harbor
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 3
core:
  image:
    repository: docker.io/goharbor/harbor-core
    tag: v2.15.4@sha256:7d2ba5304a729887cdec7cb222a82b500278423de230ae5150c386a6c332b112
  serviceAccountName: harbor
  replicas: 1
  existingSecret: harbor-secrets
  existingXsrfSecret: harbor-secrets
  existingXsrfSecretKey: CSRF_KEY
  secretName: harbor-token-signing
  configureUserSettings: >-
    {"auth_mode":"db_auth","self_registration":false,"project_creation_restriction":"adminonly"}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
  startupProbe:
    timeoutSeconds: 5
    failureThreshold: 180
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
jobservice:
  image:
    repository: docker.io/goharbor/harbor-jobservice
    tag: v2.15.4@sha256:f143578ef30e2be5c48873298257ed0fca31545025958c534e536a06765d2b82
  serviceAccountName: harbor
  replicas: 1
  existingSecret: harbor-secrets
  # checkov:skip=CKV_SECRET_6: Public key within the referenced Secret.
  existingSecretKey: JOBSERVICE_SECRET
  maxJobWorkers: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
registry:
  serviceAccountName: harbor
  replicas: 1
  existingSecret: harbor-secrets
  # checkov:skip=CKV_SECRET_6: Public key within the referenced Secret.
  existingSecretKey: REGISTRY_HTTP_SECRET
  relativeurls: true
  credentials:
    existingSecret: harbor-secrets
  registry:
    image:
      repository: docker.io/goharbor/registry-photon
      tag: v2.15.4@sha256:dc0cb388a6445c69c8a0c406679290d2991c9698833d9e6e86a23bdfaf2f83c3
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 12
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
  controller:
    image:
      repository: docker.io/goharbor/harbor-registryctl
      tag: v2.15.4@sha256:30bd1ace4e3bb390d75b84673f98ddb4a69fcc6d116932ea764391df01943fb7
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 12
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
database:
  type: external
  external:
    host: harbor-postgres
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-secrets
    sslmode: disable
  maxIdleConns: 5
  maxOpenConns: 20
redis:
  type: internal
  internal:
    image:
      repository: docker.io/goharbor/valkey-photon
      tag: v2.15.4@sha256:bb022e8f236f56f53cee7bb1f609595e497da67d829048e0af2284f97e6eb54f
    serviceAccountName: harbor
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 12
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
trivy:
  enabled: true
  image:
    repository: docker.io/goharbor/trivy-adapter-photon
    tag: v2.15.4@sha256:813ca81b4a4ea0f44f5fa81cca2645eeb58d4b1f6c66b428df9d506174bb71d9
  serviceAccountName: harbor
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [zimaboard-2]
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
exporter:
  image:
    repository: docker.io/goharbor/harbor-exporter
    tag: v2.15.4@sha256:9ffede33dc519b4be035596a72f00f354754a22a3769077731f81ee7d6852f4f
  serviceAccountName: harbor
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
