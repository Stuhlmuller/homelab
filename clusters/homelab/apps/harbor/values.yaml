# Harbor chart 1.19.2 / Harbor 2.15.2. All bootstrap images stay upstream so
# recovering the registry never requires pulling an image from that registry.
expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80
externalURL: https://harbor.stinkyboi.com
ipFamily:
  ipv6:
    enabled: false
imagePullPolicy: IfNotPresent
updateStrategy:
  type: Recreate
# checkov:skip=CKV_SECRET_6: Public Kubernetes Secret name, not a password.
existingSecretAdminPassword: harbor-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secrets
internalTLS:
  enabled: false
containerSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: [ALL]
persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry
    jobservice:
      jobLog:
        existingClaim: harbor-jobservice
    redis:
      existingClaim: harbor-redis
    trivy:
      existingClaim: harbor-trivy
  imageChartStorage:
    type: filesystem
    disableredirect: true
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
nginx:
  image:
    repository: docker.io/goharbor/nginx-photon
    tag: v2.15.2@sha256:0ccc1eca228ecea120d7ad9e4386b8e86ced200212f00060a9abc753dbe7f17f
  serviceAccountName: harbor
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 3
portal:
  image:
    repository: docker.io/goharbor/harbor-portal
    tag: v2.15.2@sha256:b811b67f7a7f6f1614e4bdf7478b207d13e8aa3f815ff6ad84f216a5098d213d
  serviceAccountName: harbor
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 3
core:
  image:
    repository: docker.io/goharbor/harbor-core
    tag: v2.15.2@sha256:d7b780d23721a000f0fb8e181add6675eafa336de5d033b77fd7da0c171ff7f7
  serviceAccountName: harbor
  replicas: 1
  existingSecret: harbor-secrets
  existingXsrfSecret: harbor-secrets
  existingXsrfSecretKey: CSRF_KEY
  secretName: harbor-token-signing
  configureUserSettings: >-
    {"auth_mode":"db_auth","self_registration":false,"project_creation_restriction":"adminonly"}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
  startupProbe:
    timeoutSeconds: 5
    failureThreshold: 180
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
jobservice:
  image:
    repository: docker.io/goharbor/harbor-jobservice
    tag: v2.15.2@sha256:f71a4452a095bcd2a8f0683648a3ae28415432df87ccfb00ec7625f3e340a598
  serviceAccountName: harbor
  replicas: 1
  existingSecret: harbor-secrets
  # checkov:skip=CKV_SECRET_6: Public key within the referenced Secret.
  existingSecretKey: JOBSERVICE_SECRET
  maxJobWorkers: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
registry:
  serviceAccountName: harbor
  replicas: 1
  existingSecret: harbor-secrets
  # checkov:skip=CKV_SECRET_6: Public key within the referenced Secret.
  existingSecretKey: REGISTRY_HTTP_SECRET
  relativeurls: true
  credentials:
    existingSecret: harbor-secrets
  registry:
    image:
      repository: docker.io/goharbor/registry-photon
      tag: v2.15.2@sha256:c4ebef61ceb50a3d8bc21d149bc280422db20a1e69df317b64b74098c3615855
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 12
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
  controller:
    image:
      repository: docker.io/goharbor/harbor-registryctl
      tag: v2.15.2@sha256:223d5cb49d5dbf0ba4ae022e7dd9775fa459904112dc12084d3aaa36c1408362
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 12
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
database:
  type: external
  external:
    host: harbor-postgres
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-secrets
    sslmode: disable
  maxIdleConns: 5
  maxOpenConns: 20
redis:
  type: internal
  internal:
    image:
      repository: docker.io/goharbor/valkey-photon
      tag: v2.15.2@sha256:7337783e8148f01a25b113f5c7b1d640f78b1860fcaf80a33d0dbb294f7b99d0
    serviceAccountName: harbor
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 12
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
trivy:
  enabled: true
  image:
    repository: docker.io/goharbor/trivy-adapter-photon
    tag: v2.15.2@sha256:215c07b71c37fc7fc16e02d9185d936dcb8884a80e810817c2cd058bbd7c4e98
  serviceAccountName: harbor
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [zimaboard-2]
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
exporter:
  image:
    repository: docker.io/goharbor/harbor-exporter
    tag: v2.15.2@sha256:e1b0a248f61aad5084c5d1612d5f1da89f99c23ce743eaf8cba913d6d00c0547
  serviceAccountName: harbor
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
