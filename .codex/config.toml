# OPENWIKI:MCP:START
[mcp_servers.openwiki]
command = "/bin/sh"
args = ["-c", '''
for candidate in /nix/var/nix/profiles/default/bin/nix /run/current-system/sw/bin/nix ~/.nix-profile/bin/nix; do
  if [ -x "$candidate" ]; then
    exec "$candidate" run github:Stuhlmuller/homelab#openwiki -- mcp --host codex
  fi
done
exec nix run github:Stuhlmuller/homelab#openwiki -- mcp --host codex
''']
# OPENWIKI:MCP:END

# Allow the pinned Nix package to build on a cold store.
startup_timeout_sec = 180

[mcp_servers.xerj]
command = "/bin/sh"
args = ["-c", '''
for candidate in /nix/var/nix/profiles/default/bin/nix /run/current-system/sw/bin/nix ~/.nix-profile/bin/nix; do
  if [ -x "$candidate" ]; then
    exec "$candidate" run github:Stuhlmuller/homelab#xerj -- mcp --disable-feedback
  fi
done
exec nix run github:Stuhlmuller/homelab#xerj -- mcp --disable-feedback
''']
startup_timeout_sec = 60
